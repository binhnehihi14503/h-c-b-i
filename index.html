uốc tế …”","o":["thức quản trị an ninh phi truyền thống phù hợp","quan và khách quan, cả bên trong và bên ngoài","của dân chúng đối với chính quyền, gây khủng hoảng xã hội trầm trọng","và các mối đe dọa của khủng bố quốc tế"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Thứ tư, nguy cơ về tổ chức tồn tại ngoài nhà nước (phi quốc gia) ảnh hưởng đến trật tự quốc tế và các mối đe dọa của khủng bố quốc tế."},{"q":"Phương án nào điền đúng vào chỗ trống: “Thông qua một số hoạt động kinh tế, các nhà đầu tư hoặc các thương lái nước ngoài cũng có những thủ đoạn, hành vi …”?","o":["uy hiếp đối với lợi ích cơ bản đó","triển và an ninh của mỗi nước, cả khu vực và cả toàn cầu”","tiếp đến cá nhân con người hoặc cộng đồng, quốc gia - dân tộc","nhằm phá hoại môi trường của một số quốc gia khác"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Thông qua một số hoạt động kinh tế, các nhà đầu tư hoặc các thương lái nước ngoài cũng có những thủ đoạn, hành vi nhằm phá hoại môi trường của một số quốc gia khác."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Ví dụ ở Việt Nam, việc thu mua đỉa, ốc bươu vàng …”?","o":["móng trâu, lá cây điều","tin của nhân dân đối với Đảng, Nhà nước","bản chính trị quốc gia sự thật","chính, còn ngoại giao là hỗ trợ"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Ví dụ ở Việt Nam, việc thu mua đỉa, ốc bươu vàng, móng trâu, lá cây điều..."},{"q":"Theo giáo trình, ý “hoặc việc đưa hoá chất độc hại thông qua thuốc bảo vệ thực vật, thuốc kích thích tăng trưởng để gây ô nhiễm môi trường, gây hại …” kết thúc bằng nội dung nào?","o":["quyền lãnh thổ quốc gia, dân tộc","tục theo dõi, nghiên cứu và bổ sung kịp thời","mối đe dọa của an ninh phi truyền thống ở Việt Nam hiện nay","lâu dài tới sức khỏe, suy thoái nòi giống đời sau"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: hoặc việc đưa hoá chất độc hại thông qua thuốc bảo vệ thực vật, thuốc kích thích tăng trưởng để gây ô nhiễm môi trường, gây hại lâu dài tới sức khỏe, suy thoái nòi giống đời sau."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “với trình độ công nghệ lạc hậu, gây hại cho môi trường và gây xung đột …”","o":["và tội phạm ma túy","truyền thống, cộng đồng doanh nghiệp và toàn thể nhân dân","dựng chiến lược an ninh quốc gia","môi trường với cộng đồng dân cư"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: với trình độ công nghệ lạc hậu, gây hại cho môi trường và gây xung đột môi trường với cộng đồng dân cư."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Thứ năm , các nguy cơ gây ra bởi sự phát triển công nghệ và toàn cầu hóa, như an ninh mạng, an ninh thông tin, rủi ro hạt …”","o":["điện, công nghệ thông tin và giao dịch điện tử","vòng lao lý, nhiều lao động thất nghiệp, an ninh kinh tế của Việt","nhân, ô nhiễm phóng xạ và an ninh kỹ thuật di truyền","cả ngoại giao giữa quân đội các nước"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Thứ năm , các nguy cơ gây ra bởi sự phát triển công nghệ và toàn cầu hóa, như an ninh mạng, an ninh thông tin, rủi ro hạt nhân, ô nhiễm phóng xạ và an ninh kỹ thuật di truyền."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Đây là các mối đe dọa an ninh phi truyền thống phát sinh từ mặt trái sử dụng thành tựu khoa học …” là gì?","o":["máy nhiệt điện, nhà máy hoá chấ t","hậu quả nghiêm trọng trong nhiều năm, tiêu tốn nhiều tiền của","tư cho quốc phòng nói chung, cho hiện đại hóa quân đội nói riêng","công nghệ như: An ninh mạng, một số dịch bệnh"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đây là các mối đe dọa an ninh phi truyền thống phát sinh từ mặt trái sử dụng thành tựu khoa học công nghệ như: An ninh mạng, một số dịch bệnh."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Rủi ro hạt nhân như thảm họa hạt nhân Chernobyl xảy ra vào năm 1986 ở Ukraine cùng với nguy cơ ô nhiễm phóng xạ từ các nhà máy điện hạt nhân được xây dựng gần các …”?","o":["đột dân tộc, tôn giáo, khủng bố, bạo loạn chính trị","lòng tin và hoàn thiện khung khổ thể chế giữa các nước về an","Việt Nam với pháp luật quốc tế trên từng lĩnh vực","quốc gia khác là thách thức lớn cần phải được quan tâm, chú trọng"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Rủi ro hạt nhân như thảm họa hạt nhân Chernobyl xảy ra vào năm 1986 ở Ukraine cùng với nguy cơ ô nhiễm phóng xạ từ các nhà máy điện hạt nhân được xây dựng gần các quốc gia khác là thách thức lớn cần phải được quan tâm, chú trọng."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Đặc điểm an ninh phi truyền thống Dù còn nhiều quan niệm rất đa dạng, song có thể định dạng một số đặc điểm chủ yếu sau của an ninh phi truyền thống Các vấn đề an ninh phi truyền thống diễn ra ảnh …”","o":["thể làm tổn hại tới quan hệ với các nước","nhằm phá hoại môi trường của một số quốc gia khác","hưởng trên phạm vi khu vực hoặc toàn cầu, mang tính xuyên quốc gia","nhằm kết nối khu vực công và khu vực tư trong một mục tiêu"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Đặc điểm an ninh phi truyền thống Dù còn nhiều quan niệm rất đa dạng, song có thể định dạng một số đặc điểm chủ yếu sau của an ninh phi truyền thống Các vấn đề an ninh phi truyền thống diễn ra ảnh hưởng trên phạm vi khu vực hoặc toàn cầu, mang tính xuyên quốc gia."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Nó có thể phát sinh từ một quốc gia này nhưng có khả năng lan tỏa với tốc độ …” được hoàn thiện như thế nào?","o":["nhằm phá hoại môi trường của một số quốc gia khác","vụ cứu nạn, cứu hộ, phòng chống thiên tai dịch bệnh ”","truyền thống, cộng đồng doanh nghiệp và toàn thể nhân dân","nhanh, phạm vi rộng đến quốc gia khác"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nó có thể phát sinh từ một quốc gia này nhưng có khả năng lan tỏa với tốc độ nhanh, phạm vi rộng đến quốc gia khác."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Các mối đe dọa an ninh phi truyền thống uy hiếp trực tiếp đến cá nhân con người hoặc …”","o":["qua thiết lập cơ chế hợp tác cụ thể và hữu hiệu","động phòng ngừa và ứng phó có ý nghĩa rất quan trọng","cộng đồng, rồi quốc gia - dân tộc","góp phần vào sự nghiệp xây dựng và bảo vệ Tổ quốc"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Các mối đe dọa an ninh phi truyền thống uy hiếp trực tiếp đến cá nhân con người hoặc cộng đồng, rồi quốc gia - dân tộc;"},{"q":"Phương án nào điền đúng vào chỗ trống: “còn an ninh truyền thống uy hiếp trực tiếp đến chủ quyền lãnh thổ quốc gia - …”?","o":["nhanh, phạm vi rộng đến quốc gia khác","VIII , IX, X, XI, XII, XIII","bản chính trị quốc gia sự thật","dân tộc, uy hiếp an ninh quốc gia"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: còn an ninh truyền thống uy hiếp trực tiếp đến chủ quyền lãnh thổ quốc gia - dân tộc, uy hiếp an ninh quốc gia."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Nhưng ngày nay, do tác động của toàn cầu hóa, mặt trái của sử dụng thành tựu cách mạng khoa học – công nghệ, sự mở …”?","o":["quyền lãnh thổ quốc gia, dân tộc","đảng các cấp đối với hoạt động quản trị an ninh phi truyền thống","rộng các phương tiện truyền thông đa phương tiệ n","lâu dài tới sức khỏe, suy thoái nòi giống đời sau"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nhưng ngày nay, do tác động của toàn cầu hóa, mặt trái của sử dụng thành tựu cách mạng khoa học – công nghệ, sự mở rộng các phương tiện truyền thông đa phương tiệ n ..."},{"q":"Theo giáo trình, ý “Các mối đe dọa an ninh phi truyền thống hủy hoại an ninh quốc gia dần dần và lâu dài, vì nó tác động đến các yếu tố mang tính hạt nhân hoặc bệ đỡ cho ổn định và phát triển (cá nhân con người, cộng đồng xã hội, hệ …” kết thúc bằng nội dung nào?","o":["thống thể chế, hạ tầng kỹ thuậ t chiến lược và môi trường sống)","qua thiết lập cơ chế hợp tác cụ thể và hữu hiệu","còn từ các vấn đề khu vực và thế giới","nhằm phá hoại môi trường của một số quốc gia khác"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Các mối đe dọa an ninh phi truyền thống hủy hoại an ninh quốc gia dần dần và lâu dài, vì nó tác động đến các yếu tố mang tính hạt nhân hoặc bệ đỡ cho ổn định và phát triển (cá nhân con người, cộng đồng xã hội, hệ thống thể chế, hạ tầng kỹ thuậ t chiến lược và môi trường sống)."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Giải quyết an ninh phi truyền thống nhấn mạnh đến hợp tác, sử dụng biện pháp ngoại giao, kể …”","o":["dân tộc, uy hiếp an ninh quốc gia","đố toàn bộ hệ thống điều khiển quốc gia","hậu quả nghiêm trọng trong nhiều năm, tiêu tốn nhiều tiền của","cả ngoại giao giữa quân đội các nước"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Giải quyết an ninh phi truyền thống nhấn mạnh đến hợp tác, sử dụng biện pháp ngoại giao, kể cả ngoại giao giữa quân đội các nước."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Còn an ninh truyền thống thường lấy biện pháp vũ trang - quân sự là …”","o":["và các mối đe dọa của khủng bố quốc tế","mối đe dọa an ninh phi truyền thống","chính, còn ngoại giao là hỗ trợ","THỐNG Ở VIỆT NAM HIỆN NAY III"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Còn an ninh truyền thống thường lấy biện pháp vũ trang - quân sự là chính, còn ngoại giao là hỗ trợ."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Khó khă n nhất của việc giải quyết các vấn đề của an ninh phi truyền thống toàn cầu chính là việc đồ ng thuận giữa các …” là gì?","o":["tế, văn hóa - xã hội, quốc phòng, an ninh và đố i ngoại","nhằm kết nối khu vực công và khu vực tư trong một mục tiêu","trường, của sử dụng thành tựu khoa họ c công nghệ","quốc gia trong việc đóng góp những chi phí khắc phục"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Khó khă n nhất của việc giải quyết các vấn đề của an ninh phi truyền thống toàn cầu chính là việc đồ ng thuận giữa các quốc gia trong việc đóng góp những chi phí khắc phục."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Vì vậy, an ninh phi truyền thống và an ninh truyền thống cùng tác động đến xây …”?","o":["bán ma túy, buôn bán phụ nữ và trẻ em)","thách thức an ninh phi truyền thống","dựng chiến lược an ninh quốc gia","công nghệ như: An ninh mạng, một số dịch bệnh"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, an ninh phi truyền thống và an ninh truyền thống cùng tác động đến xây dựng chiến lược an ninh quốc gia ..."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Về hành vi : An ninh truyền thống nhấn mạnh tới việc sử dụng các biện pháp quân sự để chống lại sự tấn công bằng quân sự nhằm …”","o":["uy hiếp, xâm phạm độc lập, chủ quyền và toàn vẹn lãnh thổ","thức quản trị an ninh phi truyền thống phù hợp","thông qua cơ chế và phương thức đa tầng, đa dạng, linh hoạt","còn từ các vấn đề khu vực và thế giới"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Về hành vi : An ninh truyền thống nhấn mạnh tới việc sử dụng các biện pháp quân sự để chống lại sự tấn công bằng quân sự nhằm uy hiếp, xâm phạm độc lập, chủ quyền và toàn vẹn lãnh thổ."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “An ninh phi truyền thống sử dụng các biện pháp phi vũ lực để phòng chống những uy hiếp có nguồn gốc phi quân sự liên quan …” được hoàn thiện như thế nào?","o":["trường, của sử dụng thành tựu khoa họ c công nghệ","đến sự phát triển của con người và môi trường sống","của dân chúng đối với chính quyền, gây khủng hoảng xã hội trầm trọng","còn từ các vấn đề khu vực và thế giới"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: An ninh phi truyền thống sử dụng các biện pháp phi vũ lực để phòng chống những uy hiếp có nguồn gốc phi quân sự liên quan đến sự phát triển của con người và môi trường sống."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “An ninh truyền thống là sự xung đột giữa quân đội các nhà nước còn các mối đe dọa an ninh phi truyền thống thường do các tác nhân tự nhiên hoặc …”","o":["những nguy cơ khủng hoảng về mặt xã hội, chính trị và kinh tế","do các tổ chức ngoài nhà nước, nhóm người hoặc cá nhân tiến hành","thức quản trị an ninh phi truyền thống phù hợp","góp phần vào sự nghiệp xây dựng và bảo vệ Tổ quốc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: An ninh truyền thống là sự xung đột giữa quân đội các nhà nước còn các mối đe dọa an ninh phi truyền thống thường do các tác nhân tự nhiên hoặc do các tổ chức ngoài nhà nước, nhóm người hoặc cá nhân tiến hành."},{"q":"Phương án nào điền đúng vào chỗ trống: “Về đối tượng đe dọa, xâm phạm : Với an ninh truyền thống đó chính là chủ …”?","o":["bằng nhiều con đường, cách thức khác nhau III","quyền lãnh thổ quốc gia, dân tộc","ninh quốc gia và an ninh nhân loại III","thể làm tổn hại tới quan hệ với các nước"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Về đối tượng đe dọa, xâm phạm : Với an ninh truyền thống đó chính là chủ quyền lãnh thổ quốc gia, dân tộc."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Còn với an ninh phi truyền thống là sự tồn tại, phát triển bền vững của con người, xã hội, môi trường sống… Các mối đe dọa an ninh phi truyền thống uy hiếp trực …”?","o":["đề an ninh, là hai mặt của khái niệm an ninh toàn diện","giàu và nước nghèo trong điều kiện thế giới phát triển mất cân đối","những nguy cơ khủng hoảng về mặt xã hội, chính trị và kinh tế","tiếp đến cá nhân con người hoặc cộng đồng, quốc gia - dân tộc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Còn với an ninh phi truyền thống là sự tồn tại, phát triển bền vững của con người, xã hội, môi trường sống… Các mối đe dọa an ninh phi truyền thống uy hiếp trực tiếp đến cá nhân con người hoặc cộng đồng, quốc gia - dân tộc;"},{"q":"Theo giáo trình, ý “Còn an ninh phi truyền thống có thể xuất phát từ nội tại một hoặc nhiều quốc gia sau đó có thể lan tỏa ảnh hưởng …” kết thúc bằng nội dung nào?","o":["nhà nước, nhóm người hoặc cá nhân tiến hành","của khái niệm an ninh truyền thống","máy nhiệt điện, nhà máy hoá chấ t","tới cả khu vực và thậm chí toàn thế giới II"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Còn an ninh phi truyền thống có thể xuất phát từ nội tại một hoặc nhiều quốc gia sau đó có thể lan tỏa ảnh hưởng tới cả khu vực và thậm chí toàn thế giới II."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Làm suy giảm sức mạnh quốc phòng của đất nước Sức mạnh quốc phòng thể hiện trực tiếp ở sức mạnh quân sự và phản ánh ở các tiềm lực quốc gia về chính trị …”","o":["đột dân tộc, tôn giáo, khủng bố, bạo loạn chính trị","Việt Nam với pháp luật quốc tế trên từng lĩnh vực","tinh thần, kinh tế, khoa học, công nghệ và quân sự , an ninh","độ khác nhau, nhưng xu hướng hòa bình vẫn là chủ đạo, còn vấn"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Làm suy giảm sức mạnh quốc phòng của đất nước Sức mạnh quốc phòng thể hiện trực tiếp ở sức mạnh quân sự và phản ánh ở các tiềm lực quốc gia về chính trị, tinh thần, kinh tế, khoa học, công nghệ và quân sự , an ninh."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Về chính trị tinh thần : Tạo tâm lý hoang mang, làm suy giảm ý chí, quyết tâm và lòng …”","o":["ninh quốc gia và an ninh nhân loại III","môi trường với cộng đồng dân cư","trở thành mối quan tâm toàn nhân loại","tin của nhân dân đối với chế độ"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Về chính trị tinh thần : Tạo tâm lý hoang mang, làm suy giảm ý chí, quyết tâm và lòng tin của nhân dân đối với chế độ;"},{"q":"Theo bài học, phần còn thiếu trong nhận định “đồng thời, có thể làm gia tăng mâu thuẫn xã hội, nhất là …” là gì?","o":["móng trâu, lá cây điều","giữa các tầng lớp dân cư","và các mối đe dọa của khủng bố quốc tế","dựng chiến lược an ninh quốc gia"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: đồng thời, có thể làm gia tăng mâu thuẫn xã hội, nhất là giữa các tầng lớp dân cư."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “làm suy giảm đáng kể khả năng dự trữ và huy động cơ sở vật chất từ nền kinh tế cho các nhiệm vụ quốc phòng cũng như khả năng đầu …”?","o":["đột dân tộc, tôn giáo, khủng bố, bạo loạn chính trị","tư cho quốc phòng nói chung, cho hiện đại hóa quân đội nói riêng","các mối đe dọa an ninh phi truyền thố ng","trường, của sử dụng thành tựu khoa họ c công nghệ"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: làm suy giảm đáng kể khả năng dự trữ và huy động cơ sở vật chất từ nền kinh tế cho các nhiệm vụ quốc phòng cũng như khả năng đầu tư cho quốc phòng nói chung, cho hiện đại hóa quân đội nói riêng."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Về khoa học công nghệ : Tác động mạnh đến mọi mặt của đời sống xã hội, thậm chí cướp đi sinh mạng của hàng triệu người, để lại …”","o":["trở thành mối quan tâm toàn nhân loại","quốc gia, nhóm liên minh các quốc gia","hậu quả nghiêm trọng trong nhiều năm, tiêu tốn nhiều tiền của","và các mối đe dọa của khủng bố quốc tế"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Về khoa học công nghệ : Tác động mạnh đến mọi mặt của đời sống xã hội, thậm chí cướp đi sinh mạng của hàng triệu người, để lại hậu quả nghiêm trọng trong nhiều năm, tiêu tốn nhiều tiền của."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Đặc biệt là nguy cơ sử dụng vũ khí sinh thái …” được hoàn thiện như thế nào?","o":["nhà nước, nhóm người hoặc cá nhân tiến hành","VIII , IX, X, XI, XII, XIII","ninh phi truyền thống và an ninh truyền thống","tội phạm công nghệ cao"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đặc biệt là nguy cơ sử dụng vũ khí sinh thái, tội phạm công nghệ cao."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Biến đổi khí hậu, dịch bệnh, xung đột sắc tộc, tôn giáo, khủng bố …”","o":["VIII , IX, X, XI, XII, XIII","dựng chiến lược an ninh quốc gia","ninh phi truyền thống ở nước ta?","và tội phạm ma túy"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Biến đổi khí hậu, dịch bệnh, xung đột sắc tộc, tôn giáo, khủng bố và tội phạm ma túy ..."},{"q":"Phương án nào điền đúng vào chỗ trống: “sẽ có tác động trực tiếp làm kìm hãm phát triển kinh …”?","o":["thống, không bao hàm an ninh quân sự","cộng đồng, rồi quốc gia - dân tộc","chính, còn ngoại giao là hỗ trợ","tế, gia tăng đói nghèo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: sẽ có tác động trực tiếp làm kìm hãm phát triển kinh tế, gia tăng đói nghèo."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Di cư bất hợp pháp dưới nhiều hình thức khác nhau làm thay đổi kết cấu xã hội, mâu thuẫn nội bộ gia tăng, tạo tâm lý bất bình, chống đối …”?","o":["tiếp đến cá nhân con người hoặc cộng đồng, quốc gia - dân tộc","doanh nghiệp, của các nhà hảo tâm có ý nghĩa rất quan trọng","của dân chúng đối với chính quyền, gây khủng hoảng xã hội trầm trọng","mối đe dọa của an ninh phi truyền thống ở Việt Nam hiện nay"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Di cư bất hợp pháp dưới nhiều hình thức khác nhau làm thay đổi kết cấu xã hội, mâu thuẫn nội bộ gia tăng, tạo tâm lý bất bình, chống đối của dân chúng đối với chính quyền, gây khủng hoảng xã hội trầm trọng."},{"q":"Theo giáo trình, ý “tạo ra các luồng thông tin xuyên tạc, bóp méo sự thật, gây chia rẽ nội bộ, làm mất lòng …” kết thúc bằng nội dung nào?","o":["đột dân tộc, tôn giáo, khủng bố, bạo loạn chính trị","tin của nhân dân đối với Đảng, Nhà nước","và ứng phó với các mối đe dọa an ninh phi truyền thống","uy hiếp đối với lợi ích cơ bản đó"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: tạo ra các luồng thông tin xuyên tạc, bóp méo sự thật, gây chia rẽ nội bộ, làm mất lòng tin của nhân dân đối với Đảng, Nhà nước."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Hình thành nguy cơ xung đột và chiến tranh Nguy cơ xung đột và chiến tranh được hình thành từ nhiều nguyên nhân, cả chủ …”","o":["quan và khách quan, cả bên trong và bên ngoài","bán ma túy, buôn bán phụ nữ và trẻ em)","nhân, ô nhiễm phóng xạ và an ninh kỹ thuật di truyền","và các mối đe dọa của khủng bố quốc tế"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Hình thành nguy cơ xung đột và chiến tranh Nguy cơ xung đột và chiến tranh được hình thành từ nhiều nguyên nhân, cả chủ quan và khách quan, cả bên trong và bên ngoài;"},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “trong đó có các nguyên nhân từ tác động của an ninh phi truyền thống, nhất là từ khủng bố, tội phạm xuyên quốc gia, ma túy …”","o":["xung đột dân tộc, sắc tộc và khai thác tài nguyên","nhân, ô nhiễm phóng xạ và an ninh kỹ thuật di truyền","đề an ninh, là hai mặt của khái niệm an ninh toàn diện","các mối đe dọa an ninh phi truyền thố ng"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: trong đó có các nguyên nhân từ tác động của an ninh phi truyền thống, nhất là từ khủng bố, tội phạm xuyên quốc gia, ma túy, xung đột dân tộc, sắc tộc và khai thác tài nguyên ..."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Đối với Việt Nam, nguy cơ xung đột và chiến tranh từ tác động của an ninh phi truyền thống có thể ít xẩy ra …” là gì?","o":["VIII , IX, X, XI, XII, XIII","quan và khách quan, cả bên trong và bên ngoài","thức quản trị an ninh phi truyền thống phù hợp","nhưng không thể không dự báo để chủ động phòng ngừa"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đối với Việt Nam, nguy cơ xung đột và chiến tranh từ tác động của an ninh phi truyền thống có thể ít xẩy ra nhưng không thể không dự báo để chủ động phòng ngừa."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “vẫn diễn biến phức tạp và là một trong những nhân tố gây mất ổn định, nhất là trên các tuyến biên giới, có …”?","o":["tội phạm trên lĩnh vực thương mại, đầ u tư","mối đe dọa của an ninh phi truyền thống ở Việt Nam hiện nay","như: “Lãnh đạo công, quản trị tư”","thể làm tổn hại tới quan hệ với các nước"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: vẫn diễn biến phức tạp và là một trong những nhân tố gây mất ổn định, nhất là trên các tuyến biên giới, có thể làm tổn hại tới quan hệ với các nước."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Nguy cơ từ an ninh phi truyền thống tác động đến quốc phòng Việt Nam không chỉ từ các vấn đề trong nước mà …”","o":["công nghệ như: An ninh mạng, một số dịch bệnh","dục quốc phòng và an ninh trong tình hình mới”","còn từ các vấn đề khu vực và thế giới","đe dọa an ninh phi truyền thống"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nguy cơ từ an ninh phi truyền thống tác động đến quốc phòng Việt Nam không chỉ từ các vấn đề trong nước mà còn từ các vấn đề khu vực và thế giới."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “MỘT SỐ GIẢI PHÁP PHÒNG NGỪA, ỨNG PHÓ VỚI CÁC MỐI ĐE DỌA AN NINH PHI TRUYỀN …” được hoàn thiện như thế nào?","o":["và các mối đe dọa của khủng bố quốc tế","uy hiếp đối với lợi ích cơ bản đó","2 Nhà xuất bản chính trị","THỐNG Ở VIỆT NAM HIỆN NAY III"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: MỘT SỐ GIẢI PHÁP PHÒNG NGỪA, ỨNG PHÓ VỚI CÁC MỐI ĐE DỌA AN NINH PHI TRUYỀN THỐNG Ở VIỆT NAM HIỆN NAY III."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Quán triệt sâu sắc các quan điểm của Đảng về an …”","o":["quốc gia, nhóm liên minh các quốc gia","mối đe dọa an ninh phi truyền thống","soát chất lượ ng”","ninh phi truyền thống"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Quán triệt sâu sắc các quan điểm của Đảng về an ninh phi truyền thống"},{"q":"Phương án nào điền đúng vào chỗ trống: “Thứ nhất: Đảng ta luôn đặt các mối đe dọa an ninh phi truyền thống bên an ninh truyền thống, trong đó các mối đe dọa an ninh truyền thống dù vẫn tiềm tang và biểu hiện dưới các hình thức, mức …”?","o":["đến sự phát triển của con người và môi trường sống","định được nhưng có vấn đề lại không xác định được","độ khác nhau, nhưng xu hướng hòa bình vẫn là chủ đạo, còn vấn","động phòng ngừa và ứng phó có ý nghĩa rất quan trọng"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Thứ nhất: Đảng ta luôn đặt các mối đe dọa an ninh phi truyền thống bên an ninh truyền thống, trong đó các mối đe dọa an ninh truyền thống dù vẫn tiềm tang và biểu hiện dưới các hình thức, mức độ khác nhau, nhưng xu hướng hòa bình vẫn là chủ đạo, còn vấn"},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Thứ hai: Các thách thức an ninh phi truyền thống đang diễn biến phức tạ p do mặt trái của toàn cầu hóa, của kinh tế thị …”?","o":["thống thể chế, hạ tầng kỹ thuậ t chiến lược và môi trường sống)","những nguy cơ khủng hoảng về mặt xã hội, chính trị và kinh tế","trường, của sử dụng thành tựu khoa họ c công nghệ","như: “Lãnh đạo công, quản trị tư”"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Thứ hai: Các thách thức an ninh phi truyền thống đang diễn biến phức tạ p do mặt trái của toàn cầu hóa, của kinh tế thị trường, của sử dụng thành tựu khoa họ c công nghệ."},{"q":"Theo giáo trình, ý “Phạm vi các mối đe dọa an ninh phi truyền thống sẽ còn mở rộng và diễn biến rất phức tạp, đòi hỏi phải tiếp …” kết thúc bằng nội dung nào?","o":["nhưng không thể không dự báo để chủ động phòng ngừa","ngũ cán bộ, công chức và chế độ công vụ chuyên nghiệp","2 Nhà xuất bản chính trị","tục theo dõi, nghiên cứu và bổ sung kịp thời"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Phạm vi các mối đe dọa an ninh phi truyền thống sẽ còn mở rộng và diễn biến rất phức tạp, đòi hỏi phải tiếp tục theo dõi, nghiên cứu và bổ sung kịp thời."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Thứ tư : Các mối đe dọa an ninh phi truyền thống không của riêng …”","o":["Việt Nam mà mang tính toàn cầu","uy hiếp đối với lợi ích cơ bản đó","dân tộc, uy hiếp an ninh quốc gia","nhằm phá hoại môi trường của một số quốc gia khác"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Thứ tư : Các mối đe dọa an ninh phi truyền thống không của riêng Việt Nam mà mang tính toàn cầu."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Thứ năm : Một số mối đe dọa an ninh phi truyền thống có khả năng chuyển hóa thành an ninh truyền thống, như xung …”","o":["đột dân tộc, tôn giáo, khủng bố, bạo loạn chính trị","định được nhưng có vấn đề lại không xác định được","độ khác nhau, nhưng xu hướng hòa bình vẫn là chủ đạo, còn vấn","bao gồm các lĩnh vực an ninh ngoài quân sự, phi vũ trang"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Thứ năm : Một số mối đe dọa an ninh phi truyền thống có khả năng chuyển hóa thành an ninh truyền thống, như xung đột dân tộc, tôn giáo, khủng bố, bạo loạn chính trị."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Phát huy trách nhiệm mỗi chủ thể trong việc chủ động phòng ngừa và ứng phó với …” là gì?","o":["tục theo dõi, nghiên cứu và bổ sung kịp thời","vực đời sống xã hội","thách thức an ninh phi truyền thống","dựng chiến lược an ninh quốc gia"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Phát huy trách nhiệm mỗi chủ thể trong việc chủ động phòng ngừa và ứng phó với thách thức an ninh phi truyền thống."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Nâng cao nhận thức cho các thành phần trong xã hội về mối đe dọa an ninh phi truyền thống có thể …”?","o":["ninh phi truyền thống và an ninh truyền thống","Việt Nam mà mang tính toàn cầu","máy nhiệt điện, nhà máy hoá chấ t","bằng nhiều con đường, cách thức khác nhau III"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nâng cao nhận thức cho các thành phần trong xã hội về mối đe dọa an ninh phi truyền thống có thể bằng nhiều con đường, cách thức khác nhau III."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Chủ động, tích cực phòng ngừa, ứng phó với các mối đe dọa an ninh phi truyền thống Chủ động và tích cực đầu tư phát triển bền vững, không ngừng nâng cao đời sống vật …”","o":["trường, của sử dụng thành tựu khoa họ c công nghệ","thể làm tổn hại tới quan hệ với các nước","thông qua cơ chế và phương thức đa tầng, đa dạng, linh hoạt","chất tinh thần của nhân dân, chăm lo bảo vệ môi trưởng sinh thái"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Chủ động, tích cực phòng ngừa, ứng phó với các mối đe dọa an ninh phi truyền thống Chủ động và tích cực đầu tư phát triển bền vững, không ngừng nâng cao đời sống vật chất tinh thần của nhân dân, chăm lo bảo vệ môi trưởng sinh thái."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Phân loại từng lĩnh vực an ninh phi truyền thống với đặc điểm khác nhau để xác định những cơ chế, phương …” được hoàn thiện như thế nào?","o":["góp phần vào sự nghiệp xây dựng và bảo vệ Tổ quốc","mối đe dọa của an ninh phi truyền thống ở Việt Nam hiện nay","tin của nhân dân đối với chế độ","thức quản trị an ninh phi truyền thống phù hợp"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Phân loại từng lĩnh vực an ninh phi truyền thống với đặc điểm khác nhau để xác định những cơ chế, phương thức quản trị an ninh phi truyền thống phù hợp."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Chủ động xây dựng lực lượng, đầu tư nguồn lực cho quản trị an ninh phi truyền thống ở từng lĩnh …”","o":["an ninh tư tưởng, văn hóa, xã hội và an ninh thông tin","như: “Lãnh đạo công, quản trị tư”","thông qua cơ chế và phương thức đa tầng, đa dạng, linh hoạt","vực, từng địa bàn, từng nội dung cụ thể"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Chủ động xây dựng lực lượng, đầu tư nguồn lực cho quản trị an ninh phi truyền thống ở từng lĩnh vực, từng địa bàn, từng nội dung cụ thể;"},{"q":"Phương án nào điền đúng vào chỗ trống: “thường xuyên diễn tập để tránh rơi vào thế bị động khi xảy …”?","o":["ra tình huống bất thường","bản chính trị quốc gia sự thật","quốc trong tình hình mới”","đe dọa an ninh phi truyền thống"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: thường xuyên diễn tập để tránh rơi vào thế bị động khi xảy ra tình huống bất thường."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Giữ vững an ninh chính trị, xử lý các vấn đề dân tộc và tôn giáo một cách khéo léo, giải tỏa các xung đột xã hội phù hợp …”?","o":["giàu và nước nghèo trong điều kiện thế giới phát triển mất cân đối","phòng ngừa và ngăn chặn khả năng chuyển hóa của xung đột","tinh thần, kinh tế, khoa học, công nghệ và quân sự , an ninh","thông qua cơ chế và phương thức đa tầng, đa dạng, linh hoạt"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Giữ vững an ninh chính trị, xử lý các vấn đề dân tộc và tôn giáo một cách khéo léo, giải tỏa các xung đột xã hội phù hợp, phòng ngừa và ngăn chặn khả năng chuyển hóa của xung đột."},{"q":"Theo giáo trình, ý “Phát huy sức mạnh tổng hợp của hệ thống chính trị và toàn xã hội trong quản trị và kiểm soát các mối đe dọa an ninh phi truyền thống Tăng cường vai trò lãnh đạo của tổ chức …” kết thúc bằng nội dung nào?","o":["đột dân tộc, tôn giáo, khủng bố, bạo loạn chính trị","còn từ các vấn đề khu vực và thế giới","triển và an ninh của mỗi nước, cả khu vực và cả toàn cầu”","đảng các cấp đối với hoạt động quản trị an ninh phi truyền thống"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Phát huy sức mạnh tổng hợp của hệ thống chính trị và toàn xã hội trong quản trị và kiểm soát các mối đ function saveProgress(){if(!currentHP||state.lesson==null||state.historySaved)return;localStorage.setItem(PROGRESS_KEY,JSON.stringify({hp:currentHP,state,ts:Date.now()}));updateResumeButton()}
function clearProgress(){localStorage.removeItem(PROGRESS_KEY);updateResumeButton()}
function updateResumeButton(){const saved=getSaved(),btn=document.getElementById('resumeBtn'),box=document.getElementById('resumeInfo');if(!btn||!box)return;if(saved&&DATA[saved.hp]&&DATA[saved.hp][saved.state?.lesson]){const l=DATA[saved.hp][saved.state.lesson],done=Object.keys(saved.state.answered||{}).length;btn.classList.remove('hidden');box.classList.remove('hidden');box.innerHTML=`<b>Bài đang làm dở:</b> ${saved.hp==='hp1'?'Học phần 1':'Học phần 2'} · Bài ${l.id}<br><span class="small">Đã trả lời ${done}/${saved.state.order?.length||l.questions.length} câu. Bạn có thể tiếp tục đúng vị trí đã dừng.</span>`}else{btn.classList.add('hidden');box.classList.add('hidden');box.innerHTML=''}}
function resumeSaved(){const saved=getSaved();if(!saved||!DATA[saved.hp]||!DATA[saved.hp][saved.state?.lesson]){alert('Không có bài đang làm dở.');clearProgress();return}currentHP=saved.hp;state=saved.state;state.historySaved=false;document.getElementById('home').classList.add('hidden');document.getElementById('historyPage').classList.add('hidden');document.getElementById('lessonPage').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');const l=DATA[currentHP][state.lesson];document.getElementById('lessonName').textContent=`${currentHP==='hp1'?'HP1':'HP2'} · Bài ${l.id}: ${l.title}`;render()}
function openHP(key){currentHP=key;document.getElementById('home').classList.add('hidden');document.getElementById('historyPage').classList.add('hidden');document.getElementById('lessonPage').classList.remove('hidden');document.getElementById('quiz').classList.add('hidden');const lessons=DATA[key];document.getElementById('hpName').textContent=key==='hp1'?'Học phần 1 - Đường lối quốc phòng và an ninh':'Học phần 2 - Công tác quốc phòng và an ninh';document.getElementById('hpMeta').textContent=`${lessons.length} bài · ${lessons.length*100} câu`;const g=document.getElementById('lessonGrid');g.innerHTML='';lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='lesson';b.innerHTML=`<b>Bài ${l.id}</b><div style="margin-top:6px">${esc(l.title)}</div><div class="small" style="margin-top:8px">100 câu</div>`;b.onclick=()=>startLesson(i);g.appendChild(b)})}
function startLesson(i,customOrder=null,forceNew=false,mode='normal'){const l=DATA[currentHP][i];if(!customOrder&&!forceNew){const saved=getSaved();if(saved&&saved.hp===currentHP&&saved.state?.lesson===i&&Object.keys(saved.state.answered||{}).length>0){if(confirm('Bài này đang có tiến độ chưa hoàn thành. Bấm OK để tiếp tục, hoặc Hủy để làm lại từ đầu.')){resumeSaved();return}else clearProgress()}}state={lesson:i,order:customOrder||[...Array(l.questions.length).keys()],pos:0,score:0,answered:{},wrong:[],mode,historySaved:false};document.getElementById('lessonPage').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('lessonName').textContent=`${currentHP==='hp1'?'HP1':'HP2'} · Bài ${l.id}: ${l.title}`;saveProgress();render()}
function render(){const l=DATA[currentHP][state.lesson],total=state.order.length;document.getElementById('counter').textContent=`Câu ${Math.min(state.pos+1,total)}/${total}`;document.getElementById('score').textContent=`Đúng: ${state.score}/${Object.keys(state.answered).length}`;document.getElementById('bar').style.width=(total?state.pos/total*100:0)+'%';const card=document.getElementById('card');if(state.pos>=total){showResult(false);return}const qi=state.order[state.pos],q=l.questions[qi];card.innerHTML=`<div class="q">${esc(q.q)}</div><div class="options">${q.options.map((o,k)=>`<button class="opt" data-k="${k}"><b>${letters[k]}.</b> ${esc(o)}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions"><button class="btn" id="next" style="display:none">Câu tiếp theo →</button></div>`;card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(qi,Number(b.dataset.k)));document.getElementById('next').onclick=()=>{state.pos++;saveProgress();render();window.scrollTo({top:0,behavior:'smooth'})};if(state.answered[qi]!=null)restoreAnswered(qi,state.answered[qi])}
function restoreAnswered(qi,k){const q=DATA[currentHP][state.lesson].questions[qi],correct=q.answer;document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');if(i===k&&i!==correct)b.classList.add('wrong')});const fb=document.getElementById('fb');fb.style.display='block';fb.innerHTML=`<b>${k===correct?'✅ Chính xác':'❌ Chưa đúng'}</b><br>Đáp án: <b>${letters[correct]}. ${esc(q.options[correct])}</b><br><span class="small">${esc(q.explain)}</span>`;document.getElementById('next').style.display='inline-block'}
function answer(qi,k){if(state.answered[qi]!=null)return;const q=DATA[currentHP][state.lesson].questions[qi],correct=q.answer;state.answered[qi]=k;if(k===correct)state.score++;else state.wrong.push(qi);restoreAnswered(qi,k);document.getElementById('score').textContent=`Đúng: ${state.score}/${Object.keys(state.answered).length}`;saveProgress()}
function getHistory(){return safeParse(localStorage.getItem(HISTORY_KEY),'[]')||[]}
function recordHistory(early){if(state.historySaved)return;const l=DATA[currentHP][state.lesson],answered=Object.keys(state.answered).length,total=state.order.length;const item={ts:Date.now(),hp:currentHP,lesson:state.lesson,lessonId:l.id,title:l.title,mode:state.mode||'normal',early,answered,total,correct:state.score,wrong:state.wrong.length,unanswered:Math.max(0,total-answered)};const h=getHistory();h.unshift(item);localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,100)));state.historySaved=true}
function submitQuiz(){const answered=Object.keys(state.answered).length,total=state.order.length;if(answered===0){if(!confirm('Bạn chưa trả lời câu nào. Vẫn nộp bài?'))return}else if(answered<total&&!confirm(`Bạn mới trả lời ${answered}/${total} câu. Nộp bài giữa chừng ngay?`))return;showResult(answered<total)}
function showResult(early=false){const total=state.order.length,answered=Object.keys(state.answered).length,unanswered=Math.max(0,total-answered),pct=answered?Math.round(state.score/answered*100):0;recordHistory(early);clearProgress();document.getElementById('bar').style.width='100%';const wrongCount=[...new Set(state.wrong)].length;document.getElementById('card').innerHTML=`<div class="result"><div class="big">${state.score}/${answered}</div><h2>${pct}% số câu đã làm</h2>${early?'<div class="notice"><b>Đã nộp bài giữa chừng.</b> Các câu chưa làm không bị tính là sai.</div>':''}<div class="statgrid"><div class="stat"><b>${answered}</b><span class="small">Đã trả lời</span></div><div class="stat"><b>${state.score}</b><span class="small">Đúng</span></div><div class="stat"><b>${wrongCount}</b><span class="small">Sai</span></div><div class="stat"><b>${unanswered}</b><span class="small">Chưa làm</span></div></div><div class="actions" style="justify-content:center"><button class="btn" onclick="retryWrong()">Làm lại ${wrongCount} câu sai</button><button class="btn secondary" onclick="startLesson(state.lesson,null,true,'normal')">Làm lại bài từ đầu</button><button class="btn secondary" onclick="backLessons()">Chọn bài khác</button><button class="btn secondary" onclick="showHistory()">Xem lịch sử</button></div></div>`}
function retryWrong(){const arr=[...new Set(state.wrong)];if(!arr.length){alert('Hiện chưa có câu sai để làm lại.');return}startLesson(state.lesson,arr,true,'retry_wrong')}
function shuffleCurrent(){if(state.lesson==null)return;if(Object.keys(state.answered).length&&!confirm('Trộn câu sẽ bắt đầu lại lượt làm hiện tại. Tiếp tục?'))return;for(let i=state.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.order[i],state.order[j]]=[state.order[j],state.order[i]]}state.pos=0;state.score=0;state.answered={};state.wrong=[];state.historySaved=false;saveProgress();render()}
function showHistory(){document.getElementById('home').classList.add('hidden');document.getElementById('lessonPage').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('historyPage').classList.remove('hidden');const list=document.getElementById('historyList'),h=getHistory();if(!h.length){list.innerHTML='<div class="sub">Chưa có lịch sử làm bài.</div>';return}list.innerHTML=h.map(x=>{const d=new Date(x.ts).toLocaleString('vi-VN');const pct=x.answered?Math.round(x.correct/x.answered*100):0;return `<div class="historyItem"><div class="historyHead"><div><b>${x.hp==='hp1'?'Học phần 1':'Học phần 2'} · Bài ${x.lessonId}</b><div class="small">${esc(x.title)}</div></div><div class="small">${d}</div></div><div style="margin-top:10px"><b>${x.correct}/${x.answered} đúng (${pct}%)</b> · Sai ${x.wrong} · Chưa làm ${x.unanswered}${x.mode==='retry_wrong'?' · Lượt làm lại câu sai':''}${x.early?' · Nộp giữa chừng':''}</div></div>`}).join('')}
function closeHistory(){document.getElementById('historyPage').classList.add('hidden');document.getElementById('home').classList.remove('hidden');updateResumeButton()}
function clearHistory(){if(!confirm('Xóa toàn bộ lịch sử làm bài trên thiết bị này?'))return;localStorage.removeItem(HISTORY_KEY);showHistory()}
function backLessons(){if(!state.historySaved&&Object.keys(state.answered).length){saveProgress()}document.getElementById('quiz').classList.add('hidden');openHP(currentHP)}
function goHome(){if(state.lesson!=null&&!state.historySaved&&Object.keys(state.answered).length)saveProgress();currentHP=null;document.getElementById('lessonPage').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('historyPage').classList.add('hidden');document.getElementById('home').classList.remove('hidden');updateResumeButton()}
updateResumeButton();
</script></body></html>
