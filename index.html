bảo vệ Tổ quốc xã hội chủ nghĩa …”","o":["mang tính cách mạng và khoa học sâu sắc","minh cho nhận định trên","có lòng yêu nước mãnh liệt, trí căm thù giặc sâu sắc","quân đội vẫn còn tồn tại"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Học thuyết Mác-Lênin, tư tưởng Hồ Chí Minh về chiến tranh, quân đội và bảo vệ Tổ quốc xã hội chủ nghĩa mang tính cách mạng và khoa học sâu sắc."},{"q":"Phương án nào điền đúng vào chỗ trống: “Trong thời đại hiện nay tình hình thế giới, khu vực và trong nước đang có nhiều …”?","o":["biến đổi và diễn biến phức tạp","dựng chủ nghĩa xã hội”","giai cấp công nhân của quân đội ta","nước, bảo vệ công cuộc xây dựng chủ nghĩa xã hội”"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trong thời đại hiện nay tình hình thế giới, khu vực và trong nước đang có nhiều biến đổi và diễn biến phức tạp."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Vì vậy, nghiên cứu và nắm vững những nội dung cơ bản trên, vận dụng sáng tạo vào thực tiễn xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong giai đoạn hiện nay …”?","o":["thống trị của bọn bóc lột đối với nhân dân lao động trong nước”","lượng vũ trang và bảo vệ Tổ quốc xã hội chủ nghĩa","đang đặt ra có tính cấp thiết cả về lý luận và thực tiễn","nhiệm vụ chiến lược này gắn bó hữu cơ với nhau trong suốt quá"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, nghiên cứu và nắm vững những nội dung cơ bản trên, vận dụng sáng tạo vào thực tiễn xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong giai đoạn hiện nay đang đặt ra có tính cấp thiết cả về lý luận và thực tiễn."},{"q":"Theo giáo trình, ý “Quan điểm của chủ nghĩa Mác-Lênin về nguồn gốc …” kết thúc bằng nội dung nào?","o":["lượng vũ trang nhân dân làm nòng cốt","của mỗi công dân Việt Nam","đội cho phù hợp với tình hình mới","bản chất chiến tranh?"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Quan điểm của chủ nghĩa Mác-Lênin về nguồn gốc, bản chất chiến tranh?"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Quan điểm chỉ đạo và một số giải pháp cơ bản của Đảng ta về bảo …”","o":["mang tính cách mạng và khoa học sâu sắc","nhà nước và giai cấp thống trị xã hội","cùng của các bên tham chiến","vệ Tổ quốc trong tình hình mới?"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Quan điểm chỉ đạo và một số giải pháp cơ bản của Đảng ta về bảo vệ Tổ quốc trong tình hình mới?"}]},{"id":3,"title":"XÂY DỰNG NỀN QUỐC PHÒNG TOÀN DÂN, AN NINH NHÂN DÂN BẢO VỆ TỔ QUỐC VIỆT NAM XÃ HỘI CHỦ NGHĨA","questions":[{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Bài 3 XÂY DỰNG NỀN QUỐC PHÒNG TOÀN DÂN, AN NINH NHÂN DÂN BẢO VỆ TỔ QUỐC …”","o":["với xây dựng nền quốc phòng toàn dân, an ninh nhân dân","tập trung ở tiềm lực chính trị, tinh thần","phục vụ cho nhiệm vụ quân sự","VIỆT NAM XÃ HỘI CHỦ NGHĨA ----- A"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Bài 3 XÂY DỰNG NỀN QUỐC PHÒNG TOÀN DÂN, AN NINH NHÂN DÂN BẢO VỆ TỔ QUỐC VIỆT NAM XÃ HỘI CHỦ NGHĨA ----- A."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Yêu cầu: Xây dựng ý thức trách nhiệm, tự giác tham gia xây dựng nền quốc phòng toàn dân, an ninh nhân …” là gì?","o":["ninh hiện đại là một tất yếu khách quan","dân bảo vệ Tổ quốc xã hội chủ nghĩa","các lực lượng vũ trang nhân dân","giữ vai trò quyết định"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Yêu cầu: Xây dựng ý thức trách nhiệm, tự giác tham gia xây dựng nền quốc phòng toàn dân, an ninh nhân dân bảo vệ Tổ quốc xã hội chủ nghĩa."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Nền quốc phòng toàn dân là sức mạnh quốc phòng của đất nước được xây dựng trên nền tảng nhân lực, vật lực, tinh thần mang tính …”?","o":["bảo vệ đi đôi với xây dựng đất nước","phục vụ cho nhiệm vụ quân sự","chất toàn dân, toàn diện, độc lập, tự chủ, tự cường","đất nước, chế độ xã hội chủ nghĩa"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nền quốc phòng toàn dân là sức mạnh quốc phòng của đất nước được xây dựng trên nền tảng nhân lực, vật lực, tinh thần mang tính chất toàn dân, toàn diện, độc lập, tự chủ, tự cường."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Kết hợp phong trào toàn dân bảo vệ an ninh Tổ quốc với các biện pháp nghiệp vụ của lực lượng chuyên trách, nhằm đập tan mọi âm mưu và hành động xâm phạm an ninh quốc gia và trật tự, an toàn xã hội, cùng với quốc phòng …”","o":["toàn dân bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa","lãnh đạo của Đảng và sự quản lý của Nhà nước","trị và Nghị định 116/2007/NĐ-CP của Thủ tướng Chính phủ","ninh, về sửa chữa, cải tiến, sản xuất các loại vũ khí trang bị"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp phong trào toàn dân bảo vệ an ninh Tổ quốc với các biện pháp nghiệp vụ của lực lượng chuyên trách, nhằm đập tan mọi âm mưu và hành động xâm phạm an ninh quốc gia và trật tự, an toàn xã hội, cùng với quốc phòng toàn dân bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “An ninh quốc gia có nhiệm vụ: Đấu tranh làm thất bại mọi âm mưu hoạt động xâm phạm an ninh quốc gia, bảo vệ chế độ xã hội chủ nghĩa …” được hoàn thiện như thế nào?","o":["toàn dân bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa","bảo vệ Đảng, chính quyền, các lực lượng vũ trang và nhân dân","và an ninh, coi đó là nhiệm vụ chiến lược gắn bó chặt chẽ”","thể huy động để thực hiện nhiệm vụ quốc phòng, an ninh"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: An ninh quốc gia có nhiệm vụ: Đấu tranh làm thất bại mọi âm mưu hoạt động xâm phạm an ninh quốc gia, bảo vệ chế độ xã hội chủ nghĩa, bảo vệ Đảng, chính quyền, các lực lượng vũ trang và nhân dân."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “28 b) Vị trí, vai trò Xây dựng nền quốc phòng, an ninh nhân dân vững mạnh là tạo ra sức mạnh để ngăn ngừa, đẩy lùi, đánh bại mọi âm mưu, hành động xâm hại đến mục tiêu trong sự …”","o":["nghiệp xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa","có thể khai thác, huy động để phục vụ cho quốc phòng, an ninh","ta đều được xây dựng nhằm mục đích tự vệ","có thể khai thác, huy động phục vụ cho quốc phòng, an ninh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: 28 b) Vị trí, vai trò Xây dựng nền quốc phòng, an ninh nhân dân vững mạnh là tạo ra sức mạnh để ngăn ngừa, đẩy lùi, đánh bại mọi âm mưu, hành động xâm hại đến mục tiêu trong sự nghiệp xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa."},{"q":"Phương án nào điền đúng vào chỗ trống: “Đảng ta đã khẳng định: “Trong khi đặt trọng tâm vào nhiệm vụ xây dựng chủ nghĩa xã hội, chúng ta không một chút lơi lỏng nhiệm vụ bảo vệ Tổ quốc, luôn luôn coi trọng quốc phòng …”?","o":["và an ninh, coi đó là nhiệm vụ chiến lược gắn bó chặt chẽ”","ta đều được xây dựng nhằm mục đích tự vệ","cơ động của nền kinh tế đất nước trong mọi điều kiện hoàn cảnh","phòng, an ninh do nhà trường, xã, phường, thị trấn triển khai"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đảng ta đã khẳng định: “Trong khi đặt trọng tâm vào nhiệm vụ xây dựng chủ nghĩa xã hội, chúng ta không một chút lơi lỏng nhiệm vụ bảo vệ Tổ quốc, luôn luôn coi trọng quốc phòng và an ninh, coi đó là nhiệm vụ chiến lược gắn bó chặt chẽ”."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Chúng ta xây dựng nền quốc phòng toàn dân, an ninh nhân dân vững mạnh là để tự vệ, chống lại thù trong, giặc ngoài, bảo vệ vững chắc độc lập, chủ quyền, thống nhất toàn vẹn lãnh thổ, bảo vệ chế độ xã hội …”?","o":["lãnh đạo của Đảng và sự quản lý của Nhà nước","xây dựng nền quốc phòng, an ninh và đấu tranh quốc phòng, an ninh","sống xã hội đã được phép thành lập và quần chúng nhân dân","chủ nghĩa và cuộc sống ấm no, tự do, hạnh phúc của nhân dân"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Chúng ta xây dựng nền quốc phòng toàn dân, an ninh nhân dân vững mạnh là để tự vệ, chống lại thù trong, giặc ngoài, bảo vệ vững chắc độc lập, chủ quyền, thống nhất toàn vẹn lãnh thổ, bảo vệ chế độ xã hội chủ nghĩa và cuộc sống ấm no, tự do, hạnh phúc của nhân dân."},{"q":"Theo giáo trình, ý “Đặc trưng “vì dân, của dân, do dân” và mục đích tự vệ của nền quốc phòng, an ninh cho phép ta huy động mọi người, mọi tổ chức, mọi lực lượng đều thực hiện …” kết thúc bằng nội dung nào?","o":["của cả nước cũng như từng vùng, miền, địa phương, mọi ngành, mọi cấp","xây dựng nền quốc phòng, an ninh và đấu tranh quốc phòng, an ninh","lượng toàn dân (lực lượng chính trị) và lực lượng vũ trang nhân dân","mạng Việt Nam của chủ nghĩa đế quốc và các thế lực thù địch"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đặc trưng “vì dân, của dân, do dân” và mục đích tự vệ của nền quốc phòng, an ninh cho phép ta huy động mọi người, mọi tổ chức, mọi lực lượng đều thực hiện xây dựng nền quốc phòng, an ninh và đấu tranh quốc phòng, an ninh."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Đồng thời, đường lối của Đảng, pháp luật của Nhà nước về quốc phòng, an ninh phải xuất phát từ lợi …”","o":["quốc phòng và an ninh","ích, nguyện vọng và khả năng của nhân dân","đáp ứng yêu cầu của quốc phòng","đất nước cả về chính trị"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đồng thời, đường lối của Đảng, pháp luật của Nhà nước về quốc phòng, an ninh phải xuất phát từ lợi ích, nguyện vọng và khả năng của nhân dân."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “cả ở trong nước, ngoài nước, của dân tộc và của thời đại, trong đó những yếu tố bên trong của dân …”","o":["thực hiện nhiệm vụ quốc phòng","NINH NHÂN DÂN HIỆN NAY 1","tộc bao giờ cũng giữ vai trò quyết định","Tổ quốc trong mọi tình huống"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: cả ở trong nước, ngoài nước, của dân tộc và của thời đại, trong đó những yếu tố bên trong của dân tộc bao giờ cũng giữ vai trò quyết định."},{"q":"Theo bài học, phần còn thiếu trong nhận định “d) Nền quốc phòng, an ninh nhân dân được xây dựng toàn diện và từng bước hiện đại Việc tạo ra sức mạnh quốc phòng, an ninh không chỉ ở sức mạnh quân sự, an ninh mà phải huy động được sức mạnh của toàn dân về …” là gì?","o":["mọi mặt chính trị, quân sự, an ninh, kinh tế, văn hoá, khoa học","trò nòng cốt để bảo vệ Tổ quốc trong mọi tình huống","lãnh đạo của Đảng và sự quản lý của Nhà nước","chủ nghĩa và cuộc sống ấm no, tự do, hạnh phúc của nhân dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: d) Nền quốc phòng, an ninh nhân dân được xây dựng toàn diện và từng bước hiện đại Việc tạo ra sức mạnh quốc phòng, an ninh không chỉ ở sức mạnh quân sự, an ninh mà phải huy động được sức mạnh của toàn dân về mọi mặt chính trị, quân sự, an ninh, kinh tế, văn hoá, khoa học."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Phải kết hợp hữu cơ giữa quốc phòng và an ninh với các mặt hoạt động xây dựng đất nước, kết hợp chặt chẽ …”?","o":["quốc Việt Nam xã hội chủ nghĩa","giữa quốc phòng, an ninh với hoạt động đối ngoại","lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ","các cấp từ Trung ương đến cơ sở"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Phải kết hợp hữu cơ giữa quốc phòng và an ninh với các mặt hoạt động xây dựng đất nước, kết hợp chặt chẽ giữa quốc phòng, an ninh với hoạt động đối ngoại."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Kết hợp giữa xây dựng con người có giác ngộ chính trị, có tri thức với vũ …”","o":["khí trang bị kỹ thuật hiện đại","tưởng văn hoá, xã hội","với tăng cường quốc phòng","cho nhiệm vụ quân sự, an ninh, cho chiến tranh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp giữa xây dựng con người có giác ngộ chính trị, có tri thức với vũ khí trang bị kỹ thuật hiện đại."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Kết hợp chặt chẽ phát triển kinh tế xã hội với tăng cường …” được hoàn thiện như thế nào?","o":["tế của đất nước","quốc phòng và an ninh","mọi điều kiện hoàn cảnh","trách nhiệm của toàn dân"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp chặt chẽ phát triển kinh tế xã hội với tăng cường quốc phòng và an ninh."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Giữa nền quốc phòng toàn dân với nền an ninh nhân dân chỉ khác nhau về phương thức tổ chức lực lượng, hoạt động cụ …”","o":["thể, theo mục tiêu cụ thể được phân công mà thôi","nghiệp vụ của lực lượng chuyên trách","lực khác, là cơ sở, nền tảng của tiềm lực quân sự, an ninh","và an ninh, coi đó là nhiệm vụ chiến lược gắn bó chặt chẽ”"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Giữa nền quốc phòng toàn dân với nền an ninh nhân dân chỉ khác nhau về phương thức tổ chức lực lượng, hoạt động cụ thể, theo mục tiêu cụ thể được phân công mà thôi."},{"q":"Phương án nào điền đúng vào chỗ trống: “Kết hợp chặt chẽ giữa quốc phòng và an ninh phải thường xuyên và tiến hành đồng bộ, thống nhất từ trong chiến lược, quy hoạch, kế hoạch xây dựng, hoạt động …”?","o":["nghiệp xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa","thể, theo mục tiêu cụ thể được phân công mà thôi","của cả nước cũng như từng vùng, miền, địa phương, mọi ngành, mọi cấp","pháp để nhân dân đánh thắng kẻ thù xâm lược"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp chặt chẽ giữa quốc phòng và an ninh phải thường xuyên và tiến hành đồng bộ, thống nhất từ trong chiến lược, quy hoạch, kế hoạch xây dựng, hoạt động của cả nước cũng như từng vùng, miền, địa phương, mọi ngành, mọi cấp."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Mục đích xây dựng nền quốc phòng toàn dân, an ninh nhân dân vững mạnh hiện nay Tạo sức mạnh tổng hợp của đất nước cả về chính trị, quân sự, an ninh, kinh tế, văn hoá, xã hội, khoa học, công …”?","o":["nghệ để giữ vững hoà bình, ổn định, đẩy lùi, ngăn chặn nguy cơ","thể huy động để thực hiện nhiệm vụ quốc phòng, an ninh","sống xã hội đã được phép thành lập và quần chúng nhân dân","bảo vệ Đảng, chính quyền, các lực lượng vũ trang và nhân dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Mục đích xây dựng nền quốc phòng toàn dân, an ninh nhân dân vững mạnh hiện nay Tạo sức mạnh tổng hợp của đất nước cả về chính trị, quân sự, an ninh, kinh tế, văn hoá, xã hội, khoa học, công nghệ để giữ vững hoà bình, ổn định, đẩy lùi, ngăn chặn nguy cơ"},{"q":"Theo giáo trình, ý “bảo vệ sự nghiệp đổi mới, sự nghiệp công nghiệp hoá …” kết thúc bằng nội dung nào?","o":["hiện đại hoá đất nước","mọi điều kiện hoàn cảnh","phòng toàn dân, an ninh nhân dân","giữ vai trò quyết định"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: bảo vệ sự nghiệp đổi mới, sự nghiệp công nghiệp hoá, hiện đại hoá đất nước;"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “bảo vệ an ninh chính trị, an ninh kinh tế, an ninh tư …”","o":["quân đội và công an","làm chủ của nhân dân","tưởng văn hoá, xã hội","quản lý điều hành của Nhà nước"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: bảo vệ an ninh chính trị, an ninh kinh tế, an ninh tư tưởng văn hoá, xã hội;"},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Nhiệm vụ xây dựng nền quốc phòng toàn dân an ninh nhân dân vững mạnh hiện nay Xây dựng lực lượng quốc phòng, an ninh đáp ứng yêu cầu bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa Lực …”","o":["lượng quốc phòng, an ninh là những con người, tổ chức và những cơ","ninh, về sửa chữa, cải tiến, sản xuất các loại vũ khí trang bị","kinh nghiệm của dân tộc ta trong lịch sử dựng nước và giữ nước","cứu khoa học có thể đáp ứng yêu cầu của quốc phòng, an ninh,"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nhiệm vụ xây dựng nền quốc phòng toàn dân an ninh nhân dân vững mạnh hiện nay Xây dựng lực lượng quốc phòng, an ninh đáp ứng yêu cầu bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa Lực lượng quốc phòng, an ninh là những con người, tổ chức và những cơ"},{"q":"Theo bài học, phần còn thiếu trong nhận định “Lực lượng chính trị bao gồm các tổ chức trong hệ thống chính trị, các tổ chức chính trị - xã hội và những tổ chức khác trong đời …” là gì?","o":["ninh, về sửa chữa, cải tiến, sản xuất các loại vũ khí trang bị","kinh nghiệm của dân tộc ta trong lịch sử dựng nước và giữ nước","sống xã hội đã được phép thành lập và quần chúng nhân dân","đó lực lượng chuyên trách bảo vệ an ninh nhân dân làm nòng cốt"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Lực lượng chính trị bao gồm các tổ chức trong hệ thống chính trị, các tổ chức chính trị - xã hội và những tổ chức khác trong đời sống xã hội đã được phép thành lập và quần chúng nhân dân."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “30 Xây dựng lực lượng quốc phòng, an ninh là xây dựng lực lượng chính trị và lực lượng vũ trang nhân dân đáp ứng yêu cầu của quốc …”?","o":["cơ sở vật chất của các tiềm lực khác","tộc bao giờ cũng giữ vai trò quyết định","phòng, an ninh, bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa","lượng toàn dân (lực lượng chính trị) và lực lượng vũ trang nhân dân"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: 30 Xây dựng lực lượng quốc phòng, an ninh là xây dựng lực lượng chính trị và lực lượng vũ trang nhân dân đáp ứng yêu cầu của quốc phòng, an ninh, bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Xây dựng tiềm lực quốc phòng, an ninh ngày càng vững mạnh Tiềm lực quốc phòng, an ninh là khả năng về nhân lực, vật lực, tài chính có …”","o":["bảo vệ Tổ quốc trong mọi điều kiện, hoàn cảnh, tình huống","ích, nguyện vọng và khả năng của nhân dân","thể huy động để thực hiện nhiệm vụ quốc phòng, an ninh","chủ nghĩa và cuộc sống ấm no, tự do, hạnh phúc của nhân dân"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng tiềm lực quốc phòng, an ninh ngày càng vững mạnh Tiềm lực quốc phòng, an ninh là khả năng về nhân lực, vật lực, tài chính có thể huy động để thực hiện nhiệm vụ quốc phòng, an ninh."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Xây dựng tiềm lực quốc phòng, an ninh là tập trung xây dựng …” được hoàn thiện như thế nào?","o":["nước và giữ nước","tiềm lực chính trị, tinh thần","Việt Nam xã hội chủ nghĩa","làm tham mưu trong tổ chức"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng tiềm lực quốc phòng, an ninh là tập trung xây dựng tiềm lực chính trị, tinh thần;"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “a) Xây dựng tiềm lực chính trị, tinh thần Tiềm lực chính trị, tinh thần của nền của nền quốc phòng toàn dân, an ninh nhân dân là khả năng về chính trị, tinh thần có thể huy …”","o":["động tạo nên sức mạnh để thực hiện nhiệm vụ quốc phòng, an ninh","trong, giặc ngoài để bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa","bảo vệ Đảng, chính quyền, các lực lượng vũ trang và nhân dân","sự khác nhau về bản chất trong xây dựng nền quốc phòng, an ninh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: a) Xây dựng tiềm lực chính trị, tinh thần Tiềm lực chính trị, tinh thần của nền của nền quốc phòng toàn dân, an ninh nhân dân là khả năng về chính trị, tinh thần có thể huy động tạo nên sức mạnh để thực hiện nhiệm vụ quốc phòng, an ninh."},{"q":"Phương án nào điền đúng vào chỗ trống: “Tiềm lực chính trị, tinh thần được biểu hiện ở năng lực lãnh đạo của Đảng …”?","o":["quản lý điều hành của Nhà nước","lãnh đạo của Đảng và sự quản lý của Nhà nước","cao chất lượng giáo dục quốc phòng và an ninh","vũ trang nhân dân vững mạnh toàn diện"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tiềm lực chính trị, tinh thần được biểu hiện ở năng lực lãnh đạo của Đảng, quản lý điều hành của Nhà nước;"},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Tiềm lực chính trị tinh thần là nhân tố cơ bản tạo nên sức mạnh của quốc phòng, an ninh, có tác động to lớn đến hiệu quả xây dựng và sử dụng các tiềm …”?","o":["giữa quốc phòng, an ninh với hoạt động đối ngoại","lực khác, là cơ sở, nền tảng của tiềm lực quân sự, an ninh","lượng toàn dân (lực lượng chính trị) và lực lượng vũ trang nhân dân","xây dựng nền quốc phòng, an ninh và đấu tranh quốc phòng, an ninh"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tiềm lực chính trị tinh thần là nhân tố cơ bản tạo nên sức mạnh của quốc phòng, an ninh, có tác động to lớn đến hiệu quả xây dựng và sử dụng các tiềm lực khác, là cơ sở, nền tảng của tiềm lực quân sự, an ninh."},{"q":"Theo giáo trình, ý “Xây dựng hệ thống chính trị trong sạch vững mạnh, phát huy quyền …” kết thúc bằng nội dung nào?","o":["sự phát triển của nền kinh tế","trận quốc phòng, an ninh","làm chủ của nhân dân","phòng toàn dân, an ninh nhân dân"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng hệ thống chính trị trong sạch vững mạnh, phát huy quyền làm chủ của nhân dân."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Tiềm lực kinh tế của nền quốc phòng toàn dân, an ninh nhân dân được biểu hiện ở nhân lực, vật lực, tài lực của quốc gia có thể huy động cho quốc phòng, an ninh và tính …”","o":["cơ động của nền kinh tế đất nước trong mọi điều kiện hoàn cảnh","động tạo nên sức mạnh để thực hiện nhiệm vụ quốc phòng, an ninh","sức mạnh chiến đấu của các lực lượng vũ trang nhân dân","chủ nghĩa và cuộc sống ấm no, tự do, hạnh phúc của nhân dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tiềm lực kinh tế của nền quốc phòng toàn dân, an ninh nhân dân được biểu hiện ở nhân lực, vật lực, tài lực của quốc gia có thể huy động cho quốc phòng, an ninh và tính cơ động của nền kinh tế đất nước trong mọi điều kiện hoàn cảnh."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Tiềm lực kinh tế tạo sức mạnh vật chất cho nền quốc phòng toàn dân, an ninh nhân dân, là …”","o":["cơ sở vật chất của các tiềm lực khác","pháp để nhân dân đánh thắng kẻ thù xâm lược","lực chính trị tinh thần","khí trang bị kỹ thuật hiện đại"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tiềm lực kinh tế tạo sức mạnh vật chất cho nền quốc phòng toàn dân, an ninh nhân dân, là cơ sở vật chất của các tiềm lực khác."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Do đó, cần tập trung vào: Đẩy mạnh công nghiệp hoá, hiện đại hoá đất nước, xây …” là gì?","o":["bảo vệ đi đôi với xây dựng đất nước","đất nước, chế độ xã hội chủ nghĩa","dựng nền kinh tế độc lập, tự chủ","phạm an ninh quốc gia"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Do đó, cần tập trung vào: Đẩy mạnh công nghiệp hoá, hiện đại hoá đất nước, xây dựng nền kinh tế độc lập, tự chủ."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “phát triển công nghiệp quốc phòng, trang bị kỹ thuật hiện đại cho …”?","o":["kẻ thù xâm lược","quân đội và công an","trình độ sẵn sàng chiến đấu","hoạt động xây dựng đất nước"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: phát triển công nghiệp quốc phòng, trang bị kỹ thuật hiện đại cho quân đội và công an."},{"q":"Chọn phương án nối tiếp đúng nội dung: “31 Kết hợp xây dựng cơ sở hạ tầng kinh tế với cơ …”","o":["giữ vai trò quyết định","sở hạ tầng quốc phòng","về phương thức tổ chức lực lượng","ương đến cơ sở"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: 31 Kết hợp xây dựng cơ sở hạ tầng kinh tế với cơ sở hạ tầng quốc phòng;"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Có kế hoạch chuyển sản xuất từ thời bình sang thời chiến và duy trì …” được hoàn thiện như thế nào?","o":["sự phát triển của nền kinh tế","an ninh nhân dân vững mạnh?","lực lượng vũ trang nhân dân","vũ trang nhân dân vững mạnh toàn diện"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Có kế hoạch chuyển sản xuất từ thời bình sang thời chiến và duy trì sự phát triển của nền kinh tế."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Tiềm lực khoa học, công nghệ được biểu hiện ở: Số lượng, chất lượng đội ngũ cán bộ khoa học kỹ thuật, cơ sở vật chất kỹ thuật có thể huy động phục vụ cho quốc phòng, an ninh và năng lực ứng dụng kết quả nghiên …”","o":["động tạo nên sức mạnh để thực hiện nhiệm vụ quốc phòng, an ninh","cứu khoa học có thể đáp ứng yêu cầu của quốc phòng, an ninh,","lượng quốc phòng, an ninh là những con người, tổ chức và những cơ","ninh, về sửa chữa, cải tiến, sản xuất các loại vũ khí trang bị"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tiềm lực khoa học, công nghệ được biểu hiện ở: Số lượng, chất lượng đội ngũ cán bộ khoa học kỹ thuật, cơ sở vật chất kỹ thuật có thể huy động phục vụ cho quốc phòng, an ninh và năng lực ứng dụng kết quả nghiên cứu khoa học có thể đáp ứng yêu cầu của quốc phòng, an ninh,..."},{"q":"Phương án nào điền đúng vào chỗ trống: “Xây dựng tiềm lực khoa học, công nghệ của nền quốc phòng toàn dân, an ninh nhân dân là tạo nên khả năng về khoa học, công nghệ của quốc gia …”?","o":["với xây dựng nền quốc phòng toàn dân, an ninh nhân dân","mọi mặt chính trị, quân sự, an ninh, kinh tế, văn hoá, khoa học","tập trung ở tiềm lực chính trị, tinh thần","có , an ninh được xây dựng trên nền tảng của các tiềm lực chính trị …”","o":["cơ sở vật chất của các tiềm lực khác","khả năng về kinh tế của đất nước","tinh thần, kinh tế, khoa học công nghệ","nay Xây dựng lực lượng quốc phòng"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Tiềm lực quân sự, an ninh được xây dựng trên nền tảng của các tiềm lực chính trị tinh thần, kinh tế, khoa học công nghệ."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Gắn quá trình công nghiệp hoá, hiện đại hoá đất nước với quá trình tăng cường vũ khí trang bị …” là gì?","o":["thực hiện công tác quốc phòng, an ninh","đất nước, chế độ xã hội chủ nghĩa","cho các lực lượng vũ trang nhân dân","tập trung ở tiềm lực chính trị, tinh thần"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Gắn quá trình công nghiệp hoá, hiện đại hoá đất nước với quá trình tăng cường vũ khí trang bị cho các lực lượng vũ trang nhân dân."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Bố trí lực lượng luôn đáp ứng yêu cầu chuẩn bị đất nước về mọi …”?","o":["mặt, sẵn sàng động viên thời chiến","trận quốc phòng, an ninh","làm chủ của nhân dân","quốc phòng và an ninh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Bố trí lực lượng luôn đáp ứng yêu cầu chuẩn bị đất nước về mọi mặt, sẵn sàng động viên thời chiến."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Tăng cường nghiên cứu khoa học quân sự, nghệ thuật quân sự trong chiến tranh nhân dân bảo vệ Tổ quốc hiện nay và nâng …”","o":["vi và khả năng của mình","cao chất lượng giáo dục quốc phòng và an ninh","của cả nước cũng như từng vùng, miền, địa phương, mọi ngành, mọi cấp","dục giáo dục quốc phòng và an ninh"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tăng cường nghiên cứu khoa học quân sự, nghệ thuật quân sự trong chiến tranh nhân dân bảo vệ Tổ quốc hiện nay và nâng cao chất lượng giáo dục quốc phòng và an ninh."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “32 Nội dung xây dựng thế trận quốc phòng toàn dân, an ninh nhân dân gồm: Phân vùng chiến lược về quốc phòng, an ninh kết hợp với vùng kinh tế trên cơ sở quy hoạch các vùng …” được hoàn thiện như thế nào?","o":["pháp để nhân dân đánh thắng kẻ thù xâm lược","đó lực lượng chuyên trách bảo vệ an ninh nhân dân làm nòng cốt","dân cư theo nguyên tắc bảo vệ đi đôi với xây dựng đất nước","lượng quốc phòng, an ninh là những con người, tổ chức và những cơ"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: 32 Nội dung xây dựng thế trận quốc phòng toàn dân, an ninh nhân dân gồm: Phân vùng chiến lược về quốc phòng, an ninh kết hợp với vùng kinh tế trên cơ sở quy hoạch các vùng dân cư theo nguyên tắc bảo vệ đi đôi với xây dựng đất nước."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Xây dựng khu vực phòng thủ tỉnh (thành phố) tạo nền tảng của thế trận quốc …”","o":["làm chủ của nhân dân","phòng toàn dân, an ninh nhân dân","Việt Nam xã hội chủ nghĩa","và tiến hành đồng bộ"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng khu vực phòng thủ tỉnh (thành phố) tạo nền tảng của thế trận quốc phòng toàn dân, an ninh nhân dân."},{"q":"Phương án nào điền đúng vào chỗ trống: “MỘT SỐ BIỆN PHÁP CHÍNH XÂY DỰNG NỀN QUỐC PHÒNG TOÀN DÂN, AN …”?","o":["NINH NHÂN DÂN HIỆN NAY 1","lượng giáo dục quốc phòng và an ninh","quân đội và công an","trách nhiệm của toàn dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: MỘT SỐ BIỆN PHÁP CHÍNH XÂY DỰNG NỀN QUỐC PHÒNG TOÀN DÂN, AN NINH NHÂN DÂN HIỆN NAY 1."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Luôn luôn thực hiện tốt giáo dục quốc phòng và an ninh Thực hiện Chỉ thị 12-CT/TW ngày 03/5/2007 của Bộ Chính …”?","o":["ích, nguyện vọng và khả năng của nhân dân","cơ sở vật chất của các tiềm lực khác","nghiệp xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa","trị và Nghị định 116/2007/NĐ-CP của Thủ tướng Chính phủ"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Luôn luôn thực hiện tốt giáo dục quốc phòng và an ninh Thực hiện Chỉ thị 12-CT/TW ngày 03/5/2007 của Bộ Chính trị và Nghị định 116/2007/NĐ-CP của Thủ tướng Chính phủ."},{"q":"Theo giáo trình, ý “nghĩa vụ công dân đối với xây dựng và bảo vệ Tổ quốc …” kết thúc bằng nội dung nào?","o":["đáp ứng yêu cầu của quốc phòng","dân làm nòng cốt","Việt Nam xã hội chủ nghĩa","sự phát triển của nền kinh tế"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: nghĩa vụ công dân đối với xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa;"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Làm cho mọi người, mọi tổ chức biết tự bảo vệ trước sự chống phá …”","o":["của các thế lực thù địch","Việt Nam xã hội chủ nghĩa","vệ an ninh quốc gia","tập trung ở tiềm lực chính trị, tinh thần"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Làm cho mọi người, mọi tổ chức biết tự bảo vệ trước sự chống phá của các thế lực thù địch."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Phải vận dụng nhiều hình thức, phương pháp giáo dục tuyên truyền để nâng cao hiệu quả, chất lượng giáo …”","o":["quốc phòng toàn dân","kẻ thù xâm lược","dục giáo dục quốc phòng và an ninh","cơ sở vật chất của các tiềm lực khác"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Phải vận dụng nhiều hình thức, phương pháp giáo dục tuyên truyền để nâng cao hiệu quả, chất lượng giáo dục giáo dục quốc phòng và an ninh."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Cụ thể hoá các nội dung lãnh đạo về quốc phòng và an ninh và bổ sung cơ chế hoạt động của từng cấp, từng ngành, từng địa phương …” là gì?","o":["đặc biệt chú trọng khi xử trí các tình huống phức tạp","mạng Việt Nam của chủ nghĩa đế quốc và các thế lực thù địch","cho nhiệm vụ quân sự, an ninh, cho chiến tranh","và các công trình quốc phòng, an ninh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Cụ thể hoá các nội dung lãnh đạo về quốc phòng và an ninh và bổ sung cơ chế hoạt động của từng cấp, từng ngành, từng địa phương, đặc biệt chú trọng khi xử trí các tình huống phức tạp."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Tổ chức phân công cán bộ chuyên trách để phát huy vai trò làm tham mưu trong tổ chức …”?","o":["phạm an ninh quốc gia","thực hiện công tác quốc phòng, an ninh","vụ cho quốc phòng","tưởng văn hoá, xã hội"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tổ chức phân công cán bộ chuyên trách để phát huy vai trò làm tham mưu trong tổ chức, thực hiện công tác quốc phòng, an ninh."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Chấp hành nghiêm Quy chế 107/2003/ QĐ-TTg của Thủ tướng Chính phủ về phối hợp quân đội với công an và Nghị quyết 51-NQ/TW ngày 20/7/2005 của Bộ Chính trị (khóa IX) về “Tiếp tục hoàn thiện cơ …”","o":["chế lãnh đạo của Đảng, thực hiện chế độ một người chỉ huy gắn","của cả nước cũng như từng vùng, miền, địa phương, mọi ngành, mọi cấp","có thể khai thác, huy động để phục vụ cho quốc phòng, an ninh","phòng, an ninh do nhà trường, xã, phường, thị trấn triển khai"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Chấp hành nghiêm Quy chế 107/2003/ QĐ-TTg của Thủ tướng Chính phủ về phối hợp quân đội với công an và Nghị quyết 51-NQ/TW ngày 20/7/2005 của Bộ Chính trị (khóa IX) về “Tiếp tục hoàn thiện cơ chế lãnh đạo của Đảng, thực hiện chế độ một người chỉ huy gắn"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Xây dựng nền quốc phòng toàn dân, an ninh nhân dân là …” được hoàn thiện như thế nào?","o":["trách nhiệm của toàn dân","vũ trang nhân dân","an ninh nhân dân","thực hiện nhiệm vụ quốc phòng"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng nền quốc phòng toàn dân, an ninh nhân dân là trách nhiệm của toàn dân."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Đối với sinh viên, phải tích cực học tập nâng cao trình độ hiểu biết về mọi mặt, nắm vững kiến thức quốc phòng, an ninh, nhận thức rõ âm mưu, thủ đoạn hoạt động chống phá cách …”","o":["mạng Việt Nam của chủ nghĩa đế quốc và các thế lực thù địch","dân cư theo nguyên tắc bảo vệ đi đôi với xây dựng đất nước","chế lãnh đạo của Đảng, thực hiện chế độ một người chỉ huy gắn","thể khai thác, huy động nhằm phục vụ cho quốc phòng, an ninh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đối với sinh viên, phải tích cực học tập nâ ạn hoạt động chống phá cách mạng Việt Nam của chủ nghĩa đế quốc …”","o":["quân sự, an ninh","và các thế lực thù địch","dân và Dân quân tự vệ","giữa quốc phòng, an ninh với hoạt động đối ngoại"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: thủ đoạn hoạt động chống phá cách mạng Việt Nam của chủ nghĩa đế quốc và các thế lực thù địch."}]},{"id":4,"title":"CHIẾN TRANH NHÂN DÂN BẢO VỆ TỔ QUỐC VIỆT NAM XÃ HỘI CHỦ NGHĨA","questions":[{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Bài 4 CHIẾN TRANH NHÂN DÂN BẢO VỆ TỔ QUỐC VIỆT NAM XÃ …”","o":["năng nề, đánh bại xâm lược của địch","HỘI CHỦ NGHĨA ----- A","mới đòi hỏi toàn Đảng","BẢO VỆ TỔ QUỐC 1"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Bài 4 CHIẾN TRANH NHÂN DÂN BẢO VỆ TỔ QUỐC VIỆT NAM XÃ HỘI CHỦ NGHĨA ----- A."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Yêu cầu: Từ nhận thức trên, nêu cao tinh thần trách nhiệm của mỗi người, ra sức học tập và vận dụng sáng tạo những quan điểm chỉ đạo của Đảng …” là gì?","o":["góp phần bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa","vũ trang mà phải dựa vào sức mạnh của toàn dân, tiến hành chiến","cơ, chủ động đối phó và giành thắng lợi trong thời gian cần thiết","thất bại chiến lược “Diễn biến hòa bình”, bạo loạn lật đổ của địch"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Yêu cầu: Từ nhận thức trên, nêu cao tinh thần trách nhiệm của mỗi người, ra sức học tập và vận dụng sáng tạo những quan điểm chỉ đạo của Đảng góp phần bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “a) Mục đích của chiến tranh nhân dân Chiến tranh nhân dân Việt Nam là quá trình sử dụng tiềm lực của đất nước, nhất là tiềm lực quốc phòng, an ninh, nhằm đánh bại ý …”?","o":["đấu chống lại chiến tranh xâm lược của kẻ thù","đồ xâm lược lật đổ của kẻ thù đối với cách mạng nước ta","ngừng tăng thêm tiềm lực của chiến tranh, càng đánh càng mạnh","bị nhân dân tiến bộ trên thế giới phản đối"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: a) Mục đích của chiến tranh nhân dân Chiến tranh nhân dân Việt Nam là quá trình sử dụng tiềm lực của đất nước, nhất là tiềm lực quốc phòng, an ninh, nhằm đánh bại ý đồ xâm lược lật đổ của kẻ thù đối với cách mạng nước ta."},{"q":"Chọn phương án nối tiếp đúng nội dung: “chủ động ngăn chặn, làm thất bại mọi âm mưu và hành động chống phá của các thế lực thù địch đối …”","o":["với sự nghiệp cách mạng của nhân dân ta","địch sử dụng phương tiện","tranh phi nghĩa, chắc chắn bị nhân loại phản đối","để lừa bịp dư luận"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: chủ động ngăn chặn, làm thất bại mọi âm mưu và hành động chống phá của các thế lực thù địch đối với sự nghiệp cách mạng của nhân dân ta."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Đối tượng tác chiến: Chủ nghĩa đế quốc và các thế lực phản động có hành động phá hoại, xâm lược lật đổ cách mạng, hiện nay chúng đang thực hiện chiến lược “Diễn biến hòa bình” bạo loạn lật đổ để xóa …” được hoàn thiện như thế nào?","o":["vũ trang mà phải dựa vào sức mạnh của toàn dân, tiến hành chiến","bỏ chủ nghĩa xã hội ở nước ta và sẵn sàng sử dụng lực","định đời sống nhân dân đòi hỏi cao và khẩn trương","xã hội, bảo vệ vững chắc hậu phương, giữ vững sự chi viện sức"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đối tượng tác chiến: Chủ nghĩa đế quốc và các thế lực phản động có hành động phá hoại, xâm lược lật đổ cách mạng, hiện nay chúng đang thực hiện chiến lược “Diễn biến hòa bình” bạo loạn lật đổ để xóa bỏ chủ nghĩa xã hội ở nước ta và sẵn sàng sử dụng lực"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Đồng thời, kết hợp với các biện pháp phi vũ trang …”","o":["để lừa bịp dư luận","dân là toàn dân đánh giặc","sự nghiệp cách mạng của nhân dân ta","chiến tranh ổn định đời sống nhân dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đồng thời, kết hợp với các biện pháp phi vũ trang để lừa bịp dư luận."},{"q":"Phương án nào điền đúng vào chỗ trống: “Giai đoạn thực hành thôn tính lãnh thổ có thể đồng thời hỗ trợ của bạo loạn lật đổ ở bên trong của các lực lượng phản động và sử …”?","o":["dụng các biện pháp chính trị, ngoại giao để lừa bịp dư luận","lực lượng vũ trang hành động quân sự can thiệp khi có thời cơ","định đời sống nhân dân đòi hỏi cao và khẩn trương","quân: Dân quân tự vệ, bộ đội địa phương và bộ đội chủ lực"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Giai đoạn thực hành thôn tính lãnh thổ có thể đồng thời hỗ trợ của bạo loạn lật đổ ở bên trong của các lực lượng phản động và sử dụng các biện pháp chính trị, ngoại giao để lừa bịp dư luận."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “35 Khi tiến hành chiến tranh xâm lược địch có điểm mạnh, yếu sau: Mạnh: Có ưu thế tuyệt đối về sức mạnh quân …”?","o":["sự, kinh tế và tiềm lực khoa học công nghệ","chiến tranh nhân dân ở địa phương","Việt Nam xã hội chủ nghĩa?","trang nhân dân làm nòng cốt"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: 35 Khi tiến hành chiến tranh xâm lược địch có điểm mạnh, yếu sau: Mạnh: Có ưu thế tuyệt đối về sức mạnh quân sự, kinh tế và tiềm lực khoa học công nghệ."},{"q":"Theo giáo trình, ý “Dân tộc ta có truyền thống yêu nước, chống xâm lược, chắc chắn sẽ làm cho chúng bị tổn thất …” kết thúc bằng nội dung nào?","o":["chuộng hoà bình trên thế giới","để lừa bịp dư luận","năng nề, đánh bại xâm lược của địch","chắc Tổ quốc Việt Nam xã hội chủ nghĩa"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Dân tộc ta có truyền thống yêu nước, chống xâm lược, chắc chắn sẽ làm cho chúng bị tổn thất năng nề, đánh bại xâm lược của địch."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Địa hình thời tiết nước ta phức tạp khó khăn cho địch sử …”","o":["vực đủ sức đánh được lâu dài","dụng phương tiện, lực lượng","quá trình phát triển của chiến tranh","đòi hỏi cao và khẩn trương"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Địa hình thời tiết nước ta phức tạp khó khăn cho địch sử dụng phương tiện, lực lượng."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Là cuộc chiến tranh chính nghĩa, tự vệ cách mạng, nhằm bảo vệ độc lập tự do của dân tộc, bảo vệ độc lập chủ quyền, thống nhất toàn vẹn lãnh thổ của đất nước, bảo vệ Đảng, bảo vệ chế độ xã …”","o":["toàn diện, đấu tranh với địch trên nhiều mặt nhưng chủ yếu đã đánh","để tiến hành chiến tranh và hoạt động tác chiến","kích động, 39 chia rẽ, làm mất ổn định chính trị, gây rối loạn","hội chủ nghĩa, bảo vệ nhân dân và mọi thành quả của cách mạng"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Là cuộc chiến tranh chính nghĩa, tự vệ cách mạng, nhằm bảo vệ độc lập tự do của dân tộc, bảo vệ độc lập chủ quyền, thống nhất toàn vẹn lãnh thổ của đất nước, bảo vệ Đảng, bảo vệ chế độ xã hội chủ nghĩa, bảo vệ nhân dân và mọi thành quả của cách mạng."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Chiến tranh nhân dân Việt Nam bảo vệ Tổ quốc xã hội chủ nghĩa trong tình hình mới có những đặc điểm cơ bản sau: Trong bối cảnh quốc tế có nhiều diễn biến phức tạp, chúng ta tiến hành chiến …” là gì?","o":["thuật cho chiến tranh ổn định đời sống nhân dân","hợp giải quyết tốt các tính huống chiến đấu diễn ra","để tiến hành chiến tranh và hoạt động tác chiến","tranh nhân dân bảo vệ Tổ quốc, nhằm góp phần thực hiện những mục"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Chiến tranh nhân dân Việt Nam bảo vệ Tổ quốc xã hội chủ nghĩa trong tình hình mới có những đặc điểm cơ bản sau: Trong bối cảnh quốc tế có nhiều diễn biến phức tạp, chúng ta tiến hành chiến tranh nhân dân bảo vệ Tổ quốc, nhằm góp phần thực hiện những mục"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Do vậy, chúng ta có thể tập hợp, động viên và phát huy cao độ, đông đảo được sức mạnh …”?","o":["mới phù hợp với điều kiện mới","sự nghiệp cách mạng của nhân dân ta","đòi hỏi cao và khẩn trương","của toàn dân cả nước, chung sức đánh giặc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Do vậy, chúng ta có thể tập hợp, động viên và phát huy cao độ, đông đảo được sức mạnh của toàn dân cả nước, chung sức đánh giặc."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Mặt khác, cuộc chiến tranh mang tính độc lập, tự chủ, tự lực tự cường, dựa vào sức mình là chính, nhưng đồng thời cũng được sự đồng tình ủng hộ, giúp đỡ của nhân dân tiến bộ trên thế giới, tạo …”","o":["phấn đấu làm thất bại âm mưu và các mục tiêu chiến lược của","sức mạnh tổng hợp của quốc gia và quốc tế, dân tộc và thời","lượng phản động và sử dụng các biện pháp chính trị","ngoài vào với hành động bạo loạn lật đổ từ bên trong"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Mặt khác, cuộc chiến tranh mang tính độc lập, tự chủ, tự lực tự cường, dựa vào sức mình là chính, nhưng đồng thời cũng được sự đồng tình ủng hộ, giúp đỡ của nhân dân tiến bộ trên thế giới, tạo sức mạnh tổng hợp của quốc gia và quốc tế, dân tộc và thời"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Chiến tranh diễn ra khẩn trương, quyết liệt phức tạp ngay từ đầu và …” được hoàn thiện như thế nào?","o":["trong suốt quá trình chiến tranh","sự, kinh tế và tiềm lực khoa học công nghệ","chiến tranh ổn định đời sống nhân dân","để lừa bịp dư luận"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Chiến tranh diễn ra khẩn trương, quyết liệt phức tạp ngay từ đầu và trong suốt quá trình chiến tranh."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Kết hợp tiến công hoả lực với tiến công trên bộ, tiến công từ bên ngoài kết hợp với bạo loạn lật đổ ở bên trong và bao vây phong toả đường không đường biển …”","o":["toàn diện, đấu tranh với địch trên nhiều mặt nhưng chủ yếu đã đánh","và đường bộ để nhằm tới mục tiêu chiến lược trong thời gian ngắn","sức mạnh tổng hợp lớn giành thắng lợi cho cuộc chiến tranh","vũ trang mà phải dựa vào sức mạnh của toàn dân, tiến hành chiến"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp tiến công hoả lực với tiến công trên bộ, tiến công từ bên ngoài kết hợp với bạo loạn lật đổ ở bên trong và bao vây phong toả đường không đường biển và đường bộ để nhằm tới mục tiêu chiến lược trong thời gian ngắn."},{"q":"Phương án nào điền đúng vào chỗ trống: “QUAN ĐIỂM CỦA ĐẢNG TRONG CHIẾN TRANH NHÂN DÂN BẢO VỆ TỔ QUỐC Từ trong thực tiễn, Đảng ta nhận định: “Trong một vài thập kỷ …”?","o":["hệ trẻ nói chung và sinh viên nói riêng","tranh phi nghĩa, chắc chắn bị nhân loại phản đối","chiến tranh nhân dân ở địa phương","tới, ít có khả năng xảy ra chiến tranh thế giới"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: QUAN ĐIỂM CỦA ĐẢNG TRONG CHIẾN TRANH NHÂN DÂN BẢO VỆ TỔ QUỐC Từ trong thực tiễn, Đảng ta nhận định: “Trong một vài thập kỷ tới, ít có khả năng xảy ra chiến tranh thế giới."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Nhưng chiến tranh cục bộ, xung đột vũ trang, xung đột dân tộc, tôn giáo, chạy đua vũ trang, hoạt động can thiệp lật đổ còn …”?","o":["chiến tranh ổn định đời sống nhân dân","vô nhân đạo sẽ bị nhân dân tiến bộ trên thế giới phản đối","thời là truyền thống chống giặc ngoại xâm trước kia cũng như trong cuộc","xảy ra nhiều nơi với tính chất ngày càng phức tạp”"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nhưng chiến tranh cục bộ, xung đột vũ trang, xung đột dân tộc, tôn giáo, chạy đua vũ trang, hoạt động can thiệp lật đổ còn xảy ra nhiều nơi với tính chất ngày càng phức tạp”."},{"q":"Theo giáo trình, ý “Tiến hành chiến tranh nhân dân, toàn dân đánh giặc, lấy lực lượng vũ …” kết thúc bằng nội dung nào?","o":["mặt đồng thời có nghệ thuật chỉ đạo","thuật cho chiến tranh ổn định đời sống nhân dân","trang nhân dân làm nòng cốt","thù phát động chiến tranh xâm lược"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Tiến hành chiến tranh nhân dân, toàn dân đánh giặc, lấy lực lượng vũ trang nhân dân làm nòng cốt."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Kết hợp tác chiến của lực lượng vũ trang địa phương với tác chiến của các binh đoàn chủ lực a) Vị trí: Đây là quan điểm cơ bản …”","o":["xuyên suốt, thể hiện tính nhân dân sâu sắc trong chiến tranh","xã hội, bảo vệ vững chắc hậu phương, giữ vững sự chi viện sức","sự nghiệp cách mạng của nhân dân ta","nhất định bảo đảm cho tác chiến giành thắng lợi"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp tác chiến của lực lượng vũ trang địa phương với tác chiến của các binh đoàn chủ lực a) Vị trí: Đây là quan điểm cơ bản xuyên suốt, thể hiện tính nhân dân sâu sắc trong chiến tranh."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Là điều kiện để phát huy cao nhất sức mạnh tổng …”","o":["hợp trong cuộc chiến tranh","trong chiến tranh a) Vị trí","lược mới của kẻ thù","mới có những đặc điểm cơ bản sau"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Là điều kiện để phát huy cao nhất sức mạnh tổng hợp trong cuộc chiến tranh."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Động viên toàn dân đánh giặc, chúng ta phải động viên và tổ chức quần chúng cùng lực lượng vũ trang nhân dân trực tiếp chiến đấu và phục …” là gì?","o":["toàn diện, đấu tranh với địch trên nhiều mặt nhưng chủ yếu đã đánh","tranh toàn dân đánh thắng cuộc tiến công xâm lược của địch","sức mạnh tổng hợp lớn giành thắng lợi cho cuộc chiến tranh","vụ chiến đấu chống lại chiến tranh xâm lược của kẻ thù"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Động viên toàn dân đánh giặc, chúng ta phải động viên và tổ chức quần chúng cùng lực lượng vũ trang nhân dân trực tiếp chiến đấu và phục vụ chiến đấu chống lại chiến tranh xâm lược của kẻ thù."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Đánh giặc bằng mọi thứ vũ khí có trong tay, bằng những cách đánh độc đáo, sáng tạo… Toàn dân đánh giặc phải có lực lượng nòng cốt là lực lượng vũ trang nhân dân gồm ba thứ …”?","o":["xuyên suốt, thể hiện tính nhân dân sâu sắc trong chiến tranh","tranh phi nghĩa, chắc chắn bị nhân loại phản đối","xảy ra nhiều nơi với tính chất ngày càng phức tạp”","quân: Dân quân tự vệ, bộ đội địa phương và bộ đội chủ lực"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đánh giặc bằng mọi thứ vũ khí có trong tay, bằng những cách đánh độc đáo, sáng tạo… Toàn dân đánh giặc phải có lực lượng nòng cốt là lực lượng vũ trang nhân dân gồm ba thứ quân: Dân quân tự vệ, bộ đội địa phương và bộ đội chủ lực."},{"q":"Chọn phương án nối tiếp đúng nội dung: “bộ đội địa phương và dân quân tự vệ làm nòng cốt cho phong trào …”","o":["để kết thúc chiến tranh","thù xâm lược lớn","mục địch chiến tranh xâm lược","chiến tranh nhân dân ở địa phương"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: bộ đội địa phương và dân quân tự vệ làm nòng cốt cho phong trào chiến tranh nhân dân ở địa phương."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Bộ đội chủ lực cùng lực lượng vũ trang địa phương làm nòng cốt cho toàn dân …” được hoàn thiện như thế nào?","o":["đánh giặc trên chiến trường cả nước","với sự nghiệp cách mạng của nhân dân ta","chiến tranh ổn định đời sống nhân dân","lược mới của kẻ thù"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Bộ đội chủ lực cùng lực lượng vũ trang địa phương làm nòng cốt cho toàn dân đánh giặc trên chiến trường cả nước."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Tổ tiên ta đã tiến hành chiến tranh nhân dân để đánh thắng các triều đại phong kiến phương Bắc xâm lược, cũng như dưới sự lãnh đạo của Đảng, dân tộc ta đã đánh thắng thực dân Pháp và đế quốc Mỹ …”","o":["những kẻ thù xâm lược lớn mạnh hơn ta nhiều lần","lượng là chính, lấy xây dựng chính trị làm cơ sở","đấu chống lại chiến tranh xâm lược của kẻ thù","xâm lược, bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Tổ tiên ta đã tiến hành chiến tranh nhân dân để đánh thắng các triều đại phong kiến phương Bắc xâm lược, cũng như dưới sự lãnh đạo của Đảng, dân tộc ta đã đánh thắng thực dân Pháp và đế quốc Mỹ xâm lược, bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa."},{"q":"Phương án nào điền đúng vào chỗ trống: “Ngày nay, chúng ta phải kế thừa và phát huy truyền thống ấy lên một trình độ mới phù hợp với điều kiện mới, thực hiện chiến …”?","o":["chiến tranh ổn định đời sống nhân dân","trường là yếu tố quyết định để giành thắng lợi trong chiến tranh a)","vụ chiến đấu chống lại chiến tranh xâm lược của kẻ thù","tranh toàn dân đánh thắng cuộc tiến công xâm lược của địch"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Ngày nay, chúng ta phải kế thừa và phát huy truyền thống ấy lên một trình độ mới phù hợp với điều kiện mới, thực hiện chiến tranh toàn dân đánh thắng cuộc tiến công xâm lược của địch."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Không ngừng chăm lo xây dựng các lực lượng vũ trang vững mạnh toàn diện …”?","o":["loạn lật đổ từ bên trong","thù xâm lược lớn","nhanh giải quyết nhanh","đặc biệt là chất lượng chính trị"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Không ngừng chăm lo xây dựng các lực lượng vũ trang vững mạnh toàn diện, đặc biệt là chất lượng chính trị."},{"q":"Theo giáo trình, ý “Tiến hành chiến tranh toàn diện, kết hợp chặt chẽ giữa đấu tranh quân sự, chính trị, ngoại giao, kinh tế, văn hoá và tư tưởng, lấy đấu tranh quân sự là chủ yếu, lấy thắng lợi trên chiến …” kết thúc bằng nội dung nào?","o":["trường là yếu tố quyết định để giành thắng lợi trong chiến tranh a)","đánh địch, liên tục dài ngày, liên kết thành thế trận làng nước","định đời sống nhân dân đòi hỏi cao và khẩn trương","lượng là chính, lấy xây dựng chính trị làm cơ sở"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tiến hành chiến tranh toàn diện, kết hợp chặt chẽ giữa đấu tranh quân sự, chính trị, ngoại giao, kinh tế, văn hoá và tư tưởng, lấy đấu tranh quân sự là chủ yếu, lấy thắng lợi trên chiến trường là yếu tố quyết định để giành thắng lợi trong chiến tranh a)"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “b) Nội dung Chiến tranh là một cuộc thử thách toàn diện đối với sức mạnh vật chất tinh thần của quốc gia, nhưng chiến tranh của …”","o":["thuật cho chiến tranh ổn định đời sống nhân dân","quân: Dân quân tự vệ, bộ đội địa phương và bộ đội chủ lực","ngoài vào với hành động bạo loạn lật đổ từ bên trong","ta là một cuộc chiến tranh chính nghĩa, tự vệ, cách mạng"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: b) Nội dung Chiến tranh là một cuộc thử thách toàn diện đối với sức mạnh vật chất tinh thần của quốc gia, nhưng chiến tranh của ta là một cuộc chiến tranh chính nghĩa, tự vệ, cách mạng."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Tất cả các mặt trận đấu tranh trên phải kết hợp chặt chẽ với nhau, hỗ trợ cho nhau và tạo điều kiện cho đấu tranh quân sự giành thắng lợi trên chiến trường và cùng với đấu tranh quân sự …”","o":["tạo nên sức mạnh tổng hợp lớn giành thắng lợi cho cuộc chiến tranh","trị, bảo đảm an ninh quốc gia và trật tự, an toàn xã hội","để nhằm tới mục tiêu chiến lược trong thời gian ngắn","đấu chống lại chiến tranh xâm lược của kẻ thù"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tất cả các mặt trận đấu tranh trên phải kết hợp chặt chẽ với nhau, hỗ trợ cho nhau và tạo điều kiện cho đấu tranh quân sự giành thắng lợi trên chiến trường và cùng với đấu tranh quân sự tạo nên sức mạnh tổng hợp lớn giành thắng lợi cho cuộc chiến tranh."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Truyền thống và kinh nghiệm của cuộc chiến tranh giải phóng và giữ nước trong lịch sử ông cha ta cũng như dưới sự lãnh đạo của Đảng, chứng tỏ nhân dân ta đã tiến hành cuộc kháng chiến …” là gì?","o":["xảy ra nhiều nơi với tính chất ngày càng phức tạp”","toàn diện, đấu tranh với địch trên nhiều mặt nhưng chủ yếu đã đánh","hội chủ nghĩa, bảo vệ nhân dân và mọi thành quả của cách mạng","vụ chiến đấu chống lại chiến tranh xâm lược của kẻ thù"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Truyền thống và kinh nghiệm của cuộc chiến tranh giải phóng và giữ nước trong lịch sử ông cha ta cũng như dưới sự lãnh đạo của Đảng, chứng tỏ nhân dân ta đã tiến hành cuộc kháng chiến toàn diện, đấu tranh với địch trên nhiều mặt nhưng chủ yếu đã đánh"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “c) Biện pháp Đảng phải có đường lối chiến lược, sách lược đúng, tạo thế và lực cho từng mặt trận đấu tranh tạo nên sức mạnh, trước mắt đấu tranh làm …”?","o":["dụng các biện pháp chính trị, ngoại giao để lừa bịp dư luận","sức mạnh tổng hợp lớn giành thắng lợi cho cuộc chiến tranh","thất bại chiến lược “Diễn biến hòa bình”, bạo loạn lật đổ của địch","ngoài vào với hành động bạo loạn lật đổ từ bên trong"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: c) Biện pháp Đảng phải có đường lối chiến lược, sách lược đúng, tạo thế và lực cho từng mặt trận đấu tranh tạo nên sức mạnh, trước mắt đấu tranh làm thất bại chiến lược “Diễn biến hòa bình”, bạo loạn lật đổ của địch."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Phải vận dụng sáng tạo nhiều hình thức và biện pháp đấu tranh thích hợp 38 trên từng mặt đồng thời có nghệ thuật chỉ đạo, phối hợp chặt chẽ các mặt trận đấu …”","o":["lượng là chính, lấy xây dựng chính trị làm cơ sở","tranh trong từng giai đoạn cũng như quá trình phát triển của chiến tranh","sức mạnh tổng hợp của quốc gia và quốc tế, dân tộc và thời","quân làm nòng cốt, dưới sự lãnh đạo của Đảng Cộng sản Việt Nam"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Phải vận dụng sáng tạo nhiều hình thức và biện pháp đấu tranh thích hợp 38 trên từng mặt đồng thời có nghệ thuật chỉ đạo, phối hợp chặt chẽ các mặt trận đấu tranh trong từng giai đoạn cũng như quá trình phát triển của chiến tranh."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Song, phải luôn quán triệt, lấy đấu tranh quân sự là chủ yếu, lấy thắng lợi trên chiến trường là …” được hoàn thiện như thế nào?","o":["Đảng trong chiến tranh nhân dân bảo vệ Tổ quốc Việt Nam","yếu tố quyết định để kết thúc chiến tranh","mới đòi hỏi toàn Đảng","quân sự lên một tầm cao mới"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Song, phải luôn quán triệt, lấy đấu tranh quân sự là chủ yếu, lấy thắng lợi trên chiến trường là yếu tố quyết định để kết thúc chiến tranh."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Chúng dựa vào sức mạnh quân sự ưu thế áp đảo đối với ta để thực hiện “đánh nhanh, giải quyết nhanh” theo học thuyết tác chiến “không …”","o":["vụ chiến đấu chống lại chiến tranh xâm lược của kẻ thù","ta là một cuộc chiến tranh chính nghĩa, tự vệ, cách mạng","- bộ - biển” nhằm đạt mục địch chiến tranh xâm lược","tranh toàn dân đánh thắng cuộc tiến công xâm lược của địch"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Chúng dựa vào sức mạnh quân sự ưu thế áp đảo đối với ta để thực hiện “đánh nhanh, giải quyết nhanh” theo học thuyết tác chiến “không - bộ - biển” nhằm đạt mục địch chiến tranh xâm lược."},{"q":"Phương án nào điền đúng vào chỗ trống: “Vì vậy, trước hết ta phải chuẩn bị mọi mặt trên cả nước cũng như từng khu vực đủ sức đánh được lâu dài, ra sức tạo thời cơ, nắm vững thời …”?","o":["đổ ở bên trong, đánh nhanh giải quyết nhanh, vì vậy buộc ta phải","mạnh tổng hợp chủ động đánh địch ngay từ ngày đầu và lâu dài","cơ, chủ động đối phó và giành thắng lợi trong thời gian cần thiết","lượng là chính, lấy xây dựng chính trị làm cơ sở"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, trước hết ta phải chuẩn bị mọi mặt trên cả nước cũng như từng khu vực đủ sức đánh được lâu dài, ra sức tạo thời cơ, nắm vững thời cơ, chủ động đối phó và giành thắng lợi trong thời gian cần thiết."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Ta kiên quyết ngăn chặn địch không cho chúng mở rộng để thu …”?","o":["trang nhân dân gồm ba thứ quân","lược đánh nhanh giải quyết nhanh","hẹp không gian của chiến tranh","vị bạn đánh địch"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Ta kiên quyết ngăn chặn địch không cho chúng mở rộng để thu hẹp không gian của chiến tranh."},{"q":"Theo giáo trình, ý “Kết hợp kháng chiến với xây dựng, vừa kháng chiến vừa xây dựng, ra sức sản xuất thực hành tiết kiệm giữ gìn và bồi dưỡng lực lượng ta càng đánh càng mạnh Đây là một kinh nghiệm đồng …” kết thúc bằng nội dung nào?","o":["thời là truyền thống chống giặc ngoại xâm trước kia cũng như trong cuộc","tiến công từ bên ngoài vào và bạo loạn lật đổ ở bên trong","thuật cho chiến tranh ổn định đời sống nhân dân","sức mạnh tổng hợp của quốc gia và quốc tế, dân tộc và thời"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp kháng chiến với xây dựng, vừa kháng chiến vừa xây dựng, ra sức sản xuất thực hành tiết kiệm giữ gìn và bồi dưỡng lực lượng ta càng đánh càng mạnh Đây là một kinh nghiệm đồng thời là truyền thống chống giặc ngoại xâm trước kia cũng như trong cuộc"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Nếu chiến tranh xảy ra, chúng ta phải tiến hành cuộc chiến tranh nhân dân bảo vệ Tổ quốc, cuộc chiến …”","o":["đó sẽ diễn ra quyết liệt ngay từ đầu","để lừa bịp dư luận","quân sự lên một tầm cao mới","những kẻ thù xâm lược lớn mạnh hơn ta nhiều lần"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nếu chiến tranh xảy ra, chúng ta phải tiến hành cuộc chiến tranh nhân dân bảo vệ Tổ quốc, cuộc chiến đó sẽ diễn ra quyết liệt ngay từ đầu."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Muốn duy trì được sức mạnh để đánh thắng kẻ thù xâm lược lớn, ta cần phải có tiềm lực kinh tế quân sự …”","o":["giành thắng lợi trong chiến tranh","đấu chống lại chiến tranh xâm lược của kẻ thù","hoả lực đánh bất ngờ, ồ ạt","nhất định bảo đảm cho tác chiến giành thắng lợi"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Muốn duy trì được sức mạnh để đánh thắng kẻ thù xâm lược lớn, ta cần phải có tiềm lực kinh tế quân sự nhất định bảo đảm cho tác chiến giành thắng lợi."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Vì vậy, trong chiến tranh ta phải: Vừa kháng chiến, vừa duy trì và đẩy mạnh sản xuất bảo đảm nhu cầu vật chất kỹ …” là gì?","o":["hẹp không gian của chiến tranh","thuật cho chiến tranh ổn định đời sống nhân dân","cơ, chủ động đối phó và giành thắng lợi trong thời gian cần thiết","giành thắng lợi càng sớm càng tốt"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, trong chiến tranh ta phải: Vừa kháng chiến, vừa duy trì và đẩy mạnh sản xuất bảo đảm nhu cầu vật chất kỹ thuật cho chiến tranh ổn định đời sống nhân dân."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Kết hợp đấu tranh quân sự với bảo đảm an ninh chính trị, giữ gìn trật tự, an toàn xã hội, trấn áp kịp thời mọi âm mưu và hành động phá hoại gây bạo loạn Hiện nay kẻ địch đang đẩy mạnh chiến lược “Diễn …”?","o":["biến hoà bình”, bạo loạn lật đổ để chống phá cách mạng nước ta","nhất định bảo đảm cho tác chiến giành thắng lợi","xảy ra nhiều nơi với tính chất ngày càng phức tạp”","xâm lược, bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp đấu tranh quân sự với bảo đảm an ninh chính trị, giữ gìn trật tự, an toàn xã hội, trấn áp kịp thời mọi âm mưu và hành động phá hoại gây bạo loạn Hiện nay kẻ địch đang đẩy mạnh chiến lược “Diễn biến hoà bình”, bạo loạn lật đổ để chống phá cách mạng nước ta."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Vì vậy, đi đôi với đấu tranh quân sự trên chiến trường, ta phải kịp thời trấn áp mọi âm mưu và hành động phá hoại của địch ở hậu phương ta, bảo đảm an ninh chính trị, giữ gìn trật tự, an toàn …”","o":["hợp giải quyết tốt các tính huống chiến đấu diễn ra","định đời sống nhân dân đòi hỏi cao và khẩn trương","vụ chiến đấu chống lại chiến tranh xâm lược của kẻ thù","xã hội, bảo vệ vững chắc hậu phương, giữ vững sự chi viện sức"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, đi đôi với đấu tranh quân sự trên chiến trường, ta phải kịp thời trấn áp mọi âm mưu và hành động phá hoại của địch ở hậu phương ta, bảo đảm an ninh chính trị, giữ gìn trật tự, an toàn xã hội, bảo vệ vững chắc hậu phương, giữ vững sự chi viện sức"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Kết hợp sức mạnh dân tộc với sức mạnh thời đại, phát huy tinh thần tự lực tự cường, tranh thủ sự giúp đỡ quốc tế, sự đồng tình, ủng hộ của nhân dân tiến bộ trên thế giới Cuộc chiến tranh xâm lược của địch là tàn bạo và …” được hoàn thiện như thế nào?","o":["nhất định bảo đảm cho tác chiến giành thắng lợi","và đường bộ để nhằm tới mục tiêu chiến lược trong thời gian ngắn","ta là một cuộc chiến tranh chính nghĩa, tự vệ, cách mạng","vô nhân đạo sẽ bị nhân dân tiến bộ trên thế giới phản đối"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp sức mạnh dân tộc với sức mạnh thời đại, phát huy tinh thần tự lực tự cường, tranh thủ sự giúp đỡ quốc tế, sự đồng tình, ủng hộ của nhân dân tiến bộ trên thế giới Cuộc chiến tranh xâm lược của địch là tàn bạo và vô nhân đạo sẽ bị nhân dân tiến bộ trên thế giới phản đối."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “MỘT SỐ NỘI DUNG CHỦ YẾU CỦA CHIẾN TRANH NHÂN DÂN …”","o":["BẢO VỆ TỔ QUỐC 1","quốc Mỹ xâm lược","bảo vệ Tổ quốc?","rãi và lực lượng quân sự"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: MỘT SỐ NỘI DUNG CHỦ YẾU CỦA CHIẾN TRANH NHÂN DÂN BẢO VỆ TỔ QUỐC 1."},{"q":"Phương án nào điền đúng vào chỗ trống: “Tổ chức thế trận chiến tranh nhân dân Thế trận chiến tranh nhân dân là sự tổ chức bố trí lực lượng …”?","o":["triển nghệ thuật quân sự lên một tầm cao mới","để tiến hành chiến tranh và hoạt động tác chiến","tranh nhân dân bảo vệ Tổ quốc, nhằm góp phần thực hiện những mục","vào sức mạnh của toàn dân"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tổ chức thế trận chiến tranh nhân dân Thế trận chiến tranh nhân dân là sự tổ chức bố trí lực lượng để tiến hành chiến tranh và hoạt động tác chiến."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Xây dựng khu vực phòng thủ vững mạnh toàn diện, có khả năng độc lập tác chiến, đồng thời phối hợp với bộ đội chủ lực và đơn vị bạn …”?","o":["cơ, chủ động đối phó và giành thắng lợi trong thời gian cần thiết","đánh địch, liên tục dài ngày, liên kết thành thế trận làng nước","nhất định bảo đảm cho tác chiến giành thắng lợi","xâm lược, bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng khu vực phòng thủ vững mạnh toàn diện, có khả năng độc lập tác chiến, đồng thời phối hợp với bộ đội chủ lực và đơn vị bạn đánh địch, liên tục dài ngày, liên kết thành thế trận làng nước."},{"q":"Theo giáo trình, ý “Lực lượng toàn dân được tổ chức chặt chẽ thành lực lượng quần chúng rộng …” kết thúc bằng nội dung nào?","o":["thổ và chế độ xã hội chủ nghĩa","rãi và lực lượng quân sự","lược mới của kẻ thù","vững mạnh toàn diện"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Lực lượng toàn dân được tổ chức chặt chẽ thành lực lượng quần chúng rộng rãi và lực lượng quân sự."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Lực lượng vũ trang nhân dân đựơc xây dựng vững mạnh toàn diện, coi trọng cả số lượng và chất lượng, trong đó lấy chất …”","o":["trường là yếu tố quyết định để giành thắng lợi trong chiến tranh a)","lượng là chính, lấy xây dựng chính trị làm cơ sở","cũng như dưới sự lãnh đạo của Đảng","đổ ở bên trong, đánh nhanh giải quyết nhanh, vì vậy buộc ta phải"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Lực lượng vũ trang nhân dân đựơc xây dựng vững mạnh toàn diện, coi trọng cả số lượng và chất lượng, trong đó lấy chất lượng là chính, lấy xây dựng chính trị làm cơ sở."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Trong quá trình chuẩn bị lực lượng vũ trang phải có kế hoạch, phương án chiến đấu và được quán triệt tới mọi người kết …”","o":["trang nhân dân gồm ba thứ quân","đó sẽ diễn ra quyết liệt ngay từ đầu","hợp giải quyết tốt các tính huống chiến đấu diễn ra","hệ trẻ nói chung và sinh viên nói riêng"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Trong quá trình chuẩn bị lực lượng vũ trang phải có kế hoạch, phương án chiến đấu và được quán triệt tới mọi người kết hợp giải quyết tốt các tính huống chiến đấu diễn ra."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Mục đích, tính chất, đặc điểm của chiến tranh nhân dân …” là gì?","o":["bảo vệ Tổ quốc?","chuộng hoà bình trên thế giới","đặc biệt là chất lượng chính trị","các tính huống chiến đấu diễn ra"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Mục đích, tính chất, đặc điểm của chiến tranh nhân dân bảo vệ Tổ quốc?"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “làm cơ sở nghiên cứu nắm vững quan điểm chỉ đạo của Đảng trong chiến tranh nhân dân …”?","o":["để tiến hành chiến tranh và hoạt động tác chiến","dân là toàn dân đánh giặc","bảo vệ Tổ quốc xã hội chủ nghĩa","nhất định bảo đảm cho tác chiến giành thắng lợi"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: làm cơ sở nghiên cứu nắm vững qu
