 trống: “Khách thể của các tội _____ dự, nhân phẩm của con người”","options":["trường lớp phát hiện","động toàndân tham gia","xâm phạm danh","hiện bằng hành độngphạm"],"answer":2,"explain":"Nội dung trong tài liệu: Khách thể của các tội xâm phạm danh dự, nhân phẩm của con người"},{"q":"Điền nội dung phù hợp vào chỗ trống: “Khách thể của các tội xâm phạm danh dự, _____ người”","options":["nhân phẩm của con","cách cách nêu gương","công dân lương thiện","gia đình Nhà nước"],"answer":0,"explain":"Nội dung trong tài liệu: Khách thể của các tội xâm phạm danh dự, nhân phẩm của con người"},{"q":"Điền nội dung phù hợp vào chỗ trống: “Khách thể của các _____ danh dự, nhân phẩm của con người”","options":["nâng cao chất lượng","tội xâm phạm","hướng công nghiệp hóa","sự nghiệp bảo vệ"],"answer":1,"explain":"Nội dung trong tài liệu: Khách thể của các tội xâm phạm danh dự, nhân phẩm của con người"},{"q":"Điền nội dung phù hợp vào chỗ trống: “Khách thể của các tội xâm _____, nhân phẩm của con người”","options":["công chức năng nhiệm","phạm danh dự","quan bảo vệ pháp","giúp giữvững an ninh"],"answer":1,"explain":"Nội dung trong tài liệu: Khách thể của các tội xâm phạm danh dự, nhân phẩm của con người"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nguồn gốc nhận thức của tôn giáo: do trình độ nhận thức hạn hẹp, mơ hồ về tự nhiên, xã hội có liên quan đến đời sống, số phận của con người họ cảm thấy yếu đuối, lệ thuộc và bất lực.","Dân tộc là cộng đồng người ổn đinh, hình thành trong lịch sử, tạo lập một quốc gia, trên cơ sở cộng đồng bền vững về:","An ninh truyền thống và an ninh phi truyền thống đều nằm trong nhóm các vấn đề an ninh, là hai mặt của khái niệm an ninh toàn diện.","Phối hợp với cáctổ chức đoàn thể tích cực vận động quần chúng tham gia phát hiện, tố giác tội phạm, chủ động hỗ trợ các lực lượng chức năng tấn công trấn áp tội phạm."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Phối hợp với cáctổ chức đoàn thể tích cực vận động quần chúng tham gia phát hiện, tố giác tội phạm, chủ động hỗ trợ các lực lượng chức năng tấn công trấn áp tội phạm."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["“Dính líu”, “ngầm”, “sâu, hiểm” nhằm chống phá cách mạng Việt Nam.","Trong công cuộc đổi mới hiện nay, Đảng ta khẳng định:","Tội mua bán, chiếm đoạt mô hoặc bộ phận cơ thể người (Điều 154).","Pháp luật xây dựng hệ thống các quy chuẩn môi trường, tiêu chuẩn môi trường để bảo vệ môi trường"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tội mua bán, chiếm đoạt mô hoặc bộ phận cơ thể người (Điều 154)."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Vai trò của pháp luật về bảo đảm trật tự, an toàn giao thông","Đây là đặc điểm nổi bật trong quan hệ giữa các dân tộc ở Việt Nam.","Tăng cường thực hiện công tác phòng, chống tội phạm, gắn phòng, chống xã hội với phòng, chống nghiệp vụ.","Các thế lực thù địch lợi dụng xu thế mở rộng, hợp tác quốc tế, thực hiện xâm nhập, tăng cường hoạt động tình báo thu thập bí mật quốc gia."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tăng cường thực hiện công tác phòng, chống tội phạm, gắn phòng, chống xã hội với phòng, chống nghiệp vụ."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Khích lệ thành phần kinh tế tư nhân phát triển, từng bước làm mất vai trò chủ đạo của thành phần kinh tế Nhà nước.","Quan điểm chủ nghĩa Mác-Lênin về giải quyết vấn đề tôn giáo trong cách mạng xã hội chủ nghĩa","Trong Bộ Luật hình sự năm 2015 (sửa đổi, bổ sung năm 2017) quy định tại Điều 140:","Chiến lược “Diễn biến hoà bình” đã ra đời, phát triển cùng với sự điều chỉnh phương thức, thủ đ"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Trong Bộ Luật hình sự năm 2015 (sửa đổi, bổ sung năm 2017) quy định tại Điều 140:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Những tôn giáo lớn trên thế giới hiện nay gồm có:","Phòng, chống tội phạm được tiến hành theo hai hướng cơ bản sau:","Trong những năm gần đây hoạt động của các tôn giáo khá sôi động, diễn ra theo nhiều xu hướng.","Hiện nay, cần tập trung vào những giải pháp cơ bản, cụ thể sau:"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Phòng, chống tội phạm được tiến hành theo hai hướng cơ bản sau:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Pháp luật có tác dụng rất lớn trong việc tạo ra cơ chế hoạt động hiệu quả cho các tổ chức bảo vệ môi trường.","Với kết quả này, Việt Nam là quốc gia đông dân thứ 15 trên thế giới và đứng thứ 3 trong khu vực Đông Nam Á.","Công dân với tư cách là chủ thể trong phòng, chống tội phạm phải quán triệt.","Đảng lãnh đạo Nhà nước, các cơ quan, tổ chức trong"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Công dân với tư cách là chủ thể trong phòng, chống tội phạm phải quán triệt."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Trên cơ sở đó để mỗi người đề cao cảnh giác cách mạng, góp phần cùng toàn Đảng, toàn dân và lực lượng vũ trang nhân dân làm thất bại chiến lược “Diễn biến hòa bình”, bạo loạn lật đổ của chúng.","Sử dụng các công cụ, phương tiện khác nhau để gây nên sự tác độngtới con người cụ thể, gây ra những thiệt hại hoặc đe dọa gây ra những thiệt hại cho con người đó.","Vì vậy, trong quá trình tổ chức thực hiện nhiệm vụ này không nên coi nhẹ hoặc tuyệt đối hoá một giải pháp nào.","Chống kì thị chia rẽ dân tộc, tôn giáo, chống tư tưởng dân tộc lớn, dân tộc hẹp hòi, dân tộc cực đoan, tự ti, mặc cảm dân tộc, tôn giáo."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Sử dụng các công cụ, phương tiện khác nhau để gây nên sự tác độngtới con người cụ thể, gây ra những thiệt hại hoặc đe dọa gây ra những thiệt hại cho con người đó."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tăng cường chia sẻ thông tin giữa Việt Nam với các nước trên từng nội dung về các mỗi đe dọa an ninh phi truyền thống thông qua thiết lập cơ chế hợp tác cụ thể và hữu hiệu.","Nguồn tài chính xã hội hóa với sự đóng góp rộng rãi của nhân dân, các nhà tài trợ:","“Vì môi trường xanh - sạch- đẹp”, “Phòng, chống rác thải nhựa”… và tổ chức các cuộc thi tìm hiểu về môi trường và pháp luật về bảo vệ môi trường trong nhà trường.","Nhân phẩm là tổng hợp những phẩm chất mang tính đặc trưng của mỗi cá nhân, những yếu tố đặc trưng này tạo nên giá trị một con người."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Nhân phẩm là tổng hợp những phẩm chất mang tính đặc trưng của mỗi cá nhân, những yếu tố đặc trưng này tạo nên giá trị một con người."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Đẩy mạnh hoạt động phòng ngừa tội phạm theo chức năng, nhiệm vụ của cáclực lượng trong Quân đội, Hải quan, Kiểm lâm, Thanh tra, Quản lý thị trường.","Gương mẫu chấp hành pháp luật về bảo đảm trật tự, an toàn giao thông; vận động người thân, gia đình và bạn bè cùng thực hiện tốt.","Các thế lực thù địch đã có sự điều chỉnh thủ đoạn chống phá cách mạng nước ta, chúng chuyển sang thủ đoạn mới, đẩy mạnh hoạt động xâm nhập như:","Đăng tải các thông tin độc hại vi phạm an ninh quốc gia, trật tự, an toàn xã hội"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Đẩy mạnh hoạt động phòng ngừa tội phạm theo chức năng, nhiệm vụ của cáclực lượng trong Quân đội, Hải quan, Kiểm lâm, Thanh tra, Quản lý thị trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tổ chức cho sinh viên tham gia ký kết không tham gia tệ nạn xã hội, không có hành vi hoạt động phạm tội.","Cán bộ, đảng viên và các tầng lớp nhân dân cần nhận thức rõ các nguy cơ đến từ không gian mạng như:","Phát huy sức mạnh tổng hợp của hệ thống chính trị và toàn xã hội trong quản trị và kiểm soát các mối đe dọa an ninh phi truyền thống","Mối quan hệ giữa an ninh truyền thông và an ninh phi truyền thống?"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tổ chức cho sinh viên tham gia ký kết không tham gia tệ nạn xã hội, không có hành vi hoạt động phạm tội."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Trực tiếp chỉ đạo, hướng dẫn, kiểm tra việc thực hiện pháp luật về bảo vệ môi trường đối với các hoạt động xây dựng cơ bản, xử lý chất thải rắn trong phạm vi trách nhiệm quản lý.","[9] Văn kiện Đại Hội Đại biểu toàn quốc lần thứ XIII tập  Nhà xuất bản chính trị quốc gia sự thật.","Đây cũng là một trong những giải pháp quan trọng, xét đến cùng có ý nghĩa nền tảng để vô hiệu hoá sự lợi dụng của kẻ thù.","Phát động các phong trào trong nhà trường hưởng ứng các cuộc vận động toàndân tham gia phòng, chống tội phạm với nội dung, hình thức phù hợp với điều kiện, hoàn cảnh của nhà trường."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Phát động các phong trào trong nhà trường hưởng ứng các cuộc vận động toàndân tham gia phòng, chống tội phạm với nội dung, hình thức phù hợp với điều kiện, hoàn cảnh của nhà trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Quyền bình đẳng dân tộc phải được pháp luật hoá và thực hiện trên thực tế.","Nội dung cơ bản của an ninh quốc gia chính là bảo vệ lợi ích của quốc gia, loại trừ những mối uy hiếp đối với lợi ích cơ bản đó.","Đây là tội xâm phạm đến sức khoẻ con người, xâm phạm đến quyền bất khả xâm phạm về thân thể con người.","Tin giả được tạo ra bằng nhiều hình thức tinh vi."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Đây là tội xâm phạm đến sức khoẻ con người, xâm phạm đến quyền bất khả xâm phạm về thân thể con người."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Lồng ghép công tác tái hòa nhập cộng đồng đối với người chấp hành xong ánphạt tù với các chương trình, chiến lược, kế hoạch phát triển kinh tế - xã hội và công tác phòng, chống tội phạm ở từng địa phương.","Phát huy trách nhiệm mỗi chủ thể trong việc chủ động phòng ngừa và ứngphó với thách thức an ninh phi truyền thống.","Hiện nay, con người vẫn chưa hoàn toàn làm chủ tự nhiên và xã hội; các cuộc xung đột giai cấp, dân tộc, tôn giáo, thiên tai, bệnh tật... vẫn còn diễn ra, nên vẫn còn nguồn gốc để tôn giáo tồn tại.","Trung thành với quan điểm chủ nghĩa Mác-Lênin, bám sát thực tiễn cách mạng, đặc điểm các dân tộc ở Việt Nam, Chủ tịch Hồ Chí Minh đã có quan điểm dân tộc đúng đắn, góp phần cùng toàn Đảng, lãnh đạo nhân dân ta giải phóng dân tộc; xây dựng, củng cố khối đại đoàn kết dân tộc và đoàn kết quốc tế của dân tộc Việt Nam."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Lồng ghép công tác tái hòa nhập cộng đồng đối với người chấp hành xong ánphạt tù với các chương trình, chiến lược, kế hoạch phát triển kinh tế - xã hội và công tác phòng, chống tội phạm ở từng địa phương."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Kích động sự bất bình của quần chúng, dụ dỗ và cưỡng ép nhân dân biểu tình làm chỗ dựa cho lực lượng phản động trà trộn hoạt động gây bạo loạn, bọn phản động tìm mọi cách để mở rộng phạm vi, quy mô, lực lượng và kêu gọi sự tài trợ tiền của, vũ khí ngoài nước vào để tăng sức mạnh.","Lợi dụng sự giúp đỡ, viện trợ kinh tế, đầu tư vốn, chuyển giao công nghệ cho Việt Nam để đặt ra các điều kiện và gây sức ép về chính trị, từng bước chuyển hoá Việt Nam theo con đường tư bản chủ nghĩa.","Giáo dục bằng cách cách nêu gương của cha mẹ, anh chị trong gia định của như lối sống, ứng xử đúng mực của mình người xung quanh để từ đó con cái học tập, noi theo; cha mẹ phải gương mẫu trong mọi lời nói, hành động, tránh xa các vi phạm đạo đức, vi phạm pháp luật, tệ nạn xã hội…","Trực tiếp chỉ đạo và phân công, phân cấp cụ thể cho các bộ, ngành, các cơ quan đoàn thể xã hội trong phòng ngừa tội phạm và vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Giáo dục bằng cách cách nêu gương của cha mẹ, anh chị trong gia định của như lối sống, ứng xử đúng mực của mình người xung quanh để từ đó con cái học tập, noi theo; cha mẹ phải gương mẫu trong mọi lời nói, hành động, tránh xa các vi phạm đạo đức, vi phạm pháp luật, tệ nạn xã hội…"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Chủ thể và quan hệ phối hợp trong phòng, chống tội phạm xâm phạm danh dự, nhân phẩm của người khác","Riêng đối với hành vi không ngăn chặn, thu hồi số thuê bao được dùng để phát tán tin nhắn rác thì mức phạt tiền sẽ từ 180-200 triệu đồng.","Khái niệm pháp luật về bảo đảm trật tự, an toàn giao thông","Các chế định hay điều luật cụ thể quy định những quy tắc xử sự buộc mỗi cá nhân, tổ chức phải tuân theo những quy định đó."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Chủ thể và quan hệ phối hợp trong phòng, chống tội phạm xâm phạm danh dự, nhân phẩm của người khác"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Đồng thời các dân tộc cũng có điểm chung thống nhất về văn hoá, ngôn ngữ, phong tục tập quán, tín ngưỡng, tôn giáo, ý thức quốc gia dân tộc.","Phối hợp với lực lượng công an cơ sở trong rà soát phát hiện, cung cấp số sinhviên có biểu hiện nghi vấn hoạt động phạm tội để có biện pháp quản lý, giáo dục;","Thực chất của vấn đề dân tộc là sự va chạm, mâu thuẫn lợi ích giữa các dân tộc trong quốc gia đa dân tộc và giữa các quốc gia dân tộc với nhau trong quan hệ quốc tế diễn ra trên mọi lĩnh vực đời sống xã hội.","Các dân tộc được quyền tự quyết là quyền làm chủ vận mệnh của mỗi dân tộc:"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Phối hợp với lực lượng công an cơ sở trong rà soát phát hiện, cung cấp số sinhviên có biểu hiện nghi vấn hoạt động phạm tội để có biện pháp quản lý, giáo dục;"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Chính những hệ luỵ của hành vi phạm tội này đã làm cho nạn nhân ảnh hưởng nghiêm trọng đến danh dự, nhân phẩm của bản thân họ.","Đây là hình thức chiếm đoạt một tài khoản facebook phổ biến nhất hiện nay và cho đến bây giờ nó vẫn là cách được hacker sử dụng nhiều nhất.","Thông qua một số hoạt động kinh tế, các nhà đầu tư hoặc các thương lái nước ngoài cũng có những thủ đoạn, hành vi nhằm phá hoại môi trường của một số quốc gia khác.","Đây cũng là một trong những giải pháp quan trọng, xét đến cùng có ý nghĩa nền tảng để vô hiệu hoá sự lợi dụng của kẻ thù."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Chính những hệ luỵ của hành vi phạm tội này đã làm cho nạn nhân ảnh hưởng nghiêm trọng đến danh dự, nhân phẩm của bản thân họ."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Các đối tượng vi phạm pháp luật về bảo vệ môi trường trong từng lĩnh vực cụ thể nhằm mục đích làm sao để kiếm được nhiều lợi nhuận nhất và chi phí bỏ ra ít nhất như trong các lĩnh vực gây ô nhiễm, suy thoái môi trường.","Nguồn gốc nhận thức của tôn giáo: do trình độ nhận thức hạn hẹp, mơ hồ về tự nhiên, xã hội có liên quan đến đời sống, số phận của con người họ cảm thấy yếu đuối, lệ thuộc và bất lực.","Ngoài ra, Bộ Luật hình sự còn quy định động cơ hoặc mục đíchphạm tội là dấu hiệu bắt buộc trong cấu thành tăng nặng ở một số cấu thành tăng nặn như động cơ đê hèn (điểm c khoản 2 các Điều 151, 152, 153:","Buôn bán tiền giả, thẻ ngân hàng hay tài khoản mạng bị đánh cắp, súng, ma túy và các chất kích thích, các sản phẩm không rõ nguồn gốc khác."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Ngoài ra, Bộ Luật hình sự còn quy định động cơ hoặc mục đíchphạm tội là dấu hiệu bắt buộc trong cấu thành tăng nặng ở một số cấu thành tăng nặn như động cơ đê hèn (điểm c khoản 2 các Điều 151, 152, 153:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Đối nhà trường cần chú trọng đến giáo dục cả đạo đức lẫn kiến thức; lồng ghép nội dung giáo dục giới tính, sức khoẻ sinh sản cho học sinh; giáo dục cho học sinh (đặc biệt bé gái) biết cách phòng vệ và tránh những nguy cơ có thể dẫn đến các hành vi xâm phạm tình dục và buôn bán người.","Trang bị cho người học những kiến thức chung, cơ bản nhất về dân tộc, tôn giáo; giải quyết vấn đề dân tộc, tôn giáo theo quan điểm của chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh và quan điểm, chính sách của Đảng và Nhà nước ta về dân tộc, tôn giáo hiện nay.","Giới thiệu một số kiến thức cơ bản về lý luận và thực tiễn của an ninh phi truyền thống và một số giải pháp phòng ngừa, đối phó với các mối đe dọa của an ninh phi truyền thống ở Việt Nam hiện nay.","Theo báo cáo của tổ chức Y tế thế giới (WHO), hiện có khoảng 50 triệu người nghiện xì ke ma túy, trong đó 6 triệu người nghiện cocain, 5 triệu người nghiện hútthuốc phiện, 30 triệu người nghiện cần sa, 9 triệu người thường xuyên dùng thuốc ngủ và thuốc an thần."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Đối nhà trường cần chú trọng đến giáo dục cả đạo đức lẫn kiến thức; lồng ghép nội dung giáo dục giới tính, sức khoẻ sinh sản cho học sinh; giáo dục cho học sinh (đặc biệt bé gái) biết cách phòng vệ và tránh những nguy cơ có thể dẫn đến các hành vi xâm phạm tình dục và buôn bán người."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Hệ thống phát thanh của sân bay cũng phát đi những thông điệp tương tự.","Nâng cao chất lượng, hiệu quả phong trào toàn dân bảo vệ an ninh Tổ quốc.","Tuyệt đối không được sử dụng mệnh lệnh hành chính cưỡng chế để tuyên chiến, xoá bỏ tôn giáo.","Trong chủ nghĩa xã hội, tôn giáo còn là nhu cầu tinh thần của một bộ phận nhân dân, còn tồn tại lâu dài."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Nâng cao chất lượng, hiệu quả phong trào toàn dân bảo vệ an ninh Tổ quốc."}]},{"id":6,"title":"An toàn thông tin và phòng, chống vi phạm pháp luật trên không gian mạng","questions":[{"q":"Điền nội dung phù hợp vào chỗ trống: “Trang bị cho người học những hiểu ":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Kẻ tấn công chiếm đoạt tài sản mạng xã hội nhằm các mục đích lừa đảo, chiếmđoạt tài sản, hack nick Facebook vì những thù hằn của cá nhân.","Nhanh gọn, kiên quyết, linh hoạt, đúng đối tượng, sử dụng lực lượng và phương thức đấu tranh phù hợp, không để lan rộng kéo dài.","Phối hợp tổ chức tuyên truyền, giáo dục pháp luật về bảo đảm trật tự, an toàngiao thông và phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông.","oạn chiến lược của chủ nghĩa đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Kẻ tấn công chiếm đoạt tài sản mạng xã hội nhằm các mục đích lừa đảo, chiếmđoạt tài sản, hack nick Facebook vì những thù hằn của cá nhân."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Xúc phạm quốc kỳ, quốc huy, lãnh tụ, danh nhân anh hùng dân tộc,…","Đối với người từ đủ 14 tuổi đến dưới 16 tuổi không phải chịu trách nhiệm hình sự","Tổ chức tiến hành các hoạt động phát hiện, điều tra, xử lý tội phạm","Đặc biệt là nguy cơ sử dụng vũ khí sinh thái, tội phạm công nghệ cao."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Xúc phạm quốc kỳ, quốc huy, lãnh tụ, danh nhân anh hùng dân tộc,…"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Vì vậy, quần chúng cũng là đối tượng để kẻ thù lợi dụng, mua chuộc nhằm thực hiện âm mưu, thủ đoạn trong chiến lược “Diễn biến hoà bình”, bạo loạn lật đổ nhằm chống phá cách mạng nước ta.","Các hành vi bị nghiêm cấm và biện pháp phòng, chống vi phạm pháp luật về bảo vệ môi trường","Nâng cao ý thức phòng tránh, tự vệ và sử biện pháp kỹ thuật để khắc phục hậu quả trong trường hợp bị tấn công trên không gian mạng","Do phát hiện thấy những sai lầm, khuyết điểm của các Đảng Cộng sản và Nhà nước xã hội chủ nghĩa trong cải tổ, cải cách, đổi mới."],"answer":2,"explain":"Đáp án đúng là nội dung đượ  kiểu như:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Riêng đối với vấn đề dân tộc, tôn giáo, trước tiên cần phải thực hiện tốt chính sách dân tộc, tôn giáo.","Nhận diện an ninh phi truyền thống trên các góc độ khác nhau?","Giải quyết vấn đề dân tộc theo quan điểm của V.I.Lênin.","Ví dụ khi bạn quên mật khẩu thì bạn có thể gửi yêu cầu đểFacebook gửi 3 mã code về cho 3 người bạn này."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Ví dụ khi bạn quên mật khẩu thì bạn có thể gửi yêu cầu đểFacebook gửi 3 mã code về cho 3 người bạn này."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Chính trị, kinh tế, văn hóa - xã hội, quốc phòng, an ninh và đối ngoại.","Quy hoạch, phân bổ, sắp xếp lại dân cư, gắn phát triển kinh tế với bảo đảm an ninh, quốc phòng.","Theo Nghị quyết 60-NQ/TW sát nhập 5 tổ chức chính trị xã hội:","Địa chỉ Văn phòng tiếp nhận, giải quyết tố giác tin báo về tội phạm:"],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Địa chỉ Văn phòng tiếp nhận, giải quyết tố giác tin báo về tội phạm:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Bên cạnh đó, các quy định, chế tài pháp luật đã đầy đủ và có tính răn đe hơn như sự ra đời của Luật An ninh mạng có hiệu lực từ ngày 01/01/2019.","Tôn giáo đã trở thành nhu cầu tinh thần, đức tin, lối sống của một bộ phận dân cư.","Hoạt động trao đổi thông tin giữa các cơ quan bảo vệ pháp luật còn chưa tốt.","Quần chúng là nền tảng, là gốc rễ của dân tộc, là động lực chính để thúc đẩy sự phát triển của xã hội."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Bên cạnh đó, các quy định, chế tài pháp luật đã đầy đủ và có tính răn đe hơn như sự ra đời của Luật An ninh mạng có hiệu lực từ ngày 01/01/2019."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nhân phẩm là tổng hợp những phẩm chất mang tính đặc trưng của mỗi cá nhân, những yếu tố đặc trưng này tạo nên giá trị một con người.","Bồi dưỡng kỹ năng nhận diện các âm mưu, thủ đoạn tấn công mạng và các hình thái phát sinh trên không gian mạng","Tôn giáo phản ánh khát vọng của quần chúng bị áp bức về một xã hội tự do, bình đẳng, bác ái (dù đó là hư ảo).","Vi phạm hành chính về bảo đảm trật tự, an toàn giao thông:"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Bồi dưỡng kỹ năng nhận diện các âm mưu, thủ đoạn tấn công mạng và các hình thái phát sinh trên không gian mạng"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Khái niệm pháp luật về bảo đảm trật tự, an toàn giao thông","Ba là, vô hiệu hoá sự quản lý của Nhà nước đối với các lĩnh vực đời sống xã hội, gây mất ổn định chính trị - xã hội, nhất là vùng dân tộc, tôn giáo.","Khiêu dâm trẻ em, ngược đãi hoặc làm tình với động vật, phát tán video quay lén là những nội dung hiện hữu trên Dark Web.","Đối với các tội khác, động cơ, mục đích phạm tội không phải là dấu hiệu bắt buộc."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Khiêu dâm trẻ em, ngược đãi hoặc làm tình với động vật, phát tán video quay lén là những nội dung hiện hữu trên Dark Web."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tư tưởng trọng nam, coi thường phụ nữ; những tác động tiêu cực, tàn dư của chế độ xã hội cũ còn tồn tại lâu dài tác động vào đời sống xã hội làm nảy sinh các hiện tượng tiêu cực trong đó có tội phạm.","Phối hợp về thông tin, lực lượng và chia sẻ nguồn lựctài chính giữa các quốc gia thì mới có thể phòng ngừa và ứng phó có hiệu quả, nhất là chia sẻ nguồn lực tài chính giữa nước giàu và nước nghèo trong điều kiện thế giớiphát triển mất cân đối.","Nghị định 15 có hiệu lực từ ngày 15/4/2020 thay thế cho Nghị định 174/2013/ NĐ-CP ngày 13/11/2013 về xử phạt vi phạm hành chính trong lĩnh vực bưu chính, viễn thông, công nghệ thông tin và tần số vô tuyến điện.","Các biện pháp phòng ngừa tội phạm luôn phải đảmbảo cho mọi người có cơ hội phát triển bình đẳng, không được phân biệt chủng tộc, tôn giáo, giới tính, thái độ chính trị."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Nghị định 15 có hiệu lực từ ngày 15/4/2020 thay thế cho Nghị định 174/2013/ NĐ-CP ngày 13/11/2013 về xử phạt vi phạm hành chính trong lĩnh vực bưu chính, viễn thông, công nghệ thông tin và tần số vô tuyến điện."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Hai là, chống “diễn biến hoà bình” là cấp bách hàng đầu trong các nhiệm vụ quốc phòng, an ninh hiện nay để bảo vệ vững chắc xã hội chủ nghĩa.","Bảo đảm hoạt động giao thông trật tự, an toàn, thông suốt; chủ động phòng ngừa tai nạn, vi phạm và ùn tắc giao thông; bảo vệ quyền con người, góp phần phục vụ phát triển kinh tế - xã hội, bảo đảm quốc phòng, an ninh.","Trong 6 tháng đầu năm 2019, Bộ Thông tin và Truyền thông ghi nhận 3.159 cuộc tấn công mạng vào các hệ thống thông tin tại Việt Nam, giảm 2.684 cuộc, tương đương 45,9% so với cùng kỳ năm 2018.","[12] Nghị quyết số 60-NQ/TW, ngày 12.4.2025 của Hội nghị lần thứ  Ban Chấp hành Trung ương Đảng khóa XIII"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Trong 6 tháng đầu năm 2019, Bộ Thông tin và Truyền thông ghi nhận 3.159 cuộc tấn công mạng vào các hệ thống thông tin tại Việt Nam, giảm 2.684 cuộc, tương đương 45,9% so với cùng kỳ năm 2018."}]},{"id":7,"title":"An ninh phi truyền thống và các mối đe dọa an ninh phi truyền thống ở Việt Nam","questions":[{"q":"Điền nội dung phù hợp vào chỗ trống: “Giới thiệu một số kiến thức cơ bản về lý luận và thực tiễn của an ninh phi truyền thống và một số giải pháp phòng ngừa, đối phó với các mối đe dọa của an ninh phi _____ Nam hiện nay.”","options":["100/2019/NĐ-CP ngày 30/12/2019","truyền thống ở Việt","quốc gia chính là","tâm lý hoang mang"],"answer":1,"explain":"Nội dung trong tài liệu: Giới thiệu một số kiến thức cơ bản về lý luận và thực tiễn của an ninh phi truyền thống và một số giải pháp phòng ộng hòa xã hội chủ nghĩa Việt Nam năm 2013;"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Đặc biệt là nguy cơ sử dụng vũ khí sinh thái, tội phạm công nghệ cao.","Sự tác động bởi những mặt trái của nền kinh tế thị trường","Tác động trực tiếp, toàn diện của những hiện tượng xã hội tiêu cực do chếđộ cũ để lại","Mặt chủ quan của tội vi phạm tham gia giao thông đường bộ (Điều 11- Bộ Luật hình sự hiện hành) quy định:"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Đặc biệt là nguy cơ sử dụng vũ khí sinh thái, tội phạm công nghệ cao."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tham gia các cuộc thi tìm hiểu về pháp luật hình sự, phòng, chống tội phạm, các tệ nạn xã hội nói chung và tội phâm xâm hại danh dự, nhân phẩm nói riêng.","Tham gia tích cực và hưởng ứng các chương trình, hành động về bảo vệ môi trường do Nhà nước, các Bộ, ngành phát động.","Phối hợp với cáctổ chức đoàn thể tích cực vận động quần chúng tham gia phát hiện, tố giác tội phạm, chủ động hỗ trợ các lực lượng chức năng tấn công trấn áp tội phạm.","Phát huy sức mạnh tổng hợp của hệ thống chính trị và toàn xã hội trong quản trị và kiểm soát các mối đe dọa an ninh phi truyền thống"],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Phát huy sức mạnh tổng hợp của hệ thống chính trị và toàn xã hội trong quản trị và kiểm soát các mối đe dọa an ninh phi truyền thống"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Phối hợp với cáctổ chức đoàn thể tích cực vận động quần chúng tham gia phát hiện, tố giác tội phạm, chủ động hỗ trợ các lực lượng chức năng tấn công trấn áp tội phạm.","Công tác quản lý của Nhà nước một số lĩnh vực còn nhiều bất cập","[1] Bộ Giáo dục và Đào tạo, Giáo trình Giáo dục Quốc phòng và an ninh, Nxb Giáo dục Việt Nam, Hà Nội năm 2008.","Đặc biệt, chúng coi trọng khích lệ lối sống tư sản và từng bước làm phai nhạt mục tiêu, lý tưởng xã hội chủ nghĩa ở một bộ phận học sinh, sinh viên."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: [1] Bộ Giáo dục và Đào tạo, Giáo trình Giáo dục Quốc phòng và an ninh, Nxb Giáo dục Việt Nam, Hà Nội năm 2008."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Các nội dung này đều bị các tổ chức bảo vệ trẻ em cũng như các nước trên thế giới lên án và cố gắng dẹp bỏ.","Hạn chế đến mức thấp nhất hậu quả, tác hại khi tội phạm xảy ra.","Tại vùng Trung du và miền núi phía Bắc, nhóm dân tộc khác chiếm 56,2%; con số này ở vùng Tây Nguyên là 37,7%;","[7] Vụ Giáo dục quốc phòng và an ninh, Bộ Giáo dục và Đào tạo Tài liệu tập huấn năm 2020."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: [7] Vụ Giáo dục quốc phòng và an ninh, Bộ Giáo dục và Đào tạo Tài liệu tập huấn năm 2020."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Cần phải đấu tranh phê phán những biểu hiện mơ hồ, mất cảnh giác cách mạng trong một bộ phận nhân dân, sinh viên trước âm mưu, thủ đoạn thâm hiểm trong chiến lược “Diễn biến hoà bình” của kẻ thù chống phá nước ta hiện nay.","Sử dụng các công cụ, phương tiện khác nhau để gây nên sự tác độngtới con người cụ thể, gây ra những thiệt hại hoặc đe dọa gây ra những thiệt hại cho con người đó.","Nguyên nhân là do người dùng chưa có thói quen quan tâm đến an ninh của những thiết bị này, không thay đổi mật khẩu mặc định của hệ thống trước khi kết nối Internet.","Làm tốt công tác tuyên truyền, giáo dục cho cả hệ thống chính trị, các chủ thể chịu trách nhiệm quản trị an ninh phi truyền thống, cộng đồng doanh nghiệp và toàn thể nhân dân."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Làm tốt công tác tuyên truyền, giáo dục cho cả hệ thống chính trị, các chủ thể chịu trách nhiệm quản trị an ninh phi truyền thống, cộng đồng doanh nghiệp và toàn thể nhân dân."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Do vậy, phải thường xuyên coi trọng xây dựng tiềm lực kinh tế, chính trị, quân sự, văn hoá, xã hội, xây dựng lực lượng vũ trang vững mạnh về mọi mặt.","Đấu tranh ngăn chặn các hoạt động mê tín dị đoan, các hành vi lợi dụng tín ngưỡng, tôn giáo làm phương hại đến lợi ích chung của đất nước, vi phạm quyền tự do tôn giáo của nhân dân”.","Đặc biệt, từ sau thất bại ở Việt Nam, Mỹ đã từng bước thay đổi chiến lược chuyển từ tiến công bằng sức mạnh quân sự là chính, sang tiến công bằng “diễn biến hoà bình” là chủ yếu.","Phát huy vai trò của Mặt trận Tổ quốc Việt Nam, các đoàn thể chính trị - xã hội, các tố chức xã hội trực thuộc mặt trận trong phòng ngừa và ứng phó với các mối đe dọa an ninh phi truyền thống."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Phát huy vai trò của Mặt trận Tổ quốc Việt Nam, các đoàn thể chính trị - xã hội, các tố chức xã hội trực thuộc mặt trận trong phòng ngừa và ứng phó với các mối đe dọa an ninh phi truyền thống."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Phát huy những giá trị văn hoá, đạo đức tốt đẹp của các tôn giáo.","Là hình thức tấn công nick facebook mạng tên “ Friends”.","Nguồn tài chính xã hội hóa với sự đóng góp rộng rãi của nhân dân, các nhà tài trợ:","Các cơ quan bảo vệ pháp luật (Công an, Viện kiểm sát, Tòa án):"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Nguồn tài chính xã hội hóa với sự đóng góp rộng rãi của nhân dân, các nhà tài trợ:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Một là, ra sức tuyên truyền, quán triệt quan điểm, chính sách dân tộc, tôn giáo của Đảng, Nhà nước; về âm mưu, thủ đoạn lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam của các thế lực thù địch cho toàn dân.","Ví dụ ở Việt Nam, việc thu mua đỉa, ốc bươu vàng, móng trâu, lá cây điều... hoặc việc đưa hoá chất độc hại thông qua thuốc bảo vệ thực vật, thuốc kích thích tăng trưởng để gây ô nhiễm môi trường, gây hại lâu dài tới sức khỏe, suy thoái nòi giống đời sau.","Chỉ đạo tiến hành thanh tra, kiểm tra, giám sát hoạt động phòng, chống tội phạm vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông.","Âm mưu, thủ đoạn “diễn biến hoà bình”, bạo loạn lật đổ của chủ nghĩa đế quốc và các thế lực thù địch sử dụng chống phá các nước xã hội chủ nghĩa như thế nào?"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Ví dụ ở Việt Nam, việc thu mua đỉa, ốc bươu vàng, móng trâu, lá cây điều... hoặc việc đưa hoá chất độc hại thông qua thuốc bảo vệ thực vật, thuốc kích thích tăng trưởng để gây ô nhiễm môi trường, gây hại lâu dài tới sức khỏe, suy thoái nòi giống đời sau."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Di cư bất hợp pháp dưới nhiều hình thức khác nhau làm thay đổi kết cấu xã hội, mâu thuẫn nội bộ gia tăng, tạo tâm lý bất bình, chống đối của dân chúng đối với chính quyền, gây khủng hoảng xã hội trầm trọng.","An ninh mạng đang trở thành vấn đề nóng, đặt ra nhiều tháchthức đối với tất cả các quốc gia trên toàn thế giới.","Chủ thể và quan hệ phối hợp trong phòng, chống tội phạm xâm phạm danh dự, nhân phẩm của người khác","Hiện nay cần tập trung vào phổ biến sâu rộng các chủ trương chính sách phát triển kinh tế - xã hội vùng dân tộc, tôn giáo, chính sách dân tộc, tôn giáo cho đồng bào các dân tộc, các tôn giáo."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Di cư bất hợp pháp dưới nhiều hình thức khác nhau làm thay đổi kết cấu xã hội, mâu thuẫn nội bộ gia tăng, tạo tâm lý bất bình, chống đối của dân chúng đối với chính quyền, gây khủng hoảng xã hội trầm trọng."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Các quy chuẩn môi trường, tiêu chuẩn môi trường là cơ sở pháp lý cho việc xác định có vi phạm pháp luật về môi trường hay không.","Quy hoạch, phân bổ, sắp xếp lại dân cư, gắn phát triển kinh tế với bảo đảm an ninh, quốc phòng.","Kẻ tấn công chiếm đoạt tài sản mạng xã hội nhằm các mục đích lừa đảo, chiếmđoạt tài sản, hack nick Facebook vì những thù hằn của cá nhân.","Đây là nguồn tài chính rất quan trọng đóng gópvào phòng ngừa và ứng phó với các mối đe dọa an ninh phi truyền thống."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Đây là nguồn tài chính rất quan trọng đóng gópvào phòng ngừa và ứng phó với các mối đe dọa an ninh phi truyền thống."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Phòng ngừa, ngăn chặn, ứng phó, khắc phục hậu quả của các đợt tấn công mạng, khủng bố mạng và phòng, chống nguy cơ chiến tranh mạng.","Nhà nước xã hội chủ nghĩa bảo đảm cho mọi công dân, không phân biệt tín ngưỡng tôn giáo đều được bình đẳng trước pháp luật.","Chủ động xây dựng lực lượng, đầu tư nguồn lực cho quản trị an ninh phi truyền thống ở từng lĩnh vực, từng địa bàn, từng nội dung cụ thể; thường xuyên diễn tập để tránh rơi vào thế bị động khi xảy ra tình huống bất thường.","Kẻ tấn công chiếm đoạt tài sản mạng xã hội nhằm các mục đích lừa đảo, chiếmđoạt tài sản, hack nick Facebook vì những thù hằn của cá nhân."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Chủ động xây dựng lực lượng, đầu tư nguồn lực cho quản trị an ninh phi truyền thống ở từng lĩnh vực, từng địa bàn, từng nội dung cụ thể; thường xuyên diễn tập để tránh rơi vào thế bị động khi xảy ra tình huống bất thường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Di cư bất hợp pháp dưới nhiều hình thức khác nhau như sự việc 39 người thiệt mạng trong vụ di cư bất hợp pháp sang Anh quốc đã để lại nhiều hệ lụy nghiêm trọng, tiềm ẩn những nguy cơ khủng hoảng về mặt xã hội, chính trị và kinh tế.","Là cơ quan quyền lực cao nhất của Nhà nước và ở từng địa phương, hoàn thiện hệ thống văn bản quy phạp pháp luật và chỉ thị, nghị quyết về công tác bảo đảm trật tự, an toàn giao thông.","Nắm vững âm mưu, thủ đoạn “diễn biến hòa bình”, bạo loạn lật đổ của các thế lực thù địch chống phá các nước xã hội chủ nghĩa và cách mạng Việt Nam hiện nay.","Khi tiến hành bạo loạn lật đổ, các thế lực thù địch thường kích động những phần tử quá khích, làm mất ổn định trật tự, an toàn xã hội ở một số khu vực và trong một thời gian nhất định (thường chỉ diễn ra trong không gian hẹp và thời gian ngắn) tiến tới lật đổ chính quyền ở địa phương hoặc Nhà nước xã hội chủ nghĩa."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Di cư bất hợp pháp dưới nhiều hình thức khác nhau như sự việc 39 người thiệt mạng trong vụ di cư bất hợp pháp sang Anh quốc đã để lại nhiều hệ lụy nghiêm trọng, tiềm ẩn những nguy cơ khủng hoảng về mặt xã hội, chính trị và kinh tế."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Sự phối hợp và tuân thủ của các tổ chức Internet lớn trên thế giới với luật pháp Việt Nam cũng tốt hơn.","đồng thời có sự phốihợp chặt chẽ với các chủ thể khác để có thể thực hiện một cách tốt nhất họat động phòng ngừa tội phạm.","Huy động nguồn lực tài chính bằng nhiều kênh khác nhau để đầu tư cho hoạt động phòng ngừa, kiểm soát, ứng phó các mối đe dọa an ninh phi truyền thống","Khắc phục tàn dư tư tưởng phân biệt, kì thị dân tộc, tư tưởng dân tộc lớn, dân tộc hẹp hòi."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Huy động nguồn lực tài chính bằng nhiều kênh khác nhau để đầu tư cho hoạt động phòng ngừa, kiểm soát, ứng phó các mối đe dọa an ninh phi truyền thống"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Giữ vững an ninh chính trị, xử lý các vấn đề dân tộc và tôn giáo một cách khéo léo, giải tỏa các xung đột xã hội phù hợp, phòng ngừa và ngăn chặn khả năng chuyển hóa của xung đột.","Pháp luật có tác dụng rất lớn trong việc tạo ra cơ chế hoạt động hiệu quả cho các tổ chức bảo vệ môi trường.","Khách thể của các tội xâm phạm danh dự, nhân phẩm của con người được thể hiện ngay trong tên gọi của Chương.","Môi trường tự nhiên mang không gian và điều kiện để con người có thể sinh sống và tồn tại."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Giữ vững an ninh chính trị, xử lý các vấn đề dân tộc và tôn giáo một cách khéo léo, giải tỏa các xung đột xã hội phù hợp, phòng ngừa và ngăn chặn khả năng chuyển hóa của xung đột."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Xử lý hình sự; xửlý vi phạm hành chính; xử lý trách nhiệm dân sự trong bảo vệ môi trường.","Tác động mạnh đến mọi mặt của đời sống xã hội, thậm chí cướp đi sinh mạng của hàng triệu người, để lại hậu quả nghiêm trọng trong nhiều năm, tiêu tốn nhiều tiền của.","Những hoạt động tôn giáo đúng pháp luật được tôn trọng, hoạt động ích nước, lợi dân được khuyến khích, hoạt động trái pháp luật, đi ngược lại lợi ích dân tộc bị xử lý theo pháp luật.","Phong trào quần chúng tham gia đấu tranh chống tội phạm ở một số nơi chưa thực sự mạnh mẽ, chưa hiệu quả."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tác động mạnh đến mọi mặt của đời sống xã hội, thậm chí cướp đi sinh mạng của hàng triệu người, để lại hậu quả nghiêm trọng trong nhiều năm, tiêu tốn nhiều tiền của."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Kêu gọi, vận động, xúi giục, đe dọa, gây chia rẽ, tiến hành hoạt động vũ trang hoặc dùng bạo lực nhằm chống chính quyền nhân dân.","Nguy cơ từ an ninh phi truyền thống tác động đến quốc phòng Việt Nam không chỉ từ các vấn đề trong nước mà còn từ các vấn đề khu vực và thế giới.","Chân thành, tích cực, thận trọng, kiên trì, vững chắc; sử dụng nhiều phương pháp phù hợp với đặc thù từng dân tộc, từng tôn giáo.","Để đạt được mục tiêu đó, các thế lực thù địch không từ bỏ bất kỳ thủ đoạn chống phá nào như sử dụng bạo lực phi vũ trang, bạo lực vũ trang, kinh tế, chính trị, văn hoá, xã hội..."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Nguy cơ từ an ninh phi truyền thống tác động đến quốc phòng Việt Nam không chỉ từ các vấn đề trong nước mà còn từ các vấn đề khu vực và thế giới."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Quan niệm an ninh truyền thống theo quan điểm của Đảng là:","Chúng thực hiện nhiều hoạt động nhằm xoá bỏ chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh.","Chủ thể và quan hệ phối hợp trong phòng, chống vi phạm pháp luật về bảo vệ môi trường","Quan điểm chủ nghĩa Mác-Lênin về giải quyết vấn đề tôn giáo?"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Quan niệm an ninh truyền thống theo quan điểm của Đảng là:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nhận diện an ninh phi truyền thống trên các góc độ khác nhau?","Nguyên tắc phối hợp chặt chẽ giữa các chủ thể trong công tác phòng ngừa tội phạm:","Người quan tâm xây dựng đội ngũ cán bộ làm công tác dân tộc.","Chủ thể tiến hành tham gia phòng, chống vi phạm pháp luật về bảo vệ môi trường rất đa dạng."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Nhận diện an ninh phi truyền thống trên các góc độ khác nhau?"}]}]};
const letters=['A','B','C','D'];
const PROGRESS_KEY='gdqp_quiz_progress_v3', HISTORY_KEY='gdqp_quiz_history_v3';
let currentHP=null; let state={lesson:null,order:[],pos:0,score:0,answered:{},wrong:[],mode:'normal',historySaved:false};
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
function safeParse(v,fallback){try{return JSON.parse(v)}catch(e){return fallback}}
function getSaved(){return safeParse(localStorage.getItem(PROGRESS_KEY),null)}
function saveProgress(){if(!currentHP||state.lesson==null||state.historySaved)return;localStorage.setItem(PROGRESS_KEY,JSON.stringify({hp:currentHP,state,ts:Date.now()}));updateResumeButton()}
function clearProgress(){localStorage.removeItem(PROGRESS_KEY);updateResumeButton()}
function updateResumeButton(){const saved=getSaved(),btn=document.getElementById('resumeBtn'),box=document.getElementById('resumeInfo');if(!btn||!box)return;if(saved&&DATA[saved.hp]&&DATA[saved.hp][saved.state?.lesson]){const l=DATA[saved.hp][saved.state.lesson],done=Object.keys(saved.state.answered||{}).length;btn.classList.remove('hidden');box.classList.remove('hidden');box.innerHTML=`<b>Bài đang làm dở:</b> ${saved.hp==='hp1'?'Học phần 1':'Học phần 2'} · Bài ${l.id}<br><span class="small">Đã trả lời ${done}/${saved.state.order?.length||l.questions.length} câu. Bạn có thể tiếp tục đúng vị trí đã dừng.</span>`}else{btn.classList.add('hidden');box.classList.add('hidden');box.innerHTML=''}}
function resumeSaved(){const saved=getSaved();if(!saved||!DATA[saved.hp]||!DATA[saved.hp][saved.state?.lesson]){alert('Không có bài đang làm dở.');clearProgress();return}currentHP=saved.hp;state=saved.state;state.historySaved=false;document.getElementById('home').classList.add('hidden');document.getElementById('historyPage').classList.add('hidden');document.getElementById('lessonPage').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');const l=DATA[currentHP][state.lesson];document.getElementById('lessonName').textContent=`${currentHP==='hp1'?'HP1':'HP2'} · Bài ${l.id}: ${l.title}`;render()}
function openHP(key){currentHP=key;document.getElementById('home').classList.add('hidden');document.getElementById('historyPage').classList.add('hidden');document.getElementById('lessonPage').classList.remove('hidden');document.getElementById('quiz').classList.add('hidden');const lessons=DATA[key];document.getElementById('hpName').textContent=key==='hp1'?'Học phần 1 - Đường lối quốc phòng và an ninh':'Học phần 2 - Công tác quốc phòng và an ninh';document.getElementById('hpMeta').textContent=`${lessons.length} bài · ${lessons.length*100} câu`;const g=document.getElementById('lessonGrid');g.innerHTML='';lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='lesson';b.innerHTML=`<b>Bài ${l.id}</b><div style="margin-top:6px">${esc(l.title)}</div><div class="small" style="margin-top:8px">100 câu</div>`;b.onclick=()=>startLesson(i);g.appendChild(b)})}
function startLesson(i,customOrder=null,forceNew=false,mode='normal'){const l=DATA[currentHP][i];if(!customOrder&&!forceNew){const saved=getSaved();if(saved&&saved.hp===currentHP&&saved.state?.lesson===i&&Object.keys(saved.state.answered||{}).length>0){if(confirm('Bài này đang có tiến độ chưa hoàn thành. Bấm OK để tiếp tục, hoặc Hủy để làm lại từ đầu.')){resumeSaved();return}else clearProgress()}}state={lesson:i,order:customOrder||[...Array(l.questions.length).keys()],pos:0,score:0,answered:{},wrong:[],mode,historySaved:false};document.getElementById('lessonPage').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('lessonName').textContent=`${currentHP==='hp1'?'HP1':'HP2'} · Bài ${l.id}: ${l.title}`;saveProgress();render()}
function render(){const l=DATA[currentHP][state.lesson],total=state.order.length;document.getElementById('counter').textContent=`Câu ${Math.min(state.pos+1,total)}/${total}`;document.getElementById('score').textContent=`Đúng: ${state.score}/${Object.keys(state.answered).length}`;document.getElementById('bar').style.width=(total?state.pos/total*100:0)+'%';const card=document.getElementById('card');if(state.pos>=total){showResult(false);return}const qi=state.order[state.pos],q=l.questions[qi];card.innerHTML=`<div class="q">${esc(q.q)}</div><div class="options">${q.options.map((o,k)=>`<button class="opt" data-k="${k}"><b>${letters[k]}.</b> ${esc(o)}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions"><button class="btn" id="next" style="display:none">Câu tiếp theo →</button></div>`;card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(qi,Number(b.dataset.k)));document.getElementById('next').onclick=()=>{state.pos++;saveProgress();render();window.scrollTo({top:0,behavior:'smooth'})};if(state.answered[qi]!=null)restoreAnswered(qi,state.answered[qi])}
function restoreAnswered(qi,k){const q=DATA[currentHP][state.lesson].questions[qi],correct=q.answer;document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');if(i===k&&i!==correct)b.classList.add('wrong')});const fb=document.getElementById('fb');fb.style.display='block';fb.innerHTML=`<b>${k===correct?'✅ Chính xác':'❌ Chưa đúng'}</b><br>Đáp án: <b>${letters[correct]}. ${esc(q.options[correct])}</b><br><span class="small">${esc(q.explain)}</span>`;document.getElementById('next').style.display='inline-block'}
function answer(qi,k){if(state.answered[qi]!=null)return;const q=DATA[currentHP][state.lesson].questions[qi],correct=q.answer;state.answered[qi]=k;if(k===correct)state.score++;else state.wrong.push(qi);restoreAnswered(qi,k);document.getElementById('score').textContent=`Đúng: ${state.score}/${Object.keys(state.answered).length}`;saveProgress()}
function getHistory(){return safeParse(localStorage.getItem(HISTORY_KEY),'[]')||[]}
function recordHistory(early){if(state.historySaved)return;const l=DATA[currentHP][state.lesson],answered=Object.keys(state.answered).length,total=state.order.length;const item={ts:Date.now(),hp:currentHP,lesson:state.lesson,lessonId:l.id,title:l.title,mode:state.mode||'normal',early,answered,total,correct:state.score,wrong:state.wrong.length,unanswered:Math.max(0,total-answered)};const h=getHistory();h.unshift(item);localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,100)));state.historySaved=true}
function submitQuiz(){const answered=Object.keys(state.answered).length,total=state.order.length;if(answered===0){if(!confirm('Bạn chưa trả lời câu nào. Vẫn nộp bài?'))return}else if(answered<total&&!confirm(`Bạn mới trả lời ${answered}/${total} câu. Nộp bài giữa chừng ngay?`))return;showResult(answered<total)}
function showResult(early=false){const total=state.order.length,answered=Object.keys(state.answered).length,unanswered=Math.max(0,total-answered),pct=answered?Math.round(state.score/answered*100):0;recordHistory(early);clearProgress();document.getElementById('bar').style.width='100%';const wrongCount=[...new Set(state.wrong)].length;document.getElementById('card').innerHTML=`<div class="result"><div class="big">${state.score}/${answered}</div><h2>${pct}% số câu đã làm</h2>${early?'<div class="notice"><b>Đã nộp bài giữa chừng.</b> Các câu chưa làm không bị tính là sai.</div>':''}<div class="statgrid"><div class="stat"><b>${answered}</b><span class="small">Đã trả lời</span></div><div class="stat"><b>${state.score}</b><span class="small">Đúng</span></div><div class="stat"><b>${wrongCount}</b><span class="small">Sai</span></div><div class="stat"><b>${unanswered}</b><span class="small">Chưa làm</span></div></div><div class="actions" style="justify-content:center"><button class="btn" onclick="retryWrong()">Làm lại ${wrongCount} câu sai</button><button class="btn secondary" onclick="startLesson(state.lesson,null,true,'normal')">Làm lại bài từ đầu</button><button class="btn secondary" onclick="backLessons()">Chọn bài khác</button><button class="btn secondary" onclick="showHistory()">Xem lịch sử</button></div></div>`}
function retryWrong(){const arr=[...new Set(state.wrong)];if(!arr.length){alert('Hiện chưa có câu sai để làm lại.');return}startLesson(state.lesson,arr,true,'retry_wrong')}
function shuffleCurrent(){if(state.lesson==null)return;if(Object.keys(state.answered).length&&!confirm('Trộn câu sẽ bắt đầu lại lượt làm hiện tại. Tiếp tục?'))return;for(let i=state.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.order[i],state.order[j]]=[state.order[j],state.order[i]]}state.pos=0;state.score=0;state.answered={};state.wrong=[];state.historySaved=false;saveProgress();render()}
function showHistory(){document.getElementById('home').classList.add('hidden');document.getElementById('lessonPage').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('historyPage').classList.remove('hidden');const list=document.getElementById('historyList'),h=getHistory();if(!h.length){list.innerHTML='<div class="sub">Chưa có lịch sử làm bài.</div>';return}list.innerHTML=h.map(x=>{const d=new Date(x.ts).toLocaleString('vi-VN');const pct=x.answered?Math.round(x.correct/x.answered*100):0;return `<div class="historyItem"><div class="historyHead"><div><b>${x.hp==='hp1'?'Học phần 1':'Học phần 2'} · Bài ${x.lessonId}</b><div class="small">${esc(x.title)}</div></div><div class="small">${d}</div></div><div style="margin-top:10px"><b>${x.correct}/${x.answered} đúng (${pct}%)</b> · Sai ${x.wrong} · Chưa làm ${x.unanswered}${x.mode==='retry_wrong'?' · Lượt làm lại câu sai':''}${x.early?' · Nộp giữa chừng':''}</div></div>`}).join('')}
function closeHistory(){document.getElementById('historyPage').classList.add('hidden');document.getElementById('home').classList.remove('hidden');updateResumeButton()}
function clearHistory(){if(!confirm('Xóa toàn bộ lịch sử làm bài trên thiết bị này?'))return;localStorage.removeItem(HISTORY_KEY);showHistory()}
function backLessons(){if(!state.historySaved&&Object.keys(state.answered).length){saveProgress()}document.getElementById('quiz').classList.add('hidden');openHP(currentHP)}
function goHome(){if(state.lesson!=null&&!state.historySaved&&Object.keys(state.answered).length)saveProgress();currentHP=null;document.getElementById('lessonPage').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('historyPage').classList.add('hidden');document.getElementById('home').classList.remove('hidden');updateResumeButton()}
updateResumeButton();
</script></body></html>
