ề an ninh thông tin và sở hữu trí tuệ trên không gian mạng?","o":["Tự viết bài tóm tắt kiến thức môn học dựa trên giáo trình chính thống của nhà trường để chia sẻ cho các bạn cùng khóa ôn thi.","Phát tán, số hóa trái phép các tài liệu thuộc danh mục nội bộ, tài liệu có mật của nhà trường, hoặc các công trình nghiên cứu đang trong quá trình bảo mật lên các hội nhóm công cộng để tăng tương tác (view).","Sử dụng các công cụ tìm kiếm trực tuyến công khai để thu thập số liệu thống kê đã được Tổng cục Thống kê công bố.","Đăng ký tham gia các khóa học trực tuyến miễn phí về kỹ năng mềm do các đại học uy tín trong nước tổ chức."],"a":"B","id":"b6q39_179"}]},{"id":7,"title":"An ninh truyền thống và an ninh phi truyền thống","questions":[{"lesson":7,"source_no":1,"q":"Khái niệm an ninh truyền thống được hiểu như thế nào là đúng nhất dưới góc độ an ninh quốc gia?","o":["Là trạng thái quốc gia được bảo đảm an toàn trước các thách thức phi quân sự như dịch bệnh, biến đổi khí hậu và ô nhiễm môi trường.","Là an toàn, ổn định của đất nước trước các mối đe dọa hoặc tấn công quân sự từ bên ngoài và bên trong.","Là việc duy trì và bảo vệ các giá trị văn hóa, phong tục tập quán, đạo đức của dân tộc trước sự hội nhập quốc tế.","Là sự ổn định và phát triển bền vững của hệ thống các tổ chức tín dụng, thị trường tài chính và tiền tệ quốc gia."],"a":"B","id":"b7q1_180"},{"lesson":7,"source_no":2,"q":"Theo Luật An ninh quốc gia, khái niệm an ninh quốc gia được hiểu như thế nào là chính xác và đầy đủ nhất?","o":["Là việc xây dựng lực lượng quân đội hùng mạnh để sẵn sàng chiến đấu đánh thắng mọi kẻ thù xâm lược từ bên ngoài.","Là trạng thái toàn bộ người dân trong xã hội đều tự giác chấp hành nghiêm chỉnh luật giao thông và không vi phạm pháp luật hành chính.","Là công tác quản lý biên giới, hải đảo nhằm ngăn chặn dòng người di cư trái phép và kiểm soát hoạt động xuất nhập khẩu.","Là trạng thái ổn định, phát triển bền vững của chế độ và Nhà nước, sự bất khả xâm phạm độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc."],"a":"D","id":"b7q2_181"},{"lesson":7,"source_no":3,"q":"An ninh phi truyền thống xuất phát từ các yếu tố do tự nhiên gây ra như?","o":["Biến đổi khí hậu, thiên tai, bão lũ, hạn hán, sóng thần.","Biến đổi khí hậu, xung đột biên giới, hỏa hoạn.","Hạn hán, ô nhiễm môi trường, khủng hoảng kinh tế.","Khủng hoảng kinh tế, hạn hán, tội phạm, ma túy."],"a":"A","id":"b7q3_182"},{"lesson":7,"source_no":4,"q":"Mối đe dọa về an ninh phi truyền thống đối với một quốc gia chủ yếu xuất phát và do các yếu tố nào sau đây gây ra?","o":["Các yếu tố quân sự, chạy đua vũ trang và nguy cơ chiến tranh xâm lược từ các thế lực đối địch.","Các yếu tố phi quân sự, bộc phát từ tự nhiên hoặc các tác động tiêu cực của quá trình toàn cầu hóa, hội nhập quốc tế.","Sự bất đồng về tư tưởng chính trị và đường lối ngoại giao giữa các đảng phái cầm quyền trên thế giới.","Hoạt động tuần tra, kiểm soát và bảo vệ biên giới đất liền của lực lượng biên phòng quốc gia."],"a":"B","id":"b7q4_183"},{"lesson":7,"source_no":5,"q":"Những thách thức, nguy cơ đối với an ninh truyền thống là?","o":["Nguy cơ xâm phạm chủ quyền lãnh thổ, biên giới quốc gia.","Nguy cơ mất lòng tin của nhân dân đối với cách mạng.","Nguy cơ mất an ninh trật tự, mất ổn định trong xã hội.","Nguy cơ mất đoàn kết toàn dân tộc, đoàn kết quốc tế."],"a":"A","id":"b7q5_184"},{"lesson":7,"source_no":6,"q":"Thách thức và đe dọa từ an ninh phi truyền thống trên lĩnh vực kinh tế là?","o":["An ninh năng lượng.","An ninh xã hội.","An ninh dân tộc.","An ninh tôn giáo."],"a":"A","id":"b7q6_185"},{"lesson":7,"source_no":7,"q":"Các thế lực thù địch lợi dụng các yếu tố từ an ninh phi truyền thống để?","o":["Kích động gây rối, làm mất ổn định chính trị.","Kết hợp tiến công quân sự với kinh tế.","Thực hiện kế hoạch can thiệp quân sự.","Bạo loạn lật đổ và can thiệp vũ trang."],"a":"A","id":"b7q7_186"},{"lesson":7,"source_no":8,"q":"Nâng cao nhận thức về các mối đe dọa của an ninh phi truyền thống đối với an ninh con người, an ninh cộng đồng, an ninh quốc gia và an ninh nhân loại là nghĩa vụ và trách nhiệm của ai?","o":["Riêng của lực lượng Công an nhân dân và Quân đội nhân dân trong thế trận phòng thủ.","Các cơ quan quản lý nhà nước về môi trường, Y tế và công nghệ thông tin.","Toàn Đảng, toàn dân, toàn quân, của cả hệ thống chính trị và của mỗi công dân.","Các tổ chức quốc tế và các quốc gia phát triển chịu trách nhiệm toàn cầu."],"a":"C","id":"b7q8_187"},{"lesson":7,"source_no":9,"q":"Nội dung nào sau đây nêu đúng các mối đe dọa an ninh phi truyền thống có khả năng chuyển hóa trực tiếp thành an ninh truyền thống?","o":["Biến đổi khí hậu, cạn kiệt tài nguyên thiên nhiên, ô nhiễm môi trường biển và thiên tai lũ lụt.","Xung đột dân tộc, tôn giáo, hoạt động khủng bố và bạo loạn chính trị vũ trang.","Sự cố rò rỉ dữ liệu máy chủ, nghẽn mạng diện rộng và tin tặc lừa đảo chiếm đoạt tài sản.","Khủng hoảng tài chính toàn cầu, lạm phát tiền tệ và đứt gãy chuỗi cung ứng lương thực."],"a":"B","id":"b7q9_188"},{"lesson":7,"source_no":10,"q":"Để quản trị và kiểm soát các mối đe dọa an ninh phi truyền thống có hiệu quả, chúng ta phải?","o":["Phát huy sức mạnh tổng hợp của hệ thống chính trị và toàn xã hội.","Phát huy sức mạnh đoàn kết quốc tế với lực lượng hòa bình thế giới.","Nâng cao sức mạnh chiến đấu của lực lượng vũ trang nhân dân.","Đẩy mạnh sự nghiệp đổi mới, công nghiệp hóa, hiện đại hóa."],"a":"A","id":"b7q10_189"},{"lesson":7,"source_no":11,"q":"Nội dung cơ bản của an ninh quốc gia là bảo vệ?","o":["Lợi ích của quốc gia.","Lợi ích của nhân dân.","Lợi ích của giai cấp.","Lợi ích của nhà nước."],"a":"A","id":"b7q11_190"},{"lesson":7,"source_no":12,"q":"Bản chất nhân văn trong quan điểm của Đảng và Nhà nước ta về ứng phó an ninh phi truyền thống là đặt yếu tố nào lên vị trí trung tâm, tối cao?","o":["Tăng trưởng chỉ số kinh tế quốc gia.","Bảo vệ tính mạng, sức khỏe, tài sản và lợi ích hợp pháp của Nhân dân (an ninh con người).","Mua sắm trang thiết bị vũ khí hiện đại cho lực lượng vũ trang nhân dân.","Đầu tư phát triển khoa học công nghệ tạo ra phần mềm phòng thủ không gian mạng."],"a":"B","id":"b7q12_191"},{"lesson":7,"source_no":13,"q":"Hành vi nào sau đây được coi là mối đe dọa nguy hiểm nhất đối với an ninh kinh tế từ bên trong (nội bộ) hệ thống chính trị - xã hội Việt Nam hiện nay?","o":["Việc các doanh nghiệp vừa và nhỏ trong nước liên tục bị thua lỗ và phá sản do quản trị yếu kém.","Hiện tượng “lợi ích nhóm” móc nối thao túng chính sách, bẻ lái quy hoạch để trục lợi, làm sai lệch phân bổ nguồn lực quốc gia và suy yếu thể chế.","Sự sụt giảm chỉ số chứng khoán trong ngắn hạn do tác động tiêu cực từ cuộc khủng hoảng tài chính toàn cầu.","Việc người dân tăng cường tích trữ vàng miếng và ngoại tệ thay vì gửi tiền tiết kiệm vào hệ thống ngân hàng thương mại."],"a":"B","id":"b7q13_192"},{"lesson":7,"source_no":14,"q":"Các thế lực thù địch lợi dụng xu thế toàn cầu hóa để đưa ra những yêu cầu, khuyến nghị trong các quan hệ nhằm hạn chế hiệu quả lãnh đạo của Đảng, hiệu lực quản lý của Nhà nước là những thách thức đe dọa từ an ninh phi truyền thống đối với lĩnh vực?","o":["Chính trị tinh thần.","Văn hóa tinh thần.","Kinh tế xã hội.","Chính trị xã hội."],"a":"A","id":"b7q14_193"},{"lesson":7,"source_no":15,"q":"Thách thức và đe dọa từ an ninh phi truyền thống, chúng ta phải chịu tác động không nhỏ từ các luồng văn hóa, đạo đức, lối sống thực dụng, độc hại, không lành mạnh làm lệch chuẩn?","o":["Tư tưởng, phẩm chất, đạo đức lối sống của giới trẻ.","Đường lối chủ trương, chính sách của Đảng, Nhà nước.","Chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh.","Đường lối đối ngoại đa dạng hóa, đa phương hóa."],"a":"A","id":"b7q15_194"},{"lesson":7,"source_no":16,"q":"Trong bối cảnh hội nhập quốc tế sâu rộng, biểu hiện nào dưới đây là cốt lõi nhất để bảo đảm an ninh kinh tế?","o":["Giữ vững ổn định kinh tế vĩ mô, làm chủ nền kinh tế, không bị chi phối hoặc lệ thuộc vào bên ngoài trong các quyết sách chiến lược.","Mở rộng quan hệ hợp tác với các nước để thu hút vốn đầu tư.","Tham gia các diễn đàn kinh tế quốc tế để nâng cao vị thế quốc gia.","Ký kết hiệp định thương mại với các nước để mở rộng thị trường."],"a":"A","id":"b7q16_195"},{"lesson":7,"source_no":17,"q":"Đặc trưng cốt lõi nhất để phân biệt một mối đe dọa an ninh phi truyền thống với một mối đe dọa an ninh truyền thống là gì?","o":["An ninh phi truyền thống chỉ do các tác nhân phi quốc gia gây ra, còn an ninh truyền thống luôn do quân đội của một quốc gia có chủ quyền tiến hành.","An ninh phi truyền thống hủy hoại an ninh con người và sự ổn định xã hội một cách phi vũ trang, trong khi an ninh truyền thống chỉ tập trung vào việc xâm phạm chủ quyền lãnh thổ cứng.","Mối đe dọa an ninh phi truyền thống thường có tính chất xuyên quốc gia, lan tỏa phi quân sự, phá hoại an ninh từ gốc rễ sinh tồn của xã hội và khó định vị cụ thể một đối thủ kháng trực diện.","An ninh phi truyền thống phát sinh từ mặt trái của quá trình phát triển công nghiệp, còn an ninh truyền thống chỉ xuất hiện khi có mâu thuẫn sâu sắc về hệ tư tưởng chính trị giữa các quốc gia."],"a":"C","id":"b7q17_196"},{"lesson":7,"source_no":18,"q":"Trong mối quan hệ biện chứng giữa an ninh truyền thống và an ninh phi truyền thống, nhận định nào sau đây phản ánh chính xác nhất thực tiễn cục diện an ninh hiện nay?","o":["An ninh phi truyền thống đã hoàn toàn thay thế an ninh truyền thống, trở thành nguy cơ duy nhất đe dọa đến sự tồn vong của các quốc gia trong kỷ nguyên số.","Mối đe dọa an ninh phi truyền thống có thể đóng vai trò là ngòi nổ, tác nhân làm trầm trọng hơn hoặc trực tiếp chuyển hóa thành các xung đột an ninh truyền thống, xung đột vũ trang truyền thống.","Hai loại hình an ninh này tồn tại độc lập song song; các giải pháp quân sự của an ninh truyền thống không có giá trị hỗ trợ đối phó với an ninh phi truyền thống.","Chỉ khi một quốc gia giải quyết triệt để các nguy cơ an ninh truyền thống thì các mối đe dọa an ninh phi truyền thống mới xuất hiện như một hệ quả tất yếu của quá trình phát triển."],"a":"B","id":"b7q18_197"},{"lesson":7,"source_no":19,"q":"Sự việc một nhóm tin tặc (hacker) quốc tế tấn công mã hóa toàn bộ dữ liệu của hệ thống tổng công ty điện lực quốc gia, đòi tiền chuộc và làm tê liệt mạng lưới điện trong nhiều ngày được phân loại chính xác nhất vào dạng mối đe dọa nào?","o":["Là một hành vi gián điệp mạng thuộc phạm vi thách thức an ninh truyền thống thuần túy.","Là mối đe dọa an ninh phi truyền thống, nhưng mang hiểm họa gián tiếp đe dọa nghiêm trọng đến an ninh truyền thống quốc gia.","Là một dạng tội phạm hình sự công nghệ cao thông thường, không đủ để hình thành một mối đe dọa an ninh quốc gia.","Là cuộc tấn công quân sự phi đối xứng sử dụng vũ khí số, thuộc hình thức chiến tranh thông tin bắt buộc phải đáp trả bằng quân sự."],"a":"B","id":"b7q19_198"},{"lesson":7,"source_no":20,"q":"Theo quan điểm chiến lược của Đảng và Nhà nước ta hiện nay, phương châm cốt lõi nhất để ứng phó với các thách thức an ninh phi truyền thống là gì?","o":["Coi trọng ứng phó, xử lý hậu quả tại chỗ; tăng cường đầu tư mua sắm trang thiết bị kỹ thuật hiện đại để chế ngự thiên tai, dịch bệnh.","Đặt trọng tâm vào việc thiết lập các liên minh quân sự xuyên quốc gia để tận dụng tiềm lực công nghệ của các nước phát triển.","Ưu tiên toàn lực cho công tác bảo vệ môi trường sinh thái, xem đây là giải pháp duy nhất để triệt tiêu mọi nguy cơ an ninh phi truyền thống.","Chủ động phòng ngừa, phát hiện sớm, ứng phó kịp thời; kết hợp chặt chẽ phát triển kinh tế - xã hội với bảo đảm quốc phòng, an ninh và tăng cường hợp tác quốc tế."],"a":"D","id":"b7q20_199"},{"lesson":7,"source_no":21,"q":"Mặt trái đáng ngại nhất của xu thế toàn cầu hóa và cách mạng công nghệ đối với an ninh kinh tế của một nước đang phát triển như nước ta hiện nay (dưới góc nhìn an ninh phi truyền thống) là gì?","o":["Làm cho các doanh nghiệp nội địa hoàn toàn phá sản do không thể cạnh tranh sòng phẳng với các tập đoàn đa quốc gia.","Làm gia tăng tỷ lệ lạm phát phi mã do dòng vốn đầu tư gián tiếp nước ngoài liên tục rút khỏi thị trường.","Làm nền kinh tế dễ bị tổn thương, dễ bị thao túng hạ tầng dữ liệu tài chính và đối mặt với các cuộc khủng hoảng xuyên biên giới lan truyền theo hiệu ứng domino rất nhanh.","Làm mất đi hoàn toàn quyền tự chủ về thuế quan và các chính sách an sinh xã hội cốt lõi của chính phủ."],"a":"C","id":"b7q21_200"},{"lesson":7,"source_no":22,"q":"Dưới góc nhìn an ninh quốc gia, một hiện tượng xã hội (ví dụ: phân hóa giàu nghèo, xung đột sắc tộc nhỏ lẻ) chuyển hóa từ một “vấn đề xã hội thông thường” thành một “mối đe dọa an ninh xã hội” khi nó đạt đến ngưỡng nào sau đây?","o":["Khi tỷ lệ thất nghiệp của nhóm người nghèo vượt quá ngưỡng 15% tổng lực lượng lao động của quốc gia.","Khi hiện tượng đó tích tụ mâu thuẫn đủ lớn, bị các thế lực thù địch lợi dụng kích động, bạo loạn, làm tê liệt sự quản lý của chính quyền và phá vỡ khối đại đoàn kết dân tộc.","Khi hệ thống tòa án và cơ quan thi hành án hình sự bị quá tải do số lượng tranh chấp dân sự tăng đột biến.","Khi chính phủ buộc phải ban hành các gói cứu trợ tài chính khẩn cấp nhằm ổn định đời sống của các cộng đồng yếu thế."],"a":"B","id":"b7q22_201"},{"lesson":7,"source_no":23,"q":"Trong kỷ nguyên số, một chiến dịch “thao túng thông tin xuyên biên giới” nguy hiểm hơn các cuộc tấn công mạng phá hoại hạ tầng kỹ thuật thuần túy ở điểm cốt lõi nào?","o":["Nó sử dụng các thuật toán mã hóa dữ liệu cấp cao mà không một hệ thống tường lửa nào có thể phát hiện được.","Nó làm suy giảm tốc độ đường truyền Internet toàn cầu và gây thất thoát trực tiếp tài sản tài chính của hệ thống ngân hàng quốc tế.","Nó tấn công trực tiếp vào nhận thức, niềm tin của người dân, làm xói mòn tính chính danh của thể chế chính trị và gây chia rẽ xã hội sâu sắc từ bên trong mà không cần sử dụng vũ lực.","Nó không chỉ đánh cắp dữ liệu mà còn trực tiếp phá hủy phần cứng của các máy chủ chứa thông tin chiến lược."],"a":"C","id":"b7q23_202"},{"lesson":7,"source_no":24,"q":"Dưới góc độ quốc phòng - an ninh, tại sao “Biến đổi khí hậu” lại được các nhà nghiên cứu gọi là “Chất xúc tác làm trầm trọng hơn các xung đột”?","o":["Vì hiện tượng nóng lên toàn cầu trực tiếp làm thay đổi tính năng chiến đấu của các loại vũ khí công nghệ cao.","Vì thiên tai làm gia tăng tần suất xuất hiện của các hiện tượng thời tiết cực đoan, buộc quân đội các nước phải chuyển sang trạng thái chiến tranh tổng lực.","Vì nó làm cạn kiệt tài nguyên sinh tồn (nước ngọt, đất canh tác), gây dịch chuyển dân cư quy mô lớn (tị nạn khí hậu), từ đó châm ngòi cho các tranh chấp sắc tộc, biên giới và bất ổn chính trị nội bộ.","Vì biến đổi khí hậu là nguyên nhân trực tiếp dẫn đến sự xuất hiện của các tư tưởng, đảng phái chính trị cực đoan mới."],"a":"C","id":"b7q24_203"}]}]};
const LETTERS=['A','B','C','D'];
const ALL=DATA.lessons.flatMap(l=>l.questions.map(q=>({...q,lessonTitle:l.title})));
const STORE='gdqp_hp2_current_v4', HIST='gdqp_hp2_history_v4';
let state=null;
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function sample(a,n){return shuffle(a).slice(0,Math.min(n,a.length))}
function lessonById(id){return DATA.lessons.find(x=>x.id===id)}
function renderHome(){
  const g=document.getElementById('lessonGrid');g.innerHTML='';
  DATA.lessons.forEach(l=>{const b=document.createElement('button');b.className='lesson';b.innerHTML=`<b>Bài ${l.id}: ${l.title}</b><span class="muted">${l.questions.length} câu</span>`;b.onclick=()=>startLesson(l.id);g.appendChild(b)});
  document.getElementById('resumeBtn').classList.toggle('hidden',!localStorage.getItem(STORE));renderHistory();
}
function makeState(items,mode,label){return {mode,label,items:items.map(q=>q.id),pos:0,answers:{},wrongChoice:{},submitted:false,startedAt:new Date().toISOString()}}
function buildRandom60(){const first=DATA.lessons.map(l=>sample(l.questions,1)[0]);const used=new Set(first.map(q=>q.id));const rest=sample(ALL.filter(q=>!used.has(q.id)),53);return shuffle([...first,...rest])}
function startRandomExam(){state=makeState(buildRandom60(),'exam','Kiểm tra học phần 2 - 60 câu ngẫu nhiên');save();showQuiz()}
function startLesson(id){const l=lessonById(id);state=makeState(shuffle(l.questions),'lesson',`Bài ${id}: ${l.title}`);save();showQuiz()}
function resumeQuiz(){try{state=JSON.parse(localStorage.getItem(STORE));if(state){if(!state.wrongChoice)state.wrongChoice={};showQuiz()}}catch(e){localStorage.removeItem(STORE)}}
function getItems(){return state.items.map(id=>ALL.find(q=>q.id===id)).filter(Boolean)}
function save(){if(state&&!state.submitted)localStorage.setItem(STORE,JSON.stringify(state))}
function showQuiz(){document.getElementById('home').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');renderQ()}
function renderQ(){
  const items=getItems(),q=items[state.pos];if(!q)return;
  if(!state.wrongChoice)state.wrongChoice={};
  document.getElementById('modeLabel').textContent=state.label;
  document.getElementById('counter').textContent=`Câu ${state.pos+1}/${items.length}`;
  document.getElementById('bar').style.width=`${(state.pos+1)/items.length*100}%`;
  document.getElementById('qtext').textContent=q.q;
  const box=document.getElementById('opts');box.innerHTML='';
  const correct=state.answers[q.id]===q.a;
  const wrong=state.wrongChoice[q.id];
  q.o.forEach((txt,i)=>{
    const L=LETTERS[i],btn=document.createElement('button');
    let cls='opt';
    if(correct&&L===q.a)cls+=' correct';
    else if(wrong&&L===wrong)cls+=' wrong';
    btn.className=cls;
    btn.innerHTML=`<span class="badge">${L}</span><span>${escapeHtml(txt)}</span>`;
    btn.disabled=!!correct||!!wrong;
    btn.onclick=()=>chooseAnswer(q,L);
    box.appendChild(btn)
  });
  const fb=document.getElementById('feedback');
  fb.className='hidden';fb.innerHTML='';
  if(correct){
    fb.className='feedback good';
    fb.innerHTML='<div class="feedback-title">✓ Chính xác</div><div>Bạn đã trả lời đúng câu này.</div>';
  }else if(wrong){
    fb.className='feedback bad';
    fb.innerHTML='<div class="feedback-title">✕ Sai</div><div>Đáp án bạn vừa chọn chưa đúng.</div>';
    const b=document.createElement('button');b.className='btn danger retry-btn';b.textContent='↻ Làm lại câu này';
    b.onclick=()=>retryCurrent(q.id);fb.appendChild(b);
  }
  const next=document.getElementById('nextBtn');
  next.disabled=!correct;
  if(state.pos===items.length-1)next.textContent='Đã ở câu cuối'; else next.textContent='Câu sau →';
}
function chooseAnswer(q,L){
  if(state.answers[q.id]===q.a||state.wrongChoice[q.id])return;
  if(L===q.a){state.answers[q.id]=L;delete state.wrongChoice[q.id]}
  else{state.wrongChoice[q.id]=L}
  save();renderQ();
}
function retryCurrent(qid){delete state.wrongChoice[qid];save();renderQ()}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function prevQ(){if(state.pos>0){state.pos--;save();renderQ()}}
function nextQ(){const items=getItems(),q=items[state.pos];if(!q||state.answers[q.id]!==q.a)return;if(state.pos<state.items.length-1){state.pos++;save();renderQ()}}
function submitNow(){if(!state)return;const items=getItems(),answered=Object.keys(state.answers).length;if(answered===0&&!confirm('Bạn chưa trả lời câu nào. Vẫn nộp bài?'))return;if(answered>0&&answered<items.length&&!confirm(`Bạn mới trả lời ${answered}/${items.length} câu. Nộp bài giữa chừng?`))return;state.submitted=true;localStorage.removeItem(STORE);showResult(items)}
function showResult(items){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let right=0,wrong=0,blank=0;for(const q of items){const a=state.answers[q.id];if(!a)blank++;else if(a===q.a)right++;else wrong++}const pct=items.length?Math.round(right/items.length*100):0;document.getElementById('resultSummary').innerHTML=`<div class="big">${right}/${items.length} đúng</div><div class="stats"><span>Sai: ${wrong}</span><span>Chưa làm: ${blank}</span><span>Điểm: ${pct}%</span></div>`;addHistory({label:state.label,total:items.length,right,wrong,blank,pct,time:new Date().toISOString()});const acts=document.getElementById('resultActions');acts.innerHTML='';const wrongIds=items.filter(q=>state.answers[q.id]&&state.answers[q.id]!==q.a).map(q=>q.id);if(wrongIds.length){const b=document.createElement('button');b.className='btn good';b.textContent=`Làm lại ${wrongIds.length} câu sai`;b.onclick=()=>{state=makeState(shuffle(wrongIds.map(id=>ALL.find(q=>q.id===id)).filter(Boolean)),'retry','Làm lại câu sai');save();showQuiz()};acts.appendChild(b)}if(state.mode==='exam'){const b=document.createElement('button');b.className='btn';b.textContent='Tạo đề 60 câu mới';b.onclick=startRandomExam;acts.appendChild(b)}const review=document.getElementById('review');review.innerHTML='<h2>Xem lại bài</h2>';items.forEach((q,idx)=>{const ua=state.answers[q.id];const d=document.createElement('div');d.className='card';d.style.margin='10px 0';const status=!ua?'Chưa làm':ua===q.a?'Đúng':'Sai';d.innerHTML=`<b>Câu ${idx+1}. ${escapeHtml(q.q)}</b><div class="small muted" style="margin:6px 0">Bài ${q.lesson} · ${escapeHtml(q.lessonTitle)}</div><div>Bạn chọn: <b>${ua||'—'}</b> · Đáp án theo tài liệu: <b>${q.a}</b> · <b>${status}</b></div>`;review.appendChild(d)})}
function addHistory(x){const h=JSON.parse(localStorage.getItem(HIST)||'[]');h.unshift(x);localStorage.setItem(HIST,JSON.stringify(h.slice(0,50)))}
function renderHistory(){const el=document.getElementById('history');const h=JSON.parse(localStorage.getItem(HIST)||'[]');if(!h.length){el.innerHTML='<div class="muted">Chưa có lịch sử làm bài.</div>';return}el.innerHTML=h.map(x=>`<div class="history-item"><b>${escapeHtml(x.label)}</b><div class="small muted">${new Date(x.time).toLocaleString('vi-VN')}</div><div>Đúng ${x.right}/${x.total} · Sai ${x.wrong} · Chưa làm ${x.blank} · ${x.pct}%</div></div>`).join('')}
function clearHistory(){if(confirm('Xóa toàn bộ lịch sử làm bài trên thiết bị này?')){localStorage.removeItem(HIST);renderHistory()}}
function goHome(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('home').classList.remove('hidden');renderHome()}
renderHome();
</script></body></html>
