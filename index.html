<script>
const DATA={"lessons":[{"id":1,"title":"Diễn biến hòa bình - Bạo loạn lật đổ","questions":[{"lesson":1,"source_no":1,"q":"Chiến lược “Diễn biến hòa bình” được định nghĩa là gì?","o":["Chiến lược quân sự sử dụng vũ khí công nghệ cao để tấn công chớp nhoáng, lật đổ chính quyền một nước.","Chiến lược tổng hợp của chủ nghĩa đế quốc và các thế lực thù địch nhằm lật đổ chế độ chính trị - xã hội của các nước tiến bộ, trước hết là các nước xã hội chủ nghĩa từ bên trong, bằng các biện pháp phi quân sự.","Biện pháp hòa bình nhằm giải quyết các xung đột quốc tế và tranh chấp chủ quyền thông qua đàm phán ngoại giao.","Chiến lược phát triển kinh tế kết hợp với viện trợ nhân đạo để giúp đỡ các quốc gia kém phát triển."],"a":"B","id":"b1q1_1"},{"lesson":1,"source_no":2,"q":"Biện pháp của chủ nghĩa đế quốc và các thế lực phản động tiến hành chiến lược “Diễn biến hòa bình” là?","o":["Biện pháp phi quân sự","Biện pháp quân sự","Biện pháp ngoại giao","Biện pháp bạo loạn"],"a":"A","id":"b1q2_2"},{"lesson":1,"source_no":3,"q":"Khi xảy ra tình huống bạo loạn lật đổ, phương châm tiến hành xử lý của ta được xác định là?","o":["Chờ đợi lực lượng chuyên trách từ Trung ương về rồi mới bắt đầu giải quyết.","Sử dụng biện pháp nhượng bộ, thỏa hiệp toàn bộ các yêu sách của lực lượng bạo loạn.","Chủ động, kiên quyết, khẩn trương, xử lý nhanh gọn, triệt để ngay từ cơ sở.","Cách ly hoàn toàn địa bàn bạo loạn và để mặc tình hình tự ổn định."],"a":"C","id":"b1q3_3"},{"lesson":1,"source_no":4,"q":"Chủ nghĩa đế quốc và các thế lực thù địch sử dụng chiến lược “Diễn biến hòa bình” đối với Việt Nam nhằm mục đích gì?","o":["Xóa bỏ vai trò lãnh đạo của Đảng","Xóa bỏ hệ thống chính trị, kinh tế","Lật đổ chế độ, theo quỹ đạo của chúng","Tự do hóa đời sống chính trị, xã hội"],"a":"A","id":"b1q4_4"},{"lesson":1,"source_no":5,"q":"Một trong những yêu cầu cốt lõi trong phương châm tiến hành xử lý bạo loạn lật đổ nhằm bảo đảm tính chính nghĩa là?","o":["Hạn chế đến mức thấp nhất thiệt hại về người và tài sản, không để địch lợi dụng.","Tập trung lực lượng quân sự giải tán bạo loạn trong thời gian ngắn nhất.","Tạm hoãn việc xử lý các đối tượng cầm đầu để thương lượng chính trị.","Huy động lực lượng tư nhân tham gia bảo vệ an ninh trật tự khu vực."],"a":"A","id":"b1q5_5"},{"lesson":1,"source_no":6,"q":"Phòng chống chiến lược “diễn biến hòa bình”, bạo loạn lật đổ ở nước ta hiện nay, chúng ta phải thực hiện giải pháp nào sau đây?","o":["Nâng cao nhận thức về âm mưu, thủ đoạn của các thế lực thù địch, nắm chắc mọi diễn biến không để bị động và bất ngờ.","Nâng cao tinh thần yêu nước, hăng hái lao động sản xuất và tích cực phòng chống thiên tai cho nhân dân.","Nâng cao đời sống vật chất, tinh thần cho nhân dân, đẩy lùi các hủ tục lạc hậu, mê tín dị đoan và các tệ nạn xã hội.","Nâng cao ý thức dân tộc, yêu Tổ quốc, yêu đồng bào, trách nhiệm công dân cho tuổi trẻ nhất là học sinh, sinh viên."],"a":"A","id":"b1q6_6"},{"lesson":1,"source_no":7,"q":"Mục đích chống phá tư tưởng - văn hóa trong chiến lược “Diễn biến hòa bình” là?","o":["Xóa bỏ chủ nghĩa Mác Lênin, tư tưởng Hồ Chí Minh","Xóa bỏ nguồn gốc tư tưởng XHCN","Xóa bỏ đường lối chính trị của Đảng Cộng sản","Xóa bỏ tư tưởng vô sản, thiết lập tư tưởng tư sản"],"a":"A","id":"b1q7_7"},{"lesson":1,"source_no":8,"q":"Trong các hình thức bạo loạn lật đổ, hình thức nào được đánh giá là nguy hiểm, tinh vi và phổ biến nhất hiện nay khi địch dùng một yếu tố làm nền tảng tạo cớ và yếu tố còn lại làm mũi nhọn quyết định?","o":["Bạo loạn vũ trang thuần túy từ biên giới.","Bạo loạn chính trị kéo dài không sử dụng bạo lực.","Bạo loạn chính trị kết hợp với bạo loạn vũ trang.","Bạo loạn kinh tế kết hợp ngoại giao quốc tế."],"a":"C","id":"b1q8_8"},{"lesson":1,"source_no":9,"q":"Một trong những giải pháp phòng chống chiến lược “Diễn biến hòa bình”, BLLĐ là?","o":["Chăm lo xây dựng lực lượng vũ trang ở địa phương vững mạnh","Xây dựng hệ thống chính trị cả nước vững mạnh toàn diện","Đẩy mạnh công nghiệp hóa hiện đại hóa, chống tụt hậu kinh tế","Xây dựng lòng yêu nước cho tuổi trẻ nhất là học sinh, sinh viên"],"a":"A","id":"b1q9_9"},{"lesson":1,"source_no":10,"q":"Thực hiện chiến lược “Diễn biến hòa bình”, chủ nghĩa đế quốc và các thế lực thù địch khích lệ lối sống tư sản, từng bước làm phai nhạt mục tiêu, lý tưởng XHCN ở tầng lớp nào?","o":["Thanh niên, nhất là sinh viên","Học sinh, sinh viên thành thị","Công nhân các khu công nghiệp","Người dân nghèo ở thành thị"],"a":"A","id":"b1q10_10"},{"lesson":1,"source_no":11,"q":"Bạo loạn lật đổ có thể xảy ra ở nhiều nơi, nhiều vùng của đất nước, trọng điểm là?","o":["Các trung tâm chính trị, kinh tế","Các khu công nghiệp tập trung","Các trung tâm văn hóa, khoa học","Các khu công nghệ kỹ thuật cao"],"a":"A","id":"b1q11_11"},{"lesson":1,"source_no":12,"q":"Chủ nghĩa đế quốc và các thế lực thù địch thực hiện chiến lược “Diễn biến hòa bình” đối với Việt Nam như thế nào?","o":["Sau thất bại chiến tranh xâm lược Việt Nam","Khi đưa quân vào xâm lược miền Nam","Sau biến động chế độ XHCN ở Liên Xô","Khi Việt Nam tiến hành sự nghiệp đổi mới"],"a":"A","id":"b1q12_12"},{"lesson":1,"source_no":13,"q":"Quan hệ giữa “Diễn biến hòa bình” và bạo loạn lật đổ?","o":["“Diễn biến hòa bình” là quá trình tạo nên những điều kiện, thời cơ cho bạo loạn lật đổ.","“Diễn biến hòa bình” là quá trình đưa đến nguyên nhân và điều kiện của bạo loạn lật đổ.","“Diễn biến hòa bình” là quá trình tạo yếu tố quyết định cho bạo loạn lật đổ.","“Diễn biến hòa bình” là quá trình tạo thời cơ quan trọng nhất cho bạo loạn lật đổ."],"a":"A","id":"b1q13_13"},{"lesson":1,"source_no":14,"q":"Trong chiến lược “Diễn biến hòa bình”, thủ đoạn về kinh tế được kẻ thù xác định là?","o":["Thủ đoạn mũi nhọn","Thủ đoạn chủ yếu","Thủ đoạn hàng đầu","Thủ đoạn cơ bản"],"a":"A","id":"b1q14_14"},{"lesson":1,"source_no":15,"q":"Thực hiện thủ đoạn chống phá về chính trị trong chiến lược “Diễn biến hòa bình” đối với cách mạng Việt Nam, kẻ thù tiến hành?","o":["Kích động đòi thực hiện chế độ “đa nguyên chính trị, đa đảng đối lập”.","Phá vỡ khối đại đoàn kết toàn dân của các tổ chức chính trị, xã hội.","Chia rẽ nội bộ, kích động gây rối loạn các tổ chức trong xã hội.","Cô lập Đảng, Nhà nước với quân đội nhân dân và công an nhân dân."],"a":"A","id":"b1q15_15"},{"lesson":1,"source_no":16,"q":"Trách nhiệm sinh viên cần làm gì để góp phần làm thất bại chiến lược “diễn biến hòa bình”, bạo loạn lật đổ của các thế lực thù địch?","o":["Luôn học tập phấn đấu, nâng cao cảnh giác tự bảo vệ mình, bảo vệ nơi mình cư trú.","Luôn nâng cao cảnh giác tích cực tham gia các hoạt động phong trào ở nhà trường và địa phương.","Bảo vệ sự nghiệp đổi mới và lợi ích quốc gia, dân tộc.","Bảo vệ an ninh chính trị, trật tự an toàn xã hội."],"a":"A","id":"b1q16_16"},{"lesson":1,"source_no":17,"q":"Thực hiện thủ đoạn trong lĩnh vực tôn giáo, dân tộc của chiến lược “Diễn biến hòa bình”, kẻ thù lợi dụng vấn đề dân tộc để kích động tư tưởng?","o":["Đòi tự trị, tự quyết dân tộc","Chia rẽ các dân tộc, gây mâu thuẫn","Đòi biệt lập, ly khai khu tự trị","Gây mâu thuẫn giữa các dân tộc"],"a":"A","id":"b1q17_17"},{"lesson":1,"source_no":18,"q":"Luận điệu đòi “phi chính trị hóa” lực lượng vũ trang của các thế lực thù địch thực chất nhằm mục đích gì?","o":["Tách Quân đội và Công an ra khỏi sự lãnh đạo của Đảng, làm mất phương hướng chiến đấu của lực lượng vũ trang.","Nâng cao trình độ kỹ thuật công nghệ cao cho cán bộ, chiến sĩ.","Biến lực lượng vũ trang thành một tổ chức kinh tế thuần túy độc lập.","Giúp lực lượng vũ trang giảm số lượng quân số nhanh chóng."],"a":"A","id":"b1q18_18"},{"lesson":1,"source_no":19,"q":"Để triệt tiêu các điều kiện mà thế lực thù địch có thể lợi dụng để kích động bạo loạn lật đổ, giải pháp về kinh tế - xã hội cần tập trung vào nội dung nào?","o":["Tập trung ngân sách quốc gia vào việc xây dựng hệ thống phòng thủ quân sự.","Tập trung phát triển kinh tế - xã hội, nâng cao đời sống vật chất và tinh thần của nhân dân, thực hiện tốt chính sách an sinh xã hội giảm nghèo.","Tập trung phát triển các trung tâm kinh tế lớn, làm động lực thúc đẩy các vùng khác phát triển.","Tập trung phát triển các đô thị lớn, làm động lực thúc đẩy các vùng khác phát triển."],"a":"B","id":"b1q19_19"},{"lesson":1,"source_no":20,"q":"Các thế lực thù địch thường lợi dụng gây rối để làm gì?","o":["Để tập duyệt âm mưu phá hoại, lật đổ chính quyền.","Để gây bạo loạn, gây chiến tranh.","Để tập duyệt hoặc mở màn cho bạo loạn lật đổ.","Để phá hoại, gây rối, mất trật tự an ninh."],"a":"C","id":"b1q20_20"},{"lesson":1,"source_no":21,"q":"Mục tiêu của chủ nghĩa đế quốc và các thế lực thù địch sử dụng chiến lược “Diễn biến hòa bình” đối với Việt Nam là?","o":["Xóa bỏ chế độ XHCN","Thực hiện chế độ đa nguyên chính trị","Thực hiện tự do chính trị - xã hội","Xóa bỏ hệ thống chính trị - xã hội"],"a":"A","id":"b1q21_21"},{"lesson":1,"source_no":22,"q":"Lực lượng tiến hành bạo loạn lật đổ thường là?","o":["Lực lượng ly khai, đối lập trong nước hoặc cấu kết với nước ngoài","Lực lượng đối lập phối hợp chặt chẽ với lực lượng ly khai bên ngoài","Lực lượng ly khai phối hợp với lực lượng dân chủ, nhân quyền","Lực lượng bất mãn chống đối trong nước cấu kết với kẻ thù bên ngoài"],"a":"A","id":"b1q22_22"},{"lesson":1,"source_no":23,"q":"Thực hiện chiến lược “Diễn biến hòa bình” chống phá CNXH, CNĐQ và các thế lực thù địch muốn đối với Việt Nam là?","o":["Một trọng điểm","Vấn đề cơ bản","Một trọng tâm","Vấn đề trọng điểm"],"a":"A","id":"b1q23_23"},{"lesson":1,"source_no":24,"q":"Chống phá về chính trị trong chiến lược “Diễn biến hòa bình”, các thế lực thù địch?","o":["Xóa bỏ vai trò lãnh đạo của Đảng và chế độ XHCN","Đối lập chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh","Phủ định chủ nghĩa Mác - Lênin, xóa bỏ CNXH","Đối lập nền văn hóa dân tộc với nền văn hóa nước ngoài"],"a":"A","id":"b1q24_24"},{"lesson":1,"source_no":25,"q":"Một trong những mục tiêu đấu tranh chống chiến lược “Diễn biến hòa bình”?","o":["Bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ","Giữ vững ổn định chính trị trên cơ sở độc lập chủ quyền dân tộc","Bảo vệ vững chắc độc lập, chủ quyền của quốc gia, dân tộc","Bảo vệ vững chắc chế độ nhà nước Việt Nam XHCN"],"a":"A","id":"b1q25_25"},{"lesson":1,"source_no":26,"q":"Thực hiện thủ đoạn chính trị trong chiến lược “Diễn biến hòa bình”, các thế lực thù địch thường khai thác, tận dụng những sơ hở trong đường lối, chủ trương, chính sách của Đảng, Nhà nước ta để kích động?","o":["Quần chúng biểu tình, chống đối","Công nhân đình công phản đối","Học sinh, sinh viên đình công","Nhân dân gây rối chính quyền"],"a":"A","id":"b1q26_26"},{"lesson":1,"source_no":27,"q":"Đảng ta xác định rõ nội dung bảo vệ Tổ quốc Việt Nam XHCN là toàn diện, trong đó coi trọng?","o":["An ninh kinh tế, chính trị, văn hóa, tư tưởng","An ninh chính trị, xã hội, biên giới, biển đảo","An ninh kinh tế, chính trị, trật tự xã hội","An ninh chính trị, đối ngoại, trật tự an toàn xã hội"],"a":"A","id":"b1q27_27"},{"lesson":1,"source_no":28,"q":"Để nhanh chóng đạt được mục đích của “Diễn biến hòa bình”, chủ nghĩa đế quốc và các thế lực thù địch thường tiến hành thủ đoạn?","o":["Bạo loạn lật đổ","Can thiệp quân sự","Bạo loạn vũ trang","Hành động bạo lực"],"a":"A","id":"b1q28_28"},{"lesson":1,"source_no":29,"q":"Đẩy mạnh chiến lược “Diễn biến hòa bình” ở nước ta, chủ nghĩa đế quốc và các thế lực thù địch thường triệt để khai thác và lợi dụng những khó khăn, sai sót của Đảng, Nhà nước ta trong thực hiện đường lối, chủ trương để?","o":["Xuyên tạc đường lối chính trị, đi theo quỹ đạo chủ nghĩa tư bản","Lôi kéo quần chúng nhân dân đi theo chúng để được giàu có","Thay đổi chế độ, theo phương Tây để được bảo hộ của tư bản","Gây mâu thuẫn, kích động nhân dân bạo loạn vũ trang"],"a":"A","id":"b1q29_29"},{"lesson":1,"source_no":30,"q":"Một trong những chiêu bài mà chủ nghĩa đế quốc và các thế lực thù địch sử dụng trong “Diễn biến hòa bình” đối với Việt Nam là?","o":["Dân chủ, nhân quyền","Tự do, dân chủ","Nhân quyền, dân chủ","Bình đẳng, tự do"],"a":"A","id":"b1q30_30"},{"lesson":1,"source_no":31,"q":"Thủ đoạn thâm độc nhất của các thế lực thù địch trên lĩnh vực đối ngoại nhằm thực hiện chiến lược “diễn biến hòa bình” đối với nước ta là gì?","o":["Khoét sâu mâu thuẫn ngoại giao để ép buộc Việt Nam lệ thuộc vào các thế chế tài chính và hiệp định thương mại toàn cầu.","Lợi dụng các tranh chấp chủ quyền biển đảo để kích động xung đột quân sự khu vực, cô lập Việt Nam trên trường quốc tế.","Chia rẽ Việt Nam với Lào, Campuchia và các nước xã hội chủ nghĩa nhằm phá vỡ liên minh chiến lược truyền thống.","Xuyên tạc đường lối ngoại giao cây tre, gieo rắc tư tưởng hoài nghi về vai trò lãnh đạo của Đảng trong hội nhập quốc tế."],"a":"C","id":"b1q31_31"},{"lesson":1,"source_no":32,"q":"Để góp phần làm thất bại chiến lược “diễn biến hòa bình”, bạo loạn lật đổ của các thế lực thù địch, cần nằm vững một trong những mục tiêu nào?","o":["Bảo vệ sự nghiệp công nghiệp hóa, hiện đại hóa đất nước.","Bảo vệ tính mạng và tài sản của nhân dân.","Bảo vệ sự nghiệp đổi mới và lợi ích quốc gia, dân tộc.","Bảo vệ an ninh chính trị, trật tự an toàn xã hội."],"a":"C","id":"b1q32_32"},{"lesson":1,"source_no":33,"q":"Để góp phần làm thất bại chiến lược “diễn biến hòa bình”, bạo loạn lật đổ của các thế lực thù địch, cần nằm vững một trong những phương châm chỉ đạo nào?","o":["Kiên định con đường đi lên chủ nghĩa xã hội mà Đảng và Chủ tịch Hồ Chí Minh đã lựa chọn.","Phát huy tiềm năng của các địa phương để xây dựng khu vực phòng thủ vững chắc, đảm bảo ngăn chặn sự xuất hiện và phát triển của “diễn biến hòa bình”, bạo loạn lật đổ.","Xây dựng tiềm lực vững mạnh của đất nước, tranh thủ sự ủng hộ của nhân dân trong nước và quốc tế, kịp thời làm thất bại mọi âm mưu, thủ đoạn chống phá của kẻ thù.","Kiên quyết chống lại các biểu hiện mất cảnh giác, chủ quan trong việc chống “Diễn biến hòa bình” ở các đơn vị cơ sở."],"a":"C","id":"b1q33_33"},{"lesson":1,"source_no":34,"q":"Các thế lực thù địch chống phá ta về tư tưởng - văn hóa trong chiến lược “diễn biến hòa bình”, bạo loạn lật đổ nhằm mục đích gì?","o":["Xóa bỏ chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh.","Phá hoại sự đoàn kết của toàn Đảng, toàn quân, toàn dân.","Phá hoại nguyên tắc tập trung dân chủ của Đảng và Nhà nước ta.","Phá hoại, xuyên tạc đường lối đổi mới của Đảng và Nhà nước ta."],"a":"A","id":"b1q34_34"},{"lesson":1,"source_no":35,"q":"Một trong những thủ đoạn chống phá về kinh tế trong chiến lược “Diễn biến hòa bình” của các thế lực thù địch đối với nước ta là gì?","o":["Khích lệ thành phần kinh tế tư nhân phát triển, từng bước làm mất vai trò chủ đạo của thành phần kinh tế Nhà nước.","Khích lệ kinh tế 100% vốn nước ngoài phát triển, làm mất vai trò chủ đạo của thành phần kinh tế Nhà nước.","Khích lệ kinh tế cá thể, tiểu chủ phát triển, làm mất vai trò chủ đạo của thành phần kinh tế Nhà nước.","Khích lệ kinh tế tư bản nhà nước."],"a":"A","id":"b1q35_35"},{"lesson":1,"source_no":36,"q":"Một trong những nội dung chống phá về chính trị trong chiến lược “diễn biến hòa bình” của các thế lực thù địch đối với nước ta là gì?","o":["Đối lập Chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh.","Phủ định Chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh và đường lối của Đảng.","Đối lập nhiệm vụ kinh tế - xã hội và quốc phòng - an ninh.","Chia rẽ mối quan hệ giữa Đảng với nhân dân và khối đại đoàn kết toàn dân tộc."],"a":"D","id":"b1q36_36"},{"lesson":1,"source_no":37,"q":"Các thế lực thù địch triệt để lợi dụng chính sách tự do tôn giáo của Đảng ta thông qua chiến lược “diễn biến hòa bình” nhằm mục đích gì?","o":["Truyền bá mê tín dị đoan và tư tưởng phản động chống chủ nghĩa xã hội.","Truyền đạo trái phép nhằm thực hiện âm mưu tôn giáo hóa dân tộc.","Truyền bá mê tín dị đoan, tập hợp lực lượng để chống phá cách mạng.","Truyền bá mê tín và tổ chức lực lượng khủng bố."],"a":"B","id":"b1q37_37"},{"lesson":1,"source_no":38,"q":"Trong chiến lược “diễn biến hòa bình”, các thế lực thù địch triệt để lợi dụng tôn giáo để tích cực hoạt động nhất là hoạt động phá hoại nhằm mục đích gì?","o":["Tạo dựng lực lượng, xây dựng ngọn cờ để chống lại Nhà nước ta.","Gây mất ổn định xã hội và làm chệch hướng chế độ chủ nghĩa xã hội.","Tạo lực lượng phản động núp bóng tôn giáo.","Tạo dựng lực lượng phản động gây bạo loạn ở địa phương."],"a":"B","id":"b1q38_38"},{"lesson":1,"source_no":39,"q":"Một trong những nội dung chống phá trên lĩnh vực quốc phòng, an ninh trong chiến lược “diễn biến hòa bình” của các thế lực thù địch đối với nước ta là gì?","o":["Đòi tách quân đội, công an với các tổ chức chính trị xã hội khác.","Đòi phi chính trị hóa đối với lực lượng quân đội nhân dân Việt Nam.","Đòi phủ nhận vai trò lãnh đạo của Đảng trong lĩnh vực quốc phòng, an ninh.","Đòi quân đội và công an là lực lượng trung lập, tách rời sự lãnh đạo của Đảng."],"a":"C","id":"b1q39_39"}]},{"id":2,"title":"Dân tộc, tôn giáo","questions":[{"lesson":2,"source_no":1,"q":"Việt Nam là quốc gia thống nhất gồm bao nhiêu dân tộc cùng sinh sống?","o":["54 dân tộc cùng sinh sống","56 dân tộc cùng sinh sống","52 dân tộc cùng sinh sống","57 dân tộc cùng sinh sống"],"a":"A","id":"b2q1_40"},{"lesson":2,"source_no":2,"q":"Tính chất của tôn giáo?","o":["Tính lịch sử, tính quần chúng, tính chính trị","Tính kế thừa, tính phát triển, tính chính trị","Tính chính trị, tính chọn lọc, tính phát triển","Tính kế thừa, tính quần chúng, tính thực tiễn"],"a":"A","id":"b2q2_41"},{"lesson":2,"source_no":3,"q":"Một trong những đặc điểm của các dân tộc ở Việt Nam là?","o":["Mỗi dân tộc ở Việt Nam đều có sắc thái văn hóa riêng","Các dân tộc Việt Nam đều có chung phong tục, tập quán riêng","Mỗi dân tộc Việt Nam đều có nền văn hóa riêng","Các dân tộc Việt Nam đều có các tôn giáo riêng"],"a":"A","id":"b2q3_42"},{"lesson":2,"source_no":4,"q":"Một trong những đặc điểm của các dân tộc thiểu số ở Việt Nam là?","o":["Cư trú phân tán và xen kẽ","Cư trú du canh, du cư","Cư trú tập trung","Cư trú ở rừng núi"],"a":"A","id":"b2q4_43"},{"lesson":2,"source_no":5,"q":"Để thực hiện thủ đoạn lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam, các thế lực thù địch thường sử dụng chiêu bài?","o":["“nhân quyền”, “dân chủ”, “tự do”","“dân chủ”, “tuyên truyền”, “tự do”","“truyền đạo”, “dân chủ”, “tự do”","“nhân quyền”, “kích động”, “dân chủ”"],"a":"A","id":"b2q5_44"},{"lesson":2,"source_no":6,"q":"Quyền tự do tín ngưỡng tôn giáo được hiểu là?","o":["Mọi người đều được tự do theo hoặc không theo tôn giáo","Mọi người đều được tự do thờ cúng hoặc không thờ cúng","Mọi người đều được tự do tin hay không tin ở thần linh","Mọi người đều được tự do cầu trời, cầu tự cho mình"],"a":"A","id":"b2q6_45"},{"lesson":2,"source_no":7,"q":"Theo quan điểm của chủ nghĩa Mác-Lênin, vấn đề dân tộc là?","o":["Vấn đề cần thiết của cách mạng XHCN","Vấn đề chiến lược của cách mạng XHCN","Vấn đề quan trọng của cách mạng XHCN","Vấn đề sách lược của cách mạng XHCN"],"a":"B","id":"b2q7_46"},{"lesson":2,"source_no":8,"q":"Tôn giáo có nguồn gốc từ các yếu tố?","o":["Kinh tế - xã hội, nhận thức và tâm lý","Chính trị - xã hội, tâm lý và ý thức","Kinh tế - xã hội, ý thức và giáo lý","Chính trị - quân sự, tâm lý và nhận thức"],"a":"A","id":"b2q8_47"},{"lesson":2,"source_no":9,"q":"Để đấu tranh phòng chống các thế lực thù địch lợi dụng vấn đề dân tộc, tôn giáo, chúng ta phải phát huy vai trò của?","o":["Cả hệ thống chính trị","Đồng bào các dân tộc, tôn giáo","Các tổ chức quần chúng","Các già làng, chức sắc tôn giáo"],"a":"A","id":"b2q9_48"},{"lesson":2,"source_no":10,"q":"Một trong những đặc điểm của các dân tộc ở Việt Nam là?","o":["Có truyền thống đoàn kết gắn bó xây dựng quốc gia dân tộc thống nhất","Có truyền thống yêu nước, thương nòi kế tiếp đời này qua đời khác","Có tinh thần chịu đựng gian khổ, khó khăn, không sợ hy sinh, vất vả","Có tinh thần độc lập tự chủ, chịu thương, chịu khó làm ăn sinh sống"],"a":"A","id":"b2q10_49"},{"lesson":2,"source_no":11,"q":"Nhóm các tôn giáo nào sau đây thuộc về 6 tôn giáo lớn, có số lượng tín đồ đông đảo nhất tại Việt Nam hiện nay?","o":["Phật giáo, Công giáo, Tin Lành, Cao Đài, Hòa Hảo, Hồi giáo.","Phật giáo, Ấn Độ giáo, Cơ đốc giáo, Mặc Môn, Baha’i.","Công giáo, Chính thống giáo, Anh giáo, Hồi giáo, Tà Lơn.","Tin Lành, Bà-la-môn, Minh Sư đạo, Cao Đài, Hòa Hảo."],"a":"A","id":"b2q11_50"},{"lesson":2,"source_no":12,"q":"Theo quan điểm của chủ nghĩa Mác-Lênin, giải quyết vấn đề dân tộc trong cách mạng xã hội chủ nghĩa?","o":["Vừa là mục tiêu vừa là động lực của cách mạng XHCN","Vừa là quan điểm vừa là phương châm của nhà nước vô sản","Vừa là mục tiêu vừa là phương thức của nhà nước XHCN","Vừa là nội dung vừa là quan điểm của cách mạng XHCN"],"a":"A","id":"b2q12_51"},{"lesson":2,"source_no":13,"q":"Một trong những quan điểm, chính sách dân tộc của Đảng, Nhà nước ta là?","o":["Chống các biểu hiện kỳ thị, hẹp hòi, chia rẽ dân tộc","Chống phân biệt, đối xử khác nhau giữa các dân tộc","Chống mọi hành động áp đặt trong công tác dân tộc","Chống tuyên truyền, lôi kéo kích động các dân tộc"],"a":"A","id":"b2q13_52"},{"lesson":2,"source_no":14,"q":"Một trong những lý do dẫn đến vấn đề dân tộc còn tồn tại lâu dài là do?","o":["Dân số và trình độ phát triển kinh tế - xã hội giữa các dân tộc không đều nhau","Các dân tộc chưa đồng thời đứng lên đấu tranh chống chủ nghĩa đế quốc","Sự chống phá của chủ nghĩa đế quốc đối với các dân tộc trên toàn thế giới","Chủ nghĩa đế quốc thực hiện chiến lược “Diễn biến hòa bình” trên thế giới"],"a":"A","id":"b2q14_53"},{"lesson":2,"source_no":15,"q":"Một trong những nội dung tư tưởng Hồ Chí Minh về vấn đề dân tộc và giải quyết vấn đề dân tộc?","o":["Khắc phục tận dư tư tưởng phân biệt, kỳ thị dân tộc, tư tưởng dân tộc lớn, dân tộc hẹp hòi","Xây dựng quan hệ sâu sắc, tốt đẹp, phong phú, hài hòa giữa các dân tộc","Thiết lập và mở rộng mối quan hệ khăng khít, gắn bó với các quốc gia, dân tộc trên thế giới","Xây dựng tình đoàn kết hữu nghị, bình đẳng, tôn trọng và giúp đỡ nhau cùng phát triển"],"a":"A","id":"b2q15_54"},{"lesson":2,"source_no":16,"q":"Một trong những đặc điểm của các dân tộc ở Việt Nam là các dân tộc ở nước ta có quy mô dân số và?","o":["Trình độ phát triển không đồng đều","Trình độ phát triển khá đồng đều","Trình độ phát triển còn hạn chế","Trình độ phát triển đồng đều"],"a":"A","id":"b2q16_55"},{"lesson":2,"source_no":17,"q":"Một trong những quan điểm, chính sách dân tộc của Đảng, Nhà nước ta là?","o":["Vấn đề dân tộc và đoàn kết các dân tộc có vị trí chiến lược lâu dài trong sự nghiệp cách mạng Việt Nam","Vấn đề dân tộc và đoàn kết dân tộc có ý nghĩa sâu sắc trong sự nghiệp cách mạng Việt Nam","Vấn đề dân tộc và đoàn kết dân tộc gắn liền với quá trình xây dựng và phát triển của cách mạng Việt Nam","Vấn đề dân tộc và đoàn kết dân tộc đi đôi với cải tạo xã hội cũ, xây dựng xã hội mới, xã hội văn minh, tốt đẹp"],"a":"A","id":"b2q17_56"},{"lesson":2,"source_no":18,"q":"Một trong những quan điểm, chính sách dân tộc của Đảng, Nhà nước ta là?","o":["Thực hiện chính sách ưu tiên trong đào tạo, bồi dưỡng cán bộ, trí thức là người dân tộc thiểu số.","Ưu tiên trong giáo dục cán bộ, nhân lực, vật lực cho các địa phương vùng đồng bào các dân tộc thiểu số","Tập trung phát triển nhanh về văn hóa - xã hội cho các địa phương vùng đồng bào các dân tộc thiểu số","Thực hiện tốt các chính sách, nhất là chính sách dân số, kế hoạch hóa gia đình cho đồng bào các dân tộc thiểu số"],"a":"A","id":"b2q18_57"},{"lesson":2,"source_no":19,"q":"Có mấy giải pháp đấu tranh phòng, chống sự lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam của các thế lực thù địch?","o":["3 giải pháp.","4 giải pháp.","5 giải pháp.","6 giải pháp."],"a":"C","id":"b2q19_58"},{"lesson":2,"source_no":20,"q":"Tôn trọng tự do tín ngưỡng là phải không ngừng tạo điều kiện cho quần chúng phát triển, tiến bộ về mọi mặt, bài trừ mê tín dị đoan, bảo đảm cho?","o":["Tín đồ, chức sắc tôn giáo hoạt động theo đúng pháp luật","Đồng bào tôn giáo tự do, bình đẳng trước pháp luật","Giáo sĩ, tín đồ tôn giáo ngày càng phát triển bền vững","Tôn giáo đoàn kết, phát triển theo kịp thế giới"],"a":"A","id":"b2q20_59"},{"lesson":2,"source_no":21,"q":"Theo quan điểm của chủ nghĩa Mác-Lênin, vấn đề dân tộc là?","o":["Vấn đề chiến lược của cách mạng XHCN","Vấn đề quan trọng của cách mạng XHCN","Vấn đề cần thiết của cách mạng XHCN","Vấn đề sách lược của cách mạng XHCN"],"a":"A","id":"b2q21_60"},{"lesson":2,"source_no":22,"q":"Một trong những nội dung giải quyết vấn đề dân tộc theo quan điểm của Lênin?","o":["Các dân tộc hoàn toàn bình đẳng","Các dân tộc phải ly khai, tự trị","Các dân tộc phải phân chia đẳng cấp","Các dân tộc phải có nền văn hóa chung"],"a":"A","id":"b2q22_61"},{"lesson":2,"source_no":23,"q":"Một trong những giải pháp cơ bản đấu tranh phòng chống các thế lực thù địch lợi dụng vấn đề dân tộc, tôn giáo là?","o":["Chăm lo nâng cao đời sống vật chất, tinh thần của đồng bào các dân tộc, các tôn giáo","Tạo điều kiện cho đồng bào các dân tộc, tôn giáo thực hiện tốt nghĩa vụ đối với đất nước","Chú trọng công tác thuyết phục đối với các già làng, trưởng bản, chức sắc tôn giáo","Kịp thời phát hiện, ngăn chặn đối phó có hiệu quả đối với những lực lượng phản động"],"a":"A","id":"b2q23_62"},{"lesson":2,"source_no":24,"q":"Lĩnh vực trọng yếu mà các thế lực thù địch lợi dụng, lấy đó làm “ngòi nổ” để chống phá cách mạng Việt Nam là?","o":["Vấn đề dân tộc, tôn giáo","Vấn đề diễn biến hòa bình","Vấn đề bạo loạn lật đổ","Vấn đề dân chủ, nhân quyền"],"a":"A","id":"b2q24_63"},{"lesson":2,"source_no":25,"q":"Quyền tự do tín ngưỡng tôn giáo, được hiểu là?","o":["Mọi người đều được tự do theo hoặc không theo tôn giáo","Mọi người đều được tự do thờ cúng hoặc không thờ cúng","Mọi người đều được tự do tin hay không tin ở thần linh","Mọi người đều được tự do cầu trời, cầu tự cho mình"],"a":"A","id":"b2q25_64"},{"lesson":2,"source_no":26,"q":"Tăng cường công tác đào tạo, bồi dưỡng cán bộ làm công tác tôn giáo, là một trong những nội dung?","o":["Chính sách tôn giáo của Đảng, Nhà nước ta","Quan điểm tôn giáo của chủ nghĩa Mác - Lênin","Quan điểm tôn giáo của Đảng, Nhà nước ta","Chính sách tôn giáo của Chủ nghĩa Mác - Lênin"],"a":"A","id":"b2q26_65"}]},{"id":3,"title":"Bảo vệ môi trường","questions":[{"lesson":3,"source_no":1,"q":"Theo Luật Bảo vệ môi trường năm 2020 thì thành phần môi trường bao gồm?","o":["Các yếu tố vật chất tự nhiên và nhân tạo","Các yếu tố vật chất tự nhiên và xã hội","Các yếu tố vật chất nhân tạo và xã hội","Các yếu tố vật chất tự nhiên, nhân tạo và xã hội"],"a":"A","id":"b3q1_66"},{"lesson":3,"source_no":2,"q":"Khái niệm “Môi trường” được tạo thành từ những yếu tố cốt lõi nào?","o":["Bao gồm các yếu tố vật chất tự nhiên xuất hiện sẵn có trên Trái Đất.","Các yếu tố vật chất tự nhiên và nhân tạo quan hệ mật thiết với nhau, bao quanh con người.","Bao gồm các công trình nhân tạo do con người xây dựng.","Các hình thái văn hóa phi vật chất và thể chế chính trị của quốc gia."],"a":"B","id":"b3q2_67"},{"lesson":3,"source_no":3,"q":"Nội dung nào sau đây không thuộc về khái niệm hoạt động bảo vệ môi trường theo quy định của pháp luật?","o":["Khắc phục ô nhiễm, suy thoái môi trường và cải thiện chất lượng môi trường.","Phòng ngừa, dự báo và hạn chế các tác động xấu từ con người đến thiên nhiên.","Khai thác tối đa các nguồn tài nguyên khoáng sản nhằm phục vụ cho phát triển kinh tế.","Sử dụng hợp lý tài nguyên thiên nhiên, bảo tồn đa dạng sinh học và ứng phó biến đổi khí hậu."],"a":"C","id":"b3q3_68"},{"lesson":3,"source_no":4,"q":"Quy chuẩn môi trường, tiêu chuẩn môi trường là?","o":["Cơ sở pháp lý cho việc xác định có vi phạm pháp luật về môi trường hay không.","Điều kiện pháp lý để cơ quan bảo vệ pháp luật xử phạt tổ chức, cá nhân vi phạm.","Trách nhiệm pháp lý để tòa án áp dụng đối với các cá nhân, tổ chức vi phạm.","Nguyên tắc pháp lý để cho mọi cá nhân, tổ chức chấp hành và tuân thủ."],"a":"A","id":"b3q4_69"},{"lesson":3,"source_no":5,"q":"Đạo luật chuyên ngành có hiệu lực pháp lý cao nhất điều chỉnh các quan hệ xã hội về bảo vệ môi trường ở nước ta hiện nay là?","o":["Luật Tài nguyên, môi trường biển và hải đảo.","Luật Bảo vệ môi trường năm 2020.","Luật Đa dạng sinh học.","Bộ luật Dân sự (chương về Môi trường)."],"a":"B","id":"b3q5_70"},{"lesson":3,"source_no":6,"q":"Hình thức xử lý vi phạm pháp luật trong lĩnh vực bảo vệ môi trường, bao gồm?","o":["Xử lý hình sự, xử lý vi phạm hành chính, xử lý trách nhiệm dân sự.","Xử lý hình sự, xử lý phạt tù, xử lý phạt tiền.","Xử lý vi phạm hành chính, xử lý phạt tiền, bồi thường.","Xử lý trách nhiệm dân sự, buộc khôi trạng thái ban đầu."],"a":"A","id":"b3q6_71"},{"lesson":3,"source_no":7,"q":"Khi phát hiện một thông tin, bài viết hoặc chiến dịch kêu gọi bảo vệ động vật hoang dã, trồng cây xanh từ các nguồn uy tín trên không gian mạng, sinh viên nên ứng xử như thế nào để thể hiện trách nhiệm của mình?","o":["Viết bài kêu gọi quyên góp tài chính và chủ động đính kèm số tài khoản ngân hàng cá nhân của mình ở phần bình luận để thu gom tiền từ thiện giúp chiến dịch.","Tích cực tương tác, chia sẻ (share) bài viết gốc để lan tỏa thông điệp xanh đến cộng đồng; đồng thời chủ động tham gia bằng các hành động thực tế phù hợp với khả năng.","Tải toàn bộ hình ảnh, nội dung bài viết về máy, chỉnh sửa cắt bỏ logo nguồn cũ rồi đăng lại trên trang cá nhân để tăng tương tác thu hút bạn bè.","Sao chép đường liên kết (link) của chiến dịch và gửi vào các hội nhóm ở trường để yêu cầu các thành viên tham gia."],"a":"B","id":"b3q7_72"},{"lesson":3,"source_no":8,"q":"Một trong những nguyên nhân điều kiện khách quan dẫn đến vi phạm pháp luật về môi trường là do?","o":["Áp lực tăng trưởng kinh tế.","Sự phát triển quá nhanh của nền kinh tế.","Quy chuẩn môi trường, tiêu chuẩn môi trường quá khắt khe.","Các khu đô thị và khu dân cư ngày càng nhiều."],"a":"A","id":"b3q8_73"},{"lesson":3,"source_no":9,"q":"Muốn nâng cao hiệu quả nhận thức của cộng đồng đối với đường lối chính sách của Đảng, pháp luật của Nhà nước về bảo vệ môi trường, cần chú trọng biện pháp nào?","o":["Biện pháp pháp luật.","Biện pháp tổ chức - hành chính.","Biện pháp tuyên truyền, giáo dục.","Biện pháp khoa học công nghệ."],"a":"C","id":"b3q9_74"},{"lesson":3,"source_no":10,"q":"Phòng, chống vi phạm pháp luật về bảo vệ môi trường nhằm?","o":["Ngăn chặn, hạn chế tình trạng vi phạm pháp luật về bảo vệ môi trường.","Ngăn chặn nguy cơ, điều kiện vi phạm pháp luật về bảo vệ môi trường.","Duy trì môi trường trong sạch và giữ nguyên hiện trạng môi trường.","Bảo đảm cho sự phát triển ổn định, bền vững kinh tế - xã hội của đất nước."],"a":"A","id":"b3q10_75"},{"lesson":3,"source_no":11,"q":"Mục tiêu cốt lõi của Luật Bảo vệ môi trường năm 2020 đối với việc quản lý, giảm thiểu chất thải nhựa trong các hoạt động sản xuất, kinh doanh và sinh hoạt là gì?","o":["Cấm tuyệt đối việc sản xuất tất cả các sản phẩm làm từ nhựa.","Giảm thiểu, tái sử dụng, tái chế và xử lý chất thải nhựa; hạn chế sử dụng sản phẩm nhựa dùng một lần và túi ni lông khó phân hủy.","Khuyến khích người dân đốt chất thải nhựa tại nhà để giảm thiểu khối lượng rác chôn lấp.","Chuyển toàn bộ chất thải nhựa phát sinh để tạo ra năng lượng tái tạo thông qua nhà máy điện rác."],"a":"B","id":"b3q11_76"},{"lesson":3,"source_no":12,"q":"Hành vi nào sau đây trong đánh bắt hải sản gây nguy hại cho môi trường?","o":["Dùng xung điện khai thác hải sản.","Dùng tàu thuyền nhỏ khai thác hải sản.","Dùng thuyền câu hải sản.","Sử dụng tàu công suất lớn để khai thác hải sản."],"a":"A","id":"b3q12_77"},{"lesson":3,"source_no":13,"q":"Chọn đáp án đúng nhất: hiện tượng chặt phá rừng còn xảy ra ở nhiều nơi rất nghiêm trọng do?","o":["Xử lý vi phạm pháp luật về môi trường chưa thực sự nghiêm minh.","Chưa được tuyên truyền nhắc nhở.","Cuộc sống mưu sinh của một số người.","Địa phương chưa quan tâm đến bảo vệ môi trường."],"a":"A","id":"b3q13_78"},{"lesson":3,"source_no":14,"q":"Biện pháp chủ yếu để phát hiện hành vi vi phạm môi trường cần?","o":["Tăng cường công tác thanh tra, kiểm tra cơ sở, địa bàn có nguy cơ gây ô nhiễm môi trường.","Thông qua báo cáo của các cơ sở về môi trường.","Đặt camera quan sát.","Căn cứ vào phát hiện của quần chúng."],"a":"A","id":"b3q14_79"},{"lesson":3,"source_no":15,"q":"Điền cụm từ vào chỗ trống: Pháp luật quy định các “...” của các cơ quan, tổ chức và cá nhân tham gia bảo vệ môi trường?","o":["Chức năng, nhiệm vụ, quyền hạn.","Chức năng, quyền hạn.","Nhiệm vụ, chức năng và quyền xử phạt.","Quyền hạn áp dụng quy định xử phạt."],"a":"A","id":"b3q15_80"},{"lesson":3,"source_no":16,"q":"Pháp luật về bảo vệ môi trường giữ vai trò như thế nào trong việc quản lý xã hội?","o":["Là giải pháp để áp dụng khi xảy ra các sự cố thiên tai nghiêm trọng.","Là công cụ để nâng cao ý thức bảo vệ môi trường.","Là công cụ quản lý vĩ mô, quy định các chuẩn mực hành vi và tạo cơ sở pháp lý để bảo vệ hệ sinh thái.","Là văn bản để khuyến khích mọi công dân tham gia bảo vệ môi trường."],"a":"C","id":"b3q16_81"},{"lesson":3,"source_no":17,"q":"Trách nhiệm của sinh viên trong phòng, chống vi phạm về bảo vệ môi trường?","o":["Nắm vững các quy định của pháp luật phòng, chống vi phạm pháp luật về bảo vệ môi trường.","Xây dựng ý thức trách nhiệm trong các hoạt động bảo vệ môi trường như sử dụng tiết kiệm, có hiệu quả các nguồn tài nguyên (nước, năng lượng,...).","Xây dựng văn hóa ứng xử, ý thức trách nhiệm với môi trường như sống thân thiện với môi trường xung quanh.","Tham gia tích cực và hưởng ứng các chương trình, hành động về bảo vệ môi trường do Nhà nước, các Bộ ngành, địa phương và nhà trường phát động."],"a":"D","id":"b3q17_82"},{"lesson":3,"source_no":18,"q":"Việc pháp luật quy định đồng thời các hệ thống chế tài hình sự, hành chính, dân sự và kinh tế đối với hành vi xâm hại môi trường nhằm mục đích quản lý xã hội nào sau đây?","o":["Thay thế các quy trình giám sát kỹ thuật bằng việc tối đa hóa mức hình phạt đối với mọi hành vi làm phát sinh chất thải.","Tạo cơ chế tác động toàn diện, vừa răn đe nghiêm khắc bằng chế tài công quyền (hình sự, hành chính), vừa bảo đảm bù đắp thiệt hại vật chất và lợi ích kinh tế (dân sự, kinh tế).","Tạo hành lang pháp lý để chủ thể vi phạm có thể chủ động sử dụng tiền phạt hành chính nhằm bù đắp cho những thiệt hại do mình gây ra.","Tạo cơ sở để áp đặt các mức phạt kinh tế."],"a":"B","id":"b3q18_83"},{"lesson":3,"source_no":19,"q":"Luật Bảo vệ môi trường quy định việc bảo vệ môi trường nhằm mục đích gì?","o":["Bảo vệ sức khỏe của nhân dân, phục vụ sự phát triển bền vững của đất nước.","Bảo vệ phát triển kinh tế rừng.","Bảo vệ môi trường không khí.","Bảo vệ phát triển kinh tế biển."],"a":"A","id":"b3q19_84"},{"lesson":3,"source_no":20,"q":"Để nâng cao hiệu quả công tác đấu tranh phòng, chống tội phạm và vi phạm pháp luật về môi trường cần phải?","o":["Quan trắc môi trường.","Hoàn thiện cơ chế, chính sách, hệ thống pháp luật về bảo vệ tài nguyên và môi trường.","Thực hiện trồng nhiều cây xanh.","Thu gom rác thải sinh hoạt."],"a":"B","id":"b3q20_85"},{"lesson":3,"source_no":21,"q":"Để phát hiện hành vi vi phạm môi trường cần phải?","o":["Đặt camera quan sát.","Thông qua báo cáo của các cơ sở về môi trường.","Tăng cường công tác thanh tra, kiểm tra cơ sở, địa bàn có nguy cơ gây ô nhiễm môi trường.","Căn cứ vào phát hiện của quần chúng."],"a":"C","id":"b3q21_86"},{"lesson":3,"source_no":22,"q":"Để phòng ngừa, đấu tranh chống tội phạm và vi phạm pháp luật về môi trường cần phải?","o":["Dựa vào tinh thần tự giác của người dân.","Phụ thuộc vào sự quản lý về môi trường của cơ sở.","Dựa vào lực lượng thanh niên tình nguyện.","Đẩy mạnh công tác tuyên truyền, giáo dục nâng cao nhận thức và trách nhiệm của mọi công dân."],"a":"D","id":"b3q22_87"},{"lesson":3,"source_no":23,"q":"Một trong những giải pháp đấu tranh phòng chống những hành vi vi phạm và tội phạm về môi trường?","o":["Xử phạt hành chính tội phạm về môi trường.","Tiếp nhận báo cáo về môi trường của cơ sở sản xuất.","Khuyến khích cá nhân tố cáo vi phạm về môi trường.","Tổ chức thực hiện triệt để các chủ trương, chính sách của Đảng, pháp luật của Nhà nước về bảo vệ môi trường."],"a":"D","id":"b3q23_88"},{"lesson":3,"source_no":24,"q":"Hoạt động bảo vệ môi trường của sinh viên trong nhà trường được nhìn nhận như thế nào dưới góc độ trách nhiệm công dân?","o":["Có trách nhiệm, nghĩa vụ tham gia khi nhà trường phát động phong trào “xanh, sạch, đẹp”.","Là trách nhiệm, nghĩa vụ công dân và là tiêu chí quan trọng để đánh giá ý thức rèn luyện, đạo đức của sinh viên.","Là trách nhiệm, nghĩa vụ của bộ phận vệ sinh môi trường.","Có trách nhiệm thực hiện khi được nhà trường chọn làm tiêu chí quan trọng để đánh giá ý thức rèn luyện, đạo đức của sinh viên."],"a":"B","id":"b3q24_89"},{"lesson":3,"source_no":25,"q":"Khi ở trong khuôn viên nhà trường, hành động nào sau đây của sinh viên thể hiện sự hiểu biết và trách nhiệm cao nhất trong việc xử lý rác thải sinh hoạt?","o":["Gom tất cả rác hữu cơ, rác vô cơ và chất thải nhựa vào nơi đúng quy định.","Chủ động phân loại rác (rác tái chế, rác hữu cơ, rác còn lại) trước khi bỏ vào các thùng rác chuyên dụng của nhà trường.","Chủ động dọn dẹp hằng ngày.","Gom tất cả rác hữu cơ, rác vô cơ và chất thải nhựa để đốt."],"a":"B","id":"b3q25_90"}]},{"id":4,"title":"Pháp luật về bảo đảm trật tự, an toàn giao thông","questions":[{"lesson":4,"source_no":1,"q":"Pháp luật về bảo đảm trật tự, an toàn giao thông được hiểu là gì?","o":["Hệ thống các quy định nội bộ của ngành giao thông vận tải áp dụng riêng cho các doanh nghiệp vận tải.","Toàn bộ các quy tắc đạo đức tự nguyện của người dân khi tham gia giao thông trên đường.","Hệ thống các quy phạm pháp luật do cơ quan nhà nước có thẩm quyền ban hành nhằm điều chỉnh các quan hệ xã hội phát sinh trong hoạt động giao thông.","Chỉ thị hành chính nội bộ của lực lượng Cảnh sát giao thông nhằm phân luồng xe cộ hằng ngày."],"a":"C","id":"b4q1_91"},{"lesson":4,"source_no":2,"q":"Pháp luật về bảo đảm trật tự, an toàn giao thông là gì?","o":["Là một bộ phận của hệ thống pháp luật hành chính nhà nước.","Là hệ thống pháp luật của nhà nước quy định về an toàn giao thông.","Là một bộ phận của pháp luật quy định các hành vi vi phạm giao thông.","Là một bộ phận của pháp luật nước Cộng hòa xã hội chủ nghĩa Việt Nam."],"a":"A","id":"b4q2_92"},{"lesson":4,"source_no":3,"q":"Đáp án nào sau đây là đầy đủ và chính xác nhất về mặt khách quan của vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông?","o":["Chỉ bao gồm hành vi hành động (như chạy quá tốc độ) và hậu quả thiệt hại thực tế.","Bắt buộc phải có đủ 3 yếu tố: Hành vi vi phạm, hậu quả nghiêm trọng và quan hệ nhân quả.","Gồm hành vi vi phạm (hành động/không hành động); vi phạm hành chính chỉ cần có hành vi, còn hình sự thường phải có hậu quả.","Là diễn biến tâm lý bên trong của người vi phạm bộc lộ ra bên ngoài thông qua lỗi cố ý."],"a":"C","id":"b4q3_93"},{"lesson":4,"source_no":4,"q":"Một trong những nguyên nhân, điều kiện dẫn đến vi phạm pháp luật về trật tự, an toàn giao thông?","o":["Tác động tiêu cực của các yếu tố thiên nhiên, môi trường đối với người tham gia giao thông.","Hệ thống pháp luật còn chưa đủ chặt, đủ mạnh để răn đe.","Hiện tượng tiêu cực mang tính phổ biến.","Ý thức tự giác của người tham gia giao thông chưa cao."],"a":"A","id":"b4q4_94"},{"lesson":4,"source_no":5,"q":"Phòng chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông là?","o":["Hoạt động của cơ quan Nhà nước, các tổ chức xã hội và công dân.","Hoạt động của các tổ chức.","Hoạt động của cơ quan Nhà nước.","Hoạt động của cá nhân."],"a":"A","id":"b4q5_95"},{"lesson":4,"source_no":6,"q":"Cơ quan hay tổ chức nào trực tiếp chỉ đạo và phân công, phân cấp cụ thể cho các bộ, ngành, cơ quan đoàn thể trong phòng ngừa tội phạm và vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông?","o":["Chính phủ, Ủy ban nhân dân các cấp.","Đảng Cộng sản Việt Nam.","Quốc hội, Hội đồng nhân dân các cấp.","Bộ Giao thông vận tải."],"a":"A","id":"b4q6_96"},{"lesson":4,"source_no":7,"q":"Lực lượng nòng cốt xung kích trong đảm bảo trật tự, an toàn giao thông là?","o":["Công an.","Quân đội.","Dân quân tự vệ.","Dân phòng."],"a":"A","id":"b4q7_97"},{"lesson":4,"source_no":8,"q":"Hành vi nào sau đây thể hiện đầy đủ và đúng đắn nhất trách nhiệm của sinh viên trong việc tham gia bảo đảm trật tự, an toàn giao thông (TTATGT)?","o":["Tự giác chấp hành nghiêm chỉnh luật giao thông, tham gia các hoạt động tuyên truyền của trường và nhắc nhở mọi người xung quanh cùng thực hiện.","Ký cam kết không vi phạm TTATGT với nhà trường vào đầu năm học và tập trung vào việc học tập, rèn luyện.","Tích cực tham gia các đội thanh niên xung kích phân luồng giao thông tại cổng trường dù bản thân đôi khi vẫn vi phạm lỗi nhỏ.","Nghiên cứu sâu sắc các chế tài xử phạt của Luật Giao thông đường bộ để không bị vi phạm."],"a":"A","id":"b4q8_98"},{"lesson":4,"source_no":9,"q":"Một trong những biện pháp phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn tham gia giao thông là?","o":["Tuyên truyền, phổ biến, giáo dục pháp luật về bảo đảm trật tự, an toàn giao thông cho mọi công dân.","Tuyên truyền, phổ biến về chính sách phát triển kinh tế - xã hội.","Tuyên truyền, phổ biến về Bộ luật hình sự hiện hành.","Tuyên truyền về hậu quả của các hành vi vi phạm và chế tài xử lý."],"a":"A","id":"b4q9_99"},{"lesson":4,"source_no":10,"q":"Mục đích của công tác tuyên truyền, phổ biến, giáo dục pháp luật về bảo đảm trật tự, an toàn giao thông là?","o":["Nâng cao ý thức chấp hành pháp luật về bảo đảm trật tự, an toàn giao thông.","Nâng cao hiểu biết về chính sách phát triển kinh tế - xã hội của đất nước.","Nâng cao ý thức trong giữ gìn an ninh trật tự.","Nâng cao tinh thần đấu tranh, tố giác tội phạm."],"a":"A","id":"b4q10_100"},{"lesson":4,"source_no":11,"q":"Điền cụm từ vào chỗ trống: Trật tự, an toàn giao thông là trạng thái xã hội có trật tự được hình thành và điều chỉnh bởi ... trong lĩnh vực giao thông?","o":["Các quy phạm pháp luật.","Hệ thống văn bản pháp quy.","Hệ thống nguyên tắc điều chỉnh hành vi.","Ý thức công dân tham gia."],"a":"A","id":"b4q11_101"},{"lesson":4,"source_no":12,"q":"Cơ quan nào chịu trách nhiệm trước Chính phủ trong việc thực hiện quản lý Nhà nước về đảm bảo trật tự, an toàn giao thông?","o":["Bộ Giao thông vận tải.","Bộ Công an.","Cục Quản lý đường bộ.","Cục Quản lý đường biển."],"a":"B","id":"b4q12_102"},{"lesson":4,"source_no":13,"q":"Nội dung nào sau đây là giải pháp trong công tác phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông?","o":["Nâng cao nhận thức và ý thức tự giác chấp hành pháp luật của người tham gia giao thông.","Đổi mới, nâng cao hiệu quả công tác tuyên truyền, phổ biến, giáo dục pháp luật về an toàn giao thông.","Kiên quyết kiềm chế, tiếp tục làm giảm tai nạn giao thông, ùn tắc giao thông.","Tuyên truyền, vận động nhân dân nghiêm chỉnh chấp hành luật giao thông."],"a":"B","id":"b4q13_103"},{"lesson":4,"source_no":14,"q":"Nội dung nào sau đây là nguyên nhân khách quan dẫn đến các vi phạm pháp luật và tai nạn giao thông hiện nay?","o":["Ý thức tự giác chấp hành luật giao thông của một bộ phận người dân còn kém.","Tâm lý chủ quan, phóng nhanh vượt ẩu, sử dụng rượu bia khi lái xe của người điều khiển phương tiện.","Sự gia tăng quá nhanh của phương tiện cá nhân trong khi hạ tầng giao thông chưa đáp ứng kịp thời.","Người tham gia giao thông chưa hiểu rõ các quy định của Luật Giao thông đường bộ."],"a":"C","id":"b4q14_104"},{"lesson":4,"source_no":15,"q":"Nội dung nào sau đây là nguyên nhân chủ quan hàng đầu dẫn đến các vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông?","o":["Hệ thống biển báo giao thông tại một số tuyến đường còn thiếu hoặc bố trí chưa hợp lý.","Thời tiết diễn biến thất thường, mưa lớn gây ngập lụt và làm giảm tầm nhìn của người lái xe.","Ý thức tự giác chấp hành pháp luật giao thông của một bộ phận người tham gia giao thông còn thấp.","Mật độ phương tiện giao thông tăng quá nhanh gây quá tải cho hệ thống cầu đường đô thị."],"a":"C","id":"b4q15_105"},{"lesson":4,"source_no":16,"q":"Cơ quan chịu trách nhiệm nghiên cứu phân tích, đánh giá tình trạng vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông?","o":["Bộ Công an.","Bộ Quốc phòng.","Quốc hội.","Bộ Giao thông vận tải."],"a":"A","id":"b4q16_106"},{"lesson":4,"source_no":17,"q":"Một trong những nội dung hợp tác giữa các chủ thể tham gia đảm bảo trật tự, an toàn giao thông là?","o":["Phối hợp tổ chức tuyên truyền, giáo dục pháp luật về bảo đảm trật tự, an toàn giao thông.","Phối hợp trong truy tìm, vây bắt đối tượng vi phạm.","Phối hợp trong dẫn độ đối tượng vi phạm.","Phối hợp trong xét xử đối tượng vi phạm."],"a":"A","id":"b4q17_107"},{"lesson":4,"source_no":18,"q":"Điền vào chỗ còn trống: Pháp luật về đảm bảo trật tự, an toàn giao thông là ... để thực hiện chức năng quản lý Nhà nước?","o":["Công cụ pháp lý.","Công cụ đấu tranh.","Công cụ thực thi.","Công cụ xử lý."],"a":"A","id":"b4q18_108"},{"lesson":4,"source_no":19,"q":"Nội dung nào sau đây thuộc về quy tắc giao thông trong nội dung cơ bản của pháp luật về bảo đảm trật tự, an toàn giao thông?","o":["Quy định về độ tuổi và thủ tục cấp Giấy phép lái xe cho công dân.","Quy định về niên hạn sử dụng và tiêu chuẩn đăng kiểm định kỳ của xe ô tô.","Quy định về tốc độ tối đa cho phép và khoảng cách an toàn giữa các xe trên đường.","Quy định về mức phạt tiền và hình thức tước quyền sử dụng giấy phép lái xe."],"a":"C","id":"b4q19_109"},{"lesson":4,"source_no":20,"q":"Hành vi “Đua xe trái phép gây tai nạn nghiêm trọng hoặc tổ chức đua xe trái phép” được nhận thức là loại vi phạm nào?","o":["Vi phạm kỷ luật quân đội nội bộ.","Vi phạm dân sự về tranh chấp tài sản.","Tội phạm hình sự về trật tự, an toàn giao thông.","Vi phạm hành chính nhẹ, chỉ cần nhắc nhở."],"a":"C","id":"b4q20_110"},{"lesson":4,"source_no":21,"q":"Pháp luật về bảo đảm trật tự, an toàn giao thông giữ vai trò như thế nào đối với các lực lượng chức năng?","o":["Là văn bản mang tính chất tham khảo, không bắt buộc lực lượng chức năng áp dụng.","Giúp lực lượng chức năng tự ý thay đổi các mức phạt tùy theo hoàn cảnh kinh tế.","Là cơ sở pháp lý vững chắc để kiểm tra, giám sát và xử lý nghiêm minh các hành vi vi phạm.","Thay thế hoàn toàn cho công tác tuyên truyền ý thức giao thông của người dân."],"a":"C","id":"b4q21_111"},{"lesson":4,"source_no":22,"q":"Một trong những vai trò cốt lõi của pháp luật về bảo đảm TTATGT đối với người tham gia giao thông là?","o":["Ép buộc mọi công dân phải sở hữu tất cả các loại bằng lái xe cùng một lúc.","Quy định chuẩn mực hành vi, xác định rõ quyền và nghĩa vụ của mọi đối tượng khi tham gia giao thông.","Khuyến khích người dân tự ý thay đổi biển số xe theo sở thích cá nhân.","Ban hành các quy định ưu tiên cho người có phương tiện đắt tiền hơn."],"a":"B","id":"b4q22_112"},{"lesson":4,"source_no":23,"q":"Mục đích cao nhất của việc phát huy vai trò của pháp luật về bảo đảm trật tự, an toàn giao thông là gì?","o":["Nhằm tăng tối đa nguồn thu ngân sách nhà nước thông qua tiền xử phạt hành chính.","Nhằm cấm tuyệt đối việc sử dụng các phương tiện giao thông cá nhân tại đô thị.","Bảo vệ tính mạng, sức khỏe và tài sản của nhân dân, giảm thiểu tai nạn và ùn tắc giao thông.","Phục vụ riêng cho mục đích hành quân thần tốc của lực lượng quân đội thời chiến."],"a":"B","id":"b4q23_113"},{"lesson":4,"source_no":24,"q":"Một hành vi vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông bắt buộc phải có dấu hiệu nào dưới đây về mặt tâm lý?","o":["Phải được sự đồng thuận của người đi cùng trên xe.","Có lỗi của chủ thể thực hiện hành vi (cố ý hoặc vô ý).","Phải có sự chứng kiến trực tiếp của lực lượng Cảnh sát giao thông.","Chủ thể thực hiện phải có bằng đại học chuyên ngành giao thông."],"a":"B","id":"b4q24_114"},{"lesson":4,"source_no":25,"q":"Điểm khác biệt lớn nhất để phân biệt một vụ “vi phạm hành chính về giao thông” với một “tội phạm hình sự về giao thông” là gì?","o":["Địa bàn xảy ra hành vi vi phạm (ở nông thôn hay thành thị).","Thương hiệu và giá trị của phương tiện giao thông được sử dụng.","Tính chất, mức độ nguy hiểm cho xã hội và hậu quả thiệt hại do hành vi đó gây ra.","Thời gian thực hiện hành vi (vào ban ngày hay ban đêm)."],"a":"C","id":"b4q25_115"}]},{"id":5,"title":"Bảo vệ danh dự, nhân phẩm; phòng chống tội phạm","questions":[{"lesson":5,"source_no":1,"q":"Nhân phẩm của một con người được hiểu như thế nào là đúng đắn nhất dưới góc độ pháp lý?","o":["Là mức độ uy tín, vị thế xã hội và giá trị tài sản mà một cá nhân sở hữu và đóng góp được cho cộng đồng.","Là toàn bộ phẩm chất đạo đức, giá trị tinh thần của một cá nhân được xã hội thừa nhận và tôn trọng.","Là sự tự đánh giá của bản thân cá nhân về danh tiếng, phẩm giá và lòng tự trọng của chính mình.","Là cách nhìn nhận, đánh giá mang tính chủ quan của những người xung quanh đối với một cá nhân."],"a":"B","id":"b5q1_116"},{"lesson":5,"source_no":2,"q":"Danh dự của một cá nhân được hiểu như thế nào là đúng đắn nhất dưới góc độ pháp lý?","o":["Là sự tự tôn, tự đánh giá cao của bản thân cá nhân về phẩm giá và năng lực của chính mình.","Là toàn bộ phẩm chất đạo đức bẩm sinh bên trong con người mà không phụ thuộc vào dư luận xã hội.","Là sự đánh giá mang tính khách quan từ dư luận xã hội đối với một cá nhân dựa trên các phẩm chất và hành vi của họ.","Là địa vị xã hội, chức vụ và khối lượng tài sản hợp pháp mà cá nhân đó cống hiến cho xã hội."],"a":"C","id":"b5q2_117"},{"lesson":5,"source_no":3,"q":"Theo Hiến pháp năm 2013 và pháp luật Việt Nam, quyền được bảo vệ danh dự, nhân phẩm là quyền của những ai?","o":["Chỉ là quyền của những người có chức vụ, quyền hạn cao trong cơ quan nhà nước.","Chỉ dành riêng cho những công dân đã trưởng thành (từ đủ 18 tuổi trở lên).","Mọi người đều có quyền bất khả xâm phạm về thân thể, được pháp luật bảo hộ về sức khỏe, danh dự và nhân phẩm.","Chỉ bảo vệ những người nổi tiếng, có sức ảnh hưởng lớn trên mạng xã hội."],"a":"C","id":"b5q3_118"},{"lesson":5,"source_no":4,"q":"“Gắn giáo dục kiến thức văn hóa với giáo dục kỹ năng sống” để phụ nữ và trẻ em?","o":["Tự bảo vệ mình trước các nguy cơ bị xâm hại.","Tham gia công tác phòng, chống tội phạm.","Tránh xa những đối tượng có tiền án, tiền sự.","Nâng cao nhận thức về thái độ và trách nhiệm xã hội."],"a":"A","id":"b5q4_119"},{"lesson":5,"source_no":5,"q":"“Chú trọng giáo dục đạo đức lẫn kiến thức; lồng ghép nội dung giáo dục giới tính, sức khỏe sinh sản cho học sinh” là trách nhiệm chính của?","o":["Nhà trường.","Gia đình.","Xã hội.","Đoàn thể."],"a":"A","id":"b5q5_120"},{"lesson":5,"source_no":6,"q":"Nhân phẩm là phẩm chất, giá trị của một con người được?","o":["Pháp luật bảo vệ.","Cộng đồng bảo vệ.","Tôn giáo bảo vệ.","Quần chúng nhân dân bảo vệ."],"a":"A","id":"b5q6_121"},{"lesson":5,"source_no":7,"q":"Một trong những yếu tố hình thành nguyên nhân, điều kiện của tình trạng phạm tội xúc phạm danh dự, nhân phẩm?","o":["Phân hóa giàu nghèo.","Bất bình đẳng giới.","Tệ nạn xã hội phát triển.","Giá trị vật chất lên ngôi."],"a":"A","id":"b5q7_122"},{"lesson":5,"source_no":8,"q":"Làm tốt công tác phòng ngừa tội phạm mang ý nghĩa?","o":["Giữ vững an ninh quốc gia, trật tự an toàn xã hội.","Nâng cao chất lượng đời sống một bộ phận người dân.","Góp phần phát triển kinh tế - xã hội ở một số khu vực.","Xóa bỏ hủ tục lạc hậu."],"a":"A","id":"b5q8_123"},{"lesson":5,"source_no":9,"q":"Công dân với tư cách là?","o":["Chủ thể trong phòng chống tội phạm.","Khách thể trong phòng chống tội phạm.","Điều tra trong phòng, chống tội phạm.","Xét xử trong phòng chống tội phạm."],"a":"A","id":"b5q9_124"},{"lesson":5,"source_no":10,"q":"Hành vi cố ý bịa đặt hoặc loan truyền những điều biết rõ là sai sự thật nhằm xúc phạm nghiêm trọng nhân phẩm, danh dự hoặc gây thiệt hại đến quyền, lợi ích hợp pháp của người khác cấu thành tội danh gì trong Bộ luật Hình sự?","o":["Tội làm nhục người khác.","Tội vu khống (Điều 156 Bộ luật Hình sự 2015).","Tội đe dọa giết người.","Tội vô ý gây thương tích."],"a":"B","id":"b5q10_125"},{"lesson":5,"source_no":11,"q":"Bộ Luật Hình sự quy định về?","o":["Tội phạm và hình phạt.","Nhà nước và tội phạm.","Cơ quan chức năng và tội phạm.","Pháp luật hình sự và tội phạm."],"a":"A","id":"b5q11_126"},{"lesson":5,"source_no":12,"q":"Nội dung nào sau đây phản ánh đúng và đầy đủ nhất vai trò chủ yếu của Bộ luật Hình sự?","o":["Là văn bản pháp lý duy nhất quy định các hình thức xử phạt vi phạm hành chính đối với người có hành vi trái pháp luật.","Là công cụ pháp lý sắc bén để bảo vệ các quyền vĩ mô của Nhà nước mà không điều chỉnh quyền lợi của cá nhân công dân.","Là công cụ sắc bén để bảo vệ các quyền, lợi ích hợp pháp của Nhà nước, tổ chức, công dân và đấu tranh phòng, chống tội phạm.","Là quy trình nghiệp vụ chi tiết hướng dẫn lực lượng Công an thực hiện các hoạt động bắt giữ và điều tra tội phạm."],"a":"C","id":"b5q12_127"},{"lesson":5,"source_no":13,"q":"Tội làm nhục người khác là?","o":["Hành vi xâm phạm đến quyền được bảo hộ về nhân phẩm, danh dự của người khác.","Lăng mạ, sỉ nhục, chửi bới... làm họ bị xúc phạm về nhân phẩm, danh dự.","Hành vi xúc phạm về thể xác ảnh hưởng đến uy tín, danh dự của họ trước tập thể.","Có hành vi làm cho người khác bị mất nhân phẩm, danh dự trước tập thể."],"a":"A","id":"b5q13_128"},{"lesson":5,"source_no":14,"q":"Hành vi xâm phạm nhân phẩm, danh dự của con người là?","o":["Làm cho người đó bị xúc phạm, tổn thương về tinh thần và xấu hổ.","Xâm phạm quyền được tôn trọng và bảo vệ về nhân phẩm, danh dự người khác.","Xâm phạm về nhân phẩm, danh dự được pháp luật bảo vệ.","Hành vi nguy hiểm cho xã hội được quy định trong Bộ luật hình sự sửa đổi, bổ sung năm 2017."],"a":"A","id":"b5q14_129"},{"lesson":5,"source_no":15,"q":"Khi thực hiện hành vi vu khống hoặc làm nhục người khác mà sử dụng mạng máy tính, mạng viễn thông, phương tiện điện tử (như Facebook, TikTok, Zalo) làm công cụ phát tán, khung hình phạt sẽ thay đổi như thế nào?","o":["Được giảm nhẹ hình phạt vì chỉ là hành vi ảo trên mạng xã hội.","Không thay đổi so với việc vi phạm ngoài đời thực.","Là tình tiết định khung tăng nặng, đối mặt với mức hình phạt nghiêm khắc hơn do tốc độ phát tán và mức độ tổn thương diện rộng.","Chỉ bị xử phạt hành chính nhẹ bằng hình thức nhắc nhở, khóa tài khoản."],"a":"C","id":"b5q15_130"},{"lesson":5,"source_no":16,"q":"Để tự bảo vệ mình và phòng ngừa tối đa việc bị các đối tượng xấu lợi dụng, bôi nhọ danh dự, nhân phẩm trên không gian mạng, sinh viên không nên làm điều nào sau đây?","o":["Tự ý đăng tải, chia sẻ các hình ảnh nhạy cảm, thông tin cá nhân chi tiết hoặc các phát ngôn mang tính kích động, xúc phạm người khác lên trang cá nhân.","Cài đặt các chế độ bảo mật hai lớp (2FA) và hạn chế quyền xem thông tin cá nhân từ những tài khoản lạ trên các nền tảng mạng xã hội.","Tìm hiểu và trang bị cho bản thân các kiến thức pháp luật cơ bản về Luật An ninh mạng và các chế tài xử lý hành vi vu khống, làm nhục người khác.","Kịp thời thông báo cho nhà trường, gia đình hoặc cơ quan Công an khi phát hiện tài khoản cá nhân bị giả mạo hoặc bị bôi nhọ danh dự."],"a":"A","id":"b5q16_131"},{"lesson":5,"source_no":17,"q":"Hành vi nào sau đây cấu thành Tội làm nhục người khác theo quy định của Bộ luật Hình sự?","o":["Bịa đặt và loan truyền thông tin sai sự thật rằng đồng nghiệp nhận hối lộ nhằm mục đích hạ uy tín của người đó.","Sử dụng lời nói thô tục, chửi bới công khai hoặc đăng hình ảnh nhạy cảm nhằm hạ nhân cách, gây tổn thương tinh thần sâu sắc cho nạn nhân.","Nghi ngờ hàng xóm trộm cắp tài sản nên đã viết đơn trình báo gửi cơ quan Công an đề nghị điều tra, làm rõ sự việc.","Vô ý kể lại một câu chuyện đùa vui đời tư của bạn bè trong buổi tiệc khiến người đó cảm thấy ngượng ngùng trước đám đông."],"a":"B","id":"b5q17_132"},{"lesson":5,"source_no":18,"q":"Khi phát hiện mình bị một nhóm đối tượng lập group “Anti” (tẩy chay), cắt ghép hình ảnh sai sự thật nhằm xúc phạm nghiêm trọng đến uy tín, nhân phẩm, sinh viên cần có nhận thức và cách xử lý đúng đắn nào?","o":["Im lặng chịu đựng, tự cô lập bản thân và không dám chia sẻ với bất kỳ ai.","Lập tức nhắn tin chửi bới, đe dọa đánh trả hoặc thuê người đến hành hung đối tượng.","Chụp ảnh màn hình, lưu lại các liên kết (link) làm bằng chứng; thông báo ngay cho gia đình, nhà trường và làm đơn trình báo cơ quan Công an.","Đăng bài viết thừa nhận mọi lời xúc phạm dù bản thân không làm việc đó để mọi chuyện nhanh qua đi."],"a":"C","id":"b5q18_133"},{"lesson":5,"source_no":19,"q":"“Thường xuyên tuyên truyền, vận động quần chúng nhân dân trong đấu tranh, phòng, chống tội xâm phạm nhân phẩm, danh dự của con người” là trách nhiệm của?","o":["Cấp ủy Đảng và chính quyền.","Cơ quan chức năng.","Quần chúng nhân dân.","Đoàn thể ở địa phương."],"a":"A","id":"b5q19_134"},{"lesson":5,"source_no":20,"q":"Tự giác chấp hành các quy định về phòng, chống các tội xâm phạm nhân phẩm, danh dự con người ở nhà trường và địa phương nơi cư trú là?","o":["Vai trò, trách nhiệm của sinh viên.","Phương hướng, nhiệm vụ của sinh viên.","Thái độ, nghĩa vụ của sinh viên.","Mục đích, yêu cầu của sinh viên."],"a":"A","id":"b5q20_135"},{"lesson":5,"source_no":21,"q":"Đặc trưng cốt lõi nhất để phân biệt tội có địa điểm bí mật với tội xâm phạm danh dự, nhân phẩm?","o":["Địa điểm thực hiện hành vi phạm tội.","Địa điểm thực hiện hành vi phạm tội công khai hay bí mật.","Hành vi bịa đặt, loan truyền những điều biết rõ là sai sự thật hoặc bịa đặt người khác phạm tội.","Độ tuổi của người thực hiện hành vi phạm tội."],"a":"C","id":"b5q21_136"},{"lesson":5,"source_no":22,"q":"Hành vi tham gia bình luận hùa theo, chia sẻ các bài viết bôi nhọ, xúc phạm danh dự một người bạn trong trường khi chưa kiểm chứng thông tin bị nhìn nhận như thế nào dưới góc độ pháp lý theo Bộ luật hình sự sửa đổi năm 2017 tới?","o":["Là hành vi vô hại vì mình không phải là người trực tiếp viết bài.","Là hành vi tiếp tay cho cái xấu, lan truyền thông tin độc hại và có thể bị xử lý kỷ luật hoặc xử phạt hành chính về hành vi cung cấp, chia sẻ thông tin xúc phạm uy tín cá nhân.","Được khuyến khích để tăng tương tác và giúp bạn bè trong lớp giải tỏa căng thẳng.","Chỉ là trò đùa nghịch ngợm thông thường của lứa tuổi học sinh, không vi phạm gì."],"a":"B","id":"b5q22_137"},{"lesson":5,"source_no":23,"q":"Nội dung nào sau đây phản ánh đúng biện pháp phòng, chống tội phạm xâm hại danh dự nhân phẩm của sinh viên trong nhà trường?","o":["Tổ chức các buổi chuyên đề giáo dục kỹ năng sống, phổ biến pháp luật và xây dựng bộ quy tắc ứng xử văn hóa học đường.","Cung cấp số sinh viên có biểu hiện nghi vấn hoạt động phạm tội cho lực lượng công an xử lý.","Đấu tranh xóa bỏ các tụ điểm hoạt động tệ nạn xã hội ở khu vực xung quanh trường.","Tổ chức các bộ phận giám sát mọi phát ngôn và hành vi của sinh viên."],"a":"A","id":"b5q23_138"},{"lesson":5,"source_no":24,"q":"Nguyên nhân chủ quan nào dưới đây dẫn đến việc gia tăng tội phạm làm nhục, vu khống người khác trên mạng xã hội hiện nay?","o":["Hệ thống đường truyền internet quốc gia thường xuyên bị gián đoạn.","Ý thức pháp luật kém, sự lệch lạc về đạo đức, lối sống ích kỷ và bốc đồng của người phạm tội.","Do nạn nhân không chủ động cài đặt mật khẩu bảo vệ tài khoản cá nhân.","Do các trường học không tổ chức các câu lạc bộ tin học cho sinh viên."],"a":"B","id":"b5q24_139"},{"lesson":5,"source_no":25,"q":"Đâu là một trong những nguyên nhân khách quan tác động đến tình trạng tội phạm xâm hại danh dự, nhân phẩm?","o":["Mặt trái của mạng xã hội, sự xâm nhập của lối sống thực dụng và các sản phẩm văn hóa độc hại.","Sự thiếu kiềm chế khả năng tự chủ và tâm lý ghen tuông của bản thân đối tượng.","Việc Nhà nước tăng mức xử phạt tiền đối với các hành vi vi phạm hành chính.","Do thời tiết thay đổi thất thường tác động đến tâm lý người dân."],"a":"A","id":"b5q25_140"}]},{"id":6,"title":"An toàn thông tin và phòng, chống vi phạm pháp luật trên không gian mạng","questions":[{"lesson":6,"source_no":1,"q":"Theo Luật An ninh mạng Việt Nam năm 2025, “Không gian mạng” được định nghĩa là môi trường nào sau đây?","o":["Là mạng lưới toàn cầu của các máy tính được kết nối bằng đa cấp đồng để truyền nhận dữ liệu Internet.","Là môi trường nhân tạo được tạo ra bởi hệ thống các mạng, hệ thống máy tính, hệ thống viễn thông, mạng Internet để con người thực hiện các hành vi xã hội.","Là một khoảng không gian ảo nằm ngoài hành tinh dành cho các hoạt động truyền hình vệ tinh, khoa học.","Là một khoảng không gian ảo nằm ngoài khu lưu trữ quyền dữ liệu phục vụ riêng cho Bộ tư lệnh tác chiến không gian mạng."],"a":"B","id":"b6q1_141"},{"lesson":6,"source_no":2,"q":"Hành vi thu thập, sử dụng thông tin cá nhân của người khác trên mạng mà không được sự đồng ý, có thể bị xử lý phạt như thế nào?","o":["Phạt tiền từ 60.000.000 đồng đến 200.000.000 đồng đối với cá nhân, tổ chức sử dụng","Chịu hình phạt cải tạo không giam giữ hoặc phạt tù","Không bị xử lý nếu mục đích thu thập là vì sở thích cá nhân","Không có quy định xử phạt"],"a":"B","id":"b6q2_142"},{"lesson":6,"source_no":3,"q":"Bảo vệ an ninh mạng là?","o":["Phòng ngừa, phát hiện, ngăn chặn, xử lý hành vi xâm phạm an ninh mạng","Phòng ngừa, phát hiện, ngăn chặn hành vi xâm phạm an ninh mạng","Điều tra, xử lý hành vi xâm phạm an ninh mạng","Ngăn chặn, bảo vệ an ninh mạng"],"a":"A","id":"b6q3_143"},{"lesson":6,"source_no":4,"q":"Lợi ích của nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân là?","o":["An ninh mạng","An ninh quốc gia","Trật tự an toàn xã hội","Lợi ích của các tổ chức chính trị, xã hội"],"a":"A","id":"b6q4_144"},{"lesson":6,"source_no":5,"q":"Trong cuộc cách mạng công nghiệp 4.0 thì thông tin được xem là?","o":["Một dạng tài nguyên","Một dạng tài sản của từng cá nhân","Một dạng tài sản nhà nước quản lý","Không gian lưu trữ số liệu"],"a":"A","id":"b6q5_145"},{"lesson":6,"source_no":6,"q":"“Lừa đảo chiếm đoạt tài sản” được gọi tắt là từ “phòng Hỗ trợ CNTT” nội bộ, yêu cầu cung cấp ngay mã OTP vừa gửi về điện thoại với lý do phải xác thực gấp tài khoản để tránh bị khóa. Xử lý nào sau đây thể hiện rõ nguyên tắc về tính bảo mật thông tin?","o":["Cung cấp ngay mã OTP vì người gọi tự xưng là phòng hỗ trợ","Yêu cầu người gọi gửi email nội bộ xác nhận rồi mới cung cấp mã OTP qua điện thoại","Từ chối cung cấp mã OTP, ngắt máy và chủ động liên hệ lại với bộ phận CNTT qua kênh liên lạc chính thức đã được công bố","Làm theo hướng dẫn nhưng đổi một ký tự trong mã OTP để thử phản ứng của người gọi"],"a":"C","id":"b6q6_146"},{"lesson":6,"source_no":7,"q":"Dưới góc độ pháp lý một trong những yếu tố góp phần làm giảm các vụ tin tặc tấn công mạng trong thời gian qua là do?","o":["Các trung tâm chính trị, kinh tế","Các khu công nghiệp tập trung","Các trung tâm văn hóa, khoa học","Các khu công nghệ kỹ thuật cao"],"a":"A","id":"b6q7_147"},{"lesson":6,"source_no":8,"q":"Khi điểm không nằm trong dãy tổ chức định bậc trực tuyến, hoặc một trang web có hình vi lừa đảo chiếm đoạt tài sản quy mô lớn trên không gian mạng, sinh viên cần báo cáo đến cơ quan nào sau đây?","o":["Đăng bài tố phát hiện các tội phạm mạng xã hội để tự xử lý","Báo ngay đến cơ quan Công an nơi gần nhất, không tự ý tham gia sử dụng công nghệ cao (Bộ Công an) hoặc cơ quan chức năng","Các cơ quan quản lý trực tuyến","Các diễn đàn công nghệ của các doanh nghiệp tư nhân"],"a":"B","id":"b6q8_148"},{"lesson":6,"source_no":9,"q":"Hiện nay, các đối tượng tạo ra hàng ngàn số điện thoại giả bằng cách sử dụng công nghệ để?","o":["Giả tiếng, giả hình, giả video","Giả lý lịch","Chiếm đoạt tài sản","Tạo tài khoản giả"],"a":"A","id":"b6q9_149"},{"lesson":6,"source_no":10,"q":"Khái niệm khủng bố mạng được hiểu như thế nào là đúng nhất?","o":["Là hành vi sử dụng không gian mạng, công nghệ thông tin hoặc thiết bị điện tử để thực hiện các hoạt động phá hoại, đe dọa hoặc gây hoang mang nhằm mục đích chính trị, xã hội.","Là hành vi chiếm đoạt tài sản qua mạng.","Là hành vi đưa thông tin sai sự thật.","Là hành vi sử dụng mạng xã hội để quảng cáo trái phép."],"a":"A","id":"b6q10_150"},{"lesson":6,"source_no":11,"q":"Theo Luật An ninh mạng, “Không gian mạng quốc gia” được xác định là gì?","o":["Là không gian do quân đội quản lý để đảm bảo an ninh quốc gia, trật tự an toàn xã hội.","Là không gian mạng do Chính phủ xác lập, quản lý và kiểm soát.","Là mạng diện rộng do Bộ Quốc phòng quản lý.","Là toàn bộ hạ tầng Internet thuộc sở hữu tư nhân."],"a":"B","id":"b6q11_151"},{"lesson":6,"source_no":12,"q":"Công nghệ AI được sử dụng trong các trường hợp nào?","o":["Tự động hóa quy trình chăm sóc khách hàng trực tuyến bằng các chatbot sử dụng công nghệ AI.","Sử dụng trí tuệ nhân tạo hoặc công nghệ mới để giả mạo video, hình ảnh, giọng nói của người khác nhằm mục đích lừa đảo hoặc truyền tải nội dung sai lệch.","Ứng dụng trí tuệ nhân tạo vào việc phân tích dữ liệu thị trường và dự báo thời tiết.","Tự động hóa quy trình chăm sóc khách hàng trực tuyến bằng các chatbot sử dụng công nghệ AI."],"a":"B","id":"b6q12_152"},{"lesson":6,"source_no":13,"q":"Theo Luật An ninh mạng, nội dung nào sau đây xác định đúng các loại thông tin có nội dung làm nhục, vu khống trên không gian mạng?","o":["Vu khống, xúc phạm uy tín, danh dự của người khác","Bịa đặt thông tin về người khác","Đăng tải nội dung xuyên tạc","Tất cả các nội dung trên"],"a":"B","id":"b6q13_153"},{"lesson":6,"source_no":14,"q":"Một trong những thủ đoạn phổ biến mà các đối tượng lừa đảo thường sử dụng không gian mạng nhằm chiếm đoạt tài sản gồm?","o":["Mạo danh cơ quan nhà nước, công an, viện kiểm sát","Bạo lực mạng","Yêu cầu báo về an ninh mạng","Biện pháp bảo vệ an ninh mạng"],"a":"A","id":"b6q14_154"},{"lesson":6,"source_no":15,"q":"Khi phát hiện có dấu hiệu liên quan đến bảo vệ an ninh mạng, nguy cơ đe dọa an ninh mạng, hành vi xâm phạm an ninh mạng thì cơ quan có thẩm quyền, lực lượng chuyên trách bảo vệ an ninh mạng sẽ thực hiện?","o":["Thực hiện các biện pháp bảo vệ an ninh mạng","Biện pháp của cơ quan, tổ chức, cá nhân sử dụng không gian mạng","Nguyên tắc của cơ quan, tổ chức, cá nhân sử dụng không gian mạng","Yêu cầu"],"a":"A","id":"b6q15_155"},{"lesson":6,"source_no":16,"q":"An toàn thông tin mạng duy trì các tính thuộc tính của thông tin trong lưu trữ, xử lý và truyền đưa trên mạng để đảm bảo?","o":["Tính bí mật, tính toàn vẹn và tính khả dụng","Tính bí mật, tính toàn vẹn và tính khả dụng","Tính bảo mật, tính toàn vẹn và tính khả dụng","Tính độc quyền, tính nguyên bản và tính pháp lý"],"a":"B","id":"b6q16_156"},{"lesson":6,"source_no":17,"q":"Điều nào trong những quyền của công dân trong lĩnh vực an ninh mạng?","o":["Sử dụng mạng xã hội để thông tin về các hành vi vi phạm pháp luật","Được quyền yêu cầu xóa thông tin cá nhân của mình trong mọi trường hợp","Được tự do đăng tải mọi thông tin không cần chịu trách nhiệm","Được quyền truy cập trái phép vào hệ thống để kiểm tra an ninh"],"a":"A","id":"b6q17_157"},{"lesson":6,"source_no":18,"q":"Tôn giáo có thể gây ra tình trạng gì?","o":["Xung đột, mâu thuẫn tôn giáo","Hòa bình, ổn định xã hội","Phát triển khoa học kỹ thuật","Tăng trưởng kinh tế"],"a":"A","id":"b6q18_158"},{"lesson":6,"source_no":19,"q":"Khi phát hiện các thông tin trên không gian mạng có nội dung xuyên tạc lịch sử, xúc phạm uy tín của cơ quan, tổ chức hoặc danh dự của cá nhân, sinh viên cần làm gì để thể hiện trách nhiệm của mình?","o":["Chia sẻ (Share) rộng rãi để bạn bè cùng vào bình luận phản bác.","Giữ im lặng, coi như không thấy để tránh phiền phức cho bản thân.","Không chia sẻ, không bình luận cổ súy; đồng thời phản ánh ngay với cơ quan chức năng hoặc báo cáo (Report) vi phạm trên nền tảng mạng xã hội.","Sao chép lại nội dung đó và đăng tải sang một hội nhóm khác để tranh luận."],"a":"C","id":"b6q19_159"},{"lesson":6,"source_no":20,"q":"Đâu là thủ đoạn tinh vi thường được tội phạm mạng sử dụng để chiếm đoạt thông tin đăng nhập ngân hàng (OTP, mật khẩu) của người dùng?","o":["Gửi email chứa liên kết giả mạo giao diện ngân hàng (Phishing) dụ người dùng đăng nhập để nhận thưởng hoặc xử lý sự cố.","Gọi điện thoại thông báo trúng thưởng công khai trên hệ thống phát thanh truyền hình quốc gia.","Gửi thư bưu điện yêu cầu người dùng xác nhận thông tin tài khoản bằng chữ ký tay.","Tự động nâng cấp hạn mức thẻ tín dụng trực tiếp tại quầy giao dịch của ngân hàng."],"a":"A","id":"b6q20_160"},{"lesson":6,"source_no":21,"q":"Theo quy định của pháp luật, an toàn thông tin mạng là sự bảo vệ thông tin và hệ thống thông tin trên mạng tránh khỏi điều gì?","o":["Tránh bị truy nhập, sử dụng, tiết lộ, gián đoạn, sửa đổi hoặc phá hoại trái phép.","Tránh bị nhiễu sóng điện từ và hư hỏng phần cứng do thời tiết.","Tránh bị rò rỉ thông tin ra nước ngoài thông qua văn bản giấy.","Tránh bị người dùng quên mật khẩu đăng nhập."],"a":"A","id":"b6q21_161"},{"lesson":6,"source_no":22,"q":"Khái niệm tội phạm mạng được hiểu như thế nào là đúng nhất dưới góc độ pháp lý?","o":["Là việc sử dụng không gian mạng để thực hiện hành vi bạo loạn, lật đổ chính quyền nhân dân, đe dọa an ninh quốc gia.","Là hành vi sử dụng không gian mạng, công nghệ thông tin hoặc phương tiện điện tử để thực hiện tội phạm được quy định trong Bộ luật Hình sự.","Là mọi hành vi truy cập vào các trang web nước ngoài không được Nhà nước cấp phép hoạt động tại Việt Nam.","Là các lỗi làm rò rỉ dữ liệu cá nhân của nhà quản lý."],"a":"B","id":"b6q22_162"},{"lesson":6,"source_no":23,"q":"Khái niệm tấn công mạng được hiểu như thế nào là đúng nhất?","o":["Là hành vi sử dụng các công cụ truyền thông trực tuyến để liên tục gửi tin nhắn spam, đe dọa vũ lực đối với một cá nhân trên mạng xã hội.","Là việc sử dụng không gian mạng, thiết bị công nghệ hoặc phương tiện điện tử xâm nhập, chiếm quyền điều khiển, làm gián đoạn, ngưng trệ, làm sai lệch hoặc phá hoại hệ thống thông tin.","Là hành vi vô ý hoặc cố ý làm hỏng hóc thiết bị phần cứng tại trung tâm dữ liệu dẫn đến gián đoạn kết nối Internet.","Là hành vi đăng tải các bài viết thể hiện sự bất đồng quan điểm trên không gian mạng."],"a":"B","id":"b6q23_163"},{"lesson":6,"source_no":24,"q":"Bản chất của công tác đảm bảo an toàn thông tin là sự tổng hòa của những yếu tố nào?","o":["Chỉ các phần mềm diệt virus độc quyền.","Biện pháp kỹ thuật, quy trình quản lý và nhận thức con người.","Các quy định xử phạt vi phạm hành chính của nhà nước.","Phần cứng máy tính cấu hình mạnh."],"a":"B","id":"b6q24_164"},{"lesson":6,"source_no":25,"q":"Biện pháp nào giúp hạn chế việc lộ lọt thông tin cá nhân dẫn đến việc bị các đối tượng lừa đảo, ép nợ hoặc đe dọa?","o":["Công khai điểm công ty, số điện thoại và địa chỉ nhà lên các bài viết công khai trên Facebook.","Không tự ý cung cấp thông tin cá nhân trên các trang web lạ; hạn chế tham gia các minigame trúng thưởng yêu cầu điền thông tin chi tiết.","Không cho người lạ mượn điện thoại hoặc chụp ảnh hai mặt thẻ ngân hàng gửi qua tin nhắn mạng xã hội.","Không đăng ảnh hộ chiếu, vé máy bay còn nguyên mã vạch (barcode) lên mạng để check-in."],"a":"B","id":"b6q25_165"},{"lesson":6,"source_no":26,"q":"Sinh viên có thể tham gia vào công tác phòng, chống vi phạm pháp luật trên không gian mạng bằng hình thức thiết thực nào?","o":["Tự xây dựng các phần mềm tấn công lại các tài khoản lừa đảo.","Tích cực tham gia các buổi tuyên truyền phổ biến pháp luật (Luật An ninh mạng, Luật Bảo vệ dữ liệu cá nhân), nâng cao kỹ năng số và ứng xử văn minh trên mạng.","Tố giác các hành vi lừa đảo trực tuyến với cơ quan chức năng.","Không tải và sử dụng các công cụ ẩn danh để truy cập vào các trang web đen bị cấm."],"a":"B","id":"b6q26_166"},{"lesson":6,"source_no":27,"q":"“Tính khả dụng” (Availability) trong an toàn thông tin mạng thể hiện điều gì?","o":["Hệ thống và dữ liệu luôn sẵn sàng cho người dùng hợp pháp sử dụng khi có nhu cầu.","Người dùng có thể tự do thay đổi quyền hạn của hệ thống.","Mạng Internet không bao giờ bị cắt.","Phần mềm luôn tự động cập nhật phiên bản mới nhất."],"a":"A","id":"b6q27_167"},{"lesson":6,"source_no":28,"q":"Công nghệ Deepfake có thể được các đối tượng sử dụng vào mục đích nào sau đây?","o":["Giả mạo hình ảnh và giọng nói của người thân hoặc lãnh đạo cơ quan để lừa đảo chuyển tiền.","Tạo ra các video giải trí để câu view trên mạng xã hội công cộng.","Đột nhập trực tiếp vào hệ thống cơ sở dữ liệu quốc gia bằng sinh trắc học giả.","Tăng tốc độ đường truyền Internet khi tiến hành các cuộc tấn công DDoS."],"a":"A","id":"b6q28_168"},{"lesson":6,"source_no":29,"q":"Văn bản pháp lý nào sau đây là cơ sở pháp lý nền tảng, trực tiếp nhất để xác định các hành vi bị nghiêm cấm và các biện pháp bảo vệ an ninh mạng tại Việt Nam?","o":["Bộ luật Dân sự và các văn bản hướng dẫn thi hành về quyền nhân thân.","Luật An ninh mạng và Luật An toàn thông tin mạng.","Luật Cạnh tranh và các quy định về độc quyền doanh nghiệp viễn thông.","Luật Bưu chính và các quy định về quản lý bưu phẩm quốc tế."],"a":"B","id":"b6q29_169"},{"lesson":6,"source_no":30,"q":"Hành vi nào sau đây bị nghiêm cấm trên không gian mạng theo quy định của pháp luật Việt Nam?","o":["Đăng tải ý kiến đóng góp xây dựng chính sách pháp luật trên trang web chính phủ.","Sử dụng không gian mạng để thông tin sai sự thật gây hoang mang trong nhân dân, gây thiệt hại cho hoạt động kinh tế - xã hội.","Tham gia các khóa học trực tuyến do các trường đại học uy tín tổ chức.","Chia sẻ hình ảnh phong cảnh quê hương đất nước lên trang cá nhân."],"a":"B","id":"b6q30_170"},{"lesson":6,"source_no":31,"q":"Việc tạo tài khoản mạng xã hội giả mạo tên, hình ảnh của người khác nhằm mục đích lừa đảo, chiếm đoạt tài sản được cấu thành tội danh gì trong Bộ luật Hình sự?","o":["Tội vô ý làm lộ thông tin bí mật cá nhân.","Tội sử dụng mạng máy tính, mạng viễn thông, phương tiện điện tử để thực hiện hành vi chiếm đoạt tài sản.","Tội vi phạm quy định về bản quyền hình ảnh cá nhân.","Tội truy cập bất hợp pháp vào phòng máy chủ vật lý."],"a":"B","id":"b6q31_171"},{"lesson":6,"source_no":32,"q":"Hành vi cố ý phát tán chương trình tin học gây hại (mã độc, virus, trojan) vào hệ thống thông tin của cơ quan Nhà nước nhằm phá hoại hoặc đánh cắp tài liệu mật sẽ bị xử lý như thế nào?","o":["Chỉ bị nhắc nhở và khóa tài khoản email tạm thời.","Bị xử phạt vi phạm hành chính.","Bị truy cứu trách nhiệm hình sự theo các tội danh liên quan đến an toàn thông tin, an ninh mạng.","Được miễn trừ trách nhiệm nếu là sinh viên."],"a":"C","id":"b6q32_172"},{"lesson":6,"source_no":33,"q":"Khi phát hiện một bài viết hoặc video có nội dung xúc phạm danh dự, nhân phẩm của bản thân hoặc người khác trên không gian mạng, sinh viên không nên làm điều nào sau đây?","o":["Lưu lại bằng chứng (hình ảnh, video, liên kết) để cung cấp cho cơ quan chức năng khi cần.","Báo cáo bài viết vi phạm (Report) lên nền tảng mạng xã hội đó.","Kêu gọi bạn bè lập hội nhóm để nhắn tin chửi bới, đe dọa hoặc tấn công mạng lại kẻ vi phạm.","Gửi đơn phản ánh, tố giác đến cơ quan Công an hoặc Cục An toàn thông tin."],"a":"C","id":"b6q33_173"},{"lesson":6,"source_no":34,"q":"Hành vi nào sau đây vi phạm Luật Sở hữu trí tuệ trên không gian mạng?","o":["Trích dẫn một đoạn văn ngắn trong bài báo mạng và có ghi rõ nguồn, tên tác giả.","Tự ý tải phim chiếu rạp, bài hát có bản quyền rồi đăng tải lại (re-up) lên YouTube để kiếm tiền khi chưa được phép.","Mua tài khoản xem phim trực tuyến chính thức từ nhà phát hành.","Tự sáng tác hình ảnh và đăng tải lên trang cá nhân của mình."],"a":"B","id":"b6q34_174"},{"lesson":6,"source_no":35,"q":"Việc tham gia các trò chơi đổi thưởng (game bài, cá độ bóng đá) ăn tiền trực tiếp qua các ứng dụng hoặc trang web trên mạng Internet bị pháp luật Việt Nam nhìn nhận như thế nào?","o":["Là hành vi giải trí hợp pháp nếu số tiền cá cược dưới 1 triệu đồng.","Là hành vi vi phạm pháp luật (có thể bị xử phạt hành chính hoặc xử lý hình sự về tội đánh bạc/tổ chức đánh bạc).","Là mô hình kinh doanh công nghệ được nhà nước khuyến khích phát triển.","Chỉ là trò chơi ảo, không tính là hành vi vi phạm pháp luật ngoài đời thực."],"a":"B","id":"b6q35_175"},{"lesson":6,"source_no":36,"q":"Nội dung nào sau đây phản ánh đúng biện pháp nghiệp vụ, kỹ thuật trong công tác đấu tranh phòng, chống vi phạm pháp luật trên không gian mạng?","o":["Tuyên truyền, phổ biến các quy định của Luật An ninh mạng rộng rãi đến toàn thể nhân dân.","Phạt tiền từ 10 triệu đến 20 triệu đồng đối với các tổ chức có hành vi tung tin giả lên mạng xã hội.","Khởi tố vụ án hình sự, điều tra và xét xử nghiêm minh các đối tượng lừa đảo chiếm đoạt tài sản qua mạng.","Tiến hành giám sát, kiểm tra an ninh mạng và áp dụng các công nghệ chặn lọc, gỡ bỏ thông tin độc hại."],"a":"D","id":"b6q36_176"},{"lesson":6,"source_no":37,"q":"Một tài khoản lạ trên mạng xã hội chủ động kết bạn với sinh viên, tự xưng là đại diện của một quỹ học bổng quốc tế và đề nghị sinh viên cung cấp bản quét (scan) thẻ sinh viên, danh sách đề tài nghiên cứu của khoa, kèm theo sơ đồ tổ chức nội bộ của trường để “xét duyệt tài trợ”. Sinh viên cần xử lý tình huống như thế nào?","o":["Cung cấp ngay vì đây là cơ hội hiếm có để nhận học bổng quốc tế và giúp quảng bá hình ảnh của nhà trường ra thế giới.","Chỉ cung cấp sơ đồ tổ chức nội bộ và thẻ sinh viên cá nhân, còn danh sách tài liệu nghiên cứu thì từ chối vì lý do bản quyền.","Cảnh giác trước thủ đoạn thu thập thông tin, gián điệp mạng núp bóng tài trợ; từ chối cung cấp dữ liệu nội bộ và báo cáo sự việc với phòng công tác sinh viên hoặc cơ quan chức năng để xác minh.","Chuyển tiếp lời mời này cho tất cả các bạn trong lớp cùng gửi thông tin cá nhân để tăng tỷ lệ nhận được học bổng chế tập thể."],"a":"C","id":"b6q37_177"},{"lesson":6,"source_no":38,"q":"Khi phát hiện một trang Fanpage mạng xã hội liên tục đăng tải các bài viết sử dụng công nghệ Deepfake để giả mạo hình ảnh lãnh đạo Đảng, Nhà nước nhằm xuyên tạc lịch sử, sinh viên nên thực hiện trách nhiệm đấu tranh trên không gian mạng bằng cách nào dưới đây là hiệu quả và đúng pháp luật nhất?","o":["Sử dụng các tài khoản ảo cá nhân để vào bình luận đe dọa hoặc dùng công cụ tấn công từ chối dịch vụ (DDoS) để đánh sập trang Fanpage đó.","Không làm gì cả vì việc tranh luận trên mạng chỉ làm mất thời gian, đồng thời việc đã có lực lượng an ninh mạng chuyên trách xử lý.","Sử dụng tính năng báo cáo vi phạm (Report) của nền tảng mạng xã hội về hành vi lan truyền thông tin giả mạo/thao túng chính trị; đồng thời cung cấp đường link cho cơ quan chức năng hoặc ban truyền thông của trường để định hướng thông tin dư luận lành mạnh.","Tải các video giả mạo đó về máy, chỉnh sửa chèn thêm nhạc hài hước rồi đăng lại lên kênh cá nhân của mình để châm biếm đối tượng thù địch."],"a":"C","id":"b6q38_178"},{"lesson":6,"source_no":39,"q":"Khi tham gia các hội nhóm học tập trên mạng, hành vi nào sau đây của sinh viên vi phạm các quy định v
