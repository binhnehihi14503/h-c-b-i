const DATA={"hp1":[{"id":1,"title":"ĐỐI TƯỢNG, NHIỆM VỤ VÀ PHƯƠNG PHÁP NGHIÊN CỨU MÔN HỌC GIÁO DỤC QUỐC PHÒNG VÀ AN NINH","questions":[{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Bài 1 ĐỐI TƯỢNG, NHIỆM VỤ VÀ PHƯƠNG PHÁP NGHIÊN CỨU MÔN HỌC GIÁO DỤC …”","o":["luyện quân sự phổ thông (1961)","luật về người khuyết tật","QUỐC PHÒNG VÀ AN NINH ----- A","quốc phòng an ninh"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Bài 1 ĐỐI TƯỢNG, NHIỆM VỤ VÀ PHƯƠNG PHÁP NGHIÊN CỨU MÔN HỌC GIÁO DỤC QUỐC PHÒNG VÀ AN NINH ----- A."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Yêu cầu: Sinh viên xác định trách nhiệm, thái độ đúng trong học tập môn học giáo dục quốc phòng và an ninh, tích cực tham gia xây dựng, củng cố nền quốc phòng toàn dân, an ninh nhân dân ngay khi đang học tập …” là gì?","o":["Đảng và những vấn đề khác của giáo dục quốc phòng và an ninh","rèn luyện trong nhà trường và ở mỗi vị trí công tác tiếp theo","khối lượng học tập, xét học bổng, xét tốt nghiệp và được ghi vào","sự nghiệp xây dựng và bảo vệ Tổ quốc trong giai đoạn hiện nay"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Yêu cầu: Sinh viên xác định trách nhiệm, thái độ đúng trong học tập môn học giáo dục quốc phòng và an ninh, tích cực tham gia xây dựng, củng cố nền quốc phòng toàn dân, an ninh nhân dân ngay khi đang học tập, rèn luyện trong nhà trường và ở mỗi vị trí công tác tiếp theo."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “xây dựng lòng yêu nước, yêu chủ nghĩa xã hội, lòng tự …”?","o":["phòng và an ninh","nội vụ trong doanh trại","DỤC QUỐC PHÒNG VÀ AN NINH 1","hào, tự tôn dân tộc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: xây dựng lòng yêu nước, yêu chủ nghĩa xã hội, lòng tự hào, tự tôn dân tộc;"},{"q":"Chọn phương án nối tiếp đúng nội dung: “Với tiếp cận là quá trình sư phạm tổng thể, giáo dục quốc phòng và an ninh bao gồm hai quá trình bộ phận cấu thành, đó là: Quá trình …”","o":["các đối tượng theo quy định của thông tư này","có giấy xác nhận của bệnh viện nơi học sinh, sinh viên điều trị","an ninh chính trị và bảo đảm trật tự, an toàn xã hội","dạy học và quá trình giáo dục, trải nghiệm quân sự, an ninh"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Với tiếp cận là quá trình sư phạm tổng thể, giáo dục quốc phòng và an ninh bao gồm hai quá trình bộ phận cấu thành, đó là: Quá trình dạy học và quá trình giáo dục, trải nghiệm quân sự, an ninh."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Hai quá trình đó có mối liên hệ biện chứng, tác động hỗ trợ lẫn nhau trong một thể thống nhất nhằm …” được hoàn thiện như thế nào?","o":["vấn đề về nguyên lý","quốc gia và bảo đảm trật tự","thực hiện mục tiêu giáo dục đã xác định","kỹ chiến thuật của các loại binh khí, kỹ thuật"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Hai quá trình đó có mối liên hệ biện chứng, tác động hỗ trợ lẫn nhau trong một thể thống nhất nhằm thực hiện mục tiêu giáo dục đã xác định."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “với chức năng trội nhằm trang bị hệ thống kiến thức, kỹ xảo, kỹ năng, phát triển tư duy sáng tạo, hình …”","o":["thành năng lực quân sự cho học sinh, sinh viên","đối tượng giáo dục và chức năng trội của mỗi quá trình","thai sản theo quy định hiện hành","trong giảng dạy nâng cao chất lượng học tập"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: với chức năng trội nhằm trang bị hệ thống kiến thức, kỹ xảo, kỹ năng, phát triển tư duy sáng tạo, hình thành năng lực quân sự cho học sinh, sinh viên."},{"q":"Phương án nào điền đúng vào chỗ trống: “phối hợp thống nhất giữa hoạt động của nhà giáo dục (giảng viên, giáo viên, cán bộ quản lý) và …”?","o":["đối tượng giáo dục (học sinh, sinh viên)","có tổ chức, có kế hoạch","phòng và an ninh","hệ biện chứng tác động lẫn nhau gồm: Mục tiêu, yêu cầu"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: phối hợp thống nhất giữa hoạt động của nhà giáo dục (giảng viên, giáo viên, cán bộ quản lý) và đối tượng giáo dục (học sinh, sinh viên);"},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “6 Quá trình dạy học và quá trình giáo dục trải nghiệm quân sự, an ninh đều chứa được cấu thành từ các yếu tố trong mối quan …”?","o":["hệ biện chứng tác động lẫn nhau gồm: Mục tiêu, yêu cầu","học tập trên lớp đối với tất cả các học phần","(2000) và nghị định của chính phủ về giáo dục quốc phòng năm 2007","động giáo dục quốc phòng và an ninh cho học sinh, sinh viên"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: 6 Quá trình dạy học và quá trình giáo dục trải nghiệm quân sự, an ninh đều chứa được cấu thành từ các yếu tố trong mối quan hệ biện chứng tác động lẫn nhau gồm: Mục tiêu, yêu cầu;"},{"q":"Theo giáo trình, ý “Tuy nhiên, giữa dạy học và giáo dục trải nghiệm quân sự, an ninh …” kết thúc bằng nội dung nào?","o":["pháp nghiên cứu khác như: Phương pháp quan sát","các quan điểm khoa học sau đây","có những đặc điểm khác nhau","chiến thuật quân sự Việt Nam, điều lệnh Quân đội"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Tuy nhiên, giữa dạy học và giáo dục trải nghiệm quân sự, an ninh có những đặc điểm khác nhau."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Đối tượng nghiên cứu Cũng như các bộ môn khoa học khác, giáo dục quốc phòng và …”","o":["an ninh cũng có đối tượng nghiên cứu","hào, tự tôn dân tộc","thực tế chiến đấu","trật tự, an toàn xã hội, an toàn an ninh mạng"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đối tượng nghiên cứu Cũng như các bộ môn khoa học khác, giáo dục quốc phòng và an ninh cũng có đối tượng nghiên cứu."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Đối tượng nghiên cứu của giáo dục quốc phòng và an ninh là nghiên cứu quá trình hình thành, vận động phát triển, những quy luật (tính quy luật) trong hoạt …”","o":["động giáo dục quốc phòng và an ninh cho học sinh, sinh viên","các đối tượng theo quy định của thông tư này","có tỷ lệ lý thuyết chiếm trên 70% chương trình","trật tự, an toàn xã hội, an toàn an ninh mạng"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đối tượng nghiên cứu của giáo dục quốc phòng và an ninh là nghiên cứu quá trình hình thành, vận động phát triển, những quy luật (tính quy luật) trong hoạt động giáo dục quốc phòng và an ninh cho học sinh, sinh viên;"},{"q":"Theo bài học, phần còn thiếu trong nhận định “Mặt khác, giáo dục quốc phòng và an ninh còn nghiên cứu mối quan hệ tác động của tình hình chính trị, kinh tế, văn hóa xã hội, quốc phòng, an ninh, đối ngoại… đối với …” là gì?","o":["quá trình giáo dục quốc phòng và an ninh cho học sinh, sinh viên","các nội dung của giáo dục quốc phòng và an ninh một cách toàn","hệ biện chứng tác động lẫn nhau gồm: Mục tiêu, yêu cầu","song cơ bản liên quan trực tiếp tới các ngành như: Triết học Mác-Lênin"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Mặt khác, giáo dục quốc phòng và an ninh còn nghiên cứu mối quan hệ tác động của tình hình chính trị, kinh tế, văn hóa xã hội, quốc phòng, an ninh, đối ngoại… đối với quá trình giáo dục quốc phòng và an ninh cho học sinh, sinh viên."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “quan điểm của Đảng về xây dựng nền quốc phòng tòan …”?","o":["lựu đạn thường dùng","cứu các văn bản","đối với học sinh tiểu học","dân, an ninh nhân dân"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: quan điểm của Đảng về xây dựng nền quốc phòng tòan dân, an ninh nhân dân;"},{"q":"Chọn phương án nối tiếp đúng nội dung: “xây dưng lực lượng dân quân tự vệ, lực lượng dự bị động viên và những vấn đề cơ bản về bảo vệ an ninh …”","o":["và chiến thuật rèn luyện các kỹ năng thao tác, hành động quân sự","từ 5 điểm trở lên theo thang điểm 10 c) Đối tượng được miễn","bộ có ý thức, năng lực sẵn sàng tham gia nhiệm vụ bảo vệ","quốc gia và bảo đảm trật tự, an toàn xã hội"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: xây dưng lực lượng dân quân tự vệ, lực lượng dự bị động viên và những vấn đề cơ bản về bảo vệ an ninh quốc gia và bảo đảm trật tự, an toàn xã hội."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Các quan điểm của Đảng về quốc phòng và an ninh có tính kế thừa và phát triển những truyền thống quân sự độc đáo của dân tộc “cả nước một …” được hoàn thiệ n đấu phòng ngự và từng người làm nhiệm vụ canh gác, cảnh giới Kiến thức về quân sự trong môn học là những kiến thức phổ thông, sinh viên cần …”","o":["khăn, biết ghép mình vào tập thể mới đạt được kết quả cao","khối lượng học tập, xét học bổng, xét tốt nghiệp và được ghi vào","an ninh liên quan đến nhiều ngành khoa học khác","quan tâm nghiên cứu đặc điểm, nguyên lý cấu tạo, tính năng, tác dụng,"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: từng người trong chiến đấu tiến công, từng người trong chiến đấu phòng ngự và từng người làm nhiệm vụ canh gác, cảnh giới Kiến thức về quân sự trong môn học là những kiến thức phổ thông, sinh viên cần quan tâm nghiên cứu đặc điểm, nguyên lý cấu tạo, tính năng, tác dụng,..."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “hiểu rõ bản chất các nội dung kỹ, chiến thuật bộ binh và các phương pháp thực hiện …” được hoàn thiện như thế nào?","o":["học thuyết Mác-Lênin và tư tưởng Hồ Chí Minh","an ninh, trật tự, an toàn xã hội","thành năng lực quân sự cho học sinh, sinh viên","phòng tránh đơn giản sát với thực tế"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: hiểu rõ bản chất các nội dung kỹ, chiến thuật bộ binh và các phương pháp thực hiện, phòng tránh đơn giản sát với thực tế."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “những luận cứ khoa học trong quản lý giáo dục, các chủ trương, đường lối, chính sách …”","o":["về giáo dục quốc phòng và an ninh","công tác trong ngày, trong tuần","QUỐC PHÒNG VÀ AN NINH ----- A","vụ quân sự theo quy định hiện hành"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: những luận cứ khoa học trong quản lý giáo dục, các chủ trương, đường lối, chính sách về giáo dục quốc phòng và an ninh."},{"q":"Phương án nào điền đúng vào chỗ trống: “những vấn đề về đảm bảo cơ sở vật chất, trang thiết bị dạy học, các nguồn lực đầu tư, kinh …”?","o":["đối tượng giáo dục (học sinh, sinh viên)","phí cho giáo dục quốc phòng và an ninh","là quá trình sư phạm tổng thể","các đối tượng theo quy định của thông tư này"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: những vấn đề về đảm bảo cơ sở vật chất, trang thiết bị dạy học, các nguồn lực đầu tư, kinh phí cho giáo dục quốc phòng và an ninh."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Nghiên cứu những vấn đề về hình thành nhân cách người chiến sỹ trong quá trình tổ chức hoạt động …”?","o":["thực hiện mục tiêu giáo dục đã xác định","QUỐC PHÒNG VÀ AN NINH ----- A","trải nghiệm giáo dục quốc phòng và an ninh","tương ứng với trình độ đào tạo"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nghiên cứu những vấn đề về hình thành nhân cách người chiến sỹ trong quá trình tổ chức hoạt động trải nghiệm giáo dục quốc phòng và an ninh."},{"q":"Theo giáo trình, ý “Mối quan hệ giữa giáo dục quốc phòng và an ninh với các môn khoa học khác Giáo dục quốc phòng và an ninh liên quan đến nhiều ngành khoa học khác …” kết thúc bằng nội dung nào?","o":["và chiến thuật rèn luyện các kỹ năng thao tác, hành động quân sự","quan tâm nghiên cứu đặc điểm, nguyên lý cấu tạo, tính năng, tác dụng,","song cơ bản liên quan trực tiếp tới các ngành như: Triết học Mác-Lênin","(giảng viên, giáo viên) tới đối tượng giáo dục (học sinh, sinh viên) nhằm"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Mối quan hệ giữa giáo dục quốc phòng và an ninh với các môn khoa học khác Giáo dục quốc phòng và an ninh liên quan đến nhiều ngành khoa học khác, song cơ bản liên quan trực tiếp tới các ngành như: Triết học Mác-Lênin;"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Xây dựng Đảng và chính quyền Nhà nước, Hồ Chí Minh học là cơ sở khoa học để định hướng nghiên cứu những tư tưởng, quan điểm của Đảng …”","o":["các thành tố của các quá trình bộ phận là quá trình dạy học","quan tâm nghiên cứu đặc điểm, nguyên lý cấu tạo, tính năng, tác dụng,","chính sách của Nhà nước trong giáo dục quốc phòng và an ninh","luật của Nhà nước về bảo vệ Tổ quốc"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng Đảng và chính quyền Nhà nước, Hồ Chí Minh học là cơ sở khoa học để định hướng nghiên cứu những tư tưởng, quan điểm của Đảng, chính sách của Nhà nước trong giáo dục quốc phòng và an ninh."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Khoa học quân sự làm cơ sở để luận giải những vấn đề về bản chất chiến tranh, lịch sử nghệ thuật quân sự …”","o":["chiến thuật quân sự Việt Nam, điều lệnh Quân đội","quan tâm nghiên cứu đặc điểm, nguyên lý cấu tạo, tính năng, tác dụng,","thực hiện mục tiêu giáo dục đã xác định","và chủ nghĩa xã hội, đáp ứng yêu cầu nhiệm vụ bảo vệ Tổ"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Khoa học quân sự làm cơ sở để luận giải những vấn đề về bản chất chiến tranh, lịch sử nghệ thuật quân sự, chiến thuật quân sự Việt Nam, điều lệnh Quân đội."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Khoa học kỹ thuật quân sự làm cơ sở để luận giải những vấn đề về nguyên lý, cấu tạo, tính năng …” là gì?","o":["phòng tránh đơn giản sát với thực tế","phí cho giáo dục quốc phòng và an ninh","kỹ chiến thuật của các loại binh khí, kỹ thuật","và chủ nghĩa xã hội, đáp ứng yêu cầu nhiệm vụ bảo vệ Tổ"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Khoa học kỹ thuật quân sự làm cơ sở để luận giải những vấn đề về nguyên lý, cấu tạo, tính năng kỹ chiến thuật của các loại binh khí, kỹ thuật."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “9 Tâm lý học quân sự làm cơ sở khoa học cho việc hình thành kỹ xảo, kỹ năng trong luyện tập kỹ thuật, chiến thuật chiến đấu bộ binh, xây dựng …”?","o":["các đối tượng theo quy định của thông tư này","tưởng Hồ Chí Minh về chiến tranh, quân đội và bảo vệ Tổ quốc","tính kỷ luật, đoàn kết trong tập thể, cơ chế hình thành niềm tin","của dân tộc “cả nước một lòng chung sức đánh giặc”"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: 9 Tâm lý học quân sự làm cơ sở khoa học cho việc hình thành kỹ xảo, kỹ năng trong luyện tập kỹ thuật, chiến thuật chiến đấu bộ binh, xây dựng tính kỷ luật, đoàn kết trong tập thể, cơ chế hình thành niềm tin."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Cơ sở phương pháp luận Cơ sở phương pháp luận chung nhất của việc nghiên cứu bộ môn này là …”","o":["học thuyết Mác-Lênin và tư tưởng Hồ Chí Minh","luận của Đảng về đường lối quốc phòng và an ninh gồm","kỹ chiến thuật của các loại binh khí, kỹ thuật","hoàn thành khối lượng học tập"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Cơ sở phương pháp luận Cơ sở phương pháp luận chung nhất của việc nghiên cứu bộ môn này là học thuyết Mác-Lênin và tư tưởng Hồ Chí Minh."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Nghiên cứu giáo dục quốc phòng và an ninh dựa trên cơ sở phương pháp luận duy vật, biện chứng lịch sử của chủ nghĩa Mác-Lênin, tư tưởng quân sự Hồ Chí Minh, đường lối quan điểm về giáo dục …” được hoàn thiện như thế nào?","o":["tưởng Hồ Chí Minh về chiến tranh, quân đội và bảo vệ Tổ quốc","về quốc phòng, quân sự, an ninh của Đảng, tiếp cận hoạt động dạy","lòng chung sức đánh giặc”, “lấy ít địch nhiều”, “lấy yếu chống mạnh”","phận là quá trình dạy học, quá trình trải nghiệm quân sự, an ninh"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Nghiên cứu giáo dục quốc phòng và an ninh dựa trên cơ sở phương pháp luận duy vật, biện chứng lịch sử của chủ nghĩa Mác-Lênin, tư tưởng quân sự Hồ Chí Minh, đường lối quan điểm về giáo dục, về quốc phòng, quân sự, an ninh của Đảng, tiếp cận hoạt động dạy"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Quan điểm lịch sử, lôgíc: Trong nghiên cứu, phải nhìn thấy sự phát triển của đối tượng, vấn đề nghiên cứu theo thời gian, không gian với những điều kiện lịch sử, cụ thể để từ đó giúp …”","o":["quan tâm nghiên cứu đặc điểm, nguyên lý cấu tạo, tính năng, tác dụng,","thành, vận động, phát triển của giáo dục quốc phòng và an ninh","an ninh chính trị và bảo đảm trật tự, an toàn xã hội","ta phát hiện, khái quát, nhận thức đúng đắn những quy luật, nguyên tắc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Quan điểm lịch sử, lôgíc: Trong nghiên cứu, phải nhìn thấy sự phát triển của đối tượng, vấn đề nghiên cứu theo thời gian, không gian với những điều kiện lịch sử, cụ thể để từ đó giúp ta phát hiện, khái quát, nhận thức đúng đắn những quy luật, nguyên tắc"},{"q":"Phương án nào điền đúng vào chỗ trống: “Các phương pháp nghiên cứu Là một bộ môn khoa học nằm trong hệ thống khoa học quân sự, phạm vi nghiên cứu rất rộng, nội dung nghiên cứu đa dạng, được cấu trúc theo hệ thống từ thấp đến cao …”?","o":["đoạn của kẻ thù đối với cách mạng Việt Nam","từ đơn giản đến phức tạp và luôn có sự kế thừa, phát triển","các nội dung của giáo dục quốc phòng và an ninh một cách toàn","tưởng Hồ Chí Minh về chiến tranh, quân đội và bảo vệ Tổ quốc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Các phương pháp nghiên cứu Là một bộ môn khoa học nằm trong hệ thống khoa học quân sự, phạm vi nghiên cứu rất rộng, nội dung nghiên cứu đa dạng, được cấu trúc theo hệ thống từ thấp đến cao, từ đơn giản đến phức tạp và luôn có sự kế thừa, phát triển."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Vì vậy, khi tiếp cận nghiên cứu phải được vận dụng với nhiều phương pháp, cách thức, phù hợp với tính chất của …”?","o":["tiêu giáo dục đã xác định","và chủ nghĩa xã hội, đáp ứng yêu cầu nhiệm vụ bảo vệ Tổ","vào đồng chí đồng đội, sẵn sàng tham gia bảo vệ Tổ quốc, giữ","từng nội dung và vấn đề nghiên cứu cụ thể"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, khi tiếp cận nghiên cứu phải được vận dụng với nhiều phương pháp, cách thức, phù hợp với tính chất của từng nội dung và vấn đề nghiên cứu cụ thể."},{"q":"Theo giáo trình, ý “Phương pháp nghiên cứu thực tiễn: Gồm quan sát điều tra, khảo sát thực 10 tế, nghiên cứu các sản phẩm quốc phòng và an ninh, tổng kết kinh nghiệm, thí nghiệm, thực nghiệm… nhằm tác động …” kết thúc bằng nội dung nào?","o":["liệu về quốc phòng và an ninh để rút ra kết luận cần thiết","Đảng và những vấn đề khác của giáo dục quốc phòng và an ninh","chiến thuật quân sự Việt Nam, điều lệnh Quân đội","trực tiếp vào đối tượng trong thực tiễn từ đó khái quát bản chất,"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Phương pháp nghiên cứu thực tiễn: Gồm quan sát điều tra, khảo sát thực 10 tế, nghiên cứu các sản phẩm quốc phòng và an ninh, tổng kết kinh nghiệm, thí nghiệm, thực nghiệm… nhằm tác động trực tiếp vào đối tượng trong thực tiễn từ đó khái quát bản chất,"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Cần chú ý sử dụng phương pháp tạo tình huống, nêu vấn đề, tranh luận sáng tạo tăng cường thực …”","o":["hoàn thành chương trình","hành rèn luyện sát thực tế chiến đấu","dục thành “tự giáo dục”","thắng mọi kẻ thù xâm lược"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Cần chú ý sử dụng phương pháp tạo tình huống, nêu vấn đề, tranh luận sáng tạo tăng cường thực hành rèn luyện sát thực tế chiến đấu."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Ngoài các phương cơ bản trên, giáo dục quốc phòng và an ninh còn sử dụng các một số phương …”","o":["thắng mọi kẻ thù xâm lược","luật về người khuyết tật","ngoài chuyển thành kết quả giáo dục trong nhân cách học sinh","pháp nghiên cứu khác như: Phương pháp quan sát"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Ngoài các phương cơ bản trên, giáo dục quốc phòng và an ninh còn sử dụng các một số phương pháp nghiên cứu khác như: Phương pháp quan sát;"},{"q":"Theo bài học, phần còn thiếu trong nhận định “ĐẶC ĐIỂM, CHƯƠNG TRÌNH, TỔ CHỨC DẠY HỌC VÀ ĐÁNH GIÁ KẾT QUẢ MÔN HỌC GIÁO …” là gì?","o":["DỤC QUỐC PHÒNG VÀ AN NINH 1","có tỷ lệ lý thuyết chiếm trên 70% chương trình","nội dung giáo dục quốc phòng và an ninh","gia bảo vệ Tổ quốc"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: ĐẶC ĐIỂM, CHƯƠNG TRÌNH, TỔ CHỨC DẠY HỌC VÀ ĐÁNH GIÁ KẾT QUẢ MÔN HỌC GIÁO DỤC QUỐC PHÒNG VÀ AN NINH 1."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Có sự kế tục và phát huy kết quả thực hiện chương trình huấn luyện quân sự phổ thông (1961), giáo dục quốc phòng (1991), quy chế giáo dục đào tạo trình độ đại học …”?","o":["năm 2050: Các trung tâm giáo dục quốc phòng và an ninh sinh viên","của dân tộc “cả nước một lòng chung sức đánh giặc”","(2000) và nghị định của chính phủ về giáo dục quốc phòng năm 2007","lòng chung sức đánh giặc”, “lấy ít địch nhiều”, “lấy yếu chống mạnh”"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Có sự kế tục và phát huy kết quả thực hiện chương trình huấn luyện quân sự phổ thông (1961), giáo dục quốc phòng (1991), quy chế giáo dục đào tạo trình độ đại học (2000) và nghị định của chính phủ về giáo dục quốc phòng năm 2007."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Là môn học bao gồm kiến thức khoa học xã hội, nhân văn, khoa học tự nhiên và khoa học kỹ thuật quân sự …”","o":["tương ứng với trình độ đào tạo","quốc gia và bảo đảm trật tự","đối với học sinh tiểu học, trung học cơ sở","có tỷ lệ lý thuyết chiếm trên 70% chương trình"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Là môn học bao gồm kiến thức khoa học xã hội, nhân văn, khoa học tự nhiên và khoa học kỹ thuật quân sự có tỷ lệ lý thuyết chiếm trên 70% chương trình."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Tổ chức dạy học và đánh giá kết quả học tập a) Tổ chức dạy học Theo Quyết định số 161/QĐ-TTg ngày 30/01/2015 của Thủ tướng Chính phủ về Phê duyệt quy hoạch Hệ thống Trung tâm giáo …” được hoàn thiện như thế nào?","o":["từng nội dung và vấn đề nghiên cứu cụ thể","an ninh chính trị và bảo đảm trật tự, an toàn xã hội","trực tiếp vào đối tượng trong thực tiễn từ đó khái quát bản chất,","dục quốc phòng và an ninh giai đoạn 2015-2020 và những năm tiếp theo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Tổ chức dạy học và đánh giá kết quả học tập a) Tổ chức dạy học Theo Quyết định số 161/QĐ-TTg ngày 30/01/2015 của Thủ tướng Chính phủ về Phê duyệt quy hoạch Hệ thống Trung tâm giáo dục quốc phòng và an ninh giai đoạn 2015-2020 và những năm tiếp theo;"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “các trung tâm thuộc các trường quân sự quân …”","o":["khu, tỉnh, thành phố","kỹ năng thao tác","về giáo dục quốc phòng và an ninh","cố quốc phòng và an ninh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: các trung tâm thuộc các trường quân sự quân khu, tỉnh,  BẢN CỦA CHỦ NGHĨA MÁC-LÊNIN, TƯ TƯỞNG HỒ CHÍ MINH VỀ CHIẾN TRANH, QUÂN …”","o":["chịu mất nước, nhất định không chịu làm nô lệ","ĐỘI VÀ BẢO VỆ TỔ QUỐC ----- A","lối, quan điểm, chính sách của Đảng, pháp luật của Nhà nước","nào không có tổ quốc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Bài 2 QUAN ĐIỂM CƠ BẢN CỦA CHỦ NGHĨA MÁC-LÊNIN, TƯ TƯỞNG HỒ CHÍ MINH VỀ CHIẾN TRANH, QUÂN ĐỘI VÀ BẢO VỆ TỔ QUỐC ----- A."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Trên cơ sở đó bồi dưỡng thế giới quan, phương pháp luận khoa học cách mạng cho người học, giúp người học có cơ sở khoa học để quán triệt các quan điểm cơ bản của Đảng ta …” là gì?","o":["về chiến tranh, quân đội và bảo vệ Tổ quốc xã hội chủ nghĩa","đã có công dựng nước, Bác cháu ta phải cùng nhau giữ lấy nước”","quân đội là công cụ bạo lực vũ trang của giai cấp, nhà nước","Đảng ta xây dựng, Đảng ta lãnh đạo và giáo dục”"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trên cơ sở đó bồi dưỡng thế giới quan, phương pháp luận khoa học cách mạng cho người học, giúp người học có cơ sở khoa học để quán triệt các quan điểm cơ bản của Đảng ta về chiến tranh, quân đội và bảo vệ Tổ quốc xã hội chủ nghĩa."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “QUAN ĐIỂM CỦA CHỦ NGHĨA MÁC-LÊNIN, TƯ TƯỞNG HỒ CHÍ MINH …”?","o":["nào không có tổ quốc","VỀ CHIẾN TRANH 1","mọi hoàn cảnh, tình huống chiến tranh","và sẵn sàng chiến đấu"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: QUAN ĐIỂM CỦA CHỦ NGHĨA MÁC-LÊNIN, TƯ TƯỞNG HỒ CHÍ MINH VỀ CHIẾN TRANH 1."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Chiến tranh là sự huy động sức mạnh không hạn độ, sức mạnh đến tột …”","o":["cùng của các bên tham chiến","đối kháng là nguồn gốc ra đời quân đội","phải có thái độ nghiêm túc đối với quốc phòng","cuồng chống phá nước Nga Xô viết"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Chiến tranh là sự huy động sức mạnh không hạn độ, sức mạnh đến tột cùng của các bên tham chiến."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Các nhà kinh điển của chủ nghĩa Mác đã kế thừa tư tưởng đó và đi đến khẳng định: Chiến tranh là hiện tượng chính trị xã hội có tính lịch sử, đó là cuộc đấu tranh vũ trang có tổ chức giữa các giai cấp, nhà nước …” được hoàn thiện như thế nào?","o":["(hoặc liên minh giữa các nước) nhằm đạt mục đích chính trị nhất định","dựng để dùng vào cuộc chiến tranh tiến công hoặc chiến tranh phòng ngự”","Xô viết, chính quyền của những người lao động, rằng họ bảo vệ sự","quân đội kiểu mới của giai cấp vô sản, Chủ tịch Hồ Chí Minh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Các nhà kinh điển của chủ nghĩa Mác đã kế thừa tư tưởng đó và đi đến khẳng định: Chiến tranh là hiện tượng chính trị xã hội có tính lịch sử, đó là cuộc đấu tranh vũ trang có tổ chức giữa các giai cấp, nhà nước (hoặc liên minh giữa các nước) nhằm đạt mục đích chính trị nhất định."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Nhưng nó không phải là những mối quan hệ giữa người với người nói chung, mà là mối quan hệ giữa những tập …”","o":["đoàn người có lợi ích cơ bản đối lập nhau","bảo vệ Tổ quốc xã hội chủ nghĩa","định: “Bảo vệ Tổ quốc xã hội chủ nghĩa là sự nghiệp thiêng liêng,","nhiệm vụ bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa hiện nay"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nhưng nó không phải là những mối quan hệ giữa người với người nói chung, mà là mối quan hệ giữa những tập đoàn người có lợi ích cơ bản đối lập nhau."},{"q":"Phương án nào điền đúng vào chỗ trống: “14 b) Nguồn gốc ra đời chiến tranh Với thế giới quan và phương pháp luận duy vật biện chứng, cùng với sự kết hợp sáng tạo phương pháp lôgíc và lịch sử, C.Mác và Ph.Ăngghen lần đầu tiên trong lịch sử …”?","o":["quân đội là công cụ bạo lực vũ trang của giai cấp, nhà nước","cốt và xung kích trong xây dựng kinh tế - quốc phòng ở các","nghèo, kẻ đi áp bức bóc lột và người bị áp bức bóc lột","đã luận giải một cách đúng đắn về nguồn gốc ra đời chiến tranh"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: 14 b) Nguồn gốc ra đời chiến tranh Với thế giới quan và phương pháp luận duy vật biện chứng, cùng với sự kết hợp sáng tạo phương pháp lôgíc và lịch sử, C.Mác và Ph.Ăngghen lần đầu tiên trong lịch sử đã luận giải một cách đúng đắn về nguồn gốc ra đời chiến tranh."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Đồng thời sự xuất hiện và tồn tại của giai cấp và đối kháng giai cấp là nguồn gốc trực tiếp (nguồn gốc xã hội) …”?","o":["dẫn đến sự xuất hiện, tồn tại của chiến tranh","giai cấp thống trị và nhà nước tổ chức nuôi dưỡng sử dụng nó","hội và việc giải quyết các mối quan hệ nội bộ trong quân đội","hội phải luôn gắn liền với bảo vệ Tổ quốc xã hội chủ nghĩa"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đồng thời sự xuất hiện và tồn tại của giai cấp và đối kháng giai cấp là nguồn gốc trực tiếp (nguồn gốc xã hội) dẫn đến sự xuất hiện, tồn tại của chiến tranh."},{"q":"Theo giáo trình, ý “Trong tác phẩm: “Nguồn gốc của gia đình, của chế độ tư hữu và của nhà nước”, Ph.Ăngghen chỉ rõ: “Trải qua hàng vạn năm trong chế độ cộng sản nguyên thủy, khi chưa có chế độ tư hữu, chưa …” kết thúc bằng nội dung nào?","o":["thành, phát triển quân đội kiểu mới, quân đội của giai cấp vô sản","có giai cấp đối kháng thì chiến tranh với tính cách là một hiện","là cơ sơ, nền tảng để xây dựng quân đội vững mạnh toàn diện","của Đảng, để thực hiện sự lãnh đạo của Đảng trong quân đội"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trong tác phẩm: “Nguồn gốc của gia đình, của chế độ tư hữu và của nhà nước”, Ph.Ăngghen chỉ rõ: “Trải qua hàng vạn năm trong chế độ cộng sản nguyên thủy, khi chưa có chế độ tư hữu, chưa có giai cấp đối kháng thì chiến tranh với tính cách là một hiện"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Bởi vì, xét về mặt xã hội, xã hội cộng sản nguyên thuỷ là một xã hội không có giai cấp, bình đẳng, không có tình trạng phân chia thành kẻ giàu, người …”","o":["xã hội chủ nghĩa đang đặt ra trực tiếp ở nước Nga Xô viết","lập nhau cùng tồn tại và đấu tranh với nhau hết sức quyết liệt","nghèo, kẻ đi áp bức bóc lột và người bị áp bức bóc lột","nghĩa xã hội là mục tiêu xuyên suốt trong tư tưởng Hồ Chí Minh"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Bởi vì, xét về mặt xã hội, xã hội cộng sản nguyên thuỷ là một xã hội không có giai cấp, bình đẳng, không có tình trạng phân chia thành kẻ giàu, người nghèo, kẻ đi áp bức bóc lột và người bị áp bức bóc lột."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Tất cả các thành viên của bộ lạc với mọi công cụ lao động thường ngày đều …”","o":["QUỐC XÃ HỘI CHỦ NGHĨA 1","xã hội chủ nghĩa?","cuốc, thuổng, gậy gộc","tham gia vào cuộc xung đột đó"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Tất cả các thành viên của bộ lạc với mọi công cụ lao động thường ngày đều tham gia vào cuộc xung đột đó."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Theo đó, Ph.Ăngghen chỉ rõ, khi chế độ chiếm hữu tư nhân về tư liệu sản xuất xuất hiện và cùng với nó là sự ra đời của giai cấp, tầng lớp áp bức bóc lột …” là gì?","o":["có lòng yêu nước mãnh liệt, trí căm thù giặc sâu sắc","có giai cấp đối kháng thì chiến tranh với tính cách là một hiện","đang đặt ra có tính cấp thiết cả về lý luận và thực tiễn","thì chiến tranh ra đời và tồn tại như một tất yếu khách quan"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Theo đó, Ph.Ăngghen chỉ rõ, khi chế độ chiếm hữu tư nhân về tư liệu sản xuất xuất hiện và cùng với nó là sự ra đời của giai cấp, tầng lớp áp bức bóc lột thì chiến tranh ra đời và tồn tại như một tất yếu khách quan."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Phát triển những luận điểm của C.Mác, Ph.Ăngghen về chiến tranh trong điều kiện lịch sử mới, V.I.Lênin chỉ rõ trong thời đại ngày nay còn chủ nghĩa đế quốc còn nguy cơ …”?","o":["suy đến cùng đã dẫn đến sự xuất hiện, tồn tại của chiến tranh","xảy ra chiến tranh, chiến tranh là bạn đường của chủ nghĩa đế quốc","động và giai cấp vô sản thế giới có nghĩa vụ ủng hộ sự","công nhân, đồng thời có tính nhân dân và tính dân tộc sâu sắc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Phát triển những luận điểm của C.Mác, Ph.Ăngghen về chiến tranh trong điều kiện lịch sử mới, V.I.Lênin chỉ rõ trong thời đại ngày nay còn chủ nghĩa đế quốc còn nguy cơ xảy ra chiến tranh, chiến tranh là bạn đường của chủ nghĩa đế quốc."},{"q":"Chọn phương án nối tiếp đúng nội dung: “c) Bản chất chiến tranh Bản chất chiến tranh là một trong những nội dung cơ bản, quan trọng nhất …”","o":["của học thuyết Mác-Lênin về chiến tranh, quân đội","và sẵn sàng chiến đấu","sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa","luôn dành sự chăm lo đặc biệt đối với quân đội"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: c) Bản chất chiến tranh Bản chất chiến tranh là một trong những nội dung cơ bản, quan trọng nhất của học thuyết Mác-Lênin về chiến tranh, quân đội."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Theo V.I.Lênin, khi phân tích bản chất chiến tranh, nhất thiết phải có quan điểm chính trị - giai cấp, xem chiến …” được hoàn thiện như thế nào?","o":["quân đội là công cụ bạo lực vũ trang của giai cấp, nhà nước","QUỐC XÃ HỘI CHỦ NGHĨA 1","đó là sử dụng bạo lực","tranh chỉ là một hiện tượng lịch sử cụ thể"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Theo V.I.Lênin, khi phân tích bản chất chiến tranh, nhất thiết phải có quan điểm chính trị - giai cấp, xem chiến tranh chỉ là một hiện tượng lịch sử cụ thể."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Như vậy, chiến tranh chỉ là một thời đoạn, một bộ phận của chính trị …”","o":["dân chống thực dân, đế quốc xâm lược","nó không làm gián đoạn chính trị","luôn dành sự chăm lo đặc biệt đối với quân đội","đứng lên đánh thực dân Pháp cứu Tổ quốc”"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Như vậy, chiến tranh chỉ là một thời đoạn, một bộ phận của chính trị, nó không làm gián đoạn chính trị."},{"q":"Phương án nào điền đúng vào chỗ trống: “Giữa chiến tranh và chính trị có quan hệ chặt chẽ với nhau trong đó chính trị chi phối và quyết định toàn bộ tiến trình và kết cục chiến tranh, chính trị chỉ đạo toàn bộ hoặc phần lớn tiến …”?","o":["kéo dài, đồng bào ta có thể phải hy sinh nhiều của nhiều người","trình và kết cục của chiến tranh, chính trị quy định mục tiêu và","và bảo vệ Tổ quốc vẫn còn nguyên giá trị","giải phóng giai cấp, độc lập dân tộc gắn với chủ nghĩa xã hội"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Giữa chiến tranh và chính trị có quan hệ chặt chẽ với nhau trong đó chính trị chi phối và quyết định toàn bộ tiến trình và kết cục chiến tranh, chính trị chỉ đạo toàn bộ hoặc phần lớn tiến trình và kết cục của chiến tranh, chính trị quy định mục tiêu và"},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Ngược lại, chiến tranh là một bộ phận, một phương tiện của chính trị, là kết quả phản ánh …”?","o":["trong điều kiện cụ thể ở Việt Nam","tộc, giải phóng giai cấp ở nước ta","những cố gắng cao nhất của chính trị","quân đội và bảo vệ Tổ quốc xã hội chủ nghĩa"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Ngược lại, chiến tranh là một bộ phận, một phương tiện của chính trị, là kết quả phản ánh những cố gắng cao nhất của chính trị."},{"q":"Theo giáo trình, ý “Chiến tranh có thể làm thay đổi đường lối, chính sách, nhiệm vụ cụ thể, thậm chí có thể còn thay đổi cả thành phần của …” kết thúc bằng nội dung nào?","o":["lực lượng lãnh đạo chính trị trong các bên tham chiến","luôn dành sự chăm lo đặc biệt đối với quân đội","phòng và an ninh bảo vệ Tổ quốc","bản chất giai cấp công nhân, mục tiêu lý tưởng chiến đấu của mình"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Chiến tranh có thể làm thay đổi đường lối, chính sách, nhiệm vụ cụ thể, thậm chí có thể còn thay đổi cả thành phần của lực lượng lãnh đạo chính trị trong các bên tham chiến."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Chiến tranh có thể đẩy nhanh sự chín muồi của cách mạng hoặc làm …”","o":["mất đi tình thế cách mạng","VỀ QUÂN ĐỘI 1","cùng của các bên tham chiến","VỀ CHIẾN TRANH 1"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Chiến tranh có thể đẩy nhanh sự chín muồi của cách mạng hoặc làm mất đi tình thế cách mạng."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Trong thời đại ngày nay mặc dù chiến tranh có những thay đổi về phương thức tác chiến, vũ khí trang bị “song bản chất chiến tranh vẫn không có gì thay đổi, chiến tranh vẫn là …”","o":["sự tiếp tục chính trị của các nhà nước và giai cấp nhất định","nghĩa xã hội có thể giành thắng lợi không đồng thời ở các nước","toàn dân lập nên những chiến công hiển hách trong chiến tranh giải phóng","thì chiến tranh ra đời và tồn tại như một tất yếu khách quan"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trong thời đại ngày nay mặc dù chiến tranh có những thay đổi về phương thức tác chiến, vũ khí trang bị “song bản chất chiến tranh vẫn không có gì thay đổi, chiến tranh vẫn là sự tiếp tục chính trị của các nhà nước và giai cấp nhất định."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Tư tưởng Hồ Chí Minh về chiến tranh Trên cơ sở lập trường duy vật biện chứng, Hồ Chí Minh đã sớm đánh giá đúng đắn bản chất, quy luật của chiến tranh, tác động của chiến tranh đến đời sống xã …” là gì?","o":["hội Hồ Chí Minh đã chỉ rõ, cuộc chiến tranh do thực dân Pháp","từ bỏ tham vọng muốn quay trở lại địa vị thống trị đã mất","là cơ sơ, nền tảng để xây dựng quân đội vững mạnh toàn diện","công trong xây dựng quân đôị kiểu mới của giai cấp vô sản"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tư tưởng Hồ Chí Minh về chiến tranh Trên cơ sở lập trường duy vật biện chứng, Hồ Chí Minh đã sớm đánh giá đúng đắn bản chất, quy luật của chiến tranh, tác động của chiến tranh đến đời sống xã hội Hồ Chí Minh đã chỉ rõ, cuộc chiến tranh do thực dân Pháp"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Hồ Chí Minh đã xác định tính chất xã hội của chiến tranh, phân tích tính chất chính trị - xã hội của chiến tranh xâm lược thuộc địa, chiến tranh ăn cướp của chủ nghĩa đế …”?","o":["sách lược, triệt để lợi dụng mâu thuẫn trong hàng ngũ kẻ thù","để giữ vững chính quyền nhân dân chuẩn bị cho kháng chiến lâu dài","quốc, chỉ ra tính chất chính nghĩa của chiến tranh giải phóng dân tộc","(hoặc liên minh giữa các nước) nhằm đạt mục đích chính trị nhất định"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Hồ Chí Minh đã xác định tính chất xã hội của chiến tranh, phân tích tính chất chính trị - xã hội của chiến tranh xâm lược thuộc địa, chiến tranh ăn cướp của chủ nghĩa đế quốc, chỉ ra tính chất chính nghĩa của chiến tranh giải phóng dân tộc."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Hồ Chí Minh khẳng định: Ngày nay chiến tranh giải phóng dân tộc của nhân dân ta là chiến tranh nhân dân đặt dưới sự lãnh đạo của Đảng Cách mạng là sự nghiệp của quần chúng, Chủ tịch Hồ Chí Minh …”","o":["đối nội và đường lối đối ngoại, trong đó đường lối đối ngoại phụ","dẫn đến sự xuất hiện, tồn tại của chiến tranh","lập nhau cùng tồn tại và đấu tranh với nhau hết sức quyết liệt","luôn coi con người là nhân tố quyết định thắng lợi trong chiến tranh"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Hồ Chí Minh khẳng định: Ngày nay chiến tranh giải phóng dân tộc của nhân dân ta là chiến tranh nhân dân đặt dưới sự lãnh đạo của Đảng Cách mạng là sự nghiệp của quần chúng, Chủ tịch Hồ Chí Minh luôn coi con người là nhân tố quyết định thắng lợi trong chiến tranh."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Tư tưởng Hồ Chí Minh về chiến tranh được thể hiện rõ trong “Lời kêu gọi toàn quốc kháng chiến” chống thực dân Pháp ngày 19/12/1946: “Bất kỳ đàn ông, đàn bà …” được hoàn thiện như thế nào?","o":["bất kỳ người già, người trẻ, không chia tôn giáo, đảng phái, dân tộc","tại, phát triển, chiến đấu, chiến thắng của Hồng quân","phát triển bản chất giai cấp công nhân của quân đội ta","có giai cấp đối kháng thì chiến tranh với tính cách là một hiện"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tư tưởng Hồ Chí Minh về chiến tranh được thể hiện rõ trong “Lời kêu gọi toàn quốc kháng chiến” chống thực dân Pháp ngày 19/12/1946: “Bất kỳ đàn ông, đàn bà, bất kỳ người già, người trẻ, không chia tôn giáo, đảng phái, dân tộc."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Ai có gươm dùng gươm, không có gươm thì dùng …”","o":["công nhân và nhân dân lao động","xã hội chủ nghĩa?","những cố gắng cao nhất của chính trị","cuốc, thuổng, gậy gộc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Ai có gươm dùng gươm, không có gươm thì dùng cuốc, thuổng, gậy gộc."},{"q":"Phương án nào điền đúng vào chỗ trống: “Theo tư tưởng Hồ Chí Minh, đánh giặc phải bằng sức mạnh của toàn dân, trong đó phải có lực …”?","o":["lượng vũ trang nhân dân làm nòng cốt","mất đi tình thế cách mạng","tại, phát triển, chiến đấu, chiến thắng của Hồng quân","áp bức nô dịch dân tộc ta"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Theo tư tưởng Hồ Chí Minh, đánh giặc phải bằng sức mạnh của toàn dân, trong đó phải có lực lượng vũ trang nhân dân làm nòng cốt."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Sự phát triển sâu sắc làm phong phú thêm lý luận mác-xít về chiến tranh nhân dân …”?","o":["quân tăng cường bản chất giai cấp công nhân","quan điểm chính trị, quân sự của giai cấp mình","trong điều kiện cụ thể ở Việt Nam","nhà nước và giai cấp thống trị xã hội"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Sự phát triển sâu sắc làm phong phú thêm lý luận mác-xít về chiến tranh nhân dân trong điều kiện cụ thể ở Việt Nam."},{"q":"Theo giáo trình, ý “Quan điểm của chủ nghĩa Mác-Lênin về quân đội a) Khái niệm quân đội Theo Ph.Ăngghen: “Quân đội là một tập đoàn người vũ trang, có tổ chức do nhà nước xây …” kết thúc bằng nội dung nào?","o":["dựng để dùng vào cuộc chiến tranh tiến công hoặc chiến tranh phòng ngự”","là ý kiến ban đầu về bảo vệ Tổ quốc xã hội chủ nghĩa","chủ nghĩa, bảo vệ chủ nghĩa xã hội với tư cách là Tổ quốc”","quân đội kiểu mới của giai cấp vô sản, Chủ tịch Hồ Chí Minh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Quan điểm của chủ nghĩa Mác-Lênin về quân đội a) Khái niệm quân đội Theo Ph.Ăngghen: “Quân đội là một tập đoàn người vũ trang, có tổ chức do nhà nước xây dựng để dùng vào cuộc chiến tranh tiến công hoặc chiến tranh phòng ngự”."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “V.I.Lênin nhấn mạnh: “Chức năng cơ bản của quân đội đế quốc là phương tiện quân sự chủ yếu để đạt mục đích chính trị đối ngoại là tiến hành chiến tranh xâm lược và duy trì quyền …”","o":["hình mới của con người xã hội chủ nghĩa trong quân đội kiểu mới","có giai cấp đối kháng thì chiến tranh với tính cách là một hiện","cốt và xung kích trong xây dựng kinh tế - quốc phòng ở các","thống trị của bọn bóc lột đối với nhân dân lao động trong nước”"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: V.I.Lênin nhấn mạnh: “Chức năng cơ bản của quân đội đế quốc là phương tiện quân sự chủ yếu để đạt mục đích chính trị đối ngoại là tiến hành chiến tranh xâm lược và duy trì quyền thống trị của bọn bóc lột đối với nhân dân lao động trong nước”."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Chủ nghĩa Mác-Lênin đã chứng minh một cách khoa học về nguồn gốc ra đời của Quân đội từ sự phân tích cơ sở kinh tế - xã hội và khẳng định: “Quân đội là một hiện tượng lịch sử, ra đời …”","o":["là ý kiến ban đầu về bảo vệ Tổ quốc xã hội chủ nghĩa","tranh chỉ là một hiện tượng lịch sử cụ thể","hình mới của con người xã hội chủ nghĩa trong quân đội kiểu mới","trong giai đoạn phát triển nhất định của xã hội loài người, khi xuất"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Chủ nghĩa Mác-Lênin đã chứng minh một cách khoa học về nguồn gốc ra đời của Quân đội từ sự phân tích cơ sở kinh tế - xã hội và khẳng định: “Quân đội là một hiện tượng lịch sử, ra đời trong giai đoạn phát triển nhất định của xã hội loài người, khi xuất"},{"q":"Theo bài học, phần còn thiếu trong nhận định “Để bảo vệ lợi ích của giai cấp thống trị và đàn áp quần chúng nhân dân lao động, giai cấp thống trị đã tổ chức ra lực lượng …” là gì?","o":["chính trị tư tưởng, làm phai nhạt bản chất cách mạng của quân đội","đội cho phù hợp với tình hình mới","vũ trang thường trực làm công cụ bạo lực của nhà nước","để tồn tại như: Nguồn nước, bãi cỏ, vùng săn bắn hay hang động,"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Để bảo vệ lợi ích của giai cấp thống trị và đàn áp quần chúng nhân dân lao động, giai cấp thống trị đã tổ chức ra lực lượng vũ trang thường trực làm công cụ bạo lực của nhà nước."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Chừng nào còn chế độ tư hữu, còn chế độ áp bức bóc lột thì …”?","o":["lợi ích nào khác","sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa","đối kháng là nguồn gốc ra đời quân đội","quân đội vẫn còn tồn tại"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Chừng nào còn chế độ tư hữu, còn chế độ áp bức bóc lột thì quân đội vẫn còn tồn tại."},{"q":"Chọn phương án nối tiếp đúng nội dung: “c) Bản chất giai cấp của quân đội Chủ nghĩa Mác-Lênin khẳng định: Bản chất quân đội là công cụ bạo lực vũ trang của một giai cấp, nhà nước nhất định nhằm mục đích bảo vệ lợi ích …”","o":["và tổ chức mọi thắng lợi của cách mạng Việt Nam","Đảng ta xây dựng, Đảng ta lãnh đạo và giáo dục”","giai cấp thống trị và nhà nước tổ chức nuôi dưỡng sử dụng nó","thống tốt đẹp của một dân tộc có hàng ngàn năm văn hiến và"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: c) Bản chất giai cấp của quân đội Chủ nghĩa Mác-Lênin khẳng định: Bản chất quân đội là công cụ bạo lực vũ trang của một giai cấp, nhà nước nhất định nhằm mục đích bảo vệ lợi ích giai cấp thống trị và nhà nước tổ chức nuôi dưỡng sử dụng nó."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Đó là cơ sở để quân đội trung thành với nhà nước …” được hoàn thiện như thế nào?","o":["tự do, hạnh phúc của nhân dân","đội ta hiện nay được thành lập","đã tổ chức ra nó","nó không làm gián đoạn chính trị"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Đó là cơ sở để quân đội trung thành với nhà nước đã tổ chức ra nó."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Bản chất quân đội tương đối ổn định nhưng không phải là bất biến, bản chất quân đội phụ thuộc vào nhiều yếu tố như: Giai cấp, nhà nước, các lực lượng, tổ chức chính trị, xã …”","o":["đã có công dựng nước, Bác cháu ta phải cùng nhau giữ lấy nước”","đoàn người có lợi ích cơ bản đối lập nhau","nhiệm vụ chiến lược này gắn bó hữu cơ với nhau trong suốt quá","hội và việc giải quyết các mối quan hệ nội bộ trong quân đội"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Bản chất quân đội tương đối ổn định nhưng không phải là bất biến, bản chất quân đội phụ thuộc vào nhiều yếu tố như: Giai cấp, nhà nước, các lực lượng, tổ chức chính trị, xã hội và việc giải quyết các mối quan hệ nội bộ trong quân đội."},{"q":"Phương án nào điền đúng vào chỗ trống: “Hiện nay, luận điểm của các học giả tư sản là “phi chính trị hóa quân đội”, cho quân đội phải đứng ngoài chính trị, quân đội là công …”?","o":["cụ bạo lực của toàn xã hội, không mang bản chất giai cấp","tranh bất khuất, lại có sự đồng tình ủng hộ rộng lớn của các","lượng vũ trang và bảo vệ Tổ quốc xã hội chủ nghĩa","thành, phát triển quân đội kiểu mới, quân đội của giai cấp vô sản"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Hiện nay, luận điểm của các học giả tư sản là “phi chính trị hóa quân đội”, cho quân đội phải đứng ngoài chính trị, quân đội là công cụ bạo lực của toàn xã hội, không mang bản chất giai cấp."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: ““phi chính trị hóa quân đội” là một mục tiêu quan trọng trong chiến lược “Diễn biến …”?","o":["hòa bình” của chủ nghĩa đế quốc","độc lập chủ quyền và thống nhất đất nước","lợi ích nào khác","(Hồng quân) của giai cấp vô sản"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: “phi chính trị hóa quân đội” là một mục tiêu quan trọng trong chiến lược “Diễn biến hòa bình” của chủ nghĩa đế quốc."},{"q":"Theo giáo trình, ý “Nguyên tắc xây dựng quân đội kiểu mới của V.I.Lênin V.I.Lênin kế thừa, bảo vệ và phát triển lý luận của C.Mác, Ph.Ăngghen về quân đội và vận dụng thành …” kết thúc bằng nội dung nào?","o":["là một định mệnh gắn liền với con người và xã hội loài người","tổ chức, nuôi dưỡng và sử dụng quân đội","công trong xây dựng quân đôị kiểu mới của giai cấp vô sản","suy đến cùng đã dẫn đến sự xuất hiện, tồn tại của chiến tranh"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nguyên tắc xây dựng quân đội kiểu mới của V.I.Lênin V.I.Lênin kế thừa, bảo vệ và phát triển lý luận của C.Mác, Ph.Ăngghen về quân đội và vận dụng thành công trong xây dựng quân đôị kiểu mới của giai cấp vô sản."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Lênin yêu cầu phải giải tán quân đội cũ và thành lập quân đội kiểu mới …”","o":["mạng để chống lại bạo lực phản cách mạng","dạng “lao động thời cổ”","(Hồng quân) của giai cấp vô sản","phải lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Lênin yêu cầu phải giải tán quân đội cũ và thành lập quân đội kiểu mới (Hồng quân) của giai cấp vô sản."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Trong đó sự lãnh đạo của Đảng Cộng sản là nguyên tắc quan trọng nhất, quyết định đến sức mạnh, sự tồn …”","o":["luôn coi con người là nhân tố quyết định thắng lợi trong chiến tranh","(Hồng quân) của giai cấp vô sản","quân đội vẫn còn tồn tại","tại, phát triển, chiến đấu, chiến thắng của Hồng quân"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trong đó sự lãnh đạo của Đảng Cộng sản là nguyên tắc quan trọng nhất, quyết định đến sức mạnh, sự tồn tại, phát triển, chiến đấu, chiến thắng của Hồng quân."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Là cơ sở lý luận khoa học cho các Đảng Cộng sản xác định phương hướng tổ …” là gì?","o":["tại, phát triển, chiến đấu, chiến thắng của Hồng quân","chức xây dựng quân đội của mình","mang tính cách mạng và khoa học sâu sắc","Pháp để cứu Tổ quốc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Là cơ sở lý luận khoa học cho các Đảng Cộng sản xác định phương hướng tổ chức xây dựng quân đội của mình."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Ngày 22/12/1944, đội Việt Nam tuyên truyền giải phóng quân - tiền thân của quân …”?","o":["đội ta hiện nay được thành lập","mất đi tình thế cách mạng","vây hòng tiêu diệt nước Nga Xô viết","tự do, hạnh phúc của nhân dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Ngày 22/12/1944, đội Việt Nam tuyên truyền giải phóng quân - tiền thân của quân đội ta hiện nay được thành lập."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Thực tiễn lịch sử cho thấy, kẻ thù sử dụng bạo lực phản cách mạng để …”","o":["nước, bảo vệ công cuộc xây dựng chủ nghĩa xã hội”","áp bức nô dịch dân tộc ta","quần chúng đang đổ máu trên chiến trường”","chất cách mạng của giai cấp công nhân"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Thực tiễn lịch sử cho thấy, kẻ thù sử dụng bạo lực phản cách mạng để áp bức nô dịch dân tộc ta."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Để thực hiện được mục tiêu cách mạng, Chủ tịch Hồ Chí Minh và Đảng Cộng sản Việt Nam đã tổ chức ra lực lượng vũ trang cách mạng làm nòng cốt cho cuộc đấu tranh giai cấp, dân tộc mà tiền thân của …” được hoàn thiện như thế nào?","o":["giai cấp thống trị và nhà nước tổ chức nuôi dưỡng sử dụng nó","nó là những đội xích vệ đỏ, du kích vũ trang, sau đó phát","phải lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc","hội Hồ Chí Minh đã chỉ rõ, cuộc chiến tranh do thực dân Pháp"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Để thực hiện được mục tiêu cách mạng, Chủ tịch Hồ Chí Minh và Đảng Cộng sản Việt Nam đã tổ chức ra lực lượng vũ trang cách mạng làm nòng cốt cho cuộc đấu tranh giai cấp, dân tộc mà tiền thân của nó là những đội xích vệ đỏ, du kích vũ trang, sau đó phát"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “19 Quá trình xây dựng chiến đấu và trưởng thành của quân đội ta luôn gắn liền với phong trào cách mạng của quần chúng, với các cuộc chiến tranh …”","o":["kéo dài, đồng bào ta có thể phải hy sinh nhiều của nhiều người","chủ nghĩa, bảo vệ chủ nghĩa xã hội với tư cách là Tổ quốc”","hình mới của con người xã hội chủ nghĩa trong quân đội kiểu mới","giải phóng dân tộc và bảo vệ Tổ quốc xã hội chủ nghĩa"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: 19 Quá trình xây dựng chiến đấu và trưởng thành của quân đội ta luôn gắn liền với phong trào cách mạng của quần chúng, với các cuộc chiến tranh giải phóng dân tộc và bảo vệ Tổ quốc xã hội chủ nghĩa."},{"q":"Phương án nào điền đúng vào chỗ trống: “Ngay từ khi mới thành lập mặc dù đại bộ phận cán bộ chiến sỹ xuất thân từ nông dân nhưng tất cả họ đều là những người …”?","o":["có lòng yêu nước mãnh liệt, trí căm thù giặc sâu sắc","bảo vệ Tổ quốc xã hội chủ nghĩa","hội phải luôn gắn liền với bảo vệ Tổ quốc xã hội chủ nghĩa","sản xuất ra của cải vật chất và tiến hành công tác huấn luyện"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Ngay từ khi mới thành lập mặc dù đại bộ phận cán bộ chiến sỹ xuất thân từ nông dân nhưng tất cả họ đều là những người có lòng yêu nước mãnh liệt, trí căm thù giặc sâu sắc."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Sự thống nhất hữu cơ trên, từ nét đặc thù về chế độ chính trị, bản chất nhà nước, giai cấp …”?","o":["quân tăng cường bản chất giai cấp công nhân","nghĩa chưa được đặt ra một cách trực tiếp","tổ chức, nuôi dưỡng và sử dụng quân đội","nhà nước và giai cấp thống trị xã hội"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Sự thống nhất hữu cơ trên, từ nét đặc thù về chế độ chính trị, bản chất nhà nước, giai cấp tổ chức, nuôi dưỡng và sử dụng quân đội."},{"q":"Theo giáo trình, ý “Quân đội Nhân dân Việt Nam mang bản chất của giai cấp công nhân Với cương vị là người tổ chức, lãnh đạo, giáo dục và rèn luyện quân đội ta, Chủ tịch Hồ Chí …” kết thúc bằng nội dung nào?","o":["Minh thường xuyên coi trọng bản chất giai cấp công nhân cho quân đội","trong giai đoạn phát triển nhất định của xã hội loài người, khi xuất","gốc, bản chất của Quân đội trên các khía cạnh khác nhau","phát triển bản chất giai cấp công nhân của quân đội ta"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Quân đội Nhân dân Việt Nam mang bản chất của giai cấp công nhân Với cương vị là người tổ chức, lãnh đạo, giáo dục và rèn luyện quân đội ta, Chủ tịch Hồ Chí Minh thường xuyên coi trọng bản chất giai cấp công nhân cho quân đội."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Trong xây dựng bản chất giai cấp công nhân cho quân đội, Hồ Chí Minh hết sức quan tâm đến giáo dục, nuôi dưỡng các phẩm chất cách mạng, bản lĩnh chính trị và coi đó …”","o":["là cơ sơ, nền tảng để xây dựng quân đội vững mạnh toàn diện","đối nội và đường lối đối ngoại, trong đó đường lối đối ngoại phụ","thống tốt đẹp của một dân tộc có hàng ngàn năm văn hiến và","trình và kết cục của chiến tranh, chính trị quy định mục tiêu và"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trong xây dựng bản chất giai cấp công nhân cho quân đội, Hồ Chí Minh hết sức quan tâm đến giáo dục, nuôi dưỡng các phẩm chất cách mạng, bản lĩnh chính trị và coi đó là cơ sơ, nền tảng để xây dựng quân đội vững mạnh toàn diện."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Người viết: “Quân đội ta trung với Đảng, hiếu với dân, sẵn sàng chiến đấu hy sinh vì độc lập tự …”","o":["kiện sinh ra nó tiêu vong","hòa bình” của chủ nghĩa đế quốc","do của Tổ quốc, vì chủ nghĩa xã hội","những cố gắng cao nhất của chính trị"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Người viết: “Quân đội ta trung với Đảng, hiếu với dân, sẵn sàng chiến đấu hy sinh vì độc lập tự do của Tổ quốc, vì chủ nghĩa xã hội."},{"q":"Theo bài học, phần còn thiếu trong nhận định “20 Quân đội Nhân dân Việt Nam được Đảng và Chủ tịch Hồ Chí Minh trực tiếp tổ chức lãnh đạo, giáo dục và rèn luyện, được nhân dân hết lòng yêu thương, đùm bọc, đồng thời được kế thừa những truyền …” là gì?","o":["Việt Nam - Người đại biểu trung thành cho lợi ích giai cấp, dân","thống tốt đẹp của một dân tộc có hàng ngàn năm văn hiến và","định: “Bảo vệ Tổ quốc xã hội chủ nghĩa là sự nghiệp thiêng liêng,","tranh bất khuất, lại có sự đồng tình ủng hộ rộng lớn của các"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: 20 Quân đội Nhân dân Việt Nam được Đảng và Chủ tịch Hồ Chí Minh trực tiếp tổ chức lãnh đạo, giáo dục và rèn luyện, được nhân dân hết lòng yêu thương, đùm bọc, đồng thời được kế thừa những truyền thống tốt đẹp của một dân tộc có hàng ngàn năm văn hiến và"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Khẳng định, Quân đội ta từ nhân dân mà ra, vì nhân dân mà chiến đấu Đây là một trong những cống hiến của Chủ tịch …”?","o":["chất cách mạng của giai cấp công nhân","Hồ Chí Minh trong phát triển lý luận về quân đội","kéo dài, đồng bào ta có thể phải hy sinh nhiều của nhiều người","giai cấp công nhân của quân đội ta"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Khẳng định, Quân đội ta từ nhân dân mà ra, vì nhân dân mà chiến đấu Đây là một trong những cống hiến của Chủ tịch Hồ Chí Minh trong phát triển lý luận về quân đội."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Trong bài Tình đoàn kết quân dân ngày càng thêm bền chặt ngày 03/3/1952, Người viết: Quân …”","o":["(Hồng quân) của giai cấp vô sản","đội ta là Quân đội Nhân dân","cấp công nhân không có Tổ quốc”","xã hội chủ nghĩa?"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trong bài Tình đoàn kết quân dân ngày càng thêm bền chặt ngày 03/3/1952, Người viết: Quân đội ta là Quân đội Nhân dân."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Ngoài lợi ích của nhân dân, quân đội ta không có …” được hoàn thiện như thế nào?","o":["lợi ích nào khác","khác” (cụ thể là bằng bạo lực)","của kẻ thù càng quyết liệt hơn","của mỗi công dân Việt Nam"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Ngoài lợi ích của nhân dân, quân đội ta không có lợi ích nào khác."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Đảng Cộng sản Việt Nam - Người tổ chức lãnh đạo giáo dục và rèn luyện quân đội - là nhân tố quyết định sự hình thành và …”","o":["phát triển bản chất giai cấp công nhân của quân đội ta","trong giai đoạn phát triển nhất định của xã hội loài người, khi xuất","toàn dân lập nên những chiến công hiển hách trong chiến tranh giải phóng","thì chiến tranh ra đời và tồn tại như một tất yếu khách quan"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đảng Cộng sản Việt Nam - Người tổ chức lãnh đạo giáo dục và rèn luyện quân đội - là nhân tố quyết định sự hình thành và phát triển bản chất giai cấp công nhân của quân đội ta."},{"q":"Phương án nào điền đúng vào chỗ trống: “Điều này được thể hiện rõ nét trong cơ chế lãnh đạo: Tuyệt đối trực tiếp về mọi mặt của Đảng đối với quân đội trong …”?","o":["khí trang bị” của quân đội do chúng tổ chức ra và nuôi dưỡng","lãnh đạo xây dựng đất nước, chống lại sự chống phá của kẻ thù","thực hiện chế độ công tác đảng, công tác chính trị","công nhân và nhân dân lao động"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Điều này được thể hiện rõ nét trong cơ chế lãnh đạo: Tuyệt đối trực tiếp về mọi mặt của Đảng đối với quân đội trong thực hiện chế độ công tác đảng, công tác chính trị."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Thành tựu to lớn trong tăng cường bản chất giai cấp công nhân cho quân đội ta là, Đảng đã đào tạo nên những thế hệ “Bộ đội cụ Hồ”, một mẫu …”?","o":["lực lượng lãnh đạo chính trị trong các bên tham chiến","với kẻ thù giai cấp và kẻ thù dân tộc","toàn dân lập nên những chiến công hiển hách trong chiến tranh giải phóng","hình mới của con người xã hội chủ nghĩa trong quân đội kiểu mới"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Thành tựu to lớn trong tăng cường bản chất giai cấp công nhân cho quân đội ta là, Đảng đã đào tạo nên những thế hệ “Bộ đội cụ Hồ”, một mẫu hình mới của con người xã hội chủ nghĩa trong quân đội kiểu mới."},{"q":"Theo giáo trình, ý “Chủ tịch Hồ Chí Minh đã chỉ rõ: “Quân đội ta có sức mạnh vô địch vì nó là một Quân đội Nhân dân do …” kết thúc bằng nội dung nào?","o":["hội và bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa","Đảng ta xây dựng, Đảng ta lãnh đạo và giáo dục”","công nhân, đồng thời có tính nhân dân và tính dân tộc sâu sắc","tham gia vào cuộc xung đột đó"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Chủ tịch Hồ Chí Minh đã chỉ rõ: “Quân đội ta có sức mạnh vô địch vì nó là một Quân đội Nhân dân do Đảng ta xây dựng, Đảng ta lãnh đạo và giáo dục”."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Chủ tịch 21 Hồ Chí Minh khẳng định: “Hiện nay quân đội ta …”","o":["có hai nhiệm vụ chính","đứng lên đánh thực dân Pháp cứu Tổ quốc”","trong điều kiện cụ thể ở Việt Nam","tham gia vào cuộc xung đột đó"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Chủ tịch 21 Hồ Chí Minh khẳng định: “Hiện nay quân đội ta có hai nhiệm vụ chính."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Hai là, thiết thực tham gia lao động sản xuất góp phần xây …”","o":["VỀ QUÂN ĐỘI 1","tham gia vào cuộc xung đột đó","dựng chủ nghĩa xã hội”","của kẻ thù càng quyết liệt hơn"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Hai là, thiết thực tham gia lao động sản xuất góp phần xây dựng chủ nghĩa xã hội”."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Trước tình hình nhiệm vụ mới của cách mạng và của quân đội, ngoài nhiệm vụ chiến đấu và sẵn sàng chiến đấu, quân đội phải tham gia vào nhiệm vụ xây dựng đất nước …” là gì?","o":["Xô viết, chính quyền của những người lao động, rằng họ bảo vệ sự","và tổ chức mọi thắng lợi của cách mạng Việt Nam","sản xuất ra của cải vật chất và tiến hành công tác huấn luyện","đang đặt ra có tính cấp thiết cả về lý luận và thực tiễn"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Trước tình hình nhiệm vụ mới của cách mạng và của quân đội, ngoài nhiệm vụ chiến đấu và sẵn sàng chiến đấu, quân đội phải tham gia vào nhiệm vụ xây dựng đất nước, sản xuất ra của cải vật chất và tiến hành công tác huấn luyện."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Với tư cách là đội quân chiến đấu, quân đội luôn sẵn sàng chiến đấu và chiến đấu chống xâm lược, bảo vệ Tổ quốc xã hội chủ nghĩa, góp phần bảo vệ trật tự, an toàn xã hội, tham gia vào cuộc tiến …”?","o":["vũ trang chuyên nghiệp, cũng như vũ khí chuyên dùng","công địch trên mặt trận lý luận, chính trị - tư tưởng, văn hoá","đã có công dựng nước, Bác cháu ta phải cùng nhau giữ lấy nước”","dựng để dùng vào cuộc chiến tranh tiến công hoặc chiến tranh phòng ngự”"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Với tư cách là đội quân chiến đấu, quân đội luôn sẵn sàng chiến đấu và chiến đấu chống xâm lược, bảo vệ Tổ quốc xã hội chủ nghĩa, góp phần bảo vệ trật tự, an toàn xã hội, tham gia vào cuộc tiến công địch trên mặt trận lý luận, chính trị - tư tưởng, văn hoá;"},{"q":"Chọn phương án nối tiếp đúng nội dung: “là đội quân công tác, quân đội tham gia vận động quần chúng nhân dân xây dựng cơ sở chính trị - xã hội vững mạnh, góp phần tăng cường …”","o":["sự đoàn kết giữa Đảng với nhân dân, quân đội với nhân dân","phải lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc","gốc, bản chất của Quân đội trên các khía cạnh khác nhau","với kẻ thù giai cấp và kẻ thù dân tộc"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: là đội quân công tác, quân đội tham gia vận động quần chúng nhân dân xây dựng cơ sở chính trị - xã hội vững mạnh, góp phần tăng cường sự đoàn kết giữa Đảng với nhân dân, quân đội với nhân dân;"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Thực tiễn hơn 70 năm xây dựng, chiến đấu, trưởng thành của quân đội ta đã chứng minh: Quân đội đã thực hiện đầy đủ và thực hiện xuất sắc ba chức năng trên cùng toàn Đảng …” được hoàn thiện như thế nào?","o":["toàn dân lập nên những chiến công hiển hách trong chiến tranh giải phóng","C.Mác và Ph.Ăngghen chỉ ra rằng, giai cấp công nhân phải đấu tranh trở","luôn dành sự chăm lo đặc biệt đối với quân đội","đã có công dựng nước, Bác cháu ta phải cùng nhau giữ lấy nước”"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Thực tiễn hơn 70 năm xây dựng, chiến đấu, trưởng thành của quân đội ta đã chứng minh: Quân đội đã thực hiện đầy đủ và thực hiện xuất sắc ba chức năng trên cùng toàn Đảng, toàn dân lập nên những chiến công hiển hách trong chiến tranh giải phóng."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Quân đội luôn phải là đội quân cách mạng, lực lượng chính trị, công cụ vũ trang sắc bén của Đảng, có sức chiến đấu cao, sẵn sàng …”","o":["đánh bại mọi kẻ thù, hoàn thành thắng lợi mọi nhiệm vụ","khí trang bị” của quân đội do chúng tổ chức ra và nuôi dưỡng","hoạt động của Chủ tịch Hồ Chí Minh","hội phải luôn gắn liền với bảo vệ Tổ quốc xã hội chủ nghĩa"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Quân đội luôn phải là đội quân cách mạng, lực lượng chính trị, công cụ vũ trang sắc bén của Đảng, có sức chiến đấu cao, sẵn sàng đánh bại mọi kẻ thù, hoàn thành thắng lợi mọi nhiệm vụ..."},{"q":"Phương án nào điền đúng vào chỗ trống: “QUAN ĐIỂM CỦA CHỦ NGHĨA MÁC-LÊNIN TƯ TƯỞNG HỒ CHÍ MINH VỀ BẢO VỆ TỔ …”?","o":["đó là sử dụng bạo lực","giai cấp công nhân của quân đội ta","đội ta là Quân đội Nhân dân","QUỐC XÃ HỘI CHỦ NGHĨA 1"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: QUAN ĐIỂM CỦA CHỦ NGHĨA MÁC-LÊNIN TƯ TƯỞNG HỒ CHÍ MINH VỀ BẢO VỆ TỔ QUỐC XÃ HỘI CHỦ NGHĨA 1."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Vấn đề Tổ quốc của giai cấp nào và giai cấp …”?","o":["công nhân và nhân dân lao động","nào không có tổ quốc","nhưng giữ được chính quyền còn khó khăn hơn”","nghĩa chưa được đặt ra một cách trực tiếp"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Vấn đề Tổ quốc của giai cấp nào và giai cấp nào không có tổ quốc."},{"q":"Theo giáo trình, ý “Trong điều kiện lịch sử cụ thể, thời C.Mác, Ph.Ăngghen sống, vấn đề bảo vệ Tổ quốc xã hội chủ …” kết thúc bằng nội dung nào?","o":["tích cực hoặc tiêu cực","nghĩa chưa được đặt ra một cách trực tiếp","tranh chỉ là một hiện tượng lịch sử cụ thể","có lòng yêu nước mãnh liệt, trí căm thù giặc sâu sắc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trong điều kiện lịch sử cụ thể, thời C.Mác, Ph.Ăngghen sống, vấn đề bảo vệ Tổ quốc xã hội chủ nghĩa chưa được đặt ra một cách trực tiếp."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Học thuyết bảo vệ Tổ quốc xã hội chủ nghĩa là một cống hiến mới của V.I.Lênin vào kho tàng lý luận chủ nghĩa Mác, đáp ứng nhiệm vụ bảo vệ Tổ quốc …”","o":["lập nhau cùng tồn tại và đấu tranh với nhau hết sức quyết liệt","xã hội chủ nghĩa đang đặt ra trực tiếp ở nước Nga Xô viết","với kẻ thù giai cấp và kẻ thù dân tộc","và tổ chức mọi thắng lợi của cách mạng Việt Nam"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Học thuyết bảo vệ Tổ quốc xã hội chủ nghĩa là một cống hiến mới của V.I.Lênin vào kho tàng lý luận chủ nghĩa Mác, đáp ứng nhiệm vụ bảo vệ Tổ quốc xã hội chủ nghĩa đang đặt ra trực tiếp ở nước Nga Xô viết."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Chúng ta tán thành “bảo vệ Tổ quốc”, nhưng cuộc chiến tranh giữ nước mà chúng ta đang đi tới là một cuộc chiến tranh bảo vệ Tổ quốc xã hội …”","o":["khí trang bị” của quân đội do chúng tổ chức ra và nuôi dưỡng","chủ nghĩa, bảo vệ chủ nghĩa xã hội với tư cách là Tổ quốc”","thì Tổ quốc xã hội chủ nghĩa cũng bắt đầu hình thành","cốt và xung kích trong xây dựng kinh tế - quốc phòng ở các"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Chúng ta tán thành “bảo vệ Tổ quốc”, nhưng cuộc chiến tranh giữ nước mà chúng ta đang đi tới là một cuộc chiến tranh bảo vệ Tổ quốc xã hội chủ nghĩa, bảo vệ chủ nghĩa xã hội với tư cách là Tổ quốc”."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Giai cấp công nhân bắt tay vào công cuộc cải tạo xã hội cũ và xây dựng xã hội …” là gì?","o":["đạo của Đảng Cộng sản","mới, xã hội - xã hội chủ nghĩa","nhà nước thống trị bóc lột","với kẻ thù giai cấp và kẻ thù dân tộc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Giai cấp công nhân bắt tay vào công cuộc cải tạo xã hội cũ và xây dựng xã hội mới, xã hội - xã hội chủ nghĩa."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Xuất phát từ quy luật phát triển không đều của chủ nghĩa đế quốc Ngay từ những năm cuối thế kỷ XIX, V.I.Lênin đã chỉ ra, do quy luật phát triển không đều của chủ nghĩa đế quốc mà chủ …”?","o":["hội và bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa","nghĩa xã hội có thể giành thắng lợi không đồng thời ở các nước","cập đến vấn đề này, song đáng chú ý nhất là tư tưởng của","trên đã phản ánh nét đặc sắc của chiến tranh nhân dân Việt Nam"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Xuất phát từ quy luật phát triển không đều của chủ nghĩa đế quốc Ngay từ những năm cuối thế kỷ XIX, V.I.Lênin đã chỉ ra, do quy luật phát triển không đều của chủ nghĩa đế quốc mà chủ nghĩa xã hội có thể giành thắng lợi không đồng thời ở các nước."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Xuất phát từ bản chất, âm mưu của kẻ thù và thực tiễn cách mạng thế giới Sự thắng lợi của cách mạng xã hội chủ nghĩa, giai cấp tư sản trong nước tuy đã bị đánh đổ về mặt chính trị, nhưng chúng vẫn chưa …”","o":["Hồ Chí Minh trong phát triển lý luận về quân đội","là ý kiến ban đầu về bảo vệ Tổ quốc xã hội chủ nghĩa","hội Hồ Chí Minh đã chỉ rõ, cuộc chiến tranh do thực dân Pháp","từ bỏ tham vọng muốn quay trở lại địa vị thống trị đã mất"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Xuất phát từ bản chất, âm mưu của kẻ thù và thực tiễn cách mạng thế giới Sự thắng lợi của cách mạng xã hội chủ nghĩa, giai cấp tư sản trong nước tuy đã bị đánh đổ về mặt chính trị, nhưng chúng vẫn chưa từ bỏ tham vọng muốn quay trở lại địa vị thống trị đã mất."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Thực tiễn lịch sử đã chứng minh rằng, từ khi Tổ quốc xã hội chủ nghĩa xuất hiện, nhân dân các nước xã hội chủ nghĩa phải đương 23 đầu chống trả những âm mưu và …” được hoàn thiện như thế nào?","o":["vũ trang thường trực làm công cụ bạo lực của nhà nước","động và giai cấp vô sản thế giới có nghĩa vụ ủng hộ sự","công cụ đặc biệt đó là bạo lực vũ trang","hành động lật đổ, xâm lược của kẻ thù bên trong và bên ngoài"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Thực tiễn lịch sử đã chứng minh rằng, từ khi Tổ quốc xã hội chủ nghĩa xuất hiện, nhân dân các nước xã hội chủ nghĩa phải đương 23 đầu chống trả những âm mưu và hành động lật đổ, xâm lược của kẻ thù bên trong và bên ngoài."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Từ khi chủ nghĩa xã hội phát triển thành hệ thống trên thế giới, sự chống phá …”","o":["cuồng chống phá nước Nga Xô viết","bản chất chiến tranh?","tham gia vào cuộc xung đột đó","của kẻ thù càng quyết liệt hơn"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Từ khi chủ nghĩa xã hội phát triển thành hệ thống trên thế giới, sự chống phá của kẻ thù càng quyết liệt hơn."},{"q":"Phương án nào điền đúng vào chỗ trống: “Thực tiễn trên đây một lần nữa đã chứng minh cho luận điểm của V.I.Lênin rằng: “Giành chính quyền đã khó …”?","o":["quân tăng cường bản chất giai cấp công nhân","nhưng giữ được chính quyền còn khó khăn hơn”","tính ngẫu nhiên tự phát","mọi hoàn cảnh, tình huống chiến tranh"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Thực tiễn trên đây một lần nữa đã chứng minh cho luận điểm của V.I.Lênin rằng: “Giành chính quyền đã khó, nhưng giữ được chính quyền còn khó khăn hơn”."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Đó là những năm tháng cực kỳ gian khổ, khó khăn, Người chỉ rõ: “Bảo vệ Tổ quốc xã hội chủ nghĩa là nhiệm vụ, là trách nhiệm của toàn Đảng, toàn dân, của giai cấp vô sản trong nước, nhân dân lao …”?","o":["trong giai đoạn phát triển nhất định của xã hội loài người, khi xuất","động và giai cấp vô sản thế giới có nghĩa vụ ủng hộ sự","nhiệm vụ bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa hiện nay","quan điểm chính trị, quân sự của giai cấp mình"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đó là những năm tháng cực kỳ gian khổ, khó khăn, Người chỉ rõ: “Bảo vệ Tổ quốc xã hội chủ nghĩa là nhiệm vụ, là trách nhiệm của toàn Đảng, toàn dân, của giai cấp vô sản trong nước, nhân dân lao động và giai cấp vô sản thế giới có nghĩa vụ ủng hộ sự"},{"q":"Theo giáo trình, ý “Người luôn lạc quan tin tưởng về sức mạnh bảo vệ Tổ quốc của giai cấp …” kết thúc bằng nội dung nào?","o":["chức xây dựng quân đội của mình","dân chống thực dân, đế quốc xâm lược","công nhân và nhân dân lao động","hội, các đoàn thể nhân dân lao động"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Người luôn lạc quan tin tưởng về sức mạnh bảo vệ Tổ quốc của giai cấp công nhân và nhân dân lao động."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “c) Bảo vệ Tổ quốc xã hội chủ nghĩa, phải thường xuyên tăng cường tiềm lực quốc phòng gắn với phát triển kinh tế - xã hội Học thuyết Bảo vệ Tổ quốc xã hội chủ nghĩa của V.I.Lênin đã khẳng …”","o":["là ý kiến ban đầu về bảo vệ Tổ quốc xã hội chủ nghĩa","thêm những mâu thuẫn vốn có trong xã hội có đối kháng giai cấp","định: “Bảo vệ Tổ quốc xã hội chủ nghĩa là sự nghiệp thiêng liêng,","là cơ sơ, nền tảng để xây dựng quân đội vững mạnh toàn diện"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: c) Bảo vệ Tổ quốc xã hội chủ nghĩa, phải thường xuyên tăng cường tiềm lực quốc phòng gắn với phát triển kinh tế - xã hội Học thuyết Bảo vệ Tổ quốc xã hội chủ nghĩa của V.I.Lênin đã khẳng định: “Bảo vệ Tổ quốc xã hội chủ nghĩa là sự nghiệp thiêng liêng,"},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “đẩy mạnh phát triển kinh tế - văn hoá, khoa học kỹ thuật, vận dụng đường lối đối ngoại khôn khéo, kiên định về nguyên tắc, mềm dẻo về …”","o":["phải lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc","sách lược, triệt để lợi dụng mâu thuẫn trong hàng ngũ kẻ thù","giải phóng dân tộc và bảo vệ Tổ quốc xã hội chủ nghĩa","đã có công dựng nước, Bác cháu ta phải cùng nhau giữ lấy nước”"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: đẩy mạnh phát triển kinh tế - văn hoá, khoa học kỹ thuật, vận dụng đường lối đối ngoại khôn khéo, kiên định về nguyên tắc, mềm dẻo về sách lược, triệt để lợi dụng mâu thuẫn trong hàng ngũ kẻ thù;"},{"q":"Theo bài học, phần còn thiếu trong nhận định “24 d) Đảng Cộng sản lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa V.I.Lênin chỉ ra rằng: Đảng Cộng sản …” là gì?","o":["nghĩa xã hội có thể giành thắng lợi không đồng thời ở các nước","Minh thường xuyên coi trọng bản chất giai cấp công nhân cho quân đội","phải lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc","xã hội chủ nghĩa, chuyển lập trường của giai cấp xuất thân sang lập"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: 24 d) Đảng Cộng sản lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa V.I.Lênin chỉ ra rằng: Đảng Cộng sản phải lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Trong quân đội, chế độ chính uỷ được thực hiện, cán bộ chính trị được lấy từ đại biểu ưu tú của công nông, thực chất đó là đại diện …”?","o":["nghĩa chưa được đặt ra một cách trực tiếp","cụ bạo lực của toàn xã hội, không mang bản chất giai cấp","là ý kiến ban đầu về bảo vệ Tổ quốc xã hội chủ nghĩa","của Đảng, để thực hiện sự lãnh đạo của Đảng trong quân đội"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trong quân đội, chế độ chính uỷ được thực hiện, cán bộ chính trị được lấy từ đại biểu ưu tú của công nông, thực chất đó là đại diện của Đảng, để thực hiện sự lãnh đạo của Đảng trong quân đội."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Sự lãnh đạo của Đảng là nguyên tắc cao nhất, là nguồn gốc sức mạnh vững chắc …”","o":["bảo vệ Tổ quốc xã hội chủ nghĩa","thực hiện chế độ công tác đảng, công tác chính trị","thì Tổ quốc xã hội chủ nghĩa cũng bắt đầu hình thành","nhà nước thống trị bóc lột"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Sự lãnh đạo của Đảng là nguyên tắc cao nhất, là nguồn gốc sức mạnh vững chắc bảo vệ Tổ quốc xã hội chủ nghĩa."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “a) Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa là một tất yếu khách quan Tính tất yếu khách quan của sự nghiệp bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa được Hồ Chí Minh chỉ rõ: “Các Vua Hùng …” được hoàn thiện như thế nào?","o":["lập nhau cùng tồn tại và đấu tranh với nhau hết sức quyết liệt","chủ nghĩa của V.I.Lênin vào tình hình thực tiễn của cách mạng Việt Nam","đã có công dựng nước, Bác cháu ta phải cùng nhau giữ lấy nước”","Hồ Chí Minh trong phát triển lý luận về quân đội"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: a) Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa là một tất yếu khách quan Tính tất yếu khách quan của sự nghiệp bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa được Hồ Chí Minh chỉ rõ: “Các Vua Hùng đã có công dựng nước, Bác cháu ta phải cùng nhau giữ lấy nước”."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Ngay sau khi Cách mạng tháng Tám năm 1945 thành công, trước sự uy hiếp của thực dân đế quốc và bọn phản động tay sai, Hồ Chí Minh đã cùng Đảng đề ra nhiều biện pháp thiết thực, cụ thể …”","o":["lối, quan điểm, chính sách của Đảng, pháp luật của Nhà nước","cụ bạo lực của toàn xã hội, không mang bản chất giai cấp","tranh bất khuất, lại có sự đồng tình ủng hộ rộng lớn của các","để giữ vững chính quyền nhân dân chuẩn bị cho kháng chiến lâu dài"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Ngay sau khi Cách mạng tháng Tám năm 1945 thành công, trước sự uy hiếp của thực dân đế quốc và bọn phản động tay sai, Hồ Chí Minh đã cùng Đảng đề ra nhiều biện pháp thiết thực, cụ thể để giữ vững chính quyền nhân dân chuẩn bị cho kháng chiến lâu dài."},{"q":"Phương án nào điền đúng vào chỗ trống: ““Hễ còn một tên xâm lược trên đất nước ta, thì ta còn phải tiếp tục chiến đấu quét sạch nó đi”, trước khi đi xa, trong bản di chúc Người căn dặn: “Cuộc kháng chiến chống Mỹ cứu nước có thể còn …”?","o":["tranh bất khuất, lại có sự đồng tình ủng hộ rộng lớn của các","bất kỳ người già, người trẻ, không chia tôn giáo, đảng phái, dân tộc","xảy ra chiến tranh, chiến tranh là bạn đường của chủ nghĩa đế quốc","kéo dài, đồng bào ta có thể phải hy sinh nhiều của nhiều người"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: “Hễ còn một tên xâm lược trên đất nước ta, thì ta còn phải tiếp tục chiến đấu quét sạch nó đi”, trước khi đi xa, trong bản di chúc Người căn dặn: “Cuộc kháng chiến chống Mỹ cứu nước có thể còn kéo dài, đồng bào ta có thể phải hy sinh nhiều của nhiều người."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Ý chí quyết tâm giải phóng dân tộc, bảo vệ Tổ quốc là tư tưởng xuyên suốt trong cuộc đời …”?","o":["quyền cách mạng còn non trẻ của giai cấp công nhân","chính quyền Xô viết các cấp","phòng và an ninh bảo vệ Tổ quốc","hoạt động của Chủ tịch Hồ Chí Minh"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Ý chí quyết tâm giải phóng dân tộc, bảo vệ Tổ quốc là tư tưởng xuyên suốt trong cuộc đời hoạt động của Chủ tịch Hồ Chí Minh."},{"q":"Theo giáo trình, ý “Bảo vệ Tổ quốc xã hội chủ nghĩa là trách nhiệm, nghĩa vụ …” kết thúc bằng nội dung nào?","o":["của mỗi công dân Việt Nam","mất đi tình thế cách mạng","V.I.Lênin vẫn giữ nguyên giá trị","vây hòng tiêu diệt nước Nga Xô viết"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Bảo vệ Tổ quốc xã hội chủ nghĩa là trách nhiệm, nghĩa vụ của mỗi công dân Việt Nam."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Khi thực dân Pháp quay trở lại xâm lược nước ta, Người kêu gọi: “Hễ là người Việt Nam thì phải …”","o":["đứng lên đánh thực dân Pháp cứu Tổ quốc”","dân cách mạng, chính quy, tinh nhuệ, từng bước hiện đại","Pháp để cứu Tổ quốc","sách lược, triệt để lợi dụng mâu thuẫn trong hàng ngũ kẻ thù"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Khi thực dân Pháp quay trở lại xâm lược nước ta, Người kêu gọi: “Hễ là người Việt Nam thì phải đứng lên đánh thực dân Pháp cứu Tổ quốc”."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Để bảo vệ Tổ quốc xã hội chủ nghĩa, Chủ tịch Hồ Chí Minh rất coi trọng xây dựng và củng cố nền quốc phòng toàn dân, an ninh dân dân, xây dựng Quân đội …”","o":["của cải để giữ vững quyền tự do độc lập ấy”","cụ bạo lực của toàn xã hội, không mang bản chất giai cấp","Nhân dân, coi đó là lực lượng chủ chốt để bảo vệ Tổ quốc","sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Để bảo vệ Tổ quốc xã hội chủ nghĩa, Chủ tịch Hồ Chí Minh rất coi trọng xây dựng và củng cố nền quốc phòng toàn dân, an ninh dân dân, xây dựng Quân đội Nhân dân, coi đó là lực lượng chủ chốt để bảo vệ Tổ quốc."},{"q":"Theo bài học, phần còn thiếu trong nhận định “d) Đảng Cộng sản Việt Nam lãnh đạo sự nghiệp bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa Đảng ta là người lãnh đạo …” là gì?","o":["từ bỏ tham vọng muốn quay trở lại địa vị thống trị đã mất","giai cấp thống trị và nhà nước tổ chức nuôi dưỡng sử dụng nó","chịu mất nước, nhất định không chịu làm nô lệ","và tổ chức mọi thắng lợi của cách mạng Việt Nam"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: d) Đảng Cộng sản Việt Nam lãnh đạo sự nghiệp bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa Đảng ta là người lãnh đạo và tổ chức mọi thắng lợi của cách mạng Việt Nam."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Quán triệt tư tưởng Hồ Chí Minh về bảo vệ Tổ quốc, ngày nay toàn Đảng, toàn dân, toàn quân ta đang thực hiện hai nhiệm vụ chiến lược xây dựng thành công chủ nghĩa xã …”?","o":["phải lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc","công trong xây dựng quân đôị kiểu mới của giai cấp vô sản","Nhân dân, coi đó là lực lượng chủ chốt để bảo vệ Tổ quốc","hội và bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Quán triệt tư tưởng Hồ Chí Minh về bảo vệ Tổ quốc, ngày nay toàn Đảng, toàn dân, toàn quân ta đang thực hiện hai nhiệm vụ chiến lược xây dựng thành công chủ nghĩa xã hội và bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Một là, xây dựng tiềm lực toàn diện của đất nước, đặc biệt tiềm lực kinh tế, tạo ra thế và lực mới cho …”","o":["nghĩa xã hội có thể giành thắng lợi không đồng thời ở các nước","hội phải luôn gắn liền với bảo vệ Tổ quốc xã hội chủ nghĩa","sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa","tự do, hạnh phúc của nhân dân"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Một là, xây dựng tiềm lực toàn diện của đất nước, đặc biệt tiềm lực kinh tế, tạo ra thế và lực mới cho sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Ba là, quán triệt tư tưởng cách mạng tiến công, chủ động đánh thắng định trong …” được hoàn thiện như thế nào?","o":["đội ta hiện nay được thành lập","nhưng giữ được chính quyền còn khó khăn hơn”","chính quyền Xô viết các cấp","mọi hoàn cảnh, tình huống chiến tranh"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Ba là, quán triệt tư tưởng cách mạng tiến công, chủ động đánh thắng định trong mọi hoàn cảnh, tình huống chiến tranh."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Học thuyết Mác-Lênin, tư tưởng Hồ Chí Minh về chiến tranh, quân đội và
