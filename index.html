ước, quyền và lợi ích hợp pháp của tổ chức, cá nhân;"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Giải pháp bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội - Tăng cường công tác bảo …”?","o":["bình, tránh đối đầu, không để xảy ra xung đột, chiến tranh biên giới","quốc gia, trật tự, an toàn xã hội","vệ Đảng, bảo vệ an ninh chính trị nội bộ","trương và trong xử lý các tình huống cụ thể"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Giải pháp bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội - Tăng cường công tác bảo vệ Đảng, bảo vệ an ninh chính trị nội bộ."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Tăng cường công tác bảo vệ an ninh tư tưởng, văn hóa, an …”","o":["ninh thông tin, truyền thông","quốc phòng, đối ngoại","về an ninh, trật tự","chủ quyền, toàn vẹn lãnh thổ"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tăng cường công tác bảo vệ an ninh tư tưởng, văn hóa, an ninh thông tin, truyền thông."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Tiếp tục củng cố, mở rộng, phát triển quan hệ hợp tác với các nước và các tổ chức quốc tế trong công tác bảo đảm an …” được hoàn thiện như thế nào?","o":["ninh quốc gia, bảo đảm trật tự, an toàn xã hội","bảo đảm trật tự, an toàn xã hội theo quy định của pháp luật","xã hội trong từng giai đoạn cách mạng","thuật, phát thanh, truyền hình, viễn thông,"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tiếp tục củng cố, mở rộng, phát triển quan hệ hợp tác với các nước và các tổ chức quốc tế trong công tác bảo đảm an ninh quốc gia, bảo đảm trật tự, an toàn xã hội."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Nhận thức của anh (chị) về quan điểm của Đảng và Nhà nước ta về công tác bảo vệ an ninh quốc …”","o":["phán và cán bộ làm công tác thi hành án hình sự","phạm độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc”","trong đó mọi người được sống yên ổn trên cơ sở các quy phạm","gia và bảo đảm trật tự, an toàn xã hội?"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nhận thức của anh (chị) về quan điểm của Đảng và Nhà nước ta về công tác bảo vệ an ninh quốc gia và bảo đảm trật tự, an toàn xã hội?"},{"q":"Phương án nào điền đúng vào chỗ trống: “Trách nhiệm của sinh viên trong công tác bảo vệ an ninh quốc gia, bảo đảm trật …”?","o":["toàn xã hội của tổ chức, cá nhân","tự, an toàn xã hội hiện nay?","làm lung lay sự ổn định của xã hội","những mục tiêu cụ thể"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trách nhiệm của sinh viên trong công tác bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội hiện nay?"},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “[2] Đảng Cộng sản Việt Nam, Văn kiện Đại hội đại biểu toàn quốc lần …”?","o":["đại đoàn kết toàn dân tộc","thứ VIII, IX, X, XI, XII, XIII","thuật, phát thanh, truyền hình, viễn thông,","thiên tai và tìm kiếm cứu nạn"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: [2] Đảng Cộng sản Việt Nam, Văn kiện Đại hội đại biểu toàn quốc lần thứ VIII, IX, X, XI, XII, XIII;"},{"q":"Theo giáo trình, ý “Luật Giáo dục quốc phòng và an ninh năm 2013,… [5] Bộ Quốc phòng, Trung tâm Từ điển bách khoa quân sự, Từ điển bách khoa quân …” kết thúc bằng nội dung nào?","o":["vệ Đảng, bảo vệ an ninh chính trị nội bộ","vẫn có thể có mặt cần tranh thủ, hợp tác","sự Việt Nam, Nxb Quân đội Nhân dân, Hà Nội 2004","dồi dào, có ưu thế kinh tế, khoa học kỹ thuật"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Luật Giáo dục quốc phòng và an ninh năm 2013,… [5] Bộ Quốc phòng, Trung tâm Từ điển bách khoa quân sự, Từ điển bách khoa quân sự Việt Nam, Nxb Quân đội Nhân dân, Hà Nội 2004."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “[6] Giáo trình Lịch sử quân sự, Nxb Quân đội Nhân …”","o":["địa phương trong bảo vệ an ninh, trật tự","phòng ngừa, giữ vững bên trong là chính","gồm: tội phạm hình sự được kiềm chế","dân, Hà Nội năm 1997"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: [6] Giáo trình Lịch sử quân sự, Nxb Quân đội Nhân dân, Hà Nội năm 1997."}]}],"hp2":[{"id":1,"title":"PHÒNG, CHỐNG CHIẾN LƯỢC “DIỄN BIẾN HOÀ BÌNH”, BẠO LOẠN LẬT ĐỔ CỦA CÁC THẾ LỰC THÙ ĐỊCH ĐỐI VỚI CÁCH MẠNG VIỆT NAM","questions":[{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Bài 1 PHÒNG, CHỐNG CHIẾN LƯỢC “DIỄN BIẾN HOÀ BÌNH”, BẠO LOẠN LẬT ĐỔ CỦA CÁC THẾ LỰC THÙ ĐỊCH …”","o":["tư sản vào các tầng lớp nhân dân","ĐỐI VỚI CÁCH MẠNG VIỆT NAM ---------------- A","vững an ninh kinh tế, chính trị , văn hoá, tư tưởng","đạo của thành phần kinh tế Nhà nước"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Bài 1 PHÒNG, CHỐNG CHIẾN LƯỢC “DIỄN BIẾN HOÀ BÌNH”, BẠO LOẠN LẬT ĐỔ CỦA CÁC THẾ LỰC THÙ ĐỊCH ĐỐI VỚI CÁCH MẠNG VIỆT NAM ---------------- A."},{"q":"Theo bài học, phần còn thiếu trong nhận định “MỤC ĐÍCH: Nắm vững âm mưu, thủ đoạn “diễn biến hòa bình”, bạo loạn lật đổ của các thế lực thù địch chống phá các nước …” là gì?","o":["hoạt động của các tổ chức quần chúng","lược “Diễn biến hoà bình” của kẻ thù chống phá nước ta hiện nay","– linh hoạt - đúng đối tượng - không để lan rộng, kéo dài","xã hội chủ nghĩa và cách mạng Việt Nam hiện nay"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: MỤC ĐÍCH: Nắm vững âm mưu, thủ đoạn “diễn biến hòa bình”, bạo loạn lật đổ của các thế lực thù địch chống phá các nước xã hội chủ nghĩa và cách mạng Việt Nam hiện nay."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “YÊU CẦU: Ra sức học tập trau dồi phẩm chất, năng lực của người đoàn viên thanh niên, kế tiếp các thế hệ cha anh góp phần thực hiện thắng lợi nhiệm …”?","o":["vụ xây dựng bả o vệ Tổ quốc Việt Nam xã hội chủ nghĩa","tăng cường hoạt động tình báo thu thập bí mật quốc gia","suy yếu và lật đổ các nước xã hội chủ nghĩa","chống lại làn sóng cộng sản, lật đổ các nước xã hội chủ nghĩa"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: YÊU CẦU: Ra sức học tập trau dồi phẩm chất, năng lực của người đoàn viên thanh niên, kế tiếp các thế hệ cha anh góp phần thực hiện thắng lợi nhiệm vụ xây dựng bả o vệ Tổ quốc Việt Nam xã hội chủ nghĩa."},{"q":"Chọn phương án nối tiếp đúng nội dung: “CHIẾN LƯỢC “DIỄN BIẾN HÒA BÌNH”, BẠO LOẠN LẬT ĐỔ CỦ A CÁC THẾ LỰC THÙ ĐỊCH CHỐNG PHÁ …”","o":["lên biểu tình chống lại chính quyền địa phương","tham mưu, quân đội và công an làm nòng cốt","CÁC NƯỚC XÃ HỘI CHỦ NGHĨA I .1","chính, sang tiến công bằng “diễn biến hoà bình” là chủ yếu"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: CHIẾN LƯỢC “DIỄN BIẾN HÒA BÌNH”, BẠO LOẠN LẬT ĐỔ CỦ A CÁC THẾ LỰC THÙ ĐỊCH CHỐNG PHÁ CÁC NƯỚC XÃ HỘI CHỦ NGHĨA I .1."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Nội dung chính của chiến lược “Diễn biến hoà bình” là kẻ thù sử dụng mọi thủ đoạn kinh tế, chính trị, tư tưởng, văn hoá, xã hội, đối ngoạ i, an ninh … để …” được hoàn thiện như thế nào?","o":["xã hội chủ nghĩa và cách mạng Việt Nam hiện nay","trung vào: Giáo dục tình yêu quê hương, đất nước","phá hoại, làm suy yếu từ bên trong các nước xã hội chủ nghĩa","“mềm” trên tất cả các lĩnh vực để chống phá cách mạng nước ta"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nội dung chính của chiến lược “Diễn biến hoà bình” là kẻ thù sử dụng mọi thủ đoạn kinh tế, chính trị, tư tưởng, văn hoá, xã hội, đối ngoạ i, an ninh … để phá hoại, làm suy yếu từ bên trong các nước xã hội chủ nghĩa."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Kích động các mâu thuẫn trong xã hộ i, tạ o ra các lực lượng chính trị đố i lập, núp dưới chiêu bài tự do, dân chủ, nhân quyền, tự do tôn giáo, sắc tộc, khuyến khích tư nhân hoá về kinh tế và đa …”","o":["kẻ thù sử dụng để chống phá sự nghiệp cách mạng Việt Nam","phá hoại, làm suy yếu từ bên trong các nước xã hội chủ nghĩa","bạo loạn lật đổ, cần có phương thức xử lý cụ thể, hiệu quả","nguyên về chính trị , làm mơ hồ giai cấp và đấu tranh giai"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Kích động các mâu thuẫn trong xã hộ i, tạ o ra các lực lượng chính trị đố i lập, núp dưới chiêu bài tự do, dân chủ, nhân quyền, tự do tôn giáo, sắc tộc, khuyến khích tư nhân hoá về kinh tế và đa nguyên về chính trị , làm mơ hồ giai cấp và đấu tranh giai"},{"q":"Phương án nào điền đúng vào chỗ trống: “Đặc biệt, chúng coi trọng khích lệ lối sống tư sản và từng bước làm phai nhạt mục tiêu, lý tưởng xã hội …”?","o":["của chiến lược “Diễn biến hoà bình”","ĐỔ CỦA ĐẢNG VÀ NHÀ NƯỚC TA III.1","suy yếu, tiến tới lật đổ các nước xã hội chủ nghĩa","chủ nghĩa ở một bộ phận học sinh, sinh viên"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đặc biệt, chúng coi trọng khích lệ lối sống tư sản và từng bước làm phai nhạt mục tiêu, lý tưởng xã hội chủ nghĩa ở một bộ phận học sinh, sinh viên."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Sự hình thành và phát triển của chiến lược “Diễn biến hoà bình” Chiến lược “Diễn biến hoà bình” đã ra đời, phát triển cùng với sự điều chỉnh phương thức, thủ đ oạn chiến lược của chủ nghĩa đế quốc và các thế …”?","o":["lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa","toàn xã hội hoặc lật đổ chính quyền ở địa phương hay Trung ương","hội chủ nghĩa ở nước ta theo con đường tư bản chủ nghĩa","phương thức đấ u tranh phù hợp, không để lan rộng kéo dài"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Sự hình thành và phát triển của chiến lược “Diễn biến hoà bình” Chiến lược “Diễn biến hoà bình” đã ra đời, phát triển cùng với sự điều chỉnh phương thức, thủ đ oạn chiến lược của chủ nghĩa đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa."},{"q":"Theo giáo trình, ý “Chiến lược “Diễn biến hoà bình” của chủ nghĩ a đế quốc và các thế lực thù địch hình thành …” kết thúc bằng nội dung nào?","o":["diễn ra khi có điều kiện và thời cơ","ĐỔ CỦA ĐẢNG VÀ NHÀ NƯỚC TA III.1","và phát triển qua nhiều giai đoạn khác nhau","hoà bình”, bạo loạn lật đổ của kẻ thù đối với nước ta"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Chiến lược “Diễn biến hoà bình” của chủ nghĩ a đế quốc và các thế lực thù địch hình thành và phát triển qua nhiều giai đoạn khác nhau."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Tháng 3 năm 1947, chính quyền Truman đã trên cơ sở kế thừa tư tưởng của Kennan đã bổ sung, hình thành và công bố …”","o":["thực hiện chiến lược “Ngăn chặn” chủ nghĩa cộng sản","trung vào: Giáo dục tình yêu quê hương, đất nước","truyền và hướng Việt Nam đi theo quỹ đạo của chủ nghĩa tư bản","nguyên về chính trị , làm mơ hồ giai cấp và đấu tranh giai"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tháng 3 năm 1947, chính quyền Truman đã trên cơ sở kế thừa tư tưởng của Kennan đã bổ sung, hình thành và công bố thực hiện chiến lược “Ngăn chặn” chủ nghĩa cộng sản."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Tháng 4 năm 1948, Quốc hội Mỹ chính thức phê chuẩn kế hoạch Mác-San, tăng viện trợ để khích lệ lực lượng dân chủ, cài cắm gián điệp vào các Đảng Cộng sản để phá hoại các nước xã hội chủ nghĩa và ngăn …”","o":["cuộc “Cách mạng Nhung”, dựng lên các chế độ chính trị mới thân Mỹ","trong và khi có thời cơ tiến hành lật đổ chế độ xã hội","chặn chủ nghĩa cộng sản ở Tây Âu, hướng họ phụ thuộc vào Mỹ","n biết, cụ thể: Thủ đoạn về kinh tế: Chúng muốn chuyển hoá nền"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Tháng 4 năm 1948, Quốc hội Mỹ chính thức phê chuẩn kế hoạch Mác-San, tăng viện trợ để khích lệ lực lượng dân chủ, cài cắm gián điệp vào các Đảng Cộng sản để phá hoại các nước xã hội chủ nghĩa và ngăn chặn chủ nghĩa cộng sản ở Tây Âu, hướng họ phụ thuộc vào Mỹ."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Đến tháng 12 năm 1957, Tổng thống Aixenhao đã tuyên bố “Mỹ sẽ giành thắng lợi bằng hoà bình” và mục đích của chiến lược để làm …” là gì?","o":["bại chiến lược “Diễn biến hòa bình”, bạo loạn lật đổ của chúng","liệt, lâu dài và phức tạp trên mọi lĩnh vực","suy yếu và lật đổ các nước xã hội chủ nghĩa","kẻ thù sử dụng để chống phá sự nghiệp cách mạng Việt Nam"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Đến tháng 12 năm 1957, Tổng thống Aixenhao đã tuyên bố “Mỹ sẽ giành thắng lợi bằng hoà bình” và mục đích của chiến lược để làm suy yếu và lật đổ các nước xã hội chủ nghĩa."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Đặc biệt, từ sau thất bại ở Việt Nam, Mỹ đã từng bước thay đổi chiến lược chuyển từ tiến công bằng sức mạnh quân sự là …”?","o":["vụ xây dựng bả o vệ Tổ quốc Việt Nam xã hội chủ nghĩa","chính, sang tiến công bằng “diễn biến hoà bình” là chủ yếu","và phát triển qua nhiều giai đoạn khác nhau","bản sắc văn hoá và giá trị văn hoá của dân tộc Việt Nam"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đặc biệt, từ sau thất bại ở Việt Nam, Mỹ đã từng bước thay đổi chiến lược chuyển từ tiến công bằng sức mạnh quân sự là chính, sang tiến công bằng “diễn biến hoà bình” là chủ yếu."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Từ vị trí là thủ đoạn kết hợp với chiến lược “Ngăn chặn”, đã phát triển thành một chiến lược cơ bả n, ngày càng …”","o":["hoàn thiện để chống các nước xã hội chủ nghĩa","nghĩa trong cải tổ, cải cách, đổi mới","tham mưu, quân đội và công an làm nòng cốt","bằng nhiều thủ đoạn tinh vi và thâm hiểm, tổng hợp"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Từ vị trí là thủ đoạn kết hợp với chiến lược “Ngăn chặn”, đã phát triển thành một chiến lược cơ bả n, ngày càng hoàn thiện để chống các nước xã hội chủ nghĩa."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Do phát hiện thấy những sai lầm, khuyết điểm của các Đảng Cộng sản và Nhà nước xã hội chủ …” được hoàn thiện như thế nào?","o":["hoá quan hệ ngoại giao với Việt Nam","hoạt động của các tổ chức quần chúng","nghĩa trong cải tổ, cải cách, đổi mới","thúc đẩy sự phát triển của xã hội"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Do phát hiện thấy những sai lầm, khuyết điểm của các Đảng Cộng sản và Nhà nước xã hội chủ nghĩa trong cải tổ, cải cách, đổi mới."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Từ năm 1980 đến 1990, chủ nghĩa đế quốc và các thế lực thù địch đã sử dụng chiến lược “Diễn biến hoà bình” để tiến công nhằm làm …”","o":["nghĩa trong cải tổ, cải cách, đổi mới","vụ xây dựng bả o vệ Tổ quốc Việt Nam xã hội chủ nghĩa","độ xã hội chủ nghĩa, lái nước ta đi theo con đường chủ nghĩa","suy yếu, tiến tới lật đổ các nước xã hội chủ nghĩa"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Từ năm 1980 đến 1990, chủ nghĩa đế quốc và các thế lực thù địch đã sử dụng chiến lược “Diễn biến hoà bình” để tiến công nhằm làm suy yếu, tiến tới lật đổ các nước xã hội chủ nghĩa."},{"q":"Phương án nào điền đúng vào chỗ trống: “Sau sự sụp đổ của các nước xã hội chủ nghĩa ở Đông Âu và Liên Xô, chủ nghĩa đế quốc và các thế lực thù địch tiếp tục ra sức sử dụng chiến lược “Diễn biến hoà bình” để …”?","o":["mạng Cam ở Ukraine (2004), cách mạng hoa Tulip ở Kyrgyzstan ( 2005)","lực lượng vũ trang vững mạnh về mọi mặ t","thực hiện âm mưu xoá bỏ các nước xã hội chủ nghĩa còn lại","n biết, cụ thể: Thủ đoạn về kinh tế: Chúng muốn chuyển hoá nền"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Sau sự sụp đổ của các nước xã hội chủ nghĩa ở Đông Âu và Liên Xô, chủ nghĩa đế quốc và các thế lực thù địch tiếp tục ra sức sử dụng chiến lược “Diễn biến hoà bình” để thực hiện âm mưu xoá bỏ các nước xã hội chủ nghĩa còn lại."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Để áp đặt giá trị Mỹ đối với thế giới, Mỹ chủ trương xóa bỏ chế độ chính trị hiện hành ở tất cả các nước chống lại Mỹ, hoặc không thân Mỹ với trào lưu lật đổ lãnh đạo bằng các …”?","o":["cuộc “Cách mạng Nhung”, dựng lên các chế độ chính trị mới thân Mỹ","chính trị, trật tự, an toàn xã hội và các thành quả cách mạng","bằng nhiều thủ đoạn tinh vi và thâm hiểm, tổng hợp","vụ chiến lược của toàn Đảng, toàn quân, toàn dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Để áp đặt giá trị Mỹ đối với thế giới, Mỹ chủ trương xóa bỏ chế độ chính trị hiện hành ở tất cả các nước chống lại Mỹ, hoặc không thân Mỹ với trào lưu lật đổ lãnh đạo bằng các cuộc “Cách mạng Nhung”, dựng lên các chế độ chính trị mới thân Mỹ."},{"q":"Theo giáo trình, ý ““Cách mạng Nhung” hay “Cách mạng đường phố”, “Cách mạng da cam” thực chất là thủ đoạn phát triển chiến lược “Diễn biến hòa bình” của Mỹ và phương Tây nhằm lật đổ chính quyền …” kết thúc bằng nội dung nào?","o":["ở các nước đối địch khi mà các thủ đoạn khác bị thất bại","vụ chiến lược của toàn Đảng, toàn quân, toàn dân","cả các lực lượng khủng bố để lật đổ một chính quyền hợp pháp","địa phương, chống Đảng và Nhà nước ta, gây mất ổn định xã hội"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: “Cách mạng Nhung” hay “Cách mạng đường phố”, “Cách mạng da cam” thực chất là thủ đoạn phát triển chiến lược “Diễn biến hòa bình” của Mỹ và phương Tây nhằm lật đổ chính quyền ở các nước đối địch khi mà các thủ đoạn khác bị thất bại."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Tiếp đó, các biến thể kịch bản “Cách mạng màu” được lặp lại ở một loạt các nướ c Trung Đông-Bắc Phi và kéo dài từ năm 2010 cho tới nay như: Tunisia …”","o":["Ai Cập, Yêmen, Libya, Syria với tên gọi mỹ miều là Mùa Xuân Ả-rập","trọng trong chiến lược phản cách mạng của chủ nghĩa đế quốc","truyền và hướng Việt Nam đi theo quỹ đạo của chủ nghĩa tư bản","(thường chỉ diễn ra trong không gian hẹp và thời gian ngắn) tiến tới"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tiếp đó, các biến thể kịch bản “Cách mạng màu” được lặp lại ở một loạt các nướ c Trung Đông-Bắc Phi và kéo dài từ năm 2010 cho tới nay như: Tunisia, Ai Cập, Yêmen, Libya, Syria với tên gọi mỹ miều là Mùa Xuân Ả-rập."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Sự can thiệp của Mỹ và phương tây không chỉ thể hiện ở việc thúc đẩy biểu tình, bạo loạn mà còn cung cấp vũ khí, trang bị, tình báo, huấn luyện quân sự cho phe đối lập, thậm chí còn sử dụng …”","o":["Đảng Cộng sản Việt Nam, chế độ xã hội chủ nghĩa ở Việt Nam","có khả năng làm mất uy tín của Đảng và chính quyền các cấp,","lược “Diễn biến hoà bình” của kẻ thù chống phá nước ta hiện nay","cả các lực lượng khủng bố để lật đổ một chính quyền hợp pháp"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Sự can thiệp của Mỹ và phương tây không chỉ thể hiện ở việc thúc đẩy biểu tình, bạo loạn mà còn cung cấp vũ khí, trang bị, tình báo, huấn luyện quân sự cho phe đối lập, thậm chí còn sử dụng cả các lực lượng khủng bố để lật đổ một chính quyền hợp pháp."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Đặc biệt, trong cuộc khủng hoảng chính trị Ukraine mang tên cách mạng Cam 2.0 vừa qua cho thấy, sự can thiệp của Mỹ và phương Tây ngày càng thô bạo hơn, bất chấp các nguyên tắc và …” là gì?","o":["luật pháp quốc tế đối với một quốc gia độc lập, có chủ quyền","phương thức đấ u tranh phù hợp, không để lan rộng kéo dài","thất bại các âm mưu, thủ đoạn trong chiến lược “Diễn biến hoà bình”,","càng ráo riết đẩy mạnh “diễ n biến hoà bình” đối với Việt Nam"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đặc biệt, trong cuộc khủng hoảng chính trị Ukraine mang tên cách mạng Cam 2.0 vừa qua cho thấy, sự can thiệp của Mỹ và phương Tây ngày càng thô bạo hơn, bất chấp các nguyên tắc và luật pháp quốc tế đối với một quốc gia độc lập, có chủ quyền."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Về hình thức của bạo loạn, gồm có bạo loạn chính trị, bạo loạn vũ trang hoặc bạo …”?","o":["vụ chiến lược của toàn Đảng, toàn quân, toàn dân","và phát triển qua nhiều giai đoạn khác nhau","phòng và an ninh hiện nay","loạn chính trị kết hợp với vũ trang"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Về hình thức của bạo loạn, gồm có bạo loạn chính trị, bạo loạn vũ trang hoặc bạo loạn chính trị kết hợp với vũ trang."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Trên thực tiễn, bạo loạn lật đổ là một thủ đoạn của chủ nghĩa đế quốc và các thế lực phản động gắn liền với chiến lược …”","o":["lực lượng vũ trang vững mạnh về mọi mặ t","hoàn thiện để chống các nước xã hội chủ nghĩa","khu vực, địa bàn mà cơ sở chính trị của địa phương yếu kém","“Diễn biến hoà bình” để xoá bỏ chủ nghĩa xã hộ i"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trên thực tiễn, bạo loạn lật đổ là một thủ đoạn của chủ nghĩa đế quốc và các thế lực phản động gắn liền với chiến lược “Diễn biến hoà bình” để xoá bỏ chủ nghĩa xã hộ i."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Quy mô bạo loạn lật đổ, có thể diễn ra ở nhiều mức độ, từ …” được hoàn thiện như thế nào?","o":["ĐỐI VỚI CÁCH MẠNG VIỆT NAM ---------------- A","quy mô nhỏ đến lớ n","loạ n lật đổ ?","ninh và đối với lực lượng vũ trang"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Quy mô bạo loạn lật đổ, có thể diễn ra ở nhiều mức độ, từ quy mô nhỏ đến lớ n."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Phạm vi địa bàn xảy ra bạo loạn lật đổ có thể ở nhiều nơi, nhiều vùng của đất nước, trọng điểm là những vùng trung tâm về kinh tế, chính trị, văn hoá của Trung ương và đị a phương, nơi nhạy cảm về chính trị hoặc ở các …”","o":["hướng xã hội chủ nghĩa thực chất là để tạo ra cơ sở vật","nghĩa đế quốc và các thế lực thù đị ch phản động tiến hành","chặn những biểu hiện “tự diễn biến”, “tự chuyển hóa” trong nội bộ”","khu vực, địa bàn mà cơ sở chính trị của địa phương yếu kém"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Phạm vi địa bàn xảy ra bạo loạn lật đổ có thể ở nhiều nơi, nhiều vùng của đất nước, trọng điểm là những vùng trung tâm về kinh tế, chính trị, văn hoá của Trung ương và đị a phương, nơi nhạy cảm về chính trị hoặc ở các khu vực, địa bàn mà cơ sở chính trị của địa phương yếu kém."},{"q":"Phương án nào điền đúng vào chỗ trống: “Âm mưu, thủ đoạn chiến lược “Diễn biến hòa bình” đối với Việt Nam Chủ nghĩa đế quốc cùng các thế lực thù địch luôn coi Việt Nam là một trọng …”?","o":["điểm trong chiến lược “Diễn biến hoà bình” chống chủ nghĩa xã hội","địa phương, chống Đảng và Nhà nước ta, gây mất ổn định xã hội","và xây dựng lực lượng vũ trang ở cơ sở","bào còn thấp và những khuyết điểm trong thực hiện các chính sách dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Âm mưu, thủ đoạn chiến lược “Diễn biến hòa bình” đối với Việt Nam Chủ nghĩa đế quốc cùng các thế lực thù địch luôn coi Việt Nam là một trọng điểm trong chiến lược “Diễn biến hoà bình” chống chủ nghĩa xã hội."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Từ năm 1950 - 1975, chủ nghĩa đế quốc dùng hành động quân sự để xâm lượ c và muốn biến Việt Nam thành thuộc địa vĩnh viễn …”?","o":["của chúng nhưng cuối cùng đã bị thất bạ i hoàn toàn","hướng xã hội chủ nghĩa thực chất là để tạo ra cơ sở vật","và xây dựng lực lượng vũ trang ở cơ sở","vụ chiến lược của toàn Đảng, toàn quân, toàn dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Từ năm 1950 - 1975, chủ nghĩa đế quốc dùng hành động quân sự để xâm lượ c và muốn biến Việt Nam thành thuộc địa vĩnh viễn của chúng nhưng cuối cùng đã bị thất bạ i hoàn toàn."},{"q":"Theo giáo trình, ý “Từ năm 1975 - 1995, sau khi sử dụng những đòn tấn công bằng quân sự để xâm lượ c Việt Nam không thành công, chúng đã chuyển sang chiến lược mới như “bao vây cấm vận kinh tế”, “cô lập về …” kết thúc bằng nội dung nào?","o":["hội chủ nghĩa ở nước ta theo con đường tư bản chủ nghĩa","cuộc “Cách mạng Nhung”, dựng lên các chế độ chính trị mới thân Mỹ","ngoại giao” kết hợp với “diễn biến hoà bình”, bạo loạn lật đổ nhằm","truyền và hướng Việt Nam đi theo quỹ đạo của chủ nghĩa tư bản"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Từ năm 1975 - 1995, sau khi sử dụng những đòn tấn công bằng quân sự để xâm lượ c Việt Nam không thành công, chúng đã chuyển sang chiến lược mới như “bao vây cấm vận kinh tế”, “cô lập về ngoại giao” kết hợp với “diễn biến hoà bình”, bạo loạn lật đổ nhằm"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Từ năm 1995 đến nay, trước những thắng lợi to lớn của công cuộc đổi mới toàn diện đất nước theo định hướng xã hội chủ nghĩa …”","o":["do Đảng Cộng sản Việt Nam khởi xướng và lãnh đạo","bình”, bạo loạn lật đổ nhằm chống phá cách mạng nướ c ta","hội chủ nghĩa ở nước ta theo con đường tư bản chủ nghĩa","loạn chính trị kết hợp với vũ trang"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Từ năm 1995 đến nay, trước những thắng lợi to lớn của công cuộc đổi mới toàn diện đất nước theo định hướng xã hội chủ nghĩa do Đảng Cộng sản Việt Nam khởi xướng và lãnh đạo."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Ngày 03/02/1994 Mỹ đã phải tuyên bố xoá bỏ “cấm vận kinh tế”, ngày 11/7/1995 bình thường …”","o":["của chúng nhưng cuối cùng đã bị thất bạ i hoàn toàn","động, để {"q":"Phương án nào điền đúng vào chỗ trống: “Tận dụng những sơ hở trong đường lối của Đảng, chính sách của Nhà nước ta, sẵn sàng can thiệp trắng trợn bằng sức mạnh quân sự …”?","o":["đảm cho chế độ xã hội luôn ổn định, phát triển","để lật đổ chế độ xã hội chủ nghĩa ở Việt Nam","chủ nghĩa ở một bộ phận học sinh, sinh viên","ĐỐI VỚI CÁCH MẠNG VIỆT NAM ---------------- A"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tận dụng những sơ hở trong đường lối của Đảng, chính sách của Nhà nước ta, sẵn sàng can thiệp trắng trợn bằng sức mạnh quân sự để lật đổ chế độ xã hội chủ nghĩa ở Việt Nam."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Thủ đoạn về tư tưởng - văn hoá: Chúng thực hiện nhiều hoạt động nhằm xoá bỏ …”?","o":["CÁC NƯỚC XÃ HỘI CHỦ NGHĨA I .1","chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh","hoá quan hệ ngoại giao với Việt Nam","hoà bình” được bắt nguồn từ nước Mỹ"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Thủ đoạn về tư tưởng - văn hoá: Chúng thực hiện nhiều hoạt động nhằm xoá bỏ chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh."},{"q":"Theo giáo trình, ý “Phá vỡ nền tảng tư tưởng của Đảng Cộng sản Việt Nam, ra sức truyền bá tư tưởng …” kết thúc bằng nội dung nào?","o":["thủ đoạn chống phá của kẻ thù đối với Việt Nam","diễn ra khi có điều kiện và thời cơ","CHỐNG PHÁ CÁCH MẠNG VIỆT NAM II.1","tư sản vào các tầng lớp nhân dân"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Phá vỡ nền tảng tư tưởng của Đảng Cộng sản Việt Nam, ra sức truyền bá tư tưởng tư sản vào các tầng lớp nhân dân."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Thủ đoạn trong lĩnh vực dân tộc - tôn giáo: Chúng lợi dụng những khó khă n ở những vùng đồng bào dân tộc ít người, những tồn tại do lịch sử để lại, trình độ dân trí của một bộ phận đồng …”","o":["hội chủ nghĩa ở nước ta theo con đường tư bản chủ nghĩa","khu vực, địa bàn mà cơ sở chính trị của địa phương yếu kém","biểu tình làm chỗ dựa cho lực lượng phản động trà trộn hoạt động","bào còn thấp và những khuyết điểm trong thực hiện các chính sách dân"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Thủ đoạn trong lĩnh vực dân tộc - tôn giáo: Chúng lợi dụng những khó khă n ở những vùng đồng bào dân tộc ít người, những tồn tại do lịch sử để lại, trình độ dân trí của một bộ phận đồng bào còn thấp và những khuyết điểm trong thực hiện các chính sách dân"},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Lợi dụng chính sách tự do tôn giáo của Đảng, Nhà nướcta để truyền đạo trái phép để thực hiện âm mưu tôn giáo hoá dân tộc, từng bước gây mất ổn định xã …”","o":["trọng trong chiến lược phản cách mạng của chủ nghĩa đế quốc","trấn, các cơ quan, tổ chức và đặt dưới sự lãnh đạo của Đảng","địa phương, chống Đảng và Nhà nước ta, gây mất ổn định xã hội","hội và làm chệch hướng chế độ chủ nghĩa xã hội ở Việt Nam"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Lợi dụng chính sách tự do tôn giáo của Đảng, Nhà nướcta để truyền đạo trái phép để thực hiện âm mưu tôn giáo hoá dân tộc, từng bước gây mất ổn định xã hội và làm chệch hướng chế độ chủ nghĩa xã hội ở Việt Nam."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Chúng kích động đòi phủ nhận vai trò lãnh đạo của Đảng trong lĩnh vực quốc phòng, an …” là gì?","o":["ninh và đối với lực lượng vũ trang","nghĩa trong cải tổ, cải cách, đổi mới","hoạt động của các tổ chức quần chúng","và phát triển qua nhiều giai đoạn khác nhau"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Chúng kích động đòi phủ nhận vai trò lãnh đạo của Đảng trong lĩnh vực quốc phòng, an ninh và đối với lực lượng vũ trang."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Đối với quân đội và công an, các thế lực thù địch chủ trương vô hiệu hoá sự lãnh đạo của Đảng với luận điểm “phi chính trị hoá” …”?","o":["lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa","tan rã chế độ xã hội chủ nghĩa ở một số nước còn lại","làm cho các lực lượng này xa rời mục tiêu chiến đấu","đoạn của kẻ thù, bảo vệ vững chắc Tổ quốc Việt Nam"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Đối với quân đội và công an, các thế lực thù địch chủ trương vô hiệu hoá sự lãnh đạo của Đảng với luận điểm “phi chính trị hoá” làm cho các lực lượng này xa rời mục tiêu chiến đấu."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Các thế lực thù địch lợi dụng chủ trương Việt Nam mở rộng hội nhập quốc tế, mở rộng quan hệ hợp tác với các nước trên thế giới để tuyên …”","o":["truyền và hướng Việt Nam đi theo quỹ đạo của chủ nghĩa tư bản","hội và làm chệch hướng chế độ chủ nghĩa xã hội ở Việt Nam","chống lại làn sóng cộng sản, lật đổ các nước xã hội chủ nghĩa","luật pháp quốc tế đối với một quốc gia độc lập, có chủ quyền"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Các thế lực thù địch lợi dụng chủ trương Việt Nam mở rộng hội nhập quốc tế, mở rộng quan hệ hợp tác với các nước trên thế giới để tuyên truyền và hướng Việt Nam đi theo quỹ đạo của chủ nghĩa tư bản."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Đặc biệt, chúng rất coi trọng việc chia rẽ tình đoàn kết hữu nghị giữa Việt Nam với Lào, Campuchia và các nước xã hội chủ nghĩa …” được hoàn thiện như thế nào?","o":["thực hiện âm mưu xoá bỏ các nước xã hội chủ nghĩa còn lại","hạ thấp uy tín của nước ta trên trường quốc tế","hội và làm chệch hướng chế độ chủ nghĩa xã hội ở Việt Nam","lực lượng vũ trang vững mạnh về mọi mặ t"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đặc biệt, chúng rất coi trọng việc chia rẽ tình đoàn kết hữu nghị giữa Việt Nam với Lào, Campuchia và các nước xã hội chủ nghĩa, hạ thấp uy tín của nước ta trên trường quốc tế."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Bạo loạn lật đổ của các thế lực thù địch chống phá cách mạng Việt Nam Các thế lực thù địch chú trọng nuôi dưỡng các tổ chức phản động sống lưu vong ở nước ngoài và kết hợp với các phần tử cực đoan …”","o":["lật đổ của kẻ thù sử dụng để chống phá Việt Nam hiện nay","bất mãn trong nước gây rối, làm mất ổn định xã hội ở một","từng bước chuyển hoá Việ t Nam theo con đường tư bản chủ nghĩa","và chuyển hoá theo quỹ đạo của chủ nghĩa tư bản"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Bạo loạn lật đổ của các thế lực thù địch chống phá cách mạng Việt Nam Các thế lực thù địch chú trọng nuôi dưỡng các tổ chức phản động sống lưu vong ở nước ngoài và kết hợp với các phần tử cực đoan, bất mãn trong nước gây rối, làm mất ổn định xã hội ở một"},{"q":"Phương án nào điền đúng vào chỗ trống: “Vùng Tây Bắc, chúng kích động người H’Mông đòi thành lập …”?","o":["của chiến lược “Diễn biến hoà bình”","khu tự trị riêng","và người đang sinh sống ở nước ngoài","ĐỐI VỚI CÁCH MẠNG VIỆT NAM ---------------- A"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Vùng Tây Bắc, chúng kích động người H’Mông đòi thành lập khu tự trị riêng."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Vùng Tây Nguyên, chúng ra sức tuyên truyền thành lập nhà nước Đề Ga, chờ thời cơ thuận lợi để tiến hành lật đổ …”?","o":["và người đang sinh sống ở nước ngoài","vai trò lãnh đạo của Đảng Cộng sản Việt Nam","suy yếu, tiến tới lật đổ các nước xã hội chủ nghĩa","sự” do chủ nghĩa đế quốc và các thế lực phản động tiến hành"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Vùng Tây Nguyên, chúng ra sức tuyên truyền thành lập nhà nước Đề Ga, chờ thời cơ thuận lợi để tiến hành lật đổ vai trò lãnh đạo của Đảng Cộng sản Việt Nam."},{"q":"Theo giáo trình, ý “Thủ đoạn cơ bản mà các thế lực thù địch đã sử dụng để tiến hành bạo loạn lật đổ chính quyền ở một số địa phương nước ta là: Kích động sự bất bình của quần chúng, dụ dỗ và cưỡng ép nhân dân …” kết thúc bằng nội dung nào?","o":["cuộc “Cách mạng Nhung”, dựng lên các chế độ chính trị mới thân Mỹ","thủ đoạn “diễn biến hoà bình” củ a các thế lực thù địch","lật đổ của kẻ thù sử dụng để chống phá Việt Nam hiện nay","biểu tình làm chỗ dựa cho lực lượng phản động trà trộn hoạt động"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Thủ đoạn cơ bản mà các thế lực thù địch đã sử dụng để tiến hành bạo loạn lật đổ chính quyền ở một số địa phương nước ta là: Kích động sự bất bình của quần chúng, dụ dỗ và cưỡng ép nhân dân biểu tình làm chỗ dựa cho lực lượng phản động trà trộn hoạt động"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Nắm vững nguyên tắc xử lý trong đấu tranh chống bạo loạn lật đổ là: Nhanh gọn, kiên quyết, linh hoạt, đúng đối tượng, sử dụng lực lượng và …”","o":["phương thức đấ u tranh phù hợp, không để lan rộng kéo dài","làm cho các lực lượng này xa rời mục tiêu chiến đấu","n biết, cụ thể: Thủ đoạn về kinh tế: Chúng muốn chuyển hoá nền","thủ đoạn “diễn biến hoà bình” củ a các thế lực thù địch"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nắm vững nguyên tắc xử lý trong đấu tranh chống bạo loạn lật đổ là: Nhanh gọn, kiên quyết, linh hoạt, đúng đối tượng, sử dụng lực lượng và phương thức đấ u tranh phù hợp, không để lan rộng kéo dài."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Mối quan hệ giữa “diễn biến hòa bình” với bạo loạn lật đổ “Diễn biến hòa bình” và bạo loạn lật đổ có mối quan hệ chặt chẽ với nhau, là chiến lược cơ bản trong chiến lược toàn cầu của chủ …”","o":["nghĩa đế quốc và các thế lực thù đị ch phản động tiến hành","vụ chiến lược của toàn Đảng, toàn quân, toàn dân","(thường chỉ diễn ra trong không gian hẹp và thời gian ngắn) tiến tới","hạ thấp uy tín của nước ta trên trường quốc tế"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Mối quan hệ giữa “diễn biến hòa bình” với bạo loạn lật đổ “Diễn biến hòa bình” và bạo loạn lật đổ có mối quan hệ chặt chẽ với nhau, là chiến lược cơ bản trong chiến lược toàn cầu của chủ nghĩa đế quốc và các thế lực thù đị ch phản động tiến hành."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Tuy nhiên, dù bạo loạn lật đổ chỉ xảy ra ở mộ t vài địa phương thì cũng có tác động rất lớn tới tâm lý và tình cảm của cán bộ, đảng viên và quần chúng nhân dân ở các địa phương khác, đồng thời …” là gì?","o":["lược “Diễn biến hoà bình” của kẻ thù chống phá nước ta hiện nay","chức Đảng ở các cấp, nhất là ở cơ sở","địa phương, chống Đảng và Nhà nước ta, gây mất ổn định xã hội","có khả năng làm mất uy tín của Đảng và chính quyền các cấp,"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Tuy nhiên, dù bạo loạn lật đổ chỉ xảy ra ở mộ t vài địa phương thì cũng có tác động rất lớn tới tâm lý và tình cảm của cán bộ, đảng viên và quần chúng nhân dân ở các địa phương khác, đồng thời có khả năng làm mất uy tín của Đảng và chính quyền các cấp,"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “MỤC TIÊU, NHIỆM VỤ, QUAN ĐIỂM VÀ PHƯƠNG CHÂM PHÒNG, CHỐNG CHIẾN LƯỢC “DIỄN BIẾN HÒA BÌNH”, BẠO LOẠN LẬT …”?","o":["tăng cường hoạt động tình báo thu thập bí mật quốc gia","lãnh thổ của Tổ quốc","suy yếu, tiến tới lật đổ các nước xã hội chủ nghĩa","ĐỔ CỦA ĐẢNG VÀ NHÀ NƯỚC TA III.1"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: MỤC TIÊU, NHIỆM VỤ, QUAN ĐIỂM VÀ PHƯƠNG CHÂM PHÒNG, CHỐNG CHIẾN LƯỢC “DIỄN BIẾN HÒA BÌNH”, BẠO LOẠN LẬT ĐỔ CỦA ĐẢNG VÀ NHÀ NƯỚC TA III.1."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Mục tiêu Mục tiêu của chiến lược “Diễn biến hoà bình” mà các thế lực thù địch tiến hành ở Việt Nam là làm chuyển hoá chế độ xã …”","o":["cả các lực lượng khủng bố để lật đổ một chính quyền hợp pháp","động, để tạo nên sức mạnh của thế trận “lòng dân”","hội chủ nghĩa ở nước ta theo con đường tư bản chủ nghĩa","phá hoại, làm suy yếu từ bên trong các nước xã hội chủ nghĩa"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Mục tiêu Mục tiêu của chiến lược “Diễn biến hoà bình” mà các thế lực thù địch tiến hành ở Việt Nam là làm chuyển hoá chế độ xã hội chủ nghĩa ở nước ta theo con đường tư bản chủ nghĩa."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Giữ vững ổn định chính trị - xã hội của đất nước, tạo môi trường hoà bình để đẩy mạnh sự …” được hoàn thiện như thế nào?","o":["trọng trong chiến lược phản cách mạng của chủ nghĩa đế quốc","động, để tạo nên sức mạnh của thế trận “lòng dân”","nghiệp công nghiệp hoá, hiện đại hoá đất nước","lực vũ trang, kinh tế, chính trị, văn hoá, xã hộ i"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Giữ vững ổn định chính trị - xã hội của đất nước, tạo môi trường hoà bình để đẩy mạnh sự nghiệp công nghiệp hoá, hiện đại hoá đất nước."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn …”","o":["kịp thời tiến công ngay từ đầ u","quy mô nhỏ đến lớ n","ĐỐI VỚI CÁCH MẠNG VIỆT NAM ---------------- A","lãnh thổ của Tổ quốc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc;"},{"q":"Phương án nào điền đúng vào chỗ trống: “Đây là nhiệm vụ cấp bách hàng đầu trong các nhiệm vụ quốc …”?","o":["quy mô nhỏ đến lớ n","liệt, lâu dài và phức tạp trên mọi lĩnh vực","và phát triển qua nhiều giai đoạn khác nhau","phòng và an ninh hiện nay"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đây là nhiệm vụ cấp bách hàng đầu trong các nhiệm vụ quốc phòng và an ninh hiện nay."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Chủ động phát hiện âm mưu, thủ đoạn chống phá của các thế lực thù địch đối với nước ta …”?","o":["ĐỔ CỦA ĐẢNG VÀ NHÀ NƯỚC TA III.1","do Đảng Cộng sản Việt Nam khởi xướng và lãnh đạo","kịp thời tiến công ngay từ đầ u","nghiệp công nghiệp hoá, hiện đại hoá đất nước"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Chủ động phát hiện âm mưu, thủ đoạn chống phá của các thế lực thù địch đối với nước ta, kịp thời tiến công ngay từ đầ u."},{"q":"Theo giáo trình, ý “Xử lý nhanh chóng, hiệu quả khi có bạo loạn xảy ra và luôn bảo …” kết thúc bằng nội dung nào?","o":["ĐỔ CỦA ĐẢNG VÀ NHÀ NƯỚC TA III.1","ninh và đối với lực lượng vũ trang","CÁC NƯỚC XÃ HỘI CHỦ NGHĨA I .1","vệ tốt chính trị nội bộ"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Xử lý nhanh chóng, hiệu quả khi có bạo loạn xảy ra và luôn bảo vệ tốt chính trị nội bộ."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Thực chất chiến lược “Diễn biến hoà bình” mà các thế lực thù địch sử dụng để chống phá cách mạng nước ta là một bộ phận quan …”","o":["trọng trong chiến lược phản cách mạng của chủ nghĩa đế quốc","từng bước chuyển hoá Việ t Nam theo con đường tư bản chủ nghĩa","hoàn thiện để chống các nước xã hội chủ nghĩa","biến hoà bình” của kẻ thù đối với cách mạng Việt Nam"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Thực chất chiến lược “Diễn biến hoà bình” mà các thế lực thù địch sử dụng để chống phá cách mạng nước ta là một bộ phận quan trọng trong chiến lược phản cách mạng của chủ nghĩa đế quốc."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Mục tiêu của chiến lược đó là nhằm xoá bỏ sự lãnh đạo của Đảng, làm sụp đổ chế độ xã hội chủ nghĩa ở Việt Nam …”","o":["lực vũ trang, kinh tế, chính trị, văn hoá, xã hộ i","“Dính líu”, “ngầm”, “sâu, hiểm” nhằm chố ng phá cách mạng Việt Nam","và chuyển hoá theo quỹ đạo của chủ nghĩa tư bản","thủ đoạn “diễn biến hoà bình” củ a các thế lực thù địch"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Mục tiêu của chiến lược đó là nhằm xoá bỏ sự lãnh đạo của Đảng, làm sụp đổ chế độ xã hội chủ nghĩa ở Việt Nam và chuyển hoá theo quỹ đạo của chủ nghĩa tư bản."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Hai là, chống “diễn biến hoà bình” là cấp bách hàng đầu trong các nhiệm vụ quốc phòng, an ninh hiện nay …” là gì?","o":["loạ n lật đổ ?","để bảo vệ vững chắc xã hội chủ nghĩa","chặn những biểu hiện “tự diễn biến”, “tự chuyển hóa” trong nội bộ”","lực vũ trang, kinh tế, chính trị, văn hoá, xã hộ i"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Hai là, chống “diễn biến hoà bình” là cấp bách hàng đầu trong các nhiệm vụ quốc phòng, an ninh hiện nay để bảo vệ vững chắc xã hội chủ nghĩa."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Xuất phát từ các thủ đoạn tinh vi, xảo quyệt mà các thế lực thù địch sử dụng trong chiến lược “Diễn biế n hoà bình” với nhiều đòn tấn công …”?","o":["kẻ thù cho cơ quan chức năng xử lý không để bị bất ngờ","liệt, lâu dài và phức tạp trên mọi lĩnh vực","“mềm” trên tất cả các lĩnh vực để chống phá cách mạng nước ta","và Đông Âu, lợi dụng cuộc chiến chống khủng bố, tấn công quyết liệt"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Xuất phát từ các thủ đoạn tinh vi, xảo quyệt mà các thế lực thù địch sử dụng trong chiến lược “Diễn biế n hoà bình” với nhiều đòn tấn công “mềm” trên tất cả các lĩnh vực để chống phá cách mạng nước ta."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Vì thế, Đảng ta đã xác định rõ nội dung bảo vệ Tổ quốc Việ t Nam xã hội chủ nghĩa hiện nay là toàn diện, coi trọng giữ …”","o":["độ xã hội chủ nghĩa, lái nước ta đi theo con đường chủ nghĩa","địa phương, chống Đảng và Nhà nước ta, gây mất ổn định xã hội","vững an ninh kinh tế, chính trị , văn hoá, tư tưởng","điểm trong chiến lược “Diễn biến hoà bình” chống chủ nghĩa xã hội"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Vì thế, Đảng ta đã xác định rõ nội dung bảo vệ Tổ quốc Việ t Nam xã hội chủ nghĩa hiện nay là toàn diện, coi trọng giữ vững an ninh kinh tế, chính trị , văn hoá, tư tưởng."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Các thế lực thù địch sử dụng sức mạnh tổng hợp để chố ng phá công cuộc xây dựng chủ nghĩa xã hội ở nước ta, đánh vào mọi tầng lớp nhân …” được hoàn thiện như thế nào?","o":["bại chiến lược “Diễn biến hòa bình”, bạo loạn lật đổ của chúng","dân lao động, mọi tổ chức chính trị - xã hội, mọi lĩnh vực","báo đúng thủ đoạn, quy mô, địa điể m và thời gian","làm cho các lực lượng này xa rời mục tiêu chiến đấu"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Các thế lực thù địch sử dụng sức mạnh tổng hợp để chố ng phá công cuộc xây dựng chủ nghĩa xã hội ở nước ta, đánh vào mọi tầng lớp nhân dân lao động, mọi tổ chức chính trị - xã hội, mọi lĩnh vực."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Do đó, phải phát huy sức mạnh tổng hợp của cả hệ thống chính trị dưới sự lãnh đạo của Đảng để làm thất bại âm mưu, thủ …”","o":["lối, chủ trương Điều lệ Đảng và chính sách, pháp luật của Nhà nước","đoạn của kẻ thù, bảo vệ vững chắc Tổ quốc Việt Nam","Cộng sản Việt Nam trong đấu tranh chống “diễn biến hoà bình”","hội và làm chệch hướng chế độ chủ nghĩa xã hội ở Việt Nam"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Do đó, phải phát huy sức mạnh tổng hợp của cả hệ thống chính trị dưới sự lãnh đạo của Đảng để làm thất bại âm mưu, thủ đoạn của kẻ thù, bảo vệ vững chắc Tổ quốc Việt Nam."},{"q":"Phương án nào điền đúng vào chỗ trống: “Do đó, mọi cấp, mọi ngành, mọi người dân phải thấy rõ tính chất nham hiểm …”?","o":["của chiến lược “Diễn biến hoà bình”","diễn ra khi có điều kiện và thời cơ","vai trò lãnh đạo của Đảng Cộng sản Việt Nam","địch chống phá đối với Việt nam hiện nay?"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Do đó, mọi cấp, mọi ngành, mọi người dân phải thấy rõ tính chất nham hiểm của chiến lược “Diễn biến hoà bình”."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Từ đó, phải nâng cao cảnh giác cách mạng, chủ động tiến công làm thất bại mọi âm mưu, thủ đoạn trong chiến lược “Diễn biến hoà …”?","o":["bình”, bạo loạn lật đổ nhằm chống phá cách mạng nướ c ta","và phát triển qua nhiều giai đoạn khác nhau","bình” của kẻ thù nhằm chống phá cách mạng nước ta","trung vào: Giáo dục tình yêu quê hương, đất nước"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Từ đó, phải nâng cao cảnh giác cách mạng, chủ động tiến công làm thất bại mọi âm mưu, thủ đoạn trong chiến lược “Diễn biến hoà bình” của kẻ thù nhằm chống phá cách mạng nước ta."},{"q":"Theo giáo trình, ý “Chủ động, kiên quyết, khôn khéo xử lý tình huống và giải quyết hậu quả khi có bạo loạn xảy ra, giải quyết các …” kết thúc bằng nội dung nào?","o":["“Dính líu”, “ngầm”, “sâu, hiểm” nhằm chố ng phá cách mạng Việt Nam","mạng Cam ở Ukraine (2004), cách mạng hoa Tulip ở Kyrgyzstan ( 2005)","vụ gây rối, không để phát triển thành bạo loạn","lên biểu tình chống lại chính quyền địa phương"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Chủ động, kiên quyết, khôn khéo xử lý tình huống và giải quyết hậu quả khi có bạo loạn xảy ra, giải quyết các vụ gây rối, không để phát triển thành bạo loạn."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Thực tế chứng minh, chủ động tấn công sẽ tạ o thuận lợi giành thắng lợi trong chiến tranh nói chung và trong phòng, chống chiến lược “Diễn biến …”","o":["kẻ thù cho cơ quan chức năng xử lý không để bị bất ngờ","liệt, lâu dài và phức tạp trên mọi lĩnh vực","địa phương, chống Đảng và Nhà nước ta, gây mất ổn định xã hội","hoà bình”, bạo loạn lật đổ của kẻ thù đối với nước ta"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Thực tế chứng minh, chủ động tấn công sẽ tạ o thuận lợi giành thắng lợi trong chiến tranh nói chung và trong phòng, chống chiến lược “Diễn biến hoà bình”, bạo loạn lật đổ của kẻ thù đối với nước ta."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Xây dựng tiềm lực vững mạnh của đất nước, tranh thủ sự ủng hộ của nhân dân trong nước và quốc tế, kịp thời làm thất bại âm mưu …”","o":["n biết, cụ thể: Thủ đoạn về kinh tế: Chúng muốn chuyển hoá nền","hoàn thiện để chống các nước xã hội chủ nghĩa","thủ đoạn chống phá của kẻ thù đối với Việt Nam","bản sắc văn hoá và giá trị văn hoá của dân tộc Việt Nam"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng tiềm lực vững mạnh của đất nước, tranh thủ sự ủng hộ của nhân dân trong nước và quốc tế, kịp thời làm thất bại âm mưu, thủ đoạn chống phá của kẻ thù đối với Việt Nam ."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Do vậy, phải thường xuyên coi trọng xây dựng tiềm lực kinh tế, chính trị, quân sự, văn hoá, xã hội, xây dựng …” là gì?","o":["suy yếu, tiến tới lật đổ các nước xã hội chủ nghĩa","tuyệt đối hoá một giải pháp nào","chủ nghĩa ở một bộ phận học sinh, sinh viên","lực lượng vũ trang vững mạnh về mọi mặ t"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Do vậy, phải thường xuyên coi trọng xây dựng tiềm lực kinh tế, chính trị, quân sự, văn hoá, xã hội, xây dựng lực lượng vũ trang vững mạnh về mọi mặ t."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Chú trọng tuyên truyền giáo dục cho mọi tầng lớp nhân dân lao động hiểu rõ âm mưu, thủ đoạn cơ bản trong chiến lược “Diễn biến hoà bình” mà …”?","o":["và chuyển hoá theo quỹ đạo của chủ nghĩa tư bản","kẻ thù sử dụng để chống phá sự nghiệp cách mạng Việt Nam","chống phá các nước xã hội chủ nghĩa như thế nào?","lực vũ trang, kinh tế, chính trị, văn hoá, xã hộ i"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Chú trọng tuyên truyền giáo dục cho mọi tầng lớp nhân dân lao động hiểu rõ âm mưu, thủ đoạn cơ bản trong chiến lược “Diễn biến hoà bình” mà kẻ thù sử dụng để chống phá sự nghiệp cách mạng Việt Nam."},{"q":"Chọn phương án nối tiếp đúng nội dung: “NHỮNG GIẢI PHÁP PHÒNG, CHỐNG CHIẾN LƯỢC “DIỄN BIẾ N HÒA BÌNH”, BẠO LOẠN LẬT …”","o":["chống phá đất nước ta","chủ nghĩa ở một bộ phận học sinh, sinh viên","chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh","ĐỔ Ở VIỆT NAM HIỆN NAY IV.1"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: NHỮNG GIẢI PHÁP PHÒNG, CHỐNG CHIẾN LƯỢC “DIỄN BIẾ N HÒA BÌNH”, BẠO LOẠN LẬT ĐỔ Ở VIỆT NAM HIỆN NAY IV.1."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Tệ quan liêu, tham nhũng được kẻ thù lợi dụng để khoét sâu mâu thuẫn nội bộ, kích động nhân dân lao động đứng lên biểu tình chống lại chính quyền …” được hoàn thiện như thế nào?","o":["địa phương, chống Đảng và Nhà nước ta, gây mất ổn định xã hội","bình” của kẻ thù nhằm chống phá cách mạng nước ta","từng bước chuyển hoá Việ t Nam theo con đường tư bản chủ nghĩa","hướng xã hội chủ nghĩa thực chất là để tạo ra cơ sở vật"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tệ quan liêu, tham nhũng được kẻ thù lợi dụng để khoét sâu mâu thuẫn nội bộ, kích động nhân dân lao động đứng lên biểu tình chống lại chính quyền địa phương, chống Đảng và Nhà nước ta, gây mất ổn định xã hội."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Do đó, việc đẩy lùi tệ quan liêu, tham nhũng, tiêu cực xã hội, giữ vững định hướng xã hội chủ nghĩa trên các lĩnh vực, chống nguy cơ tụt hậu về kinh tế là giải pháp hữu hiệu để giữ …”","o":["vững và thúc đẩy yếu tố bên trong của đất nước luôn ổn định","“Dính líu”, “ngầm”, “sâu, hiểm” nhằm chố ng phá cách mạng Việt Nam","đoạn của kẻ thù, bảo vệ vững chắc Tổ quốc Việt Nam","suy yếu, tiến tới lật đổ các nước xã hội chủ nghĩa"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Do đó, việc đẩy lùi tệ quan liêu, tham nhũng, tiêu cực xã hội, giữ vững định hướng xã hội chủ nghĩa trên các lĩnh vực, chống nguy cơ tụt hậu về kinh tế là giải pháp hữu hiệu để giữ vững và thúc đẩy yếu tố bên trong của đất nước luôn ổn định."},{"q":"Phương án nào điền đúng vào chỗ trống: “Do vậy, phải giáo dục rộng rãi trong toàn xã hội để mọi người dân Việt Nam, mọi tổ chức chính trị - xã hội đều nhận thức sâu sắc âm mưu, thủ đoạn trong chiến lược …”?","o":["“Diễn biế n hoà bình” của kẻ thù chống phá cách mạng Việt Nam","và Đông Âu, lợi dụng cuộc chiến chống khủng bố, tấn công quyết liệt","Ai Cập, Yêmen, Libya, Syria với tên gọi mỹ miều là Mùa Xuân Ả-rập","Đảng Cộng sản Việt Nam, chế độ xã hội chủ nghĩa ở Việt Nam"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Do vậy, phải giáo dục rộng rãi trong toàn xã hội để mọi người dân Việt Nam, mọi tổ chức chính trị - xã hội đều nhận thức sâu sắc âm mưu, thủ đoạn trong chiến lược “Diễn biế n hoà bình” của kẻ thù chống phá cách mạng Việt Nam."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Cần phải đấu tranh phê phán những biểu hiện mơ hồ, mất cảnh giác cách mạng trong một bộ phận nhân dân, sinh viên trước âm mưu, thủ đoạn thâm hiểm trong chiến …”?","o":["lược “Diễn biến hoà bình” của kẻ thù chống phá nước ta hiện nay","để lật đổ chế độ xã hội chủ nghĩa ở Việt Nam","hạ thấp uy tín của nước ta trên trường quốc tế","của chúng nhưng cuối cùng đã bị thất bạ i hoàn toàn"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Cần phải đấu tranh phê phán những biểu hiện mơ hồ, mất cảnh giác cách mạng trong một bộ phận nhân dân, sinh viên trước âm mưu, thủ đoạn thâm hiểm trong chiến lược “Diễn biến hoà bình” của kẻ thù chống phá nước ta hiện nay."},{"q":"Theo giáo trình, ý “Xây dựng ý thức bảo vệ Tổ quốc cho toàn dân Đối với nước ta, bảo vệ Tổ quốc là một trong hai nhiệm …” kết thúc bằng nội dung nào?","o":["vụ chiến lược của toàn Đảng, toàn quân, toàn dân","địch chống phá đối với Việt nam hiện nay?","vệ tốt chính trị nội bộ","bình”, bạo loạn lật đổ nhằm chống phá cách mạng nướ c ta"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng ý thức bảo vệ Tổ quốc cho toàn dân Đối với nước ta, bảo vệ Tổ quốc là một trong hai nhiệm vụ chiến lược của toàn Đảng, toàn quân, toàn dân."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Hiện nay, tình hình thế giới và khu vực có nhiều diễn biến phức tạp, chủ nghĩa đế quốc đứng đầu là đế quốc Mỹ và các thế lực thù địch lợi dụng sự sụp đổ của xã hội chủ nghĩa, ở Liên Xô …”","o":["và Đông Âu, lợi dụng cuộc chiến chống khủng bố, tấn công quyết liệt","chính trị, trật tự, an toàn xã hội và các thành quả cách mạng","phá cách mạng nước ta có ý nghĩa quan trọng hà ng đầ u","phương thức đấ u tranh phù hợp, không để lan rộng kéo dài"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Hiện nay, tình hình thế giới và khu vực có nhiều diễn biến phức tạp, chủ nghĩa đế quốc đứng đầu là đế quốc Mỹ và các thế lực thù địch lợi dụng sự sụp đổ của xã hội chủ nghĩa, ở Liên Xô và Đông Âu, lợi dụng cuộc chiến chống khủng bố, tấn công quyết liệt"},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Vì vậy, khi đặt lên hàng đầu nhiệm vụ xây dựng đất nước, nhân dân ta luôn nêu cao tinh thần cảnh giác, củng cố quố c phòng, bảo vệ an ninh …”","o":["chính trị, trật tự, an toàn xã hội và các thành quả cách mạng","n biết, cụ thể: Thủ đoạn về kinh tế: Chúng muốn chuyển hoá nền","phá cách mạng nước ta có ý nghĩa quan trọng hà ng đầ u","(thường chỉ diễn ra trong không gian hẹp và thời gian ngắn) tiến tới"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, khi đặt lên hàng đầu nhiệm vụ xây dựng đất nước, nhân dân ta luôn nêu cao tinh thần cảnh giác, củng cố quố c phòng, bảo vệ an ninh chính trị, trật tự, an toàn xã hội và các thành quả cách mạng."},{"q":"Theo bài học, phần còn thiếu trong nhận định “tinh thần cảnh giác trước mọi âm mưu, thủ đoạn của kẻ thù …” là gì?","o":["và phát triển qua nhiều giai đoạn khác nhau","ĐỐI VỚI CÁCH MẠNG VIỆT NAM ---------------- A","chống phá đất nước ta","lượng nhưng lấy chất lượng là chính"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: tinh thần cảnh giác trước mọi âm mưu, thủ đoạn của kẻ thù chống phá đất nước ta;"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “quan điểm, đường lối của Đảng về nhiệm vụ bảo vệ Tổ quốc xã hội chủ …”?","o":["liệt, lâu dài và phức tạp trên mọi lĩnh vực","và người đang sinh sống ở nước ngoài","quốc quyế t sinh","nghĩa trong giai đoạn cách mạng mới"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: quan điểm, đường lối của Đảng về nhiệm vụ bảo vệ Tổ quốc xã hội chủ nghĩa trong giai đoạn cách mạng mới;"},{"q":"Chọn phương án nối tiếp đúng nội dung: “Xây dựng cơ sở chính trị - xã hội vững mạnh về mọi mặt Xây dựng cơ sở chính trị - xã hội vững mạnh sẽ bảo …”","o":["hoá quan hệ ngoại giao với Việt Nam","đảm cho chế độ xã hội luôn ổn định, phát triển","CÁC NƯỚC XÃ HỘI CHỦ NGHĨA I .1","kinh tế, mọi giớ i, mọi lứa tuổi, mọi vùng, mọi miền đất nước"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng cơ sở chính trị - xã hội vững mạnh về mọi mặt Xây dựng cơ sở chính trị - xã hội vững mạnh sẽ bảo đảm cho chế độ xã hội luôn ổn định, phát triển."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Do vậy, phải luôn luôn chú trọng xây dựng khối đại đoàn kế t toàn dân tộc vững mạnh theo quan điểm của Đảng Cộng sản Việt Nam hiện nay là đoàn kế t các dân tộc, tôn giáo, giai cấp, tầng lớp nhân dân, mọi thành phần …” được hoàn thiện như thế nào?","o":["“mềm” trên tất cả các lĩnh vực để chống phá cách mạng nước ta","kinh tế, mọi giớ i, mọi lứa tuổi, mọi vùng, mọi miền đất nước","có khả năng làm mất uy tín của Đảng và chính quyền các cấp,","vụ chiến lược của toàn Đảng, toàn quân, toàn dân"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Do vậy, phải luôn luôn chú trọng xây dựng khối đại đoàn kế t toàn dân tộc vững mạnh theo quan điểm của Đảng Cộng sản Việt Nam hiện nay là đoàn kế t các dân tộc, tôn giáo, giai cấp, tầng lớp nhân dân, mọi thành phần kinh tế, mọi giớ i, mọi lứa tuổi, mọi vùng, mọi miền đất nước"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “đoàn kết trong Đảng và ngoài Đảng, người đang công tác và người đã nghỉ hưu, người trong nước …”","o":["lực vũ trang, kinh tế, chính trị, văn hoá, xã hộ i","và người đang sinh sống ở nước ngoài","suy yếu và lật đổ các nước xã hội chủ nghĩa","để bảo vệ vững chắc xã hội chủ nghĩa"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: đoàn kết trong Đảng và ngoài Đảng, người đang công tác và người đã nghỉ hưu, người trong nước và người đang sinh sống ở nước ngoài."},{"q":"Phương án nào điền đúng vào chỗ trống: “Thực hiện tốt quy chế dân chủ ở cơ sở, củng cố, nâng cao chất lượng, hiệu quả, nền nếp …”?","o":["để lật đổ chế độ xã hội chủ nghĩa ở Việt Nam","vững an ninh kinh tế, chính trị , văn hoá, tư tưởng","của chiến lược “Diễn biến hoà bình”","hoạt động của các tổ chức quần chúng"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Thực hiện tốt quy chế dân chủ ở cơ sở, củng cố, nâng cao chất lượng, hiệu quả, nền nếp hoạt động của các tổ chức quần chúng..."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Duy trì nghiêm kỷ luật của Đảng ở các cấp, xử lý kịp thời những đảng viên, tổ chức Đảng có khuyết điểm, khen thưởng kịp thời những đảng viên, tổ chức Đảng và quần chúng thực hiện tốt đường …”?","o":["lực vũ trang, kinh tế, chính trị, văn hoá, xã hộ i","lối, chủ trương Điều lệ Đảng và chính sách, pháp luật của Nhà nước","do Đảng Cộng sản Việt Nam khởi xướng và lãnh đạo","trong và khi có thời cơ tiến hành lật đổ chế độ xã hội"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Duy trì nghiêm kỷ luật của Đảng ở các cấp, xử lý kịp thời những đảng viên, tổ chức Đảng có khuyết điểm, khen thưởng kịp thời những đảng viên, tổ chức Đảng và quần chúng thực hiện tốt đường lối, chủ trương Điều lệ Đảng và chính sách, pháp luật của Nhà nước."},{"q":"Theo giáo trình, ý “Phải chú trọng giải quyết đúng đắn mối quan hệ giữa số lượng và chất …” kết thúc bằng nội dung nào?","o":["lãnh thổ của Tổ quốc","lượng nhưng lấy chất lượng là chính","những dự án đầu tư quốc tế vào Việt Nam","CHỐNG PHÁ CÁCH MẠNG VIỆT NAM II.1"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Phải chú trọng giải quyết đúng đắn mối quan hệ giữa số lượng và chất lượng nhưng lấy chất lượng là chính."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Ở mỗi địa phương, phải chú trọng kết hợp phát động phong trào quần chúng bả o vệ an ninh Tổ quốc …”","o":["bất mãn trong nước gây rối, làm mất ổn định xã hội ở một","và xây dựng lực lượng vũ trang ở cơ sở","tuyệt đối hoá một giải pháp nào","động, để tạo nên sức mạnh của thế trận “lòng dân”"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Ở mỗi địa phương, phải chú trọng kết hợp phát động phong trào quần chúng bả o vệ an ninh Tổ quốc và xây dựng lực lượng vũ trang ở cơ sở."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Quần chúng là nền tả ng, là gốc rễ của dân tộc, là động lực chính để …”","o":["“Diễn biến hoà bình” để xoá bỏ chủ nghĩa xã hộ i","nghĩa trong giai đoạn cách mạng mới","thúc đẩy sự phát triển của xã hội","tuyệt đối hoá một giải pháp nào"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Quần chúng là nền tả ng, là gốc rễ của dân tộc, là động lực chính để thúc đẩy sự phát triển của xã hội."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Xây dựng, luyện tập các phương án, các tình huống chống “diễn biến hoà bình”, bạo loạn lật đổ của địch Mỗi thủ đoạn, hình thức, biện pháp mà kẻ thù sử dụng trong chiến lược “Diễn biến hoà bình” …” là gì?","o":["của chúng nhưng cuối cùng đã bị thất bạ i hoàn toàn","ở các nước đối địch khi mà các thủ đoạn khác bị thất bại","bạo loạn lật đổ, cần có phương thức xử lý cụ thể, hiệu quả","vững an ninh kinh tế, chính trị , văn hoá, tư tưởng"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng, luyện tập các phương án, các tình huống chống “diễn biến hoà bình”, bạo loạn lật đổ của địch Mỗi thủ đoạn, hình thức, biện pháp mà kẻ thù sử dụng trong chiến lược “Diễn biến hoà bình”, bạo loạn lật đổ, cần có phương thức xử lý cụ thể, hiệu quả."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Khi mỗi tình huống bạo loạn xảy ra, cần phát huy sức mạnh tổng hợp củ a toàn dân và của cả hệ thống chính trị, xử trí theo nguyên tắc nhanh gọn - kiên quyết …”?","o":["– linh hoạt - đúng đối tượng - không để lan rộng, kéo dài","truyền và hướng Việt Nam đi theo quỹ đạo của chủ nghĩa tư bản","vững an ninh kinh tế, chính trị , văn hoá, tư tưởng","những dự án đầu tư quốc tế vào Việt Nam"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Khi mỗi tình huống bạo loạn xảy ra, cần phát huy sức mạnh tổng hợp củ a toàn dân và của cả hệ thống chính trị, xử trí theo nguyên tắc nhanh gọn - kiên quyết – linh hoạt - đúng đối tượng - không để lan rộng, kéo dài."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Hoạt động xử lý bạo loạn phải đặt dưới sự lãnh đạo của Đảng, điều hành của chính quyề n, các ngành …”","o":["chức Đảng ở các cấp, nhất là ở cơ sở","lược “Diễn biến hoà bình” của kẻ thù chống phá nước ta hiện nay","kế t toàn dân tộc, làm mất đi vai trò lãnh đạo của Đảng","tham mưu, quân đội và công an làm nòng cốt"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Hoạt động xử lý bạo loạn phải đặt dưới sự lãnh đạo của Đảng, điều hành của chính quyề n, các ngành tham mưu, quân đội và công an làm nòng cốt."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Đẩy mạnh sự nghiệp công nghiệp hoá, hiện đại hoá đất nước và chăm lo nâng cao đời sống vật chất, tinh thần cho nhân dân lao động Đẩy mạnh sự nghiệp công nghiệp hoá, hiện đại hoá đất nước theo định …” được hoàn thiện như thế nào?","o":["phương thức đấ u tranh phù hợp, không để lan rộng kéo dài","cả các lực lượng khủng bố để lật đổ một chính quyền hợp pháp","hội chủ nghĩa ở nước ta theo con đường tư bản chủ nghĩa","hướng xã hội chủ nghĩa thực chất là để tạo ra cơ sở vật"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đẩy mạnh sự nghiệp công nghiệp hoá, hiện đại hoá đất nước và chăm lo nâng cao đời sống vật chất, tinh thần cho nhân dân lao động Đẩy mạnh sự nghiệp công nghiệp hoá, hiện đại hoá đất nước theo định hướng xã hội chủ nghĩa thực chất là để tạo ra cơ sở vật"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “đồng thời, là điều kiện để tăng năng suất lao động của xã hội, nâng cao đời sống vật chất, tinh thần cho nhân dân lao …”","o":["động, để tạo nên sức mạnh của thế trận “lòng dân”","tan rã chế độ xã hội chủ nghĩa ở một số nước còn lại","ĐỐI VỚI CÁCH MẠNG VIỆT NAM ---------------- A","tuyệt đối hoá một giải pháp nào"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: đồng thời, là điều kiện để tăng năng suất lao động của xã hội, nâng cao đời sống vật chất, tinh thần cho nhân dân lao động, để tạo nên sức mạnh của thế trận “lòng dân”."},{"q":"Phương án nào điền đúng vào chỗ trống: “Vì vậy, trong quá trình tổ chức thực hiện nhiệm vụ này không nên coi nhẹ hoặc …”?","o":["quy mô nhỏ đến lớ n","chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh","nghiệp công nghiệp hoá, hiện đại hoá đất nước","tuyệt đối hoá một giải pháp nào"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, trong quá trình tổ chức thực hiện nhiệm vụ này không nên coi nhẹ hoặc tuyệt đối hoá một giải pháp nào."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Âm mưu, thủ đoạn “diễn biến hoà bình”, bạo loạn lật đổ của chủ nghĩa đế quốc và các thế lực thù địch sử dụng …”?","o":["ở các nước đối địch khi mà các thủ đoạn khác bị thất bại","lực vũ trang, kinh tế, chính trị, văn hoá, xã hộ i","chống phá các nước xã hội chủ nghĩa như thế nào?","tan rã chế độ xã hội chủ nghĩa ở một số nước còn lại"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Âm mưu, thủ đoạn “diễn biến hoà bình”, bạo loạn lật đổ của chủ nghĩa đế quốc và các thế lực thù địch sử dụng chống phá các nước xã hội chủ nghĩa như thế nào?"},{"q":"Theo giáo trình, ý “Phương hướng, giải pháp cơ bản phòng, chống “diễn biến hoà bình”, bạo …” kết thúc bằng nội dung nào?","o":["quy mô nhỏ đến lớ n","và người đang sinh sống ở nước ngoài","ĐỔ Ở VIỆT NAM HIỆN NAY IV.1","loạ n lật đổ ?"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Phương hướng, giải pháp cơ bản phòng, chống “diễn biến hoà bình”, bạo loạ n lật đổ ?"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Liên hệ với vai trò, trách nhiệm của thanh niên, học sinh trong phòng, chống “diễn …”","o":["nghĩa trong cải tổ, cải cách, đổi mới","biến hoà bình”, bạo loạn lật đổ?","diễn ra khi có điều kiện và thời cơ","nghĩa trong giai đoạn cách mạng mới"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Liên hệ với vai trò, trách nhiệm của thanh niên, học sinh trong phòng, chống “diễn biến hoà bình”, bạo loạn lật đổ?"}]},{"id":2,"title":"MỘT SỐ NỘI DUNG CƠ BẢN VỀ DÂN TỘC, TÔN GIÁO, ĐẤU TRANH PHÒNG, CHỐNG CÁC THẾ LỰC THÙ ĐỊCH LỢI DỤNG VẤN ĐỀ DÂN TỘC, TÔN GIÁO CHỐNG PHÁ CÁCH MẠNG VIỆT NAM","questions":[{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Bài 2 MỘT SỐ NỘI DUNG CƠ BẢN VỀ DÂN TỘC, TÔN GIÁO, ĐẤU TRANH PHÒNG, CHỐNG CÁC THẾ LỰC THÙ ĐỊCH LỢI DỤNG VẤN ĐỀ DÂN …”","o":[", thầ n bí hóa giáo chủ đang nổi lên","TỘC, TÔN GIÁO CHỐNG PHÁ CÁCH MẠNG VIỆT NAM --------------- A","kẻ xấu quay về với cộng đồng","hẹp hòi, dân tộc cực đoan, ly khai"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Bài 2 MỘT SỐ NỘI DUNG CƠ BẢN VỀ DÂN TỘC, TÔN GIÁO, ĐẤU TRANH PHÒNG, CHỐNG CÁC THẾ LỰC THÙ ĐỊCH LỢI DỤNG VẤN ĐỀ DÂN TỘC, TÔN GIÁO CHỐNG PHÁ CÁCH MẠNG VIỆT NAM --------------- A."},{"q":"Theo bài học, phần còn thiếu trong nhận định “giải quyết vấn đề dân tộc, tôn giáo theo quan điểm của chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh và quan điểm, chính sách của Đảng …” là gì?","o":["dựng quốc gia dân tộc thống nhất","chống phá cách mạng của các thế lực thù địch","và Nhà nước ta về dân tộc, tôn giáo hiện nay","mưu không bao giờ thay đổi của các thế lự c thù địch"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: giải quyết vấn đề dân tộc, tôn giáo theo quan điểm của chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh và quan điểm, chính sách của Đảng và Nhà nước ta về dân tộc, tôn giáo hiện nay."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Khái niệm được hiểu: Các thành viên cùng dân tộc sử dụng một ngôn ngữ chung (tiếng mẹ …”?","o":["đẻ) để giao tiếp nội bộ dân tộc","theo hướng “tốt đời, đẹp đạo”","kích động lôi kéo đồng bào gây bạo loạn","hưởng, thu hút tín đồ"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Khái niệm được hiểu: Các thành viên cùng dân tộc sử dụng một ngôn ngữ chung (tiếng mẹ đẻ) để giao tiếp nội bộ dân tộc."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Dân tộc được hiểu theo nghĩa cộng đồng quốc gia dân tộc, là một cộng đồng chính trị - xã hội, được chỉ đạo bởi một nhà nước, thiết lập trên một lãnh …”","o":["tồn tại, phát triển trong từng quốc gia dân tộc","thổ chung, như: Dân tộc Việt Nam, dân tộ c Trung Hoa … I.1.2","dân tộc, các tôn giáo vi phạm dân chủ, nhân quyền để cô lập,","liên minh công - nông - trí thức dưới sự lãnh đạo của Đảng"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Dân tộc được hiểu theo nghĩa cộng đồng quốc gia dân tộc, là một cộng đồng chính trị - xã hội, được chỉ đạo bởi một nhà nước, thiết lập trên một lãnh thổ chung, như: Dân tộc Việt Nam, dân tộ c Trung Hoa … I.1.2."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Toàn cầu hoá và các vấn đề toàn cầu làm cho sự hiểu biết lẫn nhau và sự phụ thuộc lẫn nhau giữa các dân …” được hoàn thiện như thế nào?","o":["các dân tộc ở Việt Nam đều phát triển, ấm no, hạnh phúc","ích của nhân dân lao động, đó là mặt chính trị của tôn giáo","tộc tăng lên, thúc đẩy xu thế khu vực hoá","vùng dân tộc thiểu số Tây Bắc, Tây Nguyên"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Toàn cầu hoá và các vấn đề toàn cầu làm cho sự hiểu biết lẫn nhau và sự phụ thuộc lẫn nhau giữa các dân tộc tăng lên, thúc đẩy xu thế khu vực hoá."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Mặt khác, quan hệ dân tộc, sắc tộc hiện nay trên thế giới vẫn diễn ra rất phức tạ p, nóng bỏng ở …”","o":["cả phạm vi quốc gia, khu vực và quốc tế","tộc lớn, dân tộc hẹp hòi","thổ chung, như: Dân tộc Việt Nam, dân tộ c Trung Hoa … I.1.2","ổn định chính trị - xã hội"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Mặt khác, quan hệ dân tộc, sắc tộc hiện nay trên thế giới vẫn diễn ra rất phức tạ p, nóng bỏng ở cả phạm vi quốc gia, khu vực và quốc tế."},{"q":"Phương án nào điền đúng vào chỗ trống: “Đại hội XIII của Đảng nhận định: “ Toàn cầu hóa và hội nhập quốc tế tiếp tục tiến triển nhưng đang bị thách thức bởi sự cạnh tranh ảnh hưởng của …”?","o":["dân tộc, tôn giáo, vô hiệu hoá được sự lợ i dụng vấn đề","các nước lớn và sự trổi dậy của chủ nghĩa dân tộc cự đoan","quốc gia, đe doạ hoà bình, an ninh khu vực và thế giới",", thầ n bí hóa giáo chủ đang nổi lên"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đại hội XIII của Đảng nhận định: “ Toàn cầu hóa và hội nhập quốc tế tiếp tục tiến triển nhưng đang bị thách thức bởi sự cạnh tranh ảnh hưởng của các nước lớn và sự trổi dậy của chủ nghĩa dân tộc cự đoan."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Quan điểm chủ nghĩa Mác-Lênin, tư tưởng Hồ chí Minh về dân tộc và giả i quyết vấn đề dân tộc Quan điểm chủ nghĩa Mác-Lênin về dân tộc và giải quyết vấn đề dân tộc Vấn đề dân tộc là những nội …”?","o":["chủ được bản thân là cơ sở tâm lý để hình thành tôn giáo","trị phản động của các thế lực lợi dụng tôn giáo","ta tiếp tục xây dựng và phát triển đất nước","dung nảy sinh trong quan hệ giữa các dân tộc diễn ra trên mọi"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Quan điểm chủ nghĩa Mác-Lênin, tư tưởng Hồ chí Minh về dân tộc và giả i quyết vấn đề dân tộc Quan điểm chủ nghĩa Mác-Lênin về dân tộc và giải quyết vấn đề dân tộc Vấn đề dân tộc là những nội dung nảy sinh trong quan hệ giữa các dân tộc diễn ra trên mọi"},{"q":"Theo giáo trình, ý “Bởi do dân số và trình độ phát triển kinh tế - xã hội giữa …” kết thúc bằng nội dung nào?","o":["cách mạng xã hội chủ nghĩa","đẻ) để giao tiếp nội bộ dân tộc","các dân tộc không đều nhau","giáo, bảo vệ chủ quyền an ninh quốc gia"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Bởi do dân số và trình độ phát triển kinh tế - xã hội giữa các dân tộc không đều nhau;"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Vấn đề dân tộc là vấn đề chiến lược của cách …”","o":["dân tộc ở Việt Nam","PHÁ CÁCH MẠNG VIỆT NAM III.1","mạng xã hội chủ nghĩa","và giúp đỡ nhau cùng tiến bộ"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Vấn đề dân tộc là vấn đề chiến lược của cách mạng xã hội chủ nghĩa."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Đó là các dân tộc hoàn toàn bình đẳng, các dân tộc được quyền tự quyết, liên hiệp giai …”","o":["đồng bào dân tộc thiểu số","tốt chính sách dân tộc, tôn giáo","cấp công nhân tất cả các dân tộc","chống phá cách mạng Việt Nam"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Đó là các dân tộc hoàn toàn bình đẳng, các dân tộc được quyền tự quyết, liên hiệp giai cấp công nhân tất cả các dân tộc."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Quyền bình đẳng dân tộc phải được pháp luật hoá và …” là gì?","o":["thực hiện trên thực tế","dân tộc khác chiếm 56,2%","đồng bào dân tộc thiểu số","chống phá cách mạng Việt Nam"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Quyền bình đẳng dân tộc phải được pháp luật hoá và thực hiện trên thực tế."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Kiên quyết đấu tranh chống việc lợi dụng quyền tự quyết để can thiệp, chia rẽ …”?","o":["không để kẻ thù lấy cớ can thiệp","14,7% tổng dân số của cả nướ c","tôn trọng giúp đỡ nhau cùng phát triển”","phá hoại khối đoàn kết dân tộc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Kiên quyết đấu tranh chống việc lợi dụng quyền tự quyết để can thiệp, chia rẽ, phá hoại khối đoàn kết dân tộc."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Đây là nội dung vừa phản ánh bản chất quốc tế của giai cấp công nhân, vừa phản ánh sự thống nhất giữa sự nghiệp giải phóng dân tộc và giải phóng giai cấp, đảm bảo cho phong …”","o":["triển kinh tế - xã hội giữa các dân tộc","trào dân tộc có đủ sức mạnh và khả năng để giành thắng lợi","dân tộc, các tôn giáo vi phạm dân chủ, nhân quyền để cô lập,","tôn giáo, giữa đồng bào theo các tôn giáo khác nhau, hòng làm suy"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đây là nội dung vừa phản ánh bản chất quốc tế của giai cấp công nhân, vừa phản ánh sự thống nhất giữa sự nghiệp giải phóng dân tộc và giải phóng giai cấp, đảm bảo cho phong trào dân tộc có đủ sức mạnh và khả năng để giành thắng lợi."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Tư tưởng Hồ Chí Minh về dân tộc và giải quyết vấn đề dân tộc mang bản …” được hoàn thiện như thế nào?","o":["chất cách mạng, khoa học và sâu sắc","hiệu hoá sự lợi dụng của kẻ thù","kích động lôi kéo đồng bào gây bạo loạn","quyền sinh hoạt tôn giáo bình thường theo pháp luật"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tư tưởng Hồ Chí Minh về dân tộc và giải quyết vấn đề dân tộc mang bản chất cách mạng, khoa học và sâu sắc;"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “xây dựng quan hệ tốt đẹp giữa các dân tộc trong đại gia đình các dân tộc Việt Nam và giữa dân tộc Việt …”","o":["các dân tộc, các tôn giáo","xen kẽ với một vài dân tộc khác","Nam với các quốc gia dân tộc trên thế giới","đề có tính nguyên tắc sau:"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: xây dựng quan hệ tốt đẹp giữa các dân tộc trong đại gia đình các dân tộc Việt Nam và giữa dân tộc Việt Nam với các quốc gia dân tộc trên thế giới."},{"q":"Phương án nào điền đúng vào chỗ trống: “Khi Tổ quốc được độc lập, tự do, Người đã cùng toàn Đảng lãnh đạo nhân dân xây dựng mối quan hệ mới, tốt đẹp giữa các dân tộc: Bình đẳng, đoàn kết, tôn trọng và …”?","o":["thổ chung, như: Dân tộc Việt Nam, dân tộ c Trung Hoa … I.1.2","giúp đỡ nhau cùng phát triển đi lên con đường ấm no, hạnh phúc","có vị trí chiến lược lâu dài trong sự nghiệp cách mạng nước ta","tồn tại, phát triển trong từng quốc gia dân tộc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Khi Tổ quốc được độc lập, tự do, Người đã cùng toàn Đảng lãnh đạo nhân dân xây dựng mối quan hệ mới, tốt đẹp giữa các dân tộc: Bình đẳng, đoàn kết, tôn trọng và giúp đỡ nhau cùng phát triển đi lên con đường ấm no, hạnh phúc."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “  mạnh để dân tộc ta tiếp tục xây dựng và phát triển đất nước."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Không có dân tộc thiểu số nào cư trú duy nhất trên một địa bàn mà không …” là gì?","o":["xen kẽ với một vài dân tộc khác","trị - xã hội, nhất là vùng dân tộc, tôn giáo","động làm mất trật tự, an toàn xã hội","quyết vấn đề tôn giáo"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Không có dân tộc thiểu số nào cư trú duy nhất trên một địa bàn mà không xen kẽ với một vài dân tộc khác."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Theo kết quả tổng điều tra dân số năm 2019, Việt Nam có 96.208.984 người, trong đó dân số nam là 47.881.061 người (chiếm 49,8%) …”?","o":["và dân số nữ là 48.327.923 ngườ i (chiếm 50,2%)","phóng dân tộc, lập nên nước Việt Nam dân chủ cộ ng hòa","hướng trong đời sống tinh thần xã hội","các khu vực, các châu lục trên thế giớ i"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Theo kết quả tổng điều tra dân số năm 2019, Việt Nam có 96.208.984 người, trong đó dân số nam là 47.881.061 người (chiếm 49,8%) và dân số nữ là 48.327.923 ngườ i (chiếm 50,2%)."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Toàn quốc có 82.085.729 người dân tộ c Kinh, chiếm 85,3% và 14.123.255 người dân tộc khác, chiếm …”","o":["và dân số nữ là 48.327.923 ngườ i (chiếm 50,2%)","14,7% tổng dân số của cả nướ c","Việt Nam của các thếlực thù địch?","quyền sinh hoạt tôn giáo bình thường theo pháp luật"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Toàn quốc có 82.085.729 người dân tộ c Kinh, chiếm 85,3% và 14.123.255 người dân tộc khác, chiếm 14,7% tổng dân số của cả nướ c."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Trình độ phát triển kinh tế - xã hội giữa các …” được hoàn thiện như thế nào?","o":["mạng xã hội chủ nghĩa","Nhà nước ta hiện nay II.2.1","dân tộc không đều nhau","trước những thách thức lớn ”"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Trình độ phát triển kinh tế - xã hội giữa các dân tộc không đều nhau."},{"q":"Dựa vào nội dung bài học,
