c của giai cấp bị bóc lột trong cuộc đấu tranh chống bọn bóc lột tất nhiên đẻ ra lòng tin vào …”?","o":["một cuộc đời tốt đẹp hơn ở thế giới bên kia”","nhiều người tin theo các tôn giáo khác nhau","tốt chính sách dân tộc, tôn giáo","các tôn giáo nhanh chóng xoá đói giảm nghèo nâng cao dân trí, sức"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: I.Lênin đã viết: “Sự bất lực của giai cấp bị bóc lột trong cuộc đấu tranh chống bọn bóc lột tất nhiên đẻ ra lòng tin vào một cuộc đời tốt đẹp hơn ở thế giới bên kia”."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “các cuộ c xung đột giai cấp, dân tộc, tôn giáo …”?","o":["thiên tai, bệnh tật","phát triển không có tôn giáo","không để kẻ thù lấy cớ can thiệp","trong cuộc đấu tranh này"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: các cuộ c xung đột giai cấp, dân tộc, tôn giáo, thiên tai, bệnh tật."},{"q":"Theo giáo trình, ý “Vì vậy, họ cho rằng tồn tại một thần thánh có sức mạnh, quyền lực to lớn, quyết định đến mọi vấn đề trong cuộc sống và họ phải …” kết thúc bằng nội dung nào?","o":["cấp công nhân tất cả các dân tộc","dụng tôn giáo để thực hiện mục tiêu chính trị của mình","Chí Minh đã có quan điểm dân tộc đúng đắn, góp phần cùng toàn","tôn thờ thần thánh đó và nảy sinh ra các tôn giáo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, họ cho rằng tồn tại một thần thánh có sức mạnh, quyền lực to lớn, quyết định đến mọi vấn đề trong cuộc sống và họ phải tôn thờ thần thánh đó và nảy sinh ra các tôn giáo."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Tính chất của tôn giáo Cũng như các hình thái ý thức xã hội khác, tôn giáo có tính lịch …”","o":["khối đại đoàn kết của dân tộc Việt Nam","sử, tính quầ n chúng, tính chính trị","Đảng, Nhà nước ta hiện nay I.2.1","PHÁ CÁCH MẠNG VIỆT NAM III.1"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tính chất của tôn giáo Cũng như các hình thái ý thức xã hội khác, tôn giáo có tính lịch sử, tính quầ n chúng, tính chính trị."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Tôn giáo còn tồn tại rất lâu dài, nhưng sẽ mất đi khi con người làm chủ hoàn …”","o":["toàn tự nhiên, xã hội và tư duy","kẻ xấu quay về với cộng đồng","các dân tộc, các tôn giáo","tưởng phù hợp với tâm lý, hành vi của con người"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tôn giáo còn tồn tại rất lâu dài, nhưng sẽ mất đi khi con người làm chủ hoàn toàn tự nhiên, xã hội và tư duy."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Hiện nay, một bộ phận không nhỏ quần chúng nhân dân …” là gì?","o":["ở Tây Bắc, Trườ ng Sơn, Tây Nguyên","tin theo các tôn giáo","dân tộc, vùng tôn giáo","quyết vấn đề tôn giáo"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Hiện nay, một bộ phận không nhỏ quần chúng nhân dân tin theo các tôn giáo."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Giai cấp thống trị lợi dụng tôn giáo làm công cụ hỗ trợ để thống trị áp …”?","o":["tế của dân tộc Việt Nam","bức bóc lột và mê hoặc quần chúng","sự vận động, phát triển của tồn tại xã hội","công tác tôn giáo"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Giai cấp thống trị lợi dụng tôn giáo làm công cụ hỗ trợ để thống trị áp bức bóc lột và mê hoặc quần chúng."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Tình hình tôn giáo trên thế giới và quan điểm chủ nghĩa Mác-Lênin về giải quyết vấn đề tôn giáo trong cách mạng xã hội chủ nghĩa Tình hình tôn giáo trên thế giới Theo Từ điển Bách khoa Tôn …”","o":["đồng bào dân tộc, làm tốt công tác dân vận","giáo thế giới năm 2001, hiện nay trên thế giới có tới 10.000 tôn","hiều biết lẫn nhau vì lợi ích của các giáo hội và đất nước","sức lực, tiền, của giúp đồng bào phát triển sả n xuất"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tình hình tôn giáo trên thế giới và quan điểm chủ nghĩa Mác-Lênin về giải quyết vấn đề tôn giáo trong cách mạng xã hội chủ nghĩa Tình hình tôn giáo trên thế giới Theo Từ điển Bách khoa Tôn giáo thế giới năm 2001, hiện nay trên thế giới có tới 10.000 tôn"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Như vậy, chỉ tính các tôn giáo lớn đã có 4,2 tỷ người tin theo …” được hoàn thiện như thế nào?","o":["và dân số nữ là 48.327.923 ngườ i (chiếm 50,2%)","chiếm 76% dân số thế giới","cách mạng xã hội chủ nghĩa","đồng bào dân tộc, làm tốt công tác dân vận"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Như vậy, chỉ tính các tôn giáo lớn đã có 4,2 tỷ người tin theo, chiếm 76% dân số thế giới."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “các tôn giáo cũng có xu hướng dân tộc hoá, bình dân hoá, mềm hoá các giới luật lễ nghi để thích nghi …”","o":["hướng trong đời sống tinh thần xã hội","để chia rẽ tôn giáo, dân tộc","tồn tại, phát triển trong từng quốc gia dân tộc","tín đồ, chức sắc tôn giáo hoạt động theo đúng pháp luật"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: các tôn giáo cũng có xu hướng dân tộc hoá, bình dân hoá, mềm hoá các giới luật lễ nghi để thích nghi, tồn tại, phát triển trong từng quốc gia dân tộc;"},{"q":"Phương án nào điền đúng vào chỗ trống: “đồng thời, nhiều “hiện tượng tôn giáo lạ” ra đời, trong đó có không ít tổ chức tôn giáo là một trong những tác nhân gây xung đột tôn …”?","o":["cho quan hệ giai cấp, dân tộc diễn biến phức tạ p, khó lường","xen kẽ với một vài dân tộc khác","chất cách mạng, khoa học và sâu sắc","giáo, xung đột dân tộc gay gắt trên thế giới hiện nay"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: đồng thời, nhiều “hiện tượng tôn giáo lạ” ra đời, trong đó có không ít tổ chức tôn giáo là một trong những tác nhân gây xung đột tôn giáo, xung đột dân tộc gay gắt trên thế giới hiện nay."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Tình hình, xu hướng hoạt động của các tôn giáo trên thế giới có tác động, ảnh hưởng không nhỏ …”?","o":["động làm mất trật tự, an toàn xã hội","chống phá cách mạng của các thế lực thù địch","động đối với các dân tộc","đến sinh hoạt tôn giáo ở Việt Nam"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Tình hình, xu hướng hoạt động của các tôn giáo trên thế giới có tác động, ảnh hưởng không nhỏ đến sinh hoạt tôn giáo ở Việt Nam."},{"q":"Theo giáo trình, ý “góp phần đấu tranh bác bỏ những luận điệu sai trái, xuyên tạc, vu cáo của các …” kết thúc bằng nội dung nào?","o":["thế lực thù địch với Việt Nam","phát triển không có tôn giáo","đối với sự nghiệp cách mạ ng Việt Nam","âm mưu thủ đoạn nham hiểm của kẻ thù"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: góp phần đấu tranh bác bỏ những luận điệu sai trái, xuyên tạc, vu cáo của các thế lực thù địch với Việt Nam;"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Để giải quyết tốt vấn đề tôn giáo, cần thực hiện các vấn …”","o":["cầu tinh thần của một bộ phận nhân dân","đẻ) để giao tiếp nội bộ dân tộc","đề có tính nguyên tắc sau:","vấn đề dân tộc, tôn giáo"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Để giải quyết tốt vấn đề tôn giáo, cần thực hiện các vấn đề có tính nguyên tắc sau:"},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Chủ nghĩa Mác-Lênin khẳng định, chỉ có thể giải phóng quần chúng khỏi ảnh hưởng tiêu cực của tôn giáo bằng cách từng bước giải quyết …”","o":["nguồn gốc tự nhiên, nguồn gốc xã hội của tôn giáo","tổn hại đến lợi ích dân tộc","có vị trí chiến lược lâu dài trong sự nghiệp cách mạng nước ta","đồng bào các dân tộc thiểu số"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Chủ nghĩa Mác-Lênin khẳng định, chỉ có thể giải phóng quần chúng khỏi ảnh hưởng tiêu cực của tôn giáo bằng cách từng bước giải quyết nguồn gốc tự nhiên, nguồn gốc xã hội của tôn giáo."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Tuyệt đối không được sử dụng mệ nh lệnh hành chính cưỡng chế để …” là gì?","o":["cả phạm vi quốc gia, khu vực và quốc tế","tuyên chiến, xoá bỏ tôn giáo","đoan, tự ti, mặc cảm dân tộc, tôn giáo","toàn diện, tổng hợp"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tuyệt đối không được sử dụng mệ nh lệnh hành chính cưỡng chế để tuyên chiến, xoá bỏ tôn giáo."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Trong chủ nghĩa xã hội, tôn giáo còn là nhu cầu tinh thần của một bộ phận …”?","o":["14,7% tổng dân số của cả nướ c","đồng bào dân tộc thiểu số","giáo và không theo tôn giáo","nhân dân, còn tồn tại lâu dài"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trong chủ nghĩa xã hội, tôn giáo còn là nhu cầu tinh thần của một bộ phận nhân dân, còn tồn tại lâu dài."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Nội dung cơ bản của quyền tự do tín ngưỡng là: Bất kỳ ai cũng được tự do theo tôn giáo mà mình lựa chọn, tự do …”","o":["động người Việt Nam ở nước ngoài","chống can thiệp áp đặt và cường quyền”","không theo tôn giáo, tự do chuyển đạo hoặc bỏ đạo","ngưỡng, tôn giáo, ý thức quốc gia dân tộc"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nội dung cơ bản của quyền tự do tín ngưỡng là: Bất kỳ ai cũng được tự do theo tôn giáo mà mình lựa chọn, tự do không theo tôn giáo, tự do chuyển đạo hoặc bỏ đạo."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Mọi tổ chức và cá nhân đều phải tôn trọng quyền tự do tín ngưỡng tôn giáo và quyền tự …” được hoàn thiện như thế nào?","o":["hẹp hòi, dân tộc cực đoan, ly khai","ăn năn hối cải, phục thiện","vùng dân tộc thiểu số Tây Bắc, Tây Nguyên","do không tín ngưỡng tôn giáo của công dân"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Mọi tổ chức và cá nhân đều phải tôn trọng quyền tự do tín ngưỡng tôn giáo và quyền tự do không tín ngưỡng tôn giáo của công dân."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Ba là, quán triệt quan điểm lịch sử - cụ thể khi giải …”","o":["nhận rõ và không bị lừa bịp","chính sách, pháp luật về dân tộc, tôn giáo","dân tộc, các tôn giáo","quyết vấn đề tôn giáo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Ba là, quán triệt quan điểm lịch sử - cụ thể khi giải quyết vấn đề tôn giáo."},{"q":"Phương án nào điền đúng vào chỗ trống: “Những hoạt động tôn giáo đúng pháp luật được tôn trọng, hoạt động ích nước, lợi dân được khuyến khích, hoạt động trái pháp luật, đi ngược …”?","o":["xã hội mới xã hội xã hội chủ nghĩa","lại lợi ích dân tộc bị xử lý theo pháp luật","không theo tôn giáo, tự do chuyển đạo hoặc bỏ đạo","đồng bào dân tộc, làm tốt công tác dân vận"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Những hoạt động tôn giáo đúng pháp luật được tôn trọng, hoạt động ích nước, lợi dân được khuyến khích, hoạt động trái pháp luật, đi ngược lại lợi ích dân tộc bị xử lý theo pháp luật."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Trong xã hội, sinh hoạt tôn giáo tồn tại hai loại mâu thuẫn: Mâu thuẫn đối kháng về lợi ích kinh tế, chính trị giữa các giai cấp bóc lột và thế lực lợi dụng tôn giáo chống lại cách mạng với lợi …”?","o":["sinh hoạt tôn giáo đa dạng, sôi động và không kém phần phức tạp","chủ được bản thân là cơ sở tâm lý để hình thành tôn giáo","tín đồ, chức sắc tôn giáo hoạt động theo đúng pháp luật","ích của nhân dân lao động, đó là mặt chính trị của tôn giáo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trong xã hội, sinh hoạt tôn giáo tồn tại hai loại mâu thuẫn: Mâu thuẫn đối kháng về lợi ích kinh tế, chính trị giữa các giai cấp bóc lột và thế lực lợi dụng tôn giáo chống lại cách mạng với lợi ích của nhân dân lao động, đó là mặt chính trị của tôn giáo."},{"q":"Theo giáo trình, ý “Cho nên, một mặt phải tôn trọng quyền tự do tín ngưỡng của nhân dân, mặt khác phải kiên quyết đấu tranh loại bỏ mặt chính …” kết thúc bằng nội dung nào?","o":["kẻ xấu quay về với cộng đồng","để chia rẽ tôn giáo, dân tộc","giúp đỡ nhau cùng phát triển đi lên con đường ấm no, hạnh phúc","trị phản động của các thế lực lợi dụng tôn giáo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Cho nên, một mặt phải tôn trọng quyền tự do tín ngưỡng của nhân dân, mặt khác phải kiên quyết đấu tranh loại bỏ mặt chính trị phản động của các thế lực lợi dụng tôn giáo."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “kiên quyết vạch trần và xử lý kịp thời theo pháp luật những phần tử lợi dụng tôn …”","o":["để chia rẽ tôn giáo, dân tộc","mạng xã hội chủ nghĩa","giáo để hoạt động chống phá cách mạng","hưởng, thu hút tín đồ"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: kiên quyết vạch trần và xử lý kịp thời theo pháp luật những phần tử lợi dụng tôn giáo để hoạt động chống phá cách mạng."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Khái quát tình hình tôn giáo ở Việt Nam hiện nay Việt Nam là quốc gia có nhiều tôn giáo và …”","o":["đến sinh hoạt tôn giáo ở Việt Nam","nhiều người tin theo các tôn giáo khác nhau","cụ thể, tránh giáo điều, máy móc, rập khuôn cứng nhắc","trong giải quyết vấn đề tôn giáo"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Khái quát tình hình tôn giáo ở Việt Nam hiện nay Việt Nam là quốc gia có nhiều tôn giáo và nhiều người tin theo các tôn giáo khác nhau."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Trong những năm gần đây các tôn giáo đẩy mạnh hoạt động nhằm phát triển tổ chức, phát huy ảnh …” là gì?","o":["động đối với các dân tộc","nhân dân lao động là nguồn gốc nảy sinh tôn giáo","tin theo các tôn giáo","hướng trong đời sống tinh thần xã hội"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trong những năm gần đây các tôn giáo đẩy mạnh hoạt động nhằm phát triển tổ chức, phát huy ảnh hướng trong đời sống tinh thần xã hội."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Đại đa số tín đồ, chức sắc tôn giáo hoạt động đúng pháp luật …”?","o":["phát triển không có tôn giáo","các khu vực, các châu lục trên thế giớ i","theo hướng “tốt đời, đẹp đạo”","của các tôn giáo"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Đại đa số tín đồ, chức sắc tôn giáo hoạt động đúng pháp luật, theo hướng “tốt đời, đẹp đạo”."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Vẫn còn có chức sắc, tín đồ mang tư tưởng chống đối, cực đoan, quá khích gây …”","o":["tổn hại đến lợi ích dân tộc","dân tộc, từng tôn giáo","giáo để hoạt động chống phá cách mạng","cầu tinh thần của một bộ phận nhân dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Vẫn còn có chức sắc, tín đồ mang tư tưởng chống đối, cực đoan, quá khích gây tổn hại đến lợi ích dân tộc;"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Chúng gắn vấn đề “dân chủ”, “nhân quyền” với cái gọi là “tự do tôn giáo” …” được hoàn thiện như thế nào?","o":["cố chống phá cách mạng","vùng dân tộc thiểu số Tây Bắc, Tây Nguyên","để chia rẽ tôn giáo, dân tộc","đẻ) để giao tiếp nội bộ dân tộc"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Chúng gắn vấn đề “dân chủ”, “nhân quyền” với cái gọi là “tự do tôn giáo” để chia rẽ tôn giáo, dân tộc;"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Quan điểm, chính sách tôn giáo của Đảng và Nhà nước ta hiện nay Trung thành với chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh về …”","o":["hiện chính sách dân tộc, tôn giáo","dụng vấn đề dân tộc, tôn giáo để chống phá cách mạng Việt Nam","tôn giáo, giữa đồng bào theo các tôn giáo khác nhau, hòng làm suy","vấn đề tôn giáo và giải quyết vấn đề tôn giáo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Quan điểm, chính sách tôn giáo của Đảng và Nhà nước ta hiện nay Trung thành với chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh về vấn đề tôn giáo và giải quyết vấn đề tôn giáo."},{"q":"Phương án nào điền đúng vào chỗ trống: “đồng bào tôn giáo là một bộ phận quan trọng của khối đại …”?","o":["mạng Việt Nam của các thế lực thù địch?","đoàn kết toàn dân tộc”","ăn năn hối cải, phục thiện","các dân tộc, các tôn giáo"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: đồng bào tôn giáo là một bộ phận quan trọng của khối đại đoàn kết toàn dân tộc”."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Nội dung cốt lõi của công tác tôn giáo là công tác vận động quần chúng sống “tốt đời, đẹp đạo”, góp phần xây dựng và …”?","o":["bảo vệ Tổ quốc theo Việt Nam xã hội chủ nghĩa","tộc tăng lên, thúc đẩy xu thế khu vực hoá","xã hội của nhà nước cầm quyền","phá hoại khối đoàn kết dân tộc"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nội dung cốt lõi của công tác tôn giáo là công tác vận động quần chúng sống “tốt đời, đẹp đạo”, góp phần xây dựng và bảo vệ Tổ quốc theo Việt Nam xã hội chủ nghĩa."},{"q":"Theo giáo trình, ý “Về chính sách tôn giáo, Đảng ta khẳng định: “Đồng bào các tôn giáo là bộ phận quan …” kết thúc bằng nội dung nào?","o":["trọng của khối đại đoàn kết dân tộc","nhân dân lao động là nguồn gốc nảy sinh tôn giáo","để chia rẽ tôn giáo, dân tộc","nhiên và xã hội"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Về chính sách tôn giáo, Đảng ta khẳng định: “Đồng bào các tôn giáo là bộ phận quan trọng của khối đại đoàn kết dân tộc."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Phát huy những giá trị văn hoá, đạo đức tốt đẹp …”","o":["diễn ra theo nhiều xu hướng","theo hướng “tốt đời, đẹp đạo”","của các tôn giáo","là người dân tộc thiểu số"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Phát huy những giá trị văn hoá, đạo đức tốt đẹp của các tôn giáo."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Thực hiện tốt các chương trình phát triển kinh tế - xã hội, nâng cao đời sống vật chất …”","o":["kiên quyết bài trừ mê tín, dị đoan","văn hoá của đồng bào các tôn giáo","chống phá cách mạng Việt Nam","giáo và không theo tôn giáo"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Thực hiện tốt các chương trình phát triển kinh tế - xã hội, nâng cao đời sống vật chất, văn hoá của đồng bào các tôn giáo."},{"q":"Theo bài học, phần còn thiếu trong nhận định “ĐẤU TRANH PHÒNG, CHỐNG ĐỊCH LỢI DỤNG VẤN ĐỀ DÂN TỘC VÀ TÔN GIÁO CHỐNG …” là gì?","o":["giáo để hoạt động chống phá cách mạng","PHÁ CÁCH MẠNG VIỆT NAM III.1","n núi phía Bắc, vùng Tây Nguyên","động làm mất trật tự, an toàn xã hội"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: ĐẤU TRANH PHÒNG, CHỐNG ĐỊCH LỢI DỤNG VẤN ĐỀ DÂN TỘC VÀ TÔN GIÁO CHỐNG PHÁ CÁCH MẠNG VIỆT NAM III.1."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Hiện nay, chủ nghĩa đế quốc đang đẩy mạnh chiến lược “Diễn biến hoà bình” chống Việt Nam với phương châm lấy chống phá về chính trị, tư tưởng làm hàng đầu, kinh tế là mũi nhọn, ngoại giao làm …”?","o":["lại lợi ích dân tộc bị xử lý theo pháp luật","tâm lý con người cũng là cơ sở để tôn giáo nảy sinh","hậu thuẫn, tôn giáo, dân tộc làm ngòi nổ, kết hợp với bạo loạn","dụng vấn đề dân tộc, tôn giáo để chống phá cách mạng Việt Nam"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Hiện nay, chủ nghĩa đế quốc đang đẩy mạnh chiến lược “Diễn biến hoà bình” chống Việt Nam với phương châm lấy chống phá về chính trị, tư tưởng làm hàng đầu, kinh tế là mũi nhọn, ngoại giao làm hậu thuẫn, tôn giáo, dân tộc làm ngòi nổ, kết hợp với bạo loạn"},{"q":"Chọn phương án nối tiếp đúng nội dung: “xoá vai trò lãnh đạo của Đảng với toàn xã hội, thực hiện …”","o":["tế của dân tộc Việt Nam","âm mưu “không đánh mà thắng”","vùng kinh tế mới","hợp với xã hội mới"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: xoá vai trò lãnh đạo của Đảng với toàn xã hội, thực hiện âm mưu “không đánh mà thắng”."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Hai là, kích động các dân tộc thiểu số, tín đồ chức sắc các tôn giáo chống lại chính sách dân …” được hoàn thiện như thế nào?","o":["dân tộc khác chiếm 56,2%","tộc, chính sách tôn giáo của Đảng, Nhà nước","mưu không bao giờ thay đổi của các thế lự c thù địch","hợp với xã hội mới"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Hai là, kích động các dân tộc thiểu số, tín đồ chức sắc các tôn giáo chống lại chính sách dân tộc, chính sách tôn giáo của Đảng, Nhà nước;"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Ba là, vô hiệu hoá sự quản lý của Nhà nước đối với các lĩnh vực đời sống xã hội, gây mất ổn định chính …”","o":["dụng vấn đề dân tộc, tôn giáo để chống phá cách mạng Việt Nam","trị - xã hội, nhất là vùng dân tộc, tôn giáo","dựng quốc gia dân tộc thống nhất","nguồn gốc tự nhiên, nguồn gốc xã hội của tôn giáo"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Ba là, vô hiệu hoá sự quản lý của Nhà nước đối với các lĩnh vực đời sống xã hội, gây mất ổn định chính trị - xã hội, nhất là vùng dân tộc, tôn giáo."},{"q":"Phương án nào điền đúng vào chỗ trống: “Thủ đoạn lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việ t Nam của các thế lực thù địch Thủ đoạn lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam của các thế lực thù địch rất thâm độc, tinh …”?","o":["tộc trong quốc gia đa dân tộc, và giữa các quốc gia dân tộc","không theo tôn giáo, tự do chuyển đạo hoặc bỏ đạo","họa dân tộc ta đã phải sớm đoàn kết thố ng nhất","vi, xảo trá, đê tiện dễ làm cho người ta tin và làm theo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Thủ đoạn lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việ t Nam của các thế lực thù địch Thủ đoạn lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam của các thế lực thù địch rất thâm độc, tinh vi, xảo trá, đê tiện dễ làm cho người ta tin và làm theo."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “những khó khăn trong đời sống vật chất, tinh thần của các …”?","o":["phóng dân tộc, bảo vệ độc lập dân tộc","PHÁ CÁCH MẠNG VIỆT NAM III.1","để chia rẽ tôn giáo, dân tộc","dân tộc, các tôn giáo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: những khó khăn trong đời sống vật chất, tinh thần của các dân tộc, các tôn giáo;"},{"q":"Theo giáo trình, ý “Chúng lợi dụng những thiếu sót, sai lầm trong thực hiện chính sách dân tộc, tôn giáo để gây mâu thuẫn, tạo cớ can …” kết thúc bằng nội dung nào?","o":["tế của dân tộc Việt Nam","thiệ p vào công việc nội bộ của Việt Nam","nh hóa đời sống tinh thần xã hội","đến sinh hoạt tôn giáo ở Việt Nam"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Chúng lợi dụng những thiếu sót, sai lầm trong thực hiện chính sách dân tộc, tôn giáo để gây mâu thuẫn, tạo cớ can thiệ p vào công việc nội bộ của Việt Nam."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “kích động, chia rẽ quan hệ lương – giáo và giữa các tôn giáo hòng làm suy …”","o":["nhằm các mục tiêu cụ thể sau:","yếu khối đại đoàn kết toàn dân tộc","Đảng, Nhà nước ta hiện nay I.2.1","cách mạng xã hội chủ nghĩa"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: kích động, chia rẽ quan hệ lương – giáo và giữa các tôn giáo hòng làm suy yếu khối đại đoàn kết toàn dân tộc."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Bốn là, chúng tìm mọi cách để xây dựng, nuôi dưỡng các tổ chức phản …”","o":["tế của dân tộc Việt Nam","hữu nghị hợp tác giữa các dân tộc","khối đại đoàn kết của dân tộc Việt Nam","động người Việt Nam ở nước ngoài"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Bốn là, chúng tìm mọi cách để xây dựng, nuôi dưỡng các tổ chức phản động người Việt Nam ở nước ngoài;"},{"q":"Theo bài học, phần còn thiếu trong nhận định “Âm mưu, thủ đoạn lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam của …” là gì?","o":["các thế lực thù địch rất nham hiểm","kích động lôi kéo đồng bào gây bạo loạn","xã hội mới xã hội xã hội chủ nghĩa","hiện thực không có áp bức, bất công, nghèo đói, dốt nát"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Âm mưu, thủ đoạn lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam của các thế lực thù địch rất nham hiểm."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Một là, ra sức tuyên truyền, quán triệt quan điểm, chính sách dân tộc …”?","o":["dân tộc, các tôn giáo","tôn giáo của Đảng, Nhà nước","xã hội, nhận thức và tâm lý","triệu, chiếm 6% dân số thế giới"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Một là, ra sức tuyên truyền, quán triệt quan điểm, chính sách dân tộc, tôn giáo của Đảng, Nhà nước;"},{"q":"Chọn phương án nối tiếp đúng nội dung: “Nội dung tuyên truyền giáo dục phải mang tính …”","o":["nhất về dân tộc, tôn giáo","giáo sống “tốt đời, đẹp đạo”","toàn tự nhiên, xã hội và tư duy","toàn diện, tổng hợp"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nội dung tuyên truyền giáo dục phải mang tính toàn diện, tổng hợp."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Phổ biến pháp luật và giáo dục ý thức chấp hành pháp luật của Nhà nước, khơi dậy lòng tự tôn tự hào dân tộc, truyền thống đoàn kết giữa các …” được hoàn thiện như thế nào?","o":["tín ngưỡng, đó là mặt tư tưởng của tôn giáo","để gây mất ổn định chính trị - xã hội, chống phá cách mạng","dân tộc, tôn giáo trong sự nghiệp xây dựng và bảo vệ Tổ quốc","tâm lý con người cũng là cơ sở để tôn giáo nảy sinh"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Phổ biến pháp luật và giáo dục ý thức chấp hành pháp luật của Nhà nước, khơi dậy lòng tự tôn tự hào dân tộc, truyền thống đoàn kết giữa các dân tộc, tôn giáo trong sự nghiệp xây dựng và bảo vệ Tổ quốc."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Vận động đồng bào các dân tộc, tôn giáo thực hiện đầy đủ nghĩa vụ công dân, thực hiện đúng …”","o":["các dân tộc không đều nhau","chính sách, pháp luật về dân tộc, tôn giáo","tồn tại, phát triển trong từng quốc gia dân tộc","thứ 3 trong khu vực Đông Nam Á"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Vận động đồng bào các dân tộc, tôn giáo thực hiện đầy đủ nghĩa vụ công dân, thực hiện đúng chính sách, pháp luật về dân tộc, tôn giáo."},{"q":"Phương án nào điền đúng vào chỗ trống: “Cần tuân thủ những vấn đề có tính nguyên tắc trong xây dựng khối đại đoàn kết dân tộc theo tư tưởng Hồ Chí Minh: Xây dựng khối đại đoàn kết toàn dân phải dựa trên nền tảng khối …”?","o":["dân tộc, tôn giáo, vô hiệu hoá được sự lợ i dụng vấn đề","Khơme Crôm, Mặt trận Chămpa để tiếp tục chống phá cách mạng Việt Nam","liên minh công - nông - trí thức dưới sự lãnh đạo của Đảng","không theo tôn giáo, tự do chuyển đạo hoặc bỏ đạo"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Cần tuân thủ những vấn đề có tính nguyên tắc trong xây dựng khối đại đoàn kết dân tộc theo tư tưởng Hồ Chí Minh: Xây dựng khối đại đoàn kết toàn dân phải dựa trên nền tảng khối liên minh công - nông - trí thức dưới sự lãnh đạo của Đảng."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Kiên quyết đấu tranh loại trừ nguy cơ phá hoại khối …”?","o":["đại đoàn kết dân tộc","nhất về dân tộc, tôn giáo","nhận rõ và không bị lừa bịp","thế lực thù địch với Việt Nam"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Kiên quyết đấu tranh loại trừ nguy cơ phá hoại khối đại đoàn kết dân tộc."},{"q":"Theo giáo trình, ý “Chống kì thị chia rẽ dân tộc, tôn giáo, chống tư tưởng dân tộc lớn, dân tộc hẹp hòi, dân tộc cực …” kết thúc bằng nội dung nào?","o":["bảo vệ Tổ quốc theo Việt Nam xã hội chủ nghĩa","phá hoại khối đoàn kết dân tộc","lại lợi ích dân tộc bị xử lý theo pháp luật","đoan, tự ti, mặc cảm dân tộc, tôn giáo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Chống kì thị chia rẽ dân tộc, tôn giáo, chống tư tưởng dân tộc lớn, dân tộc hẹp hòi, dân tộc cực đoan, tự ti, mặc cảm dân tộc, tôn giáo."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Đây là tiền đề quan trọng để vô hiệu hoá sự …”","o":["14,7% tổng dân số của cả nướ c","chống phá của kẻ thù","hưởng, thu hút tín đồ","vùng biên giới, vùng căn cứ cách mạng"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đây là tiền đề quan trọng để vô hiệu hoá sự chống phá của kẻ thù."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Đây cũng là một trong những giải pháp quan trọng, xét đến cùng có ý nghĩa nền tảng để vô …”","o":["hiệu hoá sự lợi dụng của kẻ thù","phá cách mạng Việt Nam của các thế lực thù địch","họa dân tộc ta đã phải sớm đoàn kết thố ng nhất","trị - xã hội, nhất là vùng dân tộc, tôn giáo"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đây cũng là một trong những giải pháp quan trọng, xét đến cùng có ý nghĩa nền tảng để vô hiệu hoá sự lợi dụng của kẻ thù."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Khắc phục sự chênh lệch về phát triển kinh tế - xã hội giữa …” là gì?","o":["giáo và không theo tôn giáo","kiên quyết bài trừ mê tín, dị đoan","các dân tộc, các tôn giáo","động trái pháp luật, gây mất ổn định chính trị"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Khắc phục sự chênh lệch về phát triển kinh tế - xã hội giữa các dân tộc, các tôn giáo;"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “của những người có uy tín trong các dân tộc, tôn giáo tham gia vào phòng, chống sự lợi dụng vấn đề dân tộc, tôn giáo chống …”?","o":["dân tộc, tạo mọi điều kiện để các dân tộc phát triển đi theo","phá cách mạng Việt Nam của các thế lực thù địch","vấn đề tôn giáo và giải quyết vấn đề tôn giáo","và dân số nữ là 48.327.923 ngườ i (chiếm 50,2%)"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: của những người có uy tín trong các dân tộc, tôn giáo tham gia vào phòng, chống sự lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam của các thế lực thù địch."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Bởi đây là đội ngũ cán bộ sở tại có rất nhiều lợi thế trong thực …”","o":["giáo sống “tốt đời, đẹp đạo”","hiện chính sách dân tộc, tôn giáo","Q uang, Lào Cai, Sơn La, Lai Châu","ở Tây Bắc, Trườ ng Sơn, Tây Nguyên"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Bởi đây là đội ngũ cán bộ sở tại có rất nhiều lợi thế trong thực hiện chính sách dân tộc, tôn giáo."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “sử dụng nhiều phương pháp phù hợp với đặc thù từng …” được hoàn thiện như thế nào?","o":["Đảng, Nhà nước ta hiện nay I.2.1","chống phá cách mạng Việt Nam","tôn giáo của Đảng, Nhà nước","dân tộc, từng tôn giáo"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: sử dụng nhiều phương pháp phù hợp với đặc thù từng dân tộc, từng tôn giáo."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Cần thường xuyên vạch trần bộ mặt phản động của kẻ thù để nhân dân …”","o":["diễn ra theo nhiều xu hướng","dựng quốc gia dân tộc thống nhất","nhận rõ và không bị lừa bịp","trị phản động của các thế lực lợi dụng tôn giáo"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Cần thường xuyên vạch trần bộ mặt phản động của kẻ thù để nhân dân nhận rõ và không bị lừa bịp."},{"q":"Phương án nào điền đúng vào chỗ trống: “Kịp thời chủ động giải quyết tốt các điểm nóng liên quan đến …”?","o":["Đảng, Nhà nước ta hiện nay I.2.1","vấn đề dân tộc, tôn giáo","yếu khối đại đoàn kết toàn dân tộc","thế lực thù địch với Việt Nam"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Kịp thời chủ động giải quyết tốt các điểm nóng liên quan đến vấn đề dân tộc, tôn giáo."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Khi xuất hiện điểm nóng, cần tìm rõ nguyên nhân, biện pháp giải quyết kịp thời, không để lan rộng …”?","o":["không để kẻ thù lấy cớ can thiệp","và giúp đỡ nhau cùng tiến bộ","sức lực, tiền, của giúp đồng bào phát triển sả n xuất", au theo giáo trình: “Khái niệm, vai trò và quy định của pháp luật về …”?","o":["thiện với môi trườ ng xung quanh","bảo vệ môi trường I.1.1","chuẩn kỹ thuật môi trường","mục đích thu lợi bất chính về kinh tế"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Khái niệm, vai trò và quy định của pháp luật về bảo vệ môi trường I.1.1."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Môi trường tự nhiên : Bao gồm tất cả các yếu tố tự nhiên trên trái đất như không khí, khoáng sản, đấ t … để con người có thể …”","o":["môi trường và quy định khác của pháp luật có liên quan","sử dụng và phục vụ cho cuộc số ng sinh hoạt hàng ngày","lý các hành vi phạm tội và vi phạm pháp luật về môi trường","chống tội phạm và vi phạm pháp luật khác về môi trường"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Môi trường tự nhiên : Bao gồm tất cả các yếu tố tự nhiên trên trái đất như không khí, khoáng sản, đấ t … để con người có thể sử dụng và phục vụ cho cuộc số ng sinh hoạt hàng ngày."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Môi trường tự nhiên mang không gian và điều kiện để con người có …” được hoàn thiện như thế nào?","o":["thể sinh sống và tồn tại","phạm vi trách nhiệm được phân công","người, sinh vật và tự nhiên","về bảo vệ môi trường II"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Môi trường tự nhiên mang không gian và điều kiện để con người có thể sinh sống và tồn tại."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Môi trường nhân tạo: Bao gồm các yếu tố vật chất do con người tạo ra, làm thành những tiện nghi trong cuộc sống như ô tô, máy bay, nhà ở, công sở, các khu dân cư …”","o":["trường dẫn đến hậu quả xấu đối với môi trường","các cá nhân, tổ chức có thể xảy ra những tranh chấp","môi trường Việc xây dựng và đưa ra các tiêu chuẩn để định hướng","đô thị, khu sản xuất, kinh doanh, dịch vụ, công viên nhân tạo… I.1.2"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Môi trường nhân tạo: Bao gồm các yếu tố vật chất do con người tạo ra, làm thành những tiện nghi trong cuộc sống như ô tô, máy bay, nhà ở, công sở, các khu dân cư, đô thị, khu sản xuất, kinh doanh, dịch vụ, công viên nhân tạo… I.1.2."},{"q":"Phương án nào điền đúng vào chỗ trống: “Vai trò của pháp luật về bảo vệ môi trường Pháp luật quy định những quy tắc xử sự mà con người phải thực hiện khi khai thác và sử dụng các yếu tố (thành phần) của môi trường Môi trường vừa là …”?","o":["điều kiện sống, vừa là đối tượng tác động hàng ngày của con người","rất phức tạp, có kết cấu đa dạng và phạm vi rộng mà một","về môi trường và pháp luật về bảo vệ môi trường trong nhà trường","các cá nhân, tổ chức có thể xảy ra những tranh chấp"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Vai trò của pháp luật về bảo vệ môi trường Pháp luật quy định những quy tắc xử sự mà con người phải thực hiện khi khai thác và sử dụng các yếu tố (thành phần) của môi trường Môi trường vừa là điều kiện sống, vừa là đối tượng tác động hàng ngày của con người."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Sự tác động đó làm thay đổi rất nhiều hiện trạng của môi trường theo …”?","o":["chiều hướng làm suy thoái môi trường","bảo vệ môi trường I.1.1","cho các tổ chức bảo vệ môi trường","của Nhà nước và từng địa phương"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Sự tác động đó làm thay đổi rất nhiều hiện trạng của môi trường theo chiều hướng làm suy thoái môi trường."},{"q":"Theo giáo trình, ý “Pháp luật với tư cách là công cụ điều tiết các hành vi của các thành viên trong xã hội, có tác dụng rất to lớn trong …” kết thúc bằng nội dung nào?","o":["việc định hướng quá trình khai thác và sử dụng môi trường","sử dụng và phục vụ cho cuộc số ng sinh hoạt hàng ngày","những hậu quả vật chất, tinh thần đối với họ","chưa thể giải quyết một sớm một chiều đối với nhiều cấp, nhiều ngành"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Pháp luật với tư cách là công cụ điều tiết các hành vi của các thành viên trong xã hội, có tác dụng rất to lớn trong việc định hướng quá trình khai thác và sử dụng môi trường."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Các chế định hay điều luật cụ thể quy định những quy tắc xử sự buộc mỗi cá nhân, tổ …”","o":["chuẩn kỹ thuật môi trường","xử lý chất thải rắn trong phạm vi trách nhiệm quản lý","chức phải tuân theo những quy định đó","môi trườ ng có điều kiện còn tồn tại và phát triển"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Các chế định hay điều luật cụ thể quy định những quy tắc xử sự buộc mỗi cá nhân, tổ chức phải tuân theo những quy định đó."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Các quy chuẩn môi trường, tiêu chuẩn môi trường là cơ sở pháp lý cho việc xác định có vi …”","o":["phạm pháp luật về môi trường hay không","tổ chức trong công tác bảo vệ môi trường","tập và làm việc","thải theo quy định (rác thải, nước thả i …)"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Các quy chuẩn môi trường, tiêu chuẩn môi trường là cơ sở pháp lý cho việc xác định có vi phạm pháp luật về môi trường hay không."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Đồng thời, cũng là cơ sở cho việc truy cứu trách nhiệm hình sự hoặc xử lý vi phạm hành chính đối …” là gì?","o":["phạm vi trách nhiệm được phân công","xử lý chất thải rắn trong phạm vi trách nhiệm quản lý","trường và phòng, chống vi phạ m pháp luật về bảo vệ môi trường","với những hành vi vi cụ thể về môi trường"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đồng thời, cũng là cơ sở cho việc truy cứu trách nhiệm hình sự hoặc xử lý vi phạm hành chính đối với những hành vi vi cụ thể về môi trường."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Tuy nhiên, trong thực tế không phải tất cả các quy tắc, các tiêu chuẩn được quy định đều được …”?","o":["dân, Viện Kiể m sát Nhân dân, Toà án Nhân dân","tuân thủ một cách nghiêm túc và triệt để","hiện, giải quyết triệt để đã trở thành tội phạm","mục đích thu lợi bất chính về kinh tế"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Tuy nhiên, trong thực tế không phải tất cả các quy tắc, các tiêu chuẩn được quy định đều được tuân thủ một cách nghiêm túc và triệt để."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Quá trình tham gia khai thác, sử dụng các yếu tố của môi trườ ng, con người thường có xu hướng vi phạm vào …”","o":["tổ chức trong công tác bảo vệ môi trường","các tiêu chuẩn đó ở các mức độ khác nhau","với những hành vi vi cụ thể về môi trường",", Hội cưu chiến binhh Việt Nam và 30 tổ chức hội quần chúng"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Quá trình tham gia khai thác, sử dụng các yếu tố của môi trườ ng, con người thường có xu hướng vi phạm vào các tiêu chuẩn đó ở các mức độ khác nhau."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Tùy theo tính chất mức độ, nhưng có xu hướng ngày càng đa dạng về hành vi, nghiêm trọng về hậu quả tác hại, nếu ở đó có sự hiện diện mâu thuẫn giữa …” được hoàn thiện như thế nào?","o":["môi trường Việc xây dựng và đưa ra các tiêu chuẩn để định hướng","vi vi phạm pháp luật về bảo vệ môi trường của các đối tượng","nhu cầu bức bách của cuộc sống và yêu cầu bảo vệ môi trường","cũng như các hành vi vi phạm hành chính về bảo vệ môi trường"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Tùy theo tính chất mức độ, nhưng có xu hướng ngày càng đa dạng về hành vi, nghiêm trọng về hậu quả tác hại, nếu ở đó có sự hiện diện mâu thuẫn giữa nhu cầu bức bách của cuộc sống và yêu cầu bảo vệ môi trường."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Tuy nhiên, bằng các chế tài hình sự, hành chính …”","o":["dân sự, kinh tế","chức phải tuân theo những quy định đó","Thủ tướng Chính phủ","do Nhà nước, các Bộ, ngành phát động"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tuy nhiên, bằng các chế tài hình sự, hành chính, dân sự, kinh tế..."},{"q":"Phương án nào điền đúng vào chỗ trống: “Các chế tài này hoặc cách ly những kẻ vi phạm nguy hiểm ra khỏi đời sống xã hội (tội phạm) hoặc bị áp dụng …”?","o":["xử lý chất thải rắn trong phạm vi trách nhiệm quản lý","những hậu quả vật chất, tinh thần đối với họ","lợi cá nhân, đặc biệt là đối tượng phạm tội về môi trường","thể tham gia bảo vệ môi trường, nâng cao năng lực các cơ quan"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Các chế tài này hoặc cách ly những kẻ vi phạm nguy hiểm ra khỏi đời sống xã hội (tội phạm) hoặc bị áp dụng những hậu quả vật chất, tinh thần đối với họ."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Pháp luật quy định chức năng, nhiệm vụ, quyền hạn của các cơ quan, tổ chức, cá nhân tham gia bảo vệ môi trường Bảo vệ môi trường là một công việc rất khó khăn và phức tạp, các yếu tố của môi trường …”?","o":["rất phức tạp, có kết cấu đa dạng và phạm vi rộng mà một","công dân còn kém, chưa tự giác, vấn đề bảo vệ môi trường chưa","giáo dục công dân tôn trọng pháp luật bảo vệ môi trường","trường và phòng, chống vi phạ m pháp luật về bảo vệ môi trường"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Pháp luật quy định chức năng, nhiệm vụ, quyền hạn của các cơ quan, tổ chức, cá nhân tham gia bảo vệ môi trường Bảo vệ môi trường là một công việc rất khó khăn và phức tạp, các yếu tố của môi trường rất phức tạp, có kết cấu đa dạng và phạm vi rộng mà một"},{"q":"Theo giáo trình, ý “Pháp luật có tác dụng rất lớn trong việc tạo ra cơ chế hoạt động hiệu quả …” kết thúc bằng nội dung nào?","o":["trường dẫn đến hậu quả xấu đối với môi trường","1992, 2013) quy định về công tác bảo vệ môi trường","cho các tổ chức bảo vệ môi trường","Thủ tướng Chính phủ"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Pháp luật có tác dụng rất lớn trong việc tạo ra cơ chế hoạt động hiệu quả cho các tổ chức bảo vệ môi trường."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Cụ thể là thông qua pháp luật, Nhà nướ c quy định chức năng, nhiệm vụ, quyền hạn của các …”","o":["bảo vệ môi trường II.1.1","tuân thủ một cách nghiêm túc và triệt để","tổ chức trong công tác bảo vệ môi trường","người, sinh vật và tự nhiên"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Cụ thể là thông qua pháp luật, Nhà nướ c quy định chức năng, nhiệm vụ, quyền hạn của các tổ chức trong công tác bảo vệ môi trường."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Giải quyết các tranh chấp liên quan đến bảo vệ môi trường Trong quá trình khai thác, sử dụng các yếu tố của môi trường thì giữa …”","o":["tượng có điều kiện, khả năng phạm tội về môi trường còn có những","môi trườ ng có điều kiện còn tồn tại và phát triển","dân, Viện Kiể m sát Nhân dân, Toà án Nhân dân","các cá nhân, tổ chức có thể xảy ra những tranh chấp"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Giải quyết các tranh chấp liên quan đến bảo vệ môi trường Trong quá trình khai thác, sử dụng các yếu tố của môi trường thì giữa các cá nhân, tổ chức có thể xảy ra những tranh chấp."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Các tranh chấp đó có thể là giữa cá nhân với cá nhân …” là gì?","o":["vi phạm pháp luật về bảo vệ môi trường","nhiệm và nghĩa vụ bảo vệ môi trường","cá nhân với doanh nghiệp","động bảo vệ môi trường"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Các tranh chấp đó có thể là giữa cá nhân với cá nhân, cá nhân với doanh nghiệp;"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Quy định của pháp luật về bảo vệ môi trường Pháp luật về tổ chức, quản lý các hoạt động bảo vệ môi trường: Hiến pháp (1980 …”?","o":["của Nhà nước và từng địa phương","vào giải quyết những vấn đề môi trường","1992, 2013) quy định về công tác bảo vệ môi trường","của pháp luật về bảo vệ môi trường"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Quy định của pháp luật về bảo vệ môi trường Pháp luật về tổ chức, quản lý các hoạt động bảo vệ môi trường: Hiến pháp (1980, 1992, 2013) quy định về công tác bảo vệ môi trường;"},{"q":"Chọn phương án nối tiếp đúng nội dung: “Nghị định, Nghị quyết, Quyết định của Chính phủ …”","o":["trọng công tác bảo vệ môi trường","luật về bảo vệ môi trường","để phá dỡ , tái chế","Thủ tướng Chính phủ"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nghị định, Nghị quyết, Quyết định của Chính phủ, Thủ tướng Chính phủ;"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “các văn bản hướng dẫn của các Bộ, cơ quan ngang bộ, Ủy ban Nhân dân các …” được hoàn thiện như thế nào?","o":["với những hành vi vi cụ thể về môi trường","cấp về công tác bảo vệ môi trường","thể sinh sống và tồn tại","nhận thức của cộng đồng vào việc bảo vệ môi trường"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: các văn bản hướng dẫn của các Bộ, cơ quan ngang bộ, Ủy ban Nhân dân các cấp về công tác bảo vệ môi trường."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Pháp luật xử lý vi phạm trong lĩnh vực bảo vệ môi …”","o":["chiều hướng làm suy thoái môi trường","bảo vệ môi trường I.2.1","yếu tố của môi trường có tính định hướng","trường: Xử lý hình sự"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Pháp luật xử lý vi phạm trong lĩnh vực bảo vệ môi trường: Xử lý hình sự;"},{"q":"Phương án nào điền đúng vào chỗ trống: “Tội phạm về môi trường trước hết phải là hành vi nguy hiểm cho xã hội, có tác động tiêu cực và gây tổn hại ở mức độ đáng kể đến các yếu tố của môi trường, tài nguyên, gây thiệt hại trực …”?","o":["tiếp hoặc gián tiếp đến tính mạng, sức khỏe, tài sản của con người,","có công tác phòng, chống vi phạm pháp luật về bảo vệ môi trường","hiện, giải quyết triệt để đã trở thành tội phạm","với những hành vi vi cụ thể về môi trường"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tội phạm về môi trường trước hết phải là hành vi nguy hiểm cho xã hội, có tác động tiêu cực và gây tổn hại ở mức độ đáng kể đến các yếu tố của môi trường, tài nguyên, gây thiệt hại trực tiếp hoặc gián tiếp đến tính mạng, sức khỏe, tài sản của con người,"},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Tội phạm về môi trường phải xâm hại đến các quan hệ được …”?","o":["luật hình sự bảo vệ","dân sự, kinh tế","pháp luật bảo vệ môi trường","luật về bảo vệ môi trường"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Tội phạm về môi trường phải xâm hại đến các quan hệ được luật hình sự bảo vệ ."},{"q":"Theo giáo trình, ý “Đó là sự trong sạch, tính tự nhiên của các yếu tố môi trường, sự cân bằng sinh thá i, tính đa dạng sinh họ c tạo nên điều kiện …” kết thúc g đầy đủ về công tác bảo vệ môi trường đã kêu gọi đầu tư dàn trải, cấp phép"},{"q":"Theo bài học, phần còn thiếu trong nhận định “Thứ hai: Nguyên nhân, điều kiện chủ quan Nhận thức của một số bộ phận các cơ quan quản lý nhà nước về bảo vệ môi trườ ng chưa cao, ý thức bảo vệ môi trường của các cơ quan, doanh nghiệp và …” là gì?","o":["giáo dục công dân tôn trọng pháp luật bảo vệ môi trường","công dân còn kém, chưa tự giác, vấn đề bảo vệ môi trường chưa","chống tội phạm và vi phạm pháp luật khác về môi trường nói riêng","thải theo quy định (rác thải, nước thả i …)"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Thứ hai: Nguyên nhân, điều kiện chủ quan Nhận thức của một số bộ phận các cơ quan quản lý nhà nước về bảo vệ môi trườ ng chưa cao, ý thức bảo vệ môi trường của các cơ quan, doanh nghiệp và công dân còn kém, chưa tự giác, vấn đề bảo vệ môi trường chưa"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Chính quyền các cấp, các ngành chỉ chú trọng phát triển kinh tế chưa coi …”?","o":["phép theo quy chuẩn kỹ thuật môi trường","trọng công tác bảo vệ môi trường","MÔI TRƯỜNG ----- ---------------- A","luật quy định về công tác bảo vệ môi trường"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Chính quyền các cấp, các ngành chỉ chú trọng phát triển kinh tế chưa coi trọng công tác bảo vệ môi trường;"},{"q":"Chọn phương án nối tiếp đúng nội dung: “thực hiện các biện pháp thu hút đầu tư, cấp phép dự án nhưng chưa quan tâm chỉ đạo thực hiện các cam kết bảo vệ môi trường, đầu tư hệ thống …”","o":["chống tội phạm và vi phạm pháp luật khác về môi trường nói riêng","hạ tầng đả m bảo cho công tác xử lý chất thải, rác thải","tham gia vào phòng, chống vi phạm pháp luật về bảo vệ môi trường","định, Nghị quyết, Quyết đị nh … về công tác bảo vệ môi trường"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: thực hiện các biện pháp thu hút đầu tư, cấp phép dự án nhưng chưa quan tâm chỉ đạo thực hiện các cam kết bảo vệ môi trường, đầu tư hệ thống hạ tầng đả m bảo cho công tác xử lý chất thải, rác thải."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Các cơ quan chức năng chưa phát huy hết vai trò, trách nhiệm trong phòng, chố ng vi …” được hoàn thiện như thế nào?","o":["trong phạm vi trách nhiệm được phân công","MÔI TRƯỜNG ----- ---------------- A","ngoài dưới mọi hình thức","phạm pháp luật về bảo vệ môi trường"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Các cơ quan chức năng chưa phát huy hết vai trò, trách nhiệm trong phòng, chố ng vi phạm pháp luật về bảo vệ môi trường."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Đây là những thiếu sót thuộc về chủ quan của các ngành, các cấp trong toàn xã hội dẫn đến vi phạm pháp luật về bảo vệ …”","o":["ít nhất như trong các lĩnh vực gây ô nhiễm, suy thoái môi trường","của cơ quan chuyên môn) với các biện pháp điề u tra, xử lý","vi phạm pháp luật về bảo vệ môi trường","môi trườ ng có điều kiện còn tồn tại và phát triển"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đây là những thiếu sót thuộc về chủ quan của các ngành, các cấp trong toàn xã hội dẫn đến vi phạm pháp luật về bảo vệ môi trườ ng có điều kiện còn tồn tại và phát triển."},{"q":"Phương án nào điền đúng vào chỗ trống: “Đội ngũ cán bộ chiến sỹ trực tiếp đấu tranh phòng chống vi phạm pháp luật về bảo vệ môi trường còn thiếu, chưa đủ biên chế ở các cấp Công an, dẫn đến công tác quản lý địa bàn, quản lý đối …”?","o":["chống tội phạm và vi phạm pháp luật khác về môi trường","thải theo quy định (rác thải, nước thả i …)","có biểu hiện vi phạm pháp luật về bảo vệ môi trường","tượng có điều kiện, khả năng phạm tội về môi trường còn có những"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đội ngũ cán bộ chiến sỹ trực tiếp đấu tranh phòng chống vi phạm pháp luật về bảo vệ môi trường còn thiếu, chưa đủ biên chế ở các cấp Công an, dẫn đến công tác quản lý địa bàn, quản lý đối tượng có điều kiện, khả năng phạm tội về môi trường còn có những"},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Vì vậy, dẫn đến các hành vi vi phạm hành chính về môi trường ngay từ ban đầu còn chưa kịp thời phát …”?","o":["ít nhất như trong các lĩnh vực gây ô nhiễm, suy thoái môi trường","vi phạm pháp luật về bảo vệ môi trường","hiện, giải quyết triệt để đã trở thành tội phạm","trong phạm vi trách nhiệm được phân công"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, dẫn đến các hành vi vi phạm hành chính về môi trường ngay từ ban đầu còn chưa kịp thời phát hiện, giải quyết triệt để đã trở thành tội phạm."},{"q":"Theo giáo trình, ý “Bên cạnh đó, một số cán bộ trong lực lượng trực tiếp đấu tranh phòng, chống còn yếu về năng lực nghiệp vụ chuyên môn chưa đáp ứng được yêu cầu của côngtác phòng, chống tội phạm …” kết thúc bằng nội dung nào?","o":["tham gia vào phòng, chống vi phạm pháp luật về bảo vệ môi trường","môi trường thời kỳ hội nhập, thời kỳ công nghiệp hóa, hiện đại hóa","trên cơ sở chức năng, quyền hạn được phân công","chống vi phạm pháp luật về bảo vệ môi trường"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Bên cạnh đó, một số cán bộ trong lực lượng trực tiếp đấu tranh phòng, chống còn yếu về năng lực nghiệp vụ chuyên môn chưa đáp ứng được yêu cầu của côngtác phòng, chống tội phạm môi trường thời kỳ hội nhập, thời kỳ công nghiệp hóa, hiện đại hóa."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Phần lớn cán bộ trong lực lượng trực tiếp đấu tranh phòng, chống còn thiếu các kiến thức chuyên sâu về môi trường, đặc biệt là trong các lĩnh …”","o":["1992, 2013) quy định về công tác bảo vệ môi trường","môi trường và quy định khác của pháp luật có liên quan","vực quản lý môi trường, công nghệ môi trường, xử lý chất thải","có công tác phòng, chống vi phạm pháp luật về bảo vệ môi trường"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Phần lớn cán bộ trong lực lượng trực tiếp đấu tranh phòng, chống còn thiếu các kiến thức chuyên sâu về môi trường, đặc biệt là trong các lĩnh vực quản lý môi trường, công nghệ môi trường, xử lý chất thải."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Một số được tuyển dụng từ ngành ngoài vào, có k hần còn thiếu trong nhận định “Che giấu, hành vi gây ô nhiễm môi trường, cản trở, làm sai lệch, thông tin, gian dối trong hoạt động bảo vệ môi …” là gì?","o":["trường dẫn đến hậu quả xấu đối với môi trường","phương đề ra các chủ trương, chính sách phù hợp, kị p thời để","tượng có điều kiện, khả năng phạm tội về môi trường còn có những","vệ môi trường nói riêng và công tác bảo vệ môi trường nói chung"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Che giấu, hành vi gây ô nhiễm môi trường, cản trở, làm sai lệch, thông tin, gian dối trong hoạt động bảo vệ môi trường dẫn đến hậu quả xấu đối với môi trường."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Sản xuất, kinh doanh sản phẩm gây nguy hại cho sức khỏe con …”?","o":["tập và làm việc","mức thấp nhất hậu quả tác hại","người, sinh vật và tự nhiên","luật quy định về công tác bảo vệ môi trường"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Sản xuất, kinh doanh sản phẩm gây nguy hại cho sức khỏe con người, sinh vật và tự nhiên;"},{"q":"Chọn phương án nối tiếp đúng nội dung: “sản xuất, sử dụng nguyên liệu, vật liệu xây dựng chứa yếu tố độc hại vượt mức cho …”","o":["của Nhà nước và từng địa phương","phép theo quy chuẩn kỹ thuật môi trường","bảo vệ môi trường I.2.1","thải theo quy định (rác thải, nước thả i …)"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: sản xuất, sử dụng nguyên liệu, vật liệu xây dựng chứa yếu tố độc hại vượt mức cho phép theo quy chuẩn kỹ thuật môi trường."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Phá hoại, xâm chiếm công trình, thiết bị, phương tiện phục vụ hoạt …” được hoàn thiện như thế nào?","o":["của Nhà nước và từng địa phương","phạm vi trách nhiệm được phân công","động bảo vệ môi trường","bảo vệ môi trường rất đa dạng"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Phá hoại, xâm chiếm công trình, thiết bị, phương tiện phục vụ hoạt động bảo vệ môi trường."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp …”","o":["cho các tổ chức bảo vệ môi trường","luật về bảo vệ môi trường","phạm pháp luật về môi trường hay không","trường: Xử lý hình sự"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp luật về bảo vệ môi trường."},{"q":"Phương án nào điền đúng vào chỗ trống: “Biện pháp phòng, chống vi phạm pháp luật về bảo vệ môi trường - Biện pháp tổ chức - hành chính : Xây dựng, hoàn thiện cơ cấu tổ chức các cơn quan quản lý Nhà nước về bảo vệ môi trường, các chủ …”?","o":["lý các hành vi phạm tội và vi phạm pháp luật về môi trường","thể tham gia bảo vệ môi trường, nâng cao năng lực các cơ quan","ô-dôn mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên","tham gia vào phòng, chống vi phạm pháp luật về bảo vệ môi trường"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Biện pháp phòng, chống vi phạm pháp luật về bảo vệ môi trường - Biện pháp tổ chức - hành chính : Xây dựng, hoàn thiện cơ cấu tổ chức các cơn quan quản lý Nhà nước về bảo vệ môi trường, các chủ thể tham gia bảo vệ môi trường, nâng cao năng lực các cơ quan"},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “thể chế hoá đường lối, chính sách của Đả ng, pháp luật của Nhà …”?","o":["nước về bảo vệ môi trường","lý chất thải y tế","người, sinh vật và tự nhiên","nhiệm và nghĩa vụ bảo vệ môi trường"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: thể chế hoá đường lối, chính sách của Đả ng, pháp luật của Nhà nước về bảo vệ môi trường."},{"q":"Theo giáo trình, ý “Biện pháp kinh tế: Biện pháp này chủ yếu dùng các lợi ích vật chất để kích thích chủ thể thực hiện những hoạt động có lợi cho môi trường, bảo vệ môi trường và ngượ c …” kết thúc bằng nội dung nào?","o":["chống tội phạm và vi phạm pháp luật khác về môi trường nói riêng","lại xử lý, hạn chế lợi ích kinh tế của chủ thể vi phạm","hiện, giải quyết triệt để đã trở thành tội phạm","sống, tồn tại và phát triển của con ngườ i và sinh vật"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Biện pháp kinh tế: Biện pháp này chủ yếu dùng các lợi ích vật chất để kích thích chủ thể thực hiện những hoạt động có lợi cho môi trường, bảo vệ môi trường và ngượ c lại xử lý, hạn chế lợi ích kinh tế của chủ thể vi phạm."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Biện pháp tuyên truyền, giáo dục: Là giáo dục, tuyên truyền đường lối chính sách của Đảng, pháp luật của Nhà nước nhằm nâng cao …”","o":["hội, sự tồn tại, phát triển của con người, sinh vật và tự nhiên","lợi cá nhân, đặc biệt là đối tượng phạm tội về môi trường","nhận thức của cộng đồng vào việc bảo vệ môi trường","trọng công tác bảo vệ môi trường"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Biện pháp tuyên truyền, giáo dục: Là giáo dục, tuyên truyền đường lối chính sách của Đảng, pháp luật của Nhà nước nhằm nâng cao nhận thức của cộng đồng vào việc bảo vệ môi trường."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Biện pháp pháp luật : Là biện pháp xây dựng các quy phạm pháp luật và tổ chức thực hiện, áp dụng pháp luật để điều chỉnh các …”","o":["nhận bị xử phạt còn rẻ hơn là đầu tư xử lý chất thải","vững chắc phục vụ công tác phòng ngừa vi phạm pháp luật môi trường","quan hệ xã hội liên quan đến việc bảo vệ môi trường","nhiệm và nghĩa vụ bảo vệ môi trường"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Biện pháp pháp luật : Là biện pháp xây dựng các quy phạm pháp luật và tổ chức thực hiện, áp dụng pháp luật để điều chỉnh các quan hệ xã hội liên quan đến việc bảo vệ môi trường."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Chủ thể và quan hệ phối hợp trong phòng, chống vi phạm pháp luật về bảo vệ môi trường - Đảng lãnh đạo, Nhà nước quản lý, các cơ quan, tổ chức trong hệ thống chính trị và quần chúng nhân dân …” là gì?","o":["tác bảo vệ môi trường đã kêu gọi đầu tư dàn trải, cấp phép","định, Nghị quyết, Quyết đị nh … về công tác bảo vệ môi trường","lợi cá nhân, đặc biệt là đối tượng phạm tội về môi trường","tham gia vào phòng, chống vi phạm pháp luật về bảo vệ môi trường"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Chủ thể và quan hệ phối hợp trong phòng, chống vi phạm pháp luật về bảo vệ môi trường - Đảng lãnh đạo, Nhà nước quản lý, các cơ quan, tổ chức trong hệ thống chính trị và quần chúng nhân dân tham gia vào phòng, chống vi phạm pháp luật về bảo vệ môi trường"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Đảng lãnh đạo trực tiếp, nhiều mặt đối với các cơ quan trực tiếp phòng, chống tội phạm về môi trường như: Công an Nhân …”?","o":["dân, Viện Kiể m sát Nhân dân, Toà án Nhân dân","phạm pháp luật về bảo vệ môi trường","do Nhà nước, các Bộ, ngành phát động","nhu cầu bức bách của cuộc sống và yêu cầu bảo vệ môi trường"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Đảng lãnh đạo trực tiếp, nhiều mặt đối với các cơ quan trực tiếp phòng, chống tội phạm về môi trường như: Công an Nhân dân, Viện Kiể m sát Nhân dân, Toà án Nhân dân;"},{"q":"Chọn phương án nối tiếp đúng nội dung: “kiểm tra, giám sát, kịp thời uốn nắn nhằm khắc phục những sai sót, tồn tại, bất cập của công tác phòng …”","o":["cho các tổ chức bảo vệ môi trường","dân, Viện Kiể m sát Nhân dân, Toà án Nhân dân","chống vi phạm pháp luật về bảo vệ môi trường","hạ tầng đả m bảo cho công tác xử lý chất thải, rác thải"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: kiểm tra, giám sát, kịp thời uốn nắn nhằm khắc phục những sai sót, tồn tại, bất cập của công tác phòng, chống vi phạm pháp luật về bảo vệ môi trường."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Quốc hội và Hội đồng Nhân dân các cấp ban hành và hoàn thiện hệ thống pháp luật, ban hành các Pháp lệnh, Nghị quyết về công tác bảo vệ môi trường trong đó …” được hoàn thiện như thế nào?","o":["môi trườ ng có điều kiện còn tồn tại và phát triển","việc định hướng quá trình khai thác và sử dụng môi trường","có công tác phòng, chống vi phạm pháp luật về bảo vệ môi trường","lý các hành vi phạm tội và vi phạm pháp luật về môi trường"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Quốc hội và Hội đồng Nhân dân các cấp ban hành và hoàn thiện hệ thống pháp luật, ban hành các Pháp lệnh, Nghị quyết về công tác bảo vệ môi trường trong đó có công tác phòng, chống vi phạm pháp luật về bảo vệ môi trường."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Chính phủ và Ủy ban Nhân dân các cấp : Chính phủ, Ủy ban Nhân dân các cấp thống nhất quản lý Nhà nước về bảo vệ môi trường trong phạm vi cả nước, ban hành các Nghị …”","o":["công dân còn kém, chưa tự giác, vấn đề bảo vệ môi trường chưa","định, Nghị quyết, Quyết đị nh … về công tác bảo vệ môi trường","tiếp hoặc gián tiếp đến tính mạng, sức khỏe, tài sản của con người,","chống tội phạm và vi phạm pháp luật khác về môi trường nói riêng"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Chính phủ và Ủy ban Nhân dân các cấp : Chính phủ, Ủy ban Nhân dân các cấp thống nhất quản lý Nhà nước về bảo vệ môi trường trong phạm vi cả nước, ban hành các Nghị định, Nghị quyết, Quyết đị nh … về công tác bảo vệ môi trường."},{"q":"Phương án nào điền đúng vào chỗ trống: “Nhiệm vụ của Bộ Xây dựng : Thực hiện chức năng quản lý Nhà nước về bảo vệ môi trường …”?","o":["phạm pháp luật về bảo vệ môi trường","trong phạm vi trách nhiệm được phân công","bảo vệ môi trường I.2.1","chuẩn kỹ thuật môi trường"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Nhiệm vụ của Bộ Xây dựng : Thực hiện chức năng quản lý Nhà nước về bảo vệ môi trường trong phạm vi trách nhiệm được phân công."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Trực tiếp chỉ đạo, hướng dẫn, kiểm tra việc thực hiện pháp luật về bảo vệ môi trường đối với các hoạt động xây dựng cơ bản …”?","o":["hiện, giải quyết triệt để đã trở thành tội phạm","xử lý chất thải rắn trong phạm vi trách nhiệm quản lý","chống vi phạm pháp luật về bảo vệ môi trường","quan hệ xã hội liên quan đến việc bảo vệ môi trường"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trực tiếp chỉ đạo, hướng dẫn, kiểm tra việc thực hiện pháp luật về bảo vệ môi trường đối với các hoạt động xây dựng cơ bản, xử lý chất thải rắn trong phạm vi trách nhiệm quản lý."},{"q":"Theo giáo trình, ý “Trực tiếp chỉ đạo, hướng dẫn, kiểm tra, ban hành quy chế quản …” kết thúc bằng nội dung nào?","o":["cho các tổ chức bảo vệ môi trường","lý chất thải y tế","dân sự, kinh tế","yếu tố của môi trường có tính định hướng"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trực tiếp chỉ đạo, hướng dẫn, kiểm tra, ban hành quy chế quản lý chất thải y tế;"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Nhiệm vụ của Bộ Văn hóa, Thể thao và du lịch : Thực hiện chức năng quản lý Nhà nước về bảo vệ …”","o":["hiện, giải quyết triệt để đã trở thành tội phạm","pháp luật bảo vệ môi trường","chống vi phạm pháp luật về bảo vệ môi trường","môi trường trong phạm vi trách nhiệm được phân công"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nhiệm vụ của Bộ Văn hóa, Thể thao và du lịch : Thực hiện chức năng quản lý Nhà nước về bảo vệ môi trường trong phạm vi trách nhiệm được phân công."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Trực tiếp chỉ đạ o các cơ quan chức năng thuộc Bộ phối hợp với các ngành liên quan thống nhất nội dung đẩy mạnh công tác tuyên truyền, giáo dục phòng, chống tội phạm và vi phạm pháp luậ t khác về bảo …”","o":["vệ môi trường nói riêng và công tác bảo vệ môi trường nói chung","những hậu quả vật chất, tinh thần đối với họ","tội phạm, vi phạm pháp luật khác về môi trường","dân, Viện Kiể m sát Nhân dân, Toà án Nhân dân"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trực tiếp chỉ đạ o các cơ quan chức năng thuộc Bộ phối hợp với các ngành liên quan thống nhất nội dung đẩy mạnh công tác tuyên truyền, giáo dục phòng, chống tội phạm và vi phạm pháp luậ t khác về bảo vệ môi trường nói riêng và công tác bảo vệ môi trường nói chung."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Bộ Tư pháp: Bộ Tư pháp nghiên cứu, rà soát, sửa đổi, bổ sung các văn bản pháp luật về bảo vệ môi trường, tạo hành lang pháp lý đầy đủ …” là gì?","o":["môi trường thời kỳ hội nhập, thời kỳ công nghiệp hóa, hiện đại hóa","phương đề ra các chủ trương, chính sách phù hợp, kị p thời để","lý các hành vi phạm tội và vi phạm pháp luật v
