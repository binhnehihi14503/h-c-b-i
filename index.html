, điển hình tiên tiến; rà soát khắc","tranh nhân dân địa phương sẽ tạo điều kiện cho tác chiến tập trung của chiến tranh","phạm vi lãnh hải của quốc gia, biên giới quốc gia trên biển là đường ranh giới phía","được ban hành, đây là sự thể chế hoá đường lối, quan điểm của Đảng về xây dựng"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Nhân rộng các mô hình, điển hình tiên tiến; rà soát khắc"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["- Phong trào toàn dân bảo vệ an ninh Tổ quốc thu hút đông đảo quần chúng","Là nền quốc phòng mang tính chất “vì dân, do dân,","dự án công nghệ sản xuất, xây dựng có hiệu quả cao phục vụ sự nghiệp xây dựng","phòng tòan dân, an ninh nhân dân; chiến tranh nhân dân bảo vệ Tổ quốc Việt Nam"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: - Phong trào toàn dân bảo vệ an ninh Tổ quốc thu hút đông đảo quần chúng"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["ta đã có nhiều chủ trương, chính sách đúng đắn và nhất quán về biển, đảo.","sức mạnh từ quần chúng nhân dân phục vụ sự nghiệp bảo vệ an ninh Tổ quốc","Bảo vệ vai trò quản lý xã hội của Nhà nước xã hội chủ nghĩa;","Đảng; xây dựng Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện; củng"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: sức mạnh từ quần chúng nhân dân phục vụ sự nghiệp bảo vệ an ninh Tổ quốc"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["kinh tế phát triển, an ninh trật tự bảo đảm, hội nhập quốc tế sâu rộng, vị thế nước ta","rõ bản chất các nội dung kỹ, chiến thuật bộ binh và các phương pháp thực hiện,","và các tổ chức đoàn thể, tính tích cực của quần chúng nhân dân.","Dân quân tự vệ là lực lượng vũ trang quần chúng không thoát ly sản xuất,"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: và các tổ chức đoàn thể, tính tích cực của quần chúng nhân dân."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["và sức mạnh đại đoàn kết toàn dân tộc kết hợp với sức mạnh thời đại;","sản xác định phương hướng tổ chức xây dựng quân đội của mình.","cực, những hành vi vi phạm pháp luật và tội phạm.","chăm lo củng cố tiềm lực quốc ph òng, thế trận quốc phòng."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: cực, những hành vi vi phạm pháp luật và tội phạm."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["động lực lượng trong chiến tranh bảo vệ Tổ quốc.","Nâng cao tinh thần cảnh giác cách mạng cho quần chúng, đấu tranh làm thất","bên trong của dân tộc bao giờ cũng giữ vai trò quyết định.","nhân dân xây dựng cơ sở chính trị - xã hội vững mạnh, góp phần tăng cường sự"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Nâng cao tinh thần cảnh giác cách mạng cho quần chúng, đấu tranh làm thất"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["cở tự giác của quần chúng nhân dân trong sự nghiệp bảo vệ an ninh, trật tự.","xây dựng đất nước, chống lại sự chống phá của kẻ thù trong nước và sự can thiệp","Đến thời Nguyễn Huệ, tư tưởng chủ động tiến công địch để giải phóng","Hình thành cho được các tuyến giao thông trục dọc nối"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: cở tự giác của quần chúng nhân dân trong sự nghiệp bảo vệ an ninh, trật tự."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["chiến đấu và được quán triệt tới mọi người kết hợp giải quyết tốt các tính huống","năm đề ra chương trình, kế hoạch để thực hiện có hiệu quả, gắn với việc thực hiện","sáng tạo các vấn đề mới nảy sinh trong xây dựng lực lượng.","Thực hiện nhiệm vụ huấn luyện quân sự, giáo dục chính trị, pháp luật, hội"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: năm đề ra chương trình, kế hoạch để thực hiện có hiệu quả, gắn với việc thực hiện"},{"q":"Phát biểu nào sau đây được nêu trong bài học này g thống","đoàn viên thanh niên"],"answer":1,"explain":"Nội dung trong tài liệu: oạn chiến lược của chủ nghĩa đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa."},{"q":"Điền nội dung phù hợp vào chỗ trống: “oạn chiến _____ đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa.”","options":["năm 1975-1994 do hậu","và ngoài Đảng người","chủ trương Điều lệ","lược của chủ nghĩa"],"answer":3,"explain":"Nội dung trong tài liệu: oạn chiến lược của chủ nghĩa đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa."},{"q":"Điền nội dung phù hợp vào chỗ trống: “oạn chiến lược của chủ nghĩa đế quốc và các thế lực phản động quốc tế để _____ xã hội chủ nghĩa.”","options":["thúc đẩy biểu tình","chống phá các nước","bình đẩy nhanh tiến","tư tưởng đạo đức"],"answer":1,"explain":"Nội dung trong tài liệu: oạn chiến lược của chủ nghĩa đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa."},{"q":"Điền nội dung phù hợp vào chỗ trống: “oạn _____ nghĩa đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa.”","options":["quyết đúng đắn mối","chính trị bạo loạn","lãnh đạo của Đảng","chiến lược của chủ"],"answer":3,"explain":"Nội dung trong tài liệu: oạn chiến lược của chủ nghĩa đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nhận thức của một số bộ phận các cơ quan quản lý nhà nước về bảo vệ môi trường chưa cao, ý thức bảo vệ môi trường của các cơ quan, doanh nghiệp và công dân còn kém, chưa tự giác, vấn đề bảo vệ môi trường chưa được quan tâm chú trọng đúng mức.","Để đạt được mục tiêu đó, các thế lực thù địch không từ bỏ bất kỳ thủ đoạn chống phá nào như sử dụng bạo lực phi vũ trang, bạo lực vũ trang, kinh tế, chính trị, văn hoá, xã hội...","Hai là, tôn trọng và bảo đảm quyền tự do tín ngưỡng và không tín ngưỡng của công dân, kiên quyết bài trừ mê tín, dị đoan.","Gắn việc hoạch định, thực hiện các chính sách phát triển kinh tế xã hội với công tác phòng, chống tội phạm, khắc phục sơ hở, thiếu sót mà tội phạm có thể lợi dụng hoạt động."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Để đạt được mục tiêu đó, các thế lực thù địch không từ bỏ bất kỳ thủ đoạn chống phá nào như sử dụng bạo lực phi vũ trang, bạo lực vũ trang, kinh tế, chính trị, văn hoá, xã hội..."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Làm tốt công tác phòng ngừa tội phạm mang ý nghĩa kinh tế sâu sắc, tiết kiệnngân sách Nhà nước, sức lao động của các nhân viên Nhà nước, của công dân trong các hoạt động điều tra truy tố xét xử và giáo dục cải tạo người phạm tội, cũng như trong việc giải quyết các vấn đề có liên quan đến tội phạm.","Trong 6 tháng đầu năm 2019, Bộ Thông tin và Truyền thông ghi nhận 3.159 cuộc tấn công mạng vào các hệ thống thông tin tại Việt Nam, giảm 2.684 cuộc, tương đương 45,9% so với cùng kỳ năm 2018.","Tổ chức, hoạt động, câu kết, xúi giục, mua chuộc, lừa gạt, lôi kéo, đào tạo, huấn luyện người chống Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam.","Là hành động chống phá bằng bạo lực có tổ chức do lực lượng phản động hay lực lượng ly khai, đối lập trong nước hoặc cấu kết với nước ngoài tiến hành gây rối loạn an ninh chính trị, trật tự, an toàn xã hội hoặc lật đổ chính quyền ở địa phương hay Trung ương."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Là hành động chống phá bằng bạo lực có tổ chức do lực lượng phản động hay lực lượng ly khai, đối lập trong nước hoặc cấu kết với nước ngoài tiến hành gây rối loạn an ninh chính trị, trật tự, an toàn xã hội hoặc lật đổ chính quyền ở địa phương hay Trung ương."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nâng cao hiệu lực, hiệu quả công tác quản lý Nhà nước, khắc phục sơ hở, thiếu sót trong công tác quản lý nhằm phòng, chống tội phạm và vi phạm pháp luật, nhất là các lĩnh vự quản lý cư trú.","Mỗi người dân Việt Nam phải có tri thức, có bản lĩnh chính trị, có phương pháp xem xét phát hiện và báo cáo kịp thời thủ đoạn chống phá của kẻ thù cho cơ quan chức năng xử lý không để bị bất ngờ.","Hiện nay, các loại tội phạm về an ninh mạng, ma túy, buôn bán phụ nữ và trẻ em, tội rửa tiền và các loại tội phạm trên lĩnh vực thương mại, đầu tư... vẫn diễn biến phức tạp và là một trong những nhân tố gây mất ổn định, nhất là trên các tuyến biên giới, có thể làm tổn hại tới quan hệ với các nước.","Như vậy, an ninh quốc gia chính là sự ổn định, bình yên của đất nước, của chế độ; là trạng thái yên ổn, thanh bình trên tất cả các lĩnh vực đời sống xã hội."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Mỗi người dân Việt Nam phải có tri thức, có bản lĩnh chính trị, có phương pháp xem xét phát hiện và báo cáo kịp thời thủ đoạn chống phá của kẻ thù cho cơ quan chức năng xử lý không để bị bất ngờ."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Phối hợp tổ chức tuyên truyền, giáo dục pháp luật về bảo đảm trật tự, an toàngiao thông và phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông.","Tăng cường thực hiện công tác phòng, chống tội phạm, gắn phòng, chống xã hội với phòng, chống nghiệp vụ.","Sự chậm đổi mới chủ trương chính sách về kinh tế xã hội và pháp luật đã bộc lộ những sơ hở khiến cho một số đối tượng lợi dụng để hoạt động phạm tội.","Chủ nghĩa đế quốc và các thế lực thù địch bao giờ cũng chủ động chống phá công cuộc xây dựng chủ nghĩa xã hội, từng bước làm suy yếu từ bên trong và khi có thời cơ tiến hành lật đổ chế độ xã hội."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Chủ nghĩa đế quốc và các thế lực thù địch bao giờ cũng chủ động chống phá công cuộc xây dựng chủ nghĩa xã hội, từng bước làm suy yếu từ bên trong và khi có thời cơ tiến hành lật đổ chế độ xã hội."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Chủ động phát hiện âm mưu, thủ đoạn chống phá của các thế lực thù địch đối với nước ta, kịp thời tiến công ngay từ đầu.","Trong năm 2016, nổi bật là cuộc tấn công mạng vào một số màn hình hiển thị thông tin chuyến bay tại khu vực làm thủ tục chuyến bay của các sân bay như:","An ninh mạng đang trở thành vấn đề nóng, đặt ra nhiều tháchthức đối với tất cả các quốc gia trên toàn thế giới.","Quan điểm chủ nghĩa Mác-Lênin về giải quyết vấn đề tôn giáo trong cách mạng xã hội chủ nghĩa"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Chủ động phát hiện âm mưu, thủ đoạn chống phá của các thế lực thù địch đối với nước ta, kịp thời tiến công ngay từ đầu."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Theo đó, giải quyết vấn đề tôn giáo phải sử dụng tổng hợp các giải pháp trên tất cả các lĩnh vực nhằm xác lập được một thế giới hiện thực không có áp bức, bất công, nghèo đói, dốt nát.","Đổi mới phương thức quản lý một số ngành nghề kinh doanh có điều kiện không để tội phạm lợi dụng hoạt động, nhất là dịch vụ cầm cố thế chấp tài sản vũ trường quán bar karaoke, game, bán hàng đa cấp.","Kết hợp chặt chẽ giữa giữ vững bên trong với chủ động ngăn chặn, phòng ngừa và chủ động tiến công làm thất bại mọi âm mưu, thủ đoạn “diễn biến hoà bình” của các thế lực thù địch.","Hoàn thiện chế độ, chính sách đặc thù đối với các cán bộ kiêm nhiệm và nhữngngười không hưởng lương từ ngân sách Nhà nước tham gia công tác phòng, chống tội phạm."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Kết hợp chặt chẽ giữa giữ vững bên trong với chủ động ngăn chặn, phòng ngừa và chủ động tiến công làm thất bại mọi âm mưu, thủ đoạn “diễn biến hoà bình” của các thế lực thù địch."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Hệ thống tổ chức bộ máy, phân công chức năng, nhiệm vụ giữa các cơ quan bảo vệ pháp luật và trong nội bộ từng cơ quan chưa thực sự khoa học, hiệu quả vận hành chưa cao.","Yêu cầu đặt ra là phải nâng cao cảnh giác cách mạng, kịp thời phát hiện âm mưu bạo loạn lật đổ của các thế lực thù địch, dự báo đúng thủ đoạn, quy mô, địa điểm và thời gian.","Mâu thuẫn đối kháng về lợi ích kinh tế, chính trị giữa các giai cấp bóc lột và thế lực lợi dụng tôn giáo chống lại cách mạng với lợi ích của nhân dân lao động, đó là mặt chính trị của tôn giáo.","Bên cạnh đó, một số cán bộ trong lực lượng trực tiếp đấu tranh phòng, chống còn yếu về năng lực nghiệp vụ chuyên môn chưa đáp ứng được yêu cầu của côngtác phòng, chống tội phạm môi trường thời kỳ hội nhập, thời kỳ công nghiệp hóa, hiện đại hóa."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Yêu cầu đặt ra là phải nâng cao cảnh giác cách mạng, kịp thời phát hiện âm mưu bạo loạn lật đổ của các thế lực thù địch, dự báo đúng thủ đoạn, quy mô, địa điểm và thời gian."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tăng cường vai trò lãnh đạo của tổ chức đảng các cấp đối với hoạt động quảntrị an ninh phi truyền thống.","Đối tượng tác động của các tội phạm này là con người cụ thể.","Do đó, mọi cấp, mọi ngành, mọi người dân phải thấy rõ tính chất nham hiểm của chiến lược “Diễn biến hoà bình”.","Đổi mới và hoàn thiện thể chế, chính sách kinh tế - xã hội góp phần bảo đảman sinh xã hội, nâng cao hiệu quả phòng, chống tội phạm."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Do đó, mọi cấp, mọi ngành, mọi người dân phải thấy rõ tính chất nham hiểm của chiến lược “Diễn biến hoà bình”."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Khách thể của các tội xâm phạm danh dự, nhân phẩm của con người","Đây là một hiện tượng xã hội tiêu cực, phải kiên quyết bài trừ, nhằm lành mạnh hóa đời sống tinh thần xã hội.","Kêu gọi, vận động, xúi giục, đe dọa, gây chia rẽ, tiến hành hoạt động vũ trang hoặc dùng bạo lực nhằm chống chính quyền nhân dân.","Ở mỗi địa phương, phải chú trọng kết hợp phát động phong trào quần chúng bảo vệ an ninh Tổ quốc và xây dựng lực lượng vũ trang ở cơ sở."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Ở mỗi địa phương, phải chú trọng kết hợp phát động phong trào quần chúng bảo vệ an ninh Tổ quốc và xây dựng lực lượng vũ trang ở cơ sở."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Theo đó, giải quyết vấn đề tôn giáo phải sử dụng tổng hợp các giải pháp trên tất cả các lĩnh vực nhằm xác lập được một thế giới hiện thực không có áp bức, bất công, nghèo đói, dốt nát.","Khi mỗi tình huống bạo loạn xảy ra, cần phát huy sức mạnh tổng hợp của toàn dân và của cả hệ thống chính trị, xử trí theo nguyên tắc nhanh gọn - kiên quyết - linh hoạt - đúng đối tượng - không để lan rộng, kéo dài.","Đặc biệt, nhận thức về an toàn thông tin của tổ chức, cá nhân đã được nâng cao, các biện pháp phòng vệ chủ động đã tốt hơn, công tác đánh giá an toàn thông tin được thực hiện nhiều hơn.","Bên cạnh đó, một số cán bộ trong lực lượng trực tiếp đấu tranh phòng, chống còn yếu về năng lực nghiệp vụ chuyên môn chưa đáp ứng được yêu cầu của côngtác phòng, chống tội phạm môi trường thời kỳ hội nhập, thời kỳ công nghiệp hóa, hiện đại hóa."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Khi mỗi tình huống bạo loạn xảy ra, cần phát huy sức mạnh tổng hợp của toàn dân và của cả hệ thống chính trị, xử trí theo nguyên tắc nhanh gọn - kiên quyết - linh hoạt - đúng đối tượng - không để lan rộng, kéo dài."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tuyên truyền miệng, in ấn tờ rơi, pa-nô, áp phích, tranh ảnh biếm họa, nhất là tuyên truyền qua hệ thống loa truyền thanh của các thôn, bản, khu phố...","Xuất phát từ các thủ đoạn tinh vi, xảo quyệt mà các thế lực thù địch sử dụng trong chiến lược “Diễn biến hoà bình” với nhiều đòn tấn công “mềm” trên tất cả các lĩnh vực để chống phá cách mạng nước ta.","Tôn giáo phản ánh khát vọng của quần chúng bị áp bức về một xã hội tự do, bình đẳng, bác ái (dù đó là hư ảo).","Đặc biệt, nhận thức về an toàn thông tin của tổ chức, cá nhân đã được nâng cao, các biện pháp phòng vệ chủ động đã tốt hơn, công tác đánh giá an toàn thông tin được thực hiện nhiều hơn."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Xuất phát từ các thủ đoạn tinh vi, xảo quyệt mà các thế lực thù địch sử dụng trong chiến lược “Diễn biến hoà bình” với nhiều đòn tấn công “mềm” trên tất cả các lĩnh vực để chống phá cách mạng nước ta."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["đăng tải thông tin dâm ô, đồi trụy, tội ác; phá hoại thuần phong, mỹ tục của dân tộc, đạo đức xã hội, sức khỏe của cộng đồng.","Đây là phương thức đang được sử dụng phổ biến trong thế giới ngày nay, nhằm kết nối khu vực công và khu vực tư trong một mục tiêu chung bảo đảm an ninh và phát triển bền vững.","Riêng đối với vấn đề dân tộc, tôn giáo, trước tiên cần phải thực hiện tốt chính sách dân tộc, tôn giáo.","Thực chất chiến lược “Diễn biến hoà bình” mà các thế lực thù địch sử dụng để chống phá cách mạng nước ta là một bộ phận quan trọng trong chiến lược phản cách mạng của chủ nghĩa đế quốc."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Thực chất chiến lược “Diễn biến hoà bình” mà các thế lực thù địch sử dụng để chống phá cách mạng nước ta là một bộ phận quan trọng trong chiến lược phản cách mạng của chủ nghĩa đế quốc."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Cách nhận biết thông tin sai sự thật trên không gian mạng hiện nay?","Chúng thực hiện nhiều hoạt động nhằm xoá bỏ chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh.","Tư tưởng Hồ Chí Minh về dân tộc và giải quyết vấn đề dân tộc mang bản chất cách mạng, khoa học và sâu sắc;","Các biện pháp phòng, chống vi phạm pháp luật trên không gian mạng?"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Chúng thực hiện nhiều hoạt động nhằm xoá bỏ chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["đấu tranh xoá bỏ các tụ điểm hoạt động tệ nạn xã hội ở khu vực xung quanh trường.","Mối quan hệ giữa “diễn biến hòa bình” với bạo loạn lật đổ","Khái quát tình hình tôn giáo ở Việt Nam hiện nay","-Nhập khẩu trái phép phương tiện, máy móc, thiết bị đã qua sử dụng để phá dỡ, tái chế."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Mối quan hệ giữa “diễn biến hòa bình” với bạo loạn lật đổ"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tài chính là mục tiêu lớn nhất mà tin tặc hành động, với 73% số lượng các cuộc tấn công mạng; chính trị, tình báo là mục tiêu lớn thứ hai, với 21% các cuộc tấn công.","Coi tôn giáo là lực lượng đối trọng với Đảng, Nhà nước ta, nên chúng thường xuyên hậu thuẫn, hỗ trợ về vật chất, tinh thần để các phần tử chống đối trong các dân tộc, tôn giáo chống đối Đảng, Nhà nước, chuyển hoá chế độ chính trị ở Việt Nam.","Lợi dụng sự giúp đỡ, viện trợ kinh tế, đầu tư vốn, chuyển giao công nghệ cho Việt Nam để đặt ra các điều kiện và gây sức ép về chính trị, từng bước chuyển hoá Việt Nam theo con đường tư bản chủ nghĩa.","Chú trọng bắt, vận động đầu thú đối tượng truy nã, tập trung số đối tượng nguy hiểm, đặc biệt nguy hiểm."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Lợi dụng sự giúp đỡ, viện trợ kinh tế, đầu tư vốn, chuyển giao công nghệ cho Việt Nam để đặt ra các điều kiện và gây sức ép về chính trị, từng bước chuyển hoá Việt Nam theo con đường tư bản chủ nghĩa."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Sự tác động bởi những mặt trái của nền kinh tế thị trường","Nhân phẩm là tổng hợp những phẩm chất mang tính đặc trưng của mỗi cá nhân, những yếu tố đặc trưng này tạo nên giá trị một con người.","oạn chiến lược của chủ nghĩa đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa.","Nhà nước xã hội chủ nghĩa bảo đảm cho mọi công dân, không phân biệt tín ngưỡng tôn giáo đều được bình đẳng trước pháp luật."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: oạn chiến lược của chủ nghĩa đế quốc và các thế lực phản động quốc tế để chống phá các nước xã hội chủ nghĩa."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nói đến khủng bố thì không chỉ là IS mà còn có các tổ chức Mafia khác sử dụng mạng lưới này, đã từng có trường hợp chúng nhận hợp đồng thanh toán một người và hợp đồng đó đã ở trạng thái được thực thi.","Xuất phát từ chức năng, nhiệm vụ, quyền hạn được pháp luật quy định, các chủthể tham gia phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông.","Mục tiêu của chiến lược “Diễn biến hoà bình” mà các thế lực thù địch tiến hành ở Việt Nam là làm chuyển hoá chế độ xã hội chủ nghĩa ở nước ta theo con đường tư bản chủ nghĩa.","Hậu quả từ an ninh phi truyền thống có thể gây ra mất ổn định đất nước trên nhiều lĩnh vực như:"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Mục tiêu của chiến lược “Diễn biến hoà bình” mà các thế lực thù địch tiến hành ở Việt Nam là làm chuyển hoá chế độ xã hội chủ nghĩa ở nước ta theo con đường tư bản chủ nghĩa."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Phát huy vai trò của các phương tiện thông tin đại chúng trong cuộc đấu tranh này.","Khi Tổ quốc được độc lập, tự do, Người đã cùng toàn Đảng lãnh đạo nhân dân xây dựng mối quan hệ mới, tốt đẹp giữa các dân tộc:","Tích cực xây dựng hệ thống chính trị ở cơ sở vùng dân tộc, vùng tôn giáo.","Khích lệ thành phần kinh tế tư nhân phát triển, từng bước làm mất vai trò chủ đạo của thành phần kinh tế Nhà nước."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Khích lệ thành phần kinh tế tư nhân phát triển, từng bước làm mất vai trò chủ đạo của thành phần kinh tế Nhà nước."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nguyên nhân, điều kiện của tình trạng tội phạm danh dự, nhân phẩm của con người là gì?","Vì vậy, trong quá trình tổ chức thực hiện nhiệm vụ này không nên coi nhẹ hoặc tuyệt đối hoá một giải pháp nào.","Công tác dân tộc ở nước ta hiện nay Đảng, Nhà nước ta tập trung:","An ninh chính trị, an ninh kinh tế, an ninh quốc phòng, an ninh đối ngoại, an ninh tư tưởng, văn hóa, xã hội và an ninh thông tin."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Vì vậy, trong quá trình tổ chức thực hiện nhiệm vụ này không nên coi nhẹ hoặc tuyệt đối hoá một giải pháp nào."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Dark Web là một phần nhỏ của Deep Web, một thế giới mạng mà các công cụ tìm kiếm như Google hay Bing không hiển thị ra.","đoàn kết trong Đảng và ngoài Đảng, người đang công tác và người đã nghỉ hưu, người trong nước và người đang sinh sống ở nước ngoài.","[5] Nghị định 100/2019/NĐ-CP ngày 30/12/2019 về Quy định xử phạt vi phạm hành chính trong lĩnh vực giao thông đường bộ và đường sắt.","Đặc điểm các dân tộc ở Việt Nam và quan điểm chính sách dân tộc của Đảng, Nhà nước ta hiện nay"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: đoàn kết trong Đảng và ngoài Đảng, người đang công tác và người đã nghỉ hưu, người trong nước và người đang sinh sống ở nước ngoài."}]},{"id":2,"title":"Một số nội dung cơ bản về dân tộc, tôn giáo; đấu tranh phòng, chống các thế lực thù địch lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam","questions":[{"q":"Điền nội dung phù hợp vào chỗ trống: “Trang bị cho người học những kiến thức chung, cơ bản nhất về dân tộc, tôn giáo; giải quyết vấn đề dân tộc, tôn giáo theo quan điểm _____, tư tưởng Hồ Chí Minh và quan điểm, chính sách của Đảng và Nhà nước ta về dân tộc, tôn giáo hiện nay.”","options":["của chủ nghĩa Mác-Lênin","ngưỡng tôn giáo khác","nhân dân tôn giáo","hẹp hòi chia rẽ"],"answer":0,"explain":"Nội dung trong tài liệu: Trang bị cho người học những kiến thức chung, cơ bản nhất về dân tộc, tôn giáo; giải quyết vấn đề dân tộc, tôn giáo theo quan điểm c  hóa và hội nhập quốc tế tiếp tục tiến triển nhưng đang bị thách thức bởi _____ hưởng của các nước lớn và sự trổi dậy của chủ nghĩa dân tộc cự đoan.”","options":["dụng tôn giáo chống","thời chủ động giải","sự cạnh tranh ảnh","chính sách phát triển"],"answer":2,"explain":"Nội dung trong tài liệu: “Toàn cầu hóa và hội nhập quốc tế tiếp tục tiến triển nhưng đang bị thách thức bởi sự cạnh tranh ảnh hưởng của các nước lớn và sự trổi dậy của chủ nghĩa dân tộc cự đoan."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tuyên truyền, phổ biến, giáo dục các quy định của pháp luật về quản lý không gian mạng","Đổi mới công tác dân vận vùng dân tộc, tôn giáo theo phương châm:","Vùng Tây Bắc, chúng kích động người H’Mông đòi thành lập khu tự trị riêng.","Khái niệm vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Đổi mới công tác dân vận vùng dân tộc, tôn giáo theo phương châm:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tổ chức tiến hành các hoạt động phát hiện, điều tra, xử lý tội phạm","Các hành vi vi phạm pháp luật trên không gian mạng?","Quyền bình đẳng dân tộc phải được pháp luật hoá và thực hiện trên thực tế.","[8] Viện Nghiên cứu tôn giáo - Giáo sư Đặng Nghiêm Vạn;"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Quyền bình đẳng dân tộc phải được pháp luật hoá và thực hiện trên thực tế."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Phần lớn cán bộ trong lực lượng trực tiếp đấu tranh phòng, chống còn thiếu các kiến thức chuyên sâu về môi trường, đặc biệt là trong các lĩnh vực quản lý môi trường, công nghệ môi trường, xử lý chất thải.","Đẩy mạnh công tác xây dựng mô hình, điển hình tiên tiến trong phong trào toàn dân bảo vệ an ninh Tổ quốc.","Các dân tộc ở Việt Nam đều có chung cội nguồn, chịu ảnh hưởng chung của điều kiện tự nhiên, xã hội, chung vận mệnh dân tộc, chung lợi ích cơ bản - quyền được tồn tại, phát triển.","Đối với hành vi xâm phạm danh dự, nhân phẩm của con người thường được thể hiện bằng lời nói, cử chỉ, hành vi phát tán… xâm phạm tới uy tín, danh dự, nhân phẩm của người khác…"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Các dân tộc ở Việt Nam đều có chung cội nguồn, chịu ảnh hưởng chung của điều kiện tự nhiên, xã hội, chung vận mệnh dân tộc, chung lợi ích cơ bản - quyền được tồn tại, phát triển."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["An ninh mạng đang trở thành vấn đề nóng, đặt ra nhiều tháchthức đối với tất cả các quốc gia trên toàn thế giới.","Nghị định 15 có hiệu lực từ ngày 15/4/2020 thay thế cho Nghị định 174/2013/ NĐ-CP ngày 13/11/2013 về xử phạt vi phạm hành chính trong lĩnh vực bưu chính, viễn thông, công nghệ thông tin và tần số vô tuyến điện.","Trang bị cho người học những kiến thức cơ bản về phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông; làm cơ sở cho quá trình học tập tại trường và vận dụng trên cương vị công tác sau này.","Thường xuyên tuyên truyền, giáo dục để đồng bào hiểu rõ âm mưu thủ đoạn chia rẽ dân tộc, tôn giáo, lương giáo của các thế lực thù địch, để đồng bào đề cao cảnh giác không bị chúng lừa gạt lôi kéo lợi dụng."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Thường xuyên tuyên truyền, giáo dục để đồng bào hiểu rõ âm mưu thủ đoạn chia rẽ dân tộc, tôn giáo, lương giáo của các thế lực thù địch, để đồng bào đề cao cảnh giác không bị chúng lừa gạt lôi kéo lợi dụng."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Danh dự là sự coi trọng của dư luận xã hội, dựa trên giá trị tinh thần, đạo đức tốt đẹp và là cái nhằm mang lại danh dự, nhằm tỏ rõ sự kính trọng của xã hội, của tập thể.","Trước hết đó là những tồn tại, thiếu sót của lực lượng trực tiếp phòng, chống vi phạm pháp luật về bảo vệ môi trường.","Hiện nay cần tập trung vào phổ biến sâu rộng các chủ trương chính sách phát triển kinh tế - xã hội vùng dân tộc, tôn giáo, chính sách dân tộc, tôn giáo cho đồng bào các dân tộc, các tôn giáo.","Đẩy mạnh hoạt động phòng ngừa tội phạm theo chức năng, nhiệm vụ của cáclực lượng trong Quân đội, Hải quan, Kiểm lâm, Thanh tra, Quản lý thị trường."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Hiện nay cần tập trung vào phổ biến sâu rộng các chủ trương chính sách phát triển kinh tế - xã hội vùng dân tộc, tôn giáo, chính sách dân tộc, tôn giáo cho đồng bào các dân tộc, các tôn giáo."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Mỗi thiết bị được kết nối với Internet đều có địa chỉ IP (Internet Protocol) duy nhất.","Phối hợp trong tổ chức thực hiện các hoạt động điều tra, xử lý vi phạm:","Cần tuân thủ những vấn đề có tính nguyên tắc trong xây dựng khối đại đoàn kết dân tộc theo tư tưởng Hồ Chí Minh:","Bồi dưỡng kỹ năng nhận diện các âm mưu, thủ đoạn tấn công mạng và các hình thái phát sinh trên không gian mạng"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Cần tuân thủ những vấn đề có tính nguyên tắc trong xây dựng khối đại đoàn kết dân tộc theo tư tưởng Hồ Chí Minh:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Thực tế hiện nay ở nước ta, lợi dụng nhu cầu của nhữngbệnh nhân cần thay thế một bộ phận cơ thể, trong xã hội đã xuất hiện những nhómngười môi giới, mua bán trái phép hoặc chiếm đoạt mô hoặc bộ phận cơ thể người.","Ba là, vô hiệu hoá sự quản lý của Nhà nước đối với các lĩnh vực đời sống xã hội, gây mất ổn định chính trị - xã hội, nhất là vùng dân tộc, tôn giáo.","Môi trường là hệ thống yếu tố vật chất tự nhiên và nhân tạo quan hệ mật thiết với nhau, bao quanh con người, có ảnh hưởng đến đời sống, kinh tế - xã hội, sự tồn tại, phát triển của con người, sinh vật và tự nhiên.","Đồng thời, cũng là cơ sở cho việc truy cứu trách nhiệm hình sự hoặc xử lý vi phạm hành chính đối với những hành vi vi cụ thể về môi trường."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Ba là, vô hiệu hoá sự quản lý của Nhà nước đối với các lĩnh vực đời sống xã hội, gây mất ổn định chính trị - xã hội, nhất là vùng dân tộc, tôn giáo."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Chủ thể tiến hành tham gia phòng, chống vi phạm pháp luật về bảo vệ môi trường rất đa dạng.","Tạo tâm lý hoang mang, làm suy giảm ý chí, quyết tâm và lòng tin của nhân dân đối với chế độ;","Bộ Tư lệnh Tác chiến không gian mạng, Bộ Quốc phòng;","Đây là đặc điểm nổi bật trong quan hệ giữa các dân tộc ở Việt Nam."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Đây là đặc điểm nổi bật trong quan hệ giữa các dân tộc ở Việt Nam."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nâng cao hiệu lực, hiệu quả công tác quản lý Nhà nước, khắc phục sơ hở, thiếu sót trong công tác quản lý nhằm phòng, chống tội phạm và vi phạm pháp luật, nhất là các lĩnh vự quản lý cư trú.","Tuyên truyền, vận động cán bộ, giảng viên, viên chức, người lao động và các đối tượng sinh viên chấp hành nghiêm pháp luật về bảo đảm trật tự, an toàn giao thông bằng nhiều nội dung hình thức phong phú, đa dạng.","Đối với đoàn thể xã hội tăng cường các hình thức tuyên truyền, giáo dục để mọi người cảnh giác trước các hành vi phạm tội xâm phạm danh dự, nhân phẩm của con người.","Trung thành với quan điểm chủ nghĩa Mác-Lênin, bám sát thực tiễn cách mạng, đặc điểm các dân tộc ở Việt Nam, Chủ tịch Hồ Chí Minh đã có quan điểm dân tộc đúng đắn, góp phần cùng toàn Đảng, lãnh đạo nhân dân ta giải phóng dân tộc; xây dựng, củng cố khối đại đoàn kết dân tộc và đoàn kết quốc tế của dân tộc Việt Nam."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Trung thành với quan điểm chủ nghĩa Mác-Lênin, bám sát thực tiễn cách mạng, đặc điểm các dân tộc ở Việt Nam, Chủ tịch Hồ Chí Minh đã có quan điểm dân tộc đúng đắn, góp phần cùng toàn Đảng, lãnh đạo nhân dân ta giải phóng dân tộc; xây dựng, củng cố khối đại đoàn kết dân tộc và đoàn kết quốc tế của dân tộc Việt Nam."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Chống phá cách mạng Việt Nam là âm mưu không bao giờ thay đổi của các thế lực thù địch.","Xử lý hình sự; xửlý vi phạm hành chính; xử lý trách nhiệm dân sự trong bảo vệ môi trường.","Nguyên tắc khoa học và tiến bộ trong phòng ngừa:","Quan niệm an ninh truyền thống theo quan điểm của Đảng là:"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Chống phá cách mạng Việt Nam là âm mưu không bao giờ thay đổi của các thế lực thù địch."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tội giao cấu hoặc thực hiện hành vi quan hệ tình dục khác với người từ đủ 13 tuổi đến dưới 16 tuổi (Điều 145);","“Trung tâm kinh tế thuốc phiện” lớn nhất thế giới sản xuất 2.000 tấn/năm.","Các hành vi bị nghiêm cấm trong hoạt động bảo vệ môi trường","Phát huy vai trò của các phương tiện thông tin đại chúng trong cuộc đấu tranh này."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Phát huy vai trò của các phương tiện thông tin đại chúng trong cuộc đấu tranh này."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nội dung cơ bản của pháp luật về bảo đảm trật tự, an toàn giao thông","Chủ thể của các tội xâm phạm danh dự, nhân phẩm của con người","Nhân phẩm là phẩm chất, giá trị của một con người cụ thể và được pháp luật bảo vệ.","Quan điểm chủ nghĩa Mác-Lênin về giải quyết vấn đề tôn giáo?"],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Quan điểm chủ nghĩa Mác-Lênin về giải quyết vấn đề tôn giáo?"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Chúng muốn chuyển hoá nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam dần dần theo quỹ đạo kinh tế thị trường tư bản chủ nghĩa.","Đẩy mạnh hoạt động phòng ngừa tội phạm theo chức năng, nhiệm vụ của cáclực lượng trong Quân đội, Hải quan, Kiểm lâm, Thanh tra, Quản lý thị trường.","Coi tôn giáo là lực lượng đối trọng với Đảng, Nhà nước ta, nên chúng thường xuyên hậu thuẫn, hỗ trợ về vật chất, tinh thần để các phần tử chống đối trong các dân tộc, tôn giáo chống đối Đảng, Nhà nước, chuyển hoá chế độ chính trị ở Việt Nam.","Các thế lực thù địch lợi dụng chủ trương Việt Nam mở rộng hội nhập quốc tế, mở rộng quan hệ hợp tác với các nước trên thế giới để tuyên truyền và hướng Việt Nam đi theo quỹ đạo của chủ nghĩa tư bản."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Coi tôn giáo là lực lượng đối trọng với Đảng, Nhà nước ta, nên chúng thường xuyên hậu thuẫn, hỗ trợ về vật chất, tinh thần để các phần tử chống đối trong các dân tộc, tôn giáo chống đối Đảng, Nhà nước, chuyển hoá chế độ chính trị ở Việt Nam."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Thực hiện tốt các quyền và nghĩa vụ công dân đã được Hiến pháp,","Tại vùng Trung du và miền núi phía Bắc, nhóm dân tộc khác chiếm 56,2%; con số này ở vùng Tây Nguyên là 37,7%;","Chú trọng bắt, vận động đầu thú đối tượng truy nã, tập trung số đối tượng nguy hiểm, đặc biệt nguy hiểm.","Chấp hành nghiêm chỉnh những nội quy, quy định củanhà trường trong lĩnh vực học tập, sinh hoạt tập thể và tuyên truyền phổ biến pháp luật cho mọi người."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tại vùng Trung du và miền núi phía Bắc, nhóm dân tộc khác chiếm 56,2%; con số này ở vùng Tây Nguyên là 37,7%;"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Riêng đối với vấn đề dân tộc, tôn giáo, trước tiên cần phải thực hiện tốt chính sách dân tộc, tôn giáo.","Nội dung cơ bản của pháp luật về bảo đảm trật tự, an toàn giao thông","Là cơ quan quyền lực cao nhất của Nhà nước và từng địa phương.","Khái niệm tội xâm phạm danh dự, nhân phẩm của người khác"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Riêng đối với vấn đề dân tộc, tôn giáo, trước tiên c g theo chiều hướng làm suy thoái môi trường."},{"q":"Điền nội dung phù hợp vào chỗ trống: “Sự tác động đó làm thay đổi rất nhiều _____ trường theo chiều hướng làm suy thoái môi trường.”","options":["Biện pháp phòng chống","hiện trạng của môi","điều kiện vi phạm","định của pháp luật"],"answer":1,"explain":"Nội dung trong tài liệu: Sự tác động đó làm thay đổi rất nhiều hiện trạng của môi trường theo chiều hướng làm suy thoái môi trường."},{"q":"Điền nội dung phù hợp vào chỗ trống: “Sự tác _____ đổi rất nhiều hiện trạng của môi trường theo chiều hướng làm suy thoái môi trường.”","options":["động đó làm thay","kỹ thuật môi trường","đòi hòi pháp luật","tài nguyên nước năng"],"answer":0,"explain":"Nội dung trong tài liệu: Sự tác động đó làm thay đổi rất nhiều hiện trạng của môi trường theo chiều hướng làm suy thoái môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Các cơ quan ở địa phương mới chỉ quan tâm đến lợi ích kinh tế trước mắt, chưa chú trọng đúng mức đến công tác bảo vệ môi trường, thậm chí nhận thức không đầy đủ về công tác bảo vệ môi trường đã kêu gọi đầu tư dàn trải, cấp phép kinh doanh ồ ạt, không quan tâm đến việc thẩm định ảnh hưởng của các dự án đối với môi trường.","Hiện nay, con người vẫn chưa hoàn toàn làm chủ tự nhiên và xã hội; các cuộc xung đột giai cấp, dân tộc, tôn giáo, thiên tai, bệnh tật... vẫn còn diễn ra, nên vẫn còn nguồn gốc để tôn giáo tồn tại.","Tham mưu cho cấp ủy Đảng, chính quyền địa phương nơi nhà trường chọn điểm đào tạo; chỉ đạo cơ quan, lực lượng chức năng thực hiện có hiệu quả việc tổ chức giao thông; phát hiện xử lý nghiêm các trường hợp vi phạm; thường xuyên tuyên truyền pháp luật về bảo đảm trật tự, an toàn giao thông khu vực gần trường.","Chủ động thực hiện các biện pháp phòng ngừa tội phạm về bảo đảm trật tự, an toàn giao thông; tham mưu cho các cấp ủy Đảng, chính quyền địa phương đề ra chủ trương, chính sách phù hợp, kịp thời để phòng ngừa tội phạm, điều tra, xử lý nghiêm các hành vi vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Các cơ quan ở địa phương mới chỉ quan tâm đến lợi ích kinh tế trước mắt, chưa chú trọng đúng mức đến công tác bảo vệ môi trường, thậm chí nhận thức không đầy đủ về công tác bảo vệ môi trường đã kêu gọi đầu tư dàn trải, cấp phép kinh doanh ồ ạt, không quan tâm đến việc thẩm định ảnh hưởng của các dự án đối với môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Pháp luật với tư cách là công cụ điều tiết các hành vi của các thành viên trong xã hội, có tác dụng rất to lớn trong việc định hướng quá trình khai thác và sử dụng môi trường.","Sử dụng các cơ quan chuyên trách trực thuộc phạm vi quản lý tiến hành các hoạt động phòng, chống tội phạm về bảo đảm trật tự, an toàn giao thông; trực tiếp chỉ đạo tiến hành thanh tra kiểm tra giám sát hoạt động phòng, chống tội phạm.","Chủ động phát hiện âm mưu, thủ đoạn chống phá của các thế lực thù địch đối với nước ta, kịp thời tiến công ngay từ đầu.","Liên hệ với vai trò, trách nhiệm của thanh niên, học sinh trong phòng, chống “diễn biến hoà bình”, bạo loạn lật đổ?"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Pháp luật với tư cách là công cụ điều tiết các hành vi của các thành viên trong xã hội, có tác dụng rất to lớn trong việc định hướng quá trình khai thác và sử dụng môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Mâu thuẫn đối kháng về lợi ích kinh tế, chính trị giữa các giai cấp bóc lột và thế lực lợi dụng tôn giáo chống lại cách mạng với lợi ích của nhân dân lao động, đó là mặt chính trị của tôn giáo.","An ninh mạng đang trở thành vấn đề nóng, đặt ra nhiều tháchthức đối với tất cả các quốc gia trên toàn thế giới.","Tình hình, xu hướng hoạt động của các tôn giáo trên thế giới có tác động, ảnh hưởng không nhỏ đến sinh hoạt tôn giáo ở Việt Nam.","Các tổ chức thành viên của Mặt trận Tổ quốc là cơ sở chính trị vững chắc của Nhà nước có vị trí quan trọng trong công tác bảo vệ môi trường nói chung, trong phòng, chống tội phạm và vi phạm pháp luật khác về môi trường nói riêng."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Các tổ chức thành viên của Mặt trận Tổ quốc là cơ sở chính trị vững chắc của Nhà nước có vị trí quan trọng trong công tác bảo vệ môi trường nói chung, trong phòng, chống tội phạm và vi phạm pháp luật khác về môi trường nói riêng."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Thực hiện tốt quy chế dân chủ ở cơ sở, củng cố, nâng cao chất lượng, hiệu quả, nền nếp hoạt động của các tổ chức quần chúng...","Thủ đoạn lợi dụng vấn đề dân tộc, tôn giáo chống phá cách mạng Việt Nam của các thế lực thù địch rất thâm độc, tinh vi, xảo trá, đê tiện dễ làm cho người ta tin và làm theo.","Trực tiếp chỉ đạo các cơ quan chức năng thuộc Bộ phối hợp với các ngành liên quan thống nhất nội dung đẩy mạnh công tác tuyên truyền, giáo dục phòng, chống tội phạm và vi phạm pháp luật khác về bảo vệ môi trường nói riêng và công tác bảo vệ môi trường nói chung.","Mọi tổ chức và cá nhân đều phải tôn trọng quyền tự do tín ngưỡng tôn giáo và quyền tự do không tín ngưỡng tôn giáo của công dân."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Trực tiếp chỉ đạo các cơ quan chức năng thuộc Bộ phối hợp với các ngành liên quan thống nhất nội dung đẩy mạnh công tác tuyên truyền, giáo dục phòng, chống tội phạm và vi phạm pháp luật khác về bảo vệ môi trường nói riêng và công tác bảo vệ môi trường nói chung."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Giải quyết vấn đề dân tộc vừa là mục tiêu vừa là động lực của cách mạng xã hội chủ nghĩa.","[9] Văn kiện Đại Hội Đại biểu toàn quốc lần thứ XIII tập  Nhà xuất bản chính trị quốc gia sự thật.","Thực hiện nhất quán chính sách tôn trọng và bảo đảm quyền tự do tín ngưỡng, theo hoặc không theo tôn giáo của công dân, quyền sinh hoạt tôn giáo bình thường theo pháp luật.","Tuy nhiên, bằng các chế tài hình sự, hành chính, dân sự, kinh tế... pháp luật đã tác động đến những hành vi vi phạm."],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tuy nhiên, bằng các chế tài hình sự, hành chính, dân sự, kinh tế... pháp luật đã tác động đến những hành vi vi phạm."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["-Gây tiếng ồn, độ rung vượt mức cho phép theo quy chuẩn kỹ thuật môi trường; xả thải khói, bụi, khí có mùi độc hại vào không khí.","Biện pháp phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông","Nắm vững nguyên tắc xử lý trong đấu tranh chống bạo loạn lật đổ là:","Chủ động giữ vững an ninh chính trị, trật tự, an toàn xã hội ở các vùng dân tộc, tôn giáo, bảo vệ chủ quyền an ninh quốc gia."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: -Gây tiếng ồn, độ rung vượt mức cho phép theo quy chuẩn kỹ thuật môi trường; xả thải khói, bụi, khí có mùi độc hại vào không khí."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nguyên nhân, điều kiện của tình trạng phạm tội danh dự, nhân phẩm","Trang bị cho người học những nội dung cơ bản về pháp luật bảo vệ môi trường; phòng, chống vi phạm pháp luật về bảo vệ môi trường.","Do đó, phải phát huy sức mạnh tổng hợp của cả hệ thống chính trị dưới sự lãnh đạo của Đảng để làm thất bại âm mưu, thủ đoạn của kẻ thù, bảo vệ vững chắc Tổ quốc Việt Nam.","Đối với các hành vi kể trên, ngoài phạt tiền còn bị áp dụng thêm các hình thức xử phạt bổ sung, biện pháp khắc phục hậu quả như:"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Trang bị cho người học những nội dung cơ bản về pháp luật bảo vệ môi trường; phòng, chống vi phạm pháp luật về bảo vệ môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Các vấn đề an ninh phi truyền thống diễn ra ảnh hưởng trên phạm vi khu vực hoặc toàn cầu, mang tính xuyên quốc gia.","Tùy theo tính chất mức độ, nhưng có xu hướng ngày càng đa dạng về hành vi, nghiêm trọng về hậu quả tác hại, nếu ở đó có sự hiện diện mâu thuẫn giữa nhu cầu bức bách của cuộc sống và yêu cầu bảo vệ môi trường.","Vì vậy, trong quá trình tổ chức thực hiện nhiệm vụ này không nên coi nhẹ hoặc tuyệt đối hoá một giải pháp nào.","Nhân phẩm là tổng hợp những phẩm chất mang tính đặc trưng của mỗi cá nhân, những yếu tố đặc trưng này tạo nên giá trị một con người."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tùy theo tính chất mức độ, nhưng có xu hướng ngày càng đa dạng về hành vi, nghiêm trọng về hậu quả tác hại, nếu ở đó có sự hiện diện mâu thuẫn giữa nhu cầu bức bách của cuộc sống và yêu cầu bảo vệ môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Web tối) là những nội dung mạng World Wide Web không thể truy cập bằng những cách thông thường mà phải sử dụng các phần mềm chuyên biệt.","Nhóm tội xâm phạm tình dục được quy định trong Bộ Luật hình sự năm 2015 (sửa đổi, bổ sung năm 2017) gồm các tội:","-Xả nước thải, xả khí thải chưa được xử lý đạt quy chuẩn kỹ thuật môi trường ra môi trường.","Tuyên truyền xuyên tạc, phỉ báng chính quyền nhân dân."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: -Xả nước thải, xả khí thải chưa được xử lý đạt quy chuẩn kỹ thuật môi trường ra môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tin giả được tạo ra bằng nhiều hình thức tinh vi.","Giải quyết các tranh chấp liên quan đến bảo vệ môi trường","Nhiều tỉnh miền núi các dân tộc thiểu số chiếm đa số dân số như:","Phối hợp trong tổ chức thực hiện các hoạt động điều tra, xử lý vi phạm:"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Giải quyết các tranh chấp liên quan đến bảo vệ môi trường"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Xuất phát từ chức năng, nhiệm vụ, quyền hạn được pháp luật quy định, các chủthể tham gia phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông.","Chúng lợi dụng những thiếu sót, sai lầm trong thực hiện chính sách dân tộc, tôn giáo để gây mâu thuẫn, tạo cớ can thiệp vào công việc nội bộ của Việt Nam.","Pháp luật quy định các chế tài hình sự, kinh tế, hành chính, dân sự buộc các cá nhân, tổ chức phải thực hiện đầy đủ các yêu cầu đòi hòi pháp luật trong việc khai thác, sử dụng các yếu tố của môi trường","Tiếp tục kiện toàn bộ máy tổ chức, nâng cao chất lượng đội ngũ cán bộ chuyên trách, bán chuyên trách, nhất là các lực lượng công an xã, dân quân tự vệ, bảo vệ dân phố, bảo vệ chuyên trách các cơ quan, doanh nghiệp."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Pháp luật quy định các chế tài hình sự, kinh tế, hành chính, dân sự buộc các cá nhân, tổ chức phải thực hiện đầy đủ các yêu cầu đòi hòi pháp luật trong việc khai thác, sử dụng các yếu tố của môi trường"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Là ứng dụng các biện pháp khoa học - công nghệ vào giải quyết những vấn đề môi trường.","Làm tốtcông tác tôn giáo là trách nhiệm của toàn bộ hệ thống chính trị do Đảng lãnh đạo.","Chiến lược “Diễn biến hoà bình” của chủ nghĩa đế quốc và các thế lực thù địch hình thành và phát triển qua nhiều giai đoạn khác nhau.","Mỗi sinh viên phải là một tuyên truyền viên tích cực trong việc tuyên truyền pháp luật biện pháp bảo đảm trật tự, an toàn giao thông."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Là ứng dụng các biện pháp khoa học - công nghệ vào giải quyết những vấn đề môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["[12] Nghị quyết số 60-NQ/TW, ngày 12.4.2025 của Hội nghị lần thứ  Ban Chấp hành Trung ương Đảng khóa XIII","Điển hình là các vụ bạo loạn ở Tây Nguyên năm 2001, 2004, việc truyền đạo Tin Lành trái phép vào các vùng dân tộc thiểu số Tây Bắc, Tây Nguyên.","Các cơ quan chức năng chưa phát huy hết vai trò, trách nhiệm trong phòng, chống vi phạm pháp luật về bảo vệ môi trường.","Hoạt động tấn công không gian mạng rất đa dạng và tinh vi như:"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Các cơ quan chức năng chưa phát huy hết vai trò, trách nhiệm trong phòng, chống vi phạm pháp luật về bảo vệ môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Quán triệt sâu sắc các quan điểm của Đảng về an ninh phi truyền thống","Trước hết đó là những tồn tại, thiếu sót của lực lượng trực tiếp phòng, chống vi phạm pháp luật về bảo vệ môi trường.","Phối hợp trong tổ chức thực hiện các hoạt động điều tra, xử lý vi phạm:","An ninh chính trị, an ninh kinh tế, an ninh quốc phòng, an ninh đối ngoại, an ninh tư tưởng, văn hóa, xã hội và an ninh thông tin."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Trước hết đó là những tồn tại, thiếu sót của lực lượng trực tiếp phòng, chống vi phạm pháp luật về bảo vệ môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Ví dụ khi bạn quên mật khẩu thì bạn có thể gửi yêu cầu đểFacebook gửi 3 mã code về cho 3 người bạn này.","Đây là giai đoạn manh nha hình thành chiến lược “Diễn biến hoà bình” được bắt nguồn từ nước Mỹ.","Nắm vững kiến thức bài học, vận dụng linh hoạt, sáng tạo trong sinh hoạt, học tập và rèn luyện góp phần bảo vệ môi trường.","Âm mưu, thủ đoạn “diễn biến hoà bình”, bạo loạn lật đổ của chủ nghĩa đế quốc và các thế lực thù địch sử dụng chống phá các nước xã hội chủ nghĩa như thế nào?"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Nắm vững kiến thức bài học, vận dụng linh hoạt, sáng tạo trong sinh hoạt, học tập và rèn luyện góp phần bảo vệ môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tổ chức học tập, nghiên cứu và tuyên truyền giáo dục cho cán bộ, giảng viên và sinh viên tham gia tích cực các hoạt động bảo vệ môi trường và phòng, chống vi phạm pháp luật về bảo vệ môi trường.","Công tác tôn giáo vừa quan tâm giải quyết hợp lý nhu cầu tín ngưỡng của quầnchúng, vừa kịp thời đấu tranh chống địch lợi dụng tôn giáo chống phá cách mạng.","“Toàn cầu hóa và hội nhập quốc tế tiếp tục tiến triển nhưng đang bị thách thức bởi sự cạnh tranh ảnh hưởng của các nước lớn và sự trổi dậy của chủ nghĩa dân tộc cự đoan.","Đại đa số tín đồ, chức sắc tôn giáo hoạt động đúng pháp luật, theo hướng “tốt đời, đẹp đạo”."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tổ chức học tập, nghiên cứu và tuyên truyền giáo dục cho cán bộ, giảng viên và sinh viên tham gia tích cực các hoạt động bảo vệ môi trường và phòng, chống vi phạm pháp luật về bảo vệ môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Đây không phải là trang facebook mà chỉ là một website có giao diện giống Facebook.","Là cơ quan quyền lực cao nhất của Nhà nước và từng địa phương.","Tuy nhiên, đi kèm theođó là các rủi ro và nguy cơ bảo mật.","Tư tưởng Hồ Chí Minh về vấn đề dân tộc và giải quyết vấn đề dân tộc"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Là cơ quan quyền lực cao nhất của Nhà nước và từng địa phương."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["-Lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp luật về bảo vệ môi trường.","Vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông có hai dạng vi phạm:","Trong chủ nghĩa xã hội, tôn giáo còn là nhu cầu tinh thần của một bộ phận nhân dân, còn tồn tại lâu dài.","Nội dung cơ bản của an ninh quốc gia chính là bảo vệ lợi ích của quốc gia, loại trừ những mối uy hiếp đối với lợi ích cơ bản đó."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: -Lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp luật về bảo vệ môi trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Do đó, việc tăng cường công tác tuyên truyền, giáo dục nhằm nâng cao nhận thức cho mọi người về công tác bảo vệ môi trường, về ý thức tuân thủ pháp luật cũng như những chuẩn mực của cuộc sống sẽ góp phần quan trọng vào phòng, chống vi phạm pháp luật về bảo vệ môi trường trong giai đoạn hiện nay.","Tổ chức thực hiện tốt các biện pháp phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông gắn với chức năng, nhiệm vụ cụ thể của từng ngành, từng lực lượng theo quy định của pháp luật.","Phòng ngừa tội phạm là việc các cơ quan của Nhà nước, các tổ chức xã hội vàcông dân bằng nhiều biện pháp nhằm khắc phục những nguyên nhân, điều kiện của tình trạng phạm tội nhằm ngăn chặn, hạn chế và làm giảm từng bước, tiến tới loại trừ tội phạm ra khỏi đời sống xã hội.","Quản lý, nắm chắc diễn biến tư tưởng của sinh viên, phối hợp chặt chẽ với cấp ủy chính quyền địa phương và gia đình chủ động phát hiện, có biện pháp ngăn chặn hữu hiệu các biểu hiện vi phạm pháp luật."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Do đó, việc tăng cường công tác tuyên truyền, giáo dục nhằm nâng cao nhận thức cho mọi người về công tác bảo vệ môi trường, về ý thức tuân thủ pháp luật cũng như những chuẩn mực của cuộc sống sẽ góp phần quan trọng vào phòng, chống vi phạm pháp luật về bảo vệ môi trường trong giai đoạn hiện nay."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Phát huy vai trò của các phương tiện thông tin đại chúng trong cuộc đấu tranh này.","Dấu hiệu vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông","Chiến lược “Diễn biến hoà bình” đã ra đời, phát triển cùng với sự điều chỉnh phương thức, thủ đ","Pháp luật về tổ chức, quản lý các hoạt động bảo vệ môi trường:"],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Pháp luật về tổ chức, quản lý các hoạt động bảo vệ môi trường:"}]},{"id":4,"title":"Phòng, chống vi phạm pháp luật về đảm bảo trật tự, an toàn giao thông","questions":[{"q":"Điền nội dung phù hợp vào chỗ trống: “Trang bị cho người học những kiến thức cơ bản về phòng, _ 2,"explain":"Nội dung trong tài liệu: Nội dung cơ bản của pháp luật về bảo đảm trật tự, an toàn giao thông"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Vấn đề dân tộc là vấn đề chiến lược của cách mạng xã hội chủ nghĩa.","Dấu hiệu vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông","Tuyên truyền, phổ biến, giáo dục các quy định của pháp luật về quản lý không gian mạng","Các tổ chức tôn giáo hợp pháp hoạt động theo pháp luật và được pháp luật bảo hộ."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Dấu hiệu vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tại Việt Nam, có thể chia thành hai trường phái","Số vụ phát hiện, điều tra ít hơn so với thực tế tội phạm xảy ra, tội phạm ẩn còn nhiều.","Bộ Tư lệnh Tác chiến không gian mạng, Bộ Quốc phòng;","Vi phạm hành chính về bảo đảm trật tự, an toàn giao thông:"],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Vi phạm hành chính về bảo đảm trật tự, an toàn giao thông:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Thực hiện tốt các quyền và nghĩa vụ công dân đã được Hiến pháp,","Kiên quyết đấu tranh loại trừ nguy cơ phá hoại khối đại đoàn kết dân tộc.","đối xử khoan hồng, độ lượng, bình đẳng với những người lầm lỗi đã ăn năn hối cải, phục thiện.","Tuyên truyền, phổ biến, giáo dục Luật An ninh mạng năm 2018."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Thực hiện tốt các quyền và nghĩa vụ công dân đã được Hiến pháp,"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Khái niệm tội xâm phạm danh dự, nhân phẩm của người khác","Pháp luật về bảo đảm trật tự, an toàn giao thông","Khái quát đặc điểm các dân tộc ở nước ta hiện nay:","Tăng cường quản lý vũ khí vật liệu nổ và công cụ hỗ trợ."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Pháp luật về bảo đảm trật tự, an toàn giao thông"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Bạo loạn lật đổ của các thế lực thù địch chống phá cách mạng Việt Nam","Khái niệm vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông","Xây dựng cơ sở chính trị - xã hội vững mạnh về mọi mặt","Giải quyết các tranh chấp liên quan đến bảo vệ môi trường"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Khái niệm vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tuy nhiên, do phần chung của Bộ Luật hình sự quy định pháp nhân thương mại chỉ có thể là chủ thể của một số tội phạm nhất định, trong đókhông có các tội xâm phạm danh dự, nhân phẩm nên các tội phạm này chủ thể chỉ có thể là cá nhân có năng lực trách nhiệm hình sự và đạt một độ tuổi nhất định.","Tham mưu cho cấp ủy Đảng, chính quyền địa phương nơi nhà trường chọn điểm đào tạo; chỉ đạo cơ quan, lực lượng chức năng thực hiện có hiệu quả việc tổ chức giao thông; phát hiện xử lý nghiêm các trường hợp vi phạm; thường xuyên tuyên truyền pháp luật về bảo đảm trật tự, an toàn giao thông khu vực gần trường.","Bên cạnh đó, một số cán bộ trong lực lượng trực tiếp đấu tranh phòng, chống còn yếu về năng lực nghiệp vụ chuyên môn chưa đáp ứng được yêu cầu của côngtác phòng, chống tội phạm môi trường thời kỳ hội nhập, thời kỳ công nghiệp hóa, hiện đại hóa.","Lợi dụng chính sách tự do tôn giáo của Đảng, Nhà nướcta để truyền đạo trái phép để thực hiện âm mưu tôn giáo hoá dân tộc, từng bước gây mất ổn định xã hội và làm chệch hướng chế độ chủ nghĩa xã hội ở Việt Nam."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tham mưu cho cấp ủy Đảng, chính quyền địa phương nơi nhà trường chọn điểm đào tạo; chỉ đạo cơ quan, lực lượng chức năng thực hiện có hiệu quả việc tổ chức giao thông; phát hiện xử lý nghiêm các trường hợp vi phạm; thường xuyên tuyên truyền pháp luật về bảo đảm trật tự, an toàn giao thông khu vực gần trường."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nạn nhân khôngbiết tài khoản Facebook kia đã bị tấn công nên tin tưởng và sẵn sàng giúp đỡ.","về tội phạm này là thực hiện do lỗi vô ý và không có tội nào hoặc tội phạm đặc biệt nghiêm trọng.","Chính những hệ luỵ của hành vi phạm tội này đã làm cho nạn nhân ảnh hưởng nghiêm trọng đến danh dự, nhân phẩm của bản thân họ.","Trực tiếp chỉ đạo, hướng dẫn, kiểm tra, ban hành quy chế quản lý chất thải y tế; bảo vệ môi trường tại các cơ sở y tế."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: về tội phạm này là thực hiện do lỗi vô ý và không có tội nào hoặc tội phạm đặc biệt nghiêm trọng."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Xử lý nhanh chóng, hiệu quả khi có bạo loạn xảy ra và luôn bảo vệ tốt chính trị nội bộ.","hệ thống chính trị và quần chúng nhân dân tham gia vào phòng, chống vi phạm pháp luật bảo đảm trật tự, an toàn giao thông.","Chính trị, kinh tế, văn hóa - xã hội, quốc phòng, an ninh và đối ngoại.","Pháp luật quy định những quy tắc xử sự mà con người phải thực hiện khi khai thác và sử dụng các yếu tố (thành phần) của môi trường"],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: hệ thống chính trị và quần chúng nhân dân tham gia vào phòng, chống vi phạm pháp luật bảo đảm trật tự, an toàn giao thông."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Do đó, việc đẩy lùi tệ quan liêu, tham nhũng, tiêu cực xã hội, giữ vững định hướng xã hội chủ nghĩa trên các lĩnh vực, chống nguy cơ tụt hậu về kinh tế là giải pháp hữu hiệu để giữ vững và thúc đẩy yếu tố bên trong của đất nước luôn ổn định.","Thực hiện nhất quán chính sách tôn trọng và bảo đảm quyền tự do tín ngưỡng, theo hoặc không theo tôn giáo của công dân, quyền sinh hoạt tôn giáo bình thường theo pháp luật.","Lực lượng nòng cốt xung kích trong việc phối hợp hướng dẫn các cơ quan Nhà nước khác, các tổ chức xã hội, đoàn thể quần chúng nhân dân trong quá trình phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông","Mâu thuẫn không đối kháng giữa những người có tín ngưỡng khác nhau hoặc giữa người có tín ngưỡng và không có tín ngưỡng, đó là mặt tư tưởng của tôn giáo."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Lực lượng nòng cốt xung kích trong việc phối hợp hướng dẫn các cơ quan Nhà nước khác, các tổ chức xã hội, đoàn thể quần chúng nhân dân trong quá trình phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Trong những năm gần đây các tôn giáo đẩy mạnh hoạt động nhằm phát triển tổ chức, phát huy ảnh hướng trong đời sống tinh thần xã hội.","Hoàn thiện chế độ, chính sách đặc thù đối với các cán bộ kiêm nhiệm và nhữngngười không hưởng lương từ ngân sách Nhà nước tham gia công tác phòng, chống tội phạm.","Quan niệm an ninh phi truyền thống là an ninh tổng hợpbao gồm an ninh quân sự, chính trị, kinh tế, xã hội, môi trường.","Thực hiện chức năng quản lý Nhà nước về bảo đảm trật tự, an toàn thợ giao thông trong phạm vi trách nhiệm được phân công trực tiếp chỉ đạo hướng dẫn kiểm tra việc thực hiện pháp luật về bảo đảm trật tự, an toàn giao thông"],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Thực hiện chức năng quản lý Nhà nước về bảo đảm trật tự, an toàn thợ giao thông trong phạm vi trách nhiệm được phân công trực tiếp chỉ đạo hướng dẫn kiểm tra việc thực hiện pháp luật về bảo đảm trật tự, an toàn giao thông"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Nguyên tắc cụ thể hóa trong phòng ngừa tội phạm:","Khái niệm, nguyên nhân, điều kiện vi phạm pháp luật về bảo vệ môi trường","Nhận diện an ninh phi truyền thống trên các góc độ khác nhau?","Vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông"],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Cách này rất phổ biến, bởi đa số người dùng camera hiệntại thường sử dụng Password mặc định của nhà cung cấp.","Hai là, chống “diễn biến hoà bình” là cấp bách hàng đầu trong các nhiệm vụ quốc phòng, an ninh hiện nay để bảo vệ vững chắc xã hội chủ nghĩa.","Xây dựng và ban hành hệ thống văn bản quy phạm pháp luật, các nội quy, quyđịnh về bảo đảm trật tự, an toàn giao thông","Khái niệm phòng, chống tội phạm xâm phạm danh dự, nhân phẩm của người khác"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Xây dựng và ban hành hệ thống văn bản quy phạm pháp luật, các nội quy, quyđịnh về bảo đảm trật tự, an toàn giao thông"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Bộ Luật hình sự năm 2015 (sửa đổi, bổ sung năm 2017);","Bảo đảm triển khai thế trận phòng thủ ở các địa phương, cơ sở.","Các thành viên cùng chung những đặc điểm sinh hoạt văn hoá vật chất, văn hoá tinh thần, tạo nên bản sắc văn hoá dân tộc.","Chủ thể của hành vi vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông là:"],"answer":3,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Chủ thể của hành vi vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông là:"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Chú trọng bắt, vận động đầu thú đối tượng truy nã, tập trung số đối tượng nguy hiểm, đặc biệt nguy hiểm.","Tôn giáo ra đời, tồn tại và biến đổi phản ánh và phụ thuộc vào sự vận động, phát triển của tồn tại xã hội.","Biện pháp phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông","Lý luận về tôn giáo và tình hình tôn giáo ở Việt Nam;"],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Biện pháp phòng, chống vi phạm pháp luật về bảo đảm trật tự, an toàn giao thông"},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Tác động tiêu cực của các yếu tố thiên nhiên, môi trường đối với người tham gia giao thông.","Chăm lo xây dựng lực lượng vũ trang ở địa phương vững mạnh","Làm tốt công tác tuyên truyền, giáo dục, nâng cao nhận thức, ý thức về phòng, chống vi phạm pháp luật trên không gian mạng.","Bộ Luật hình sự 2015 (sửa đổi, bổ sung năm 2017) đã quy định rõ một số tội danh mua bán người, gồm:"],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tác động tiêu cực của các yếu tố thiên nhiên, môi trường đối với người tham gia giao thông."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["[12] Nghị quyết số 60-NQ/TW, ngày 12.4.2025 của Hội nghị lần thứ  Ban Chấp hành Trung ương Đảng khóa XIII","Vi phạm hành chính và vi phạm hình sự (cấu thành các tội xâm phạm an toàn giao thông).","Nâng cao nhận thức về âm mưu, thủ đoạn của các thế lực thù địch, nắm chắc mọi diễn biến không để bị động và bất ngờ","Đây là hướng mang tính cơ bản, chiến lược và lâu dài."],"answer":1,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Vi phạm hành chính và vi phạm hình sự (cấu thành các tội xâm phạm an toàn giao thông)."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["An ninh truyền thống nhấn mạnh tới việc sử dụng các biện pháp quân sự để chống lại sự tấn công bằng quân sự nhằm uy hiếp, xâm phạm độc lập, chủ quyền và toàn vẹn lãnh thổ.","Tuy nhiên, tình hình tôn giáo còn có những diễn biến phức tạp, tiềm ẩn những nhân tố gây mất ổn định.","Chính phủ và Ủy ban Nhân dân các cấp thống nhất quản lý Nhà nước về bảo đảm trật tự, an toàn giao thông trong phạm vi cả nước, ban hành các Nghị định, Nghị quyết, Quy định về công tác bảo đảm trật tự, an toàn giao thông.","Cán bộ công tác ở vùng dân tộc thiểu số và miền núi phải gần gũi, hiểu phong tục tập quán, tiếng nói của đồng bào dân tộc, làm tốt công tác dân vận."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Chính phủ và Ủy ban Nhân dân các cấp thống nhất quản lý Nhà nước về bảo đảm trật tự, an toàn giao thông trong phạm vi cả nước, ban hành các Nghị định, Nghị quyết, Quy định về công tác bảo đảm trật tự, an toàn giao thông."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Là cơ quan quyền lực cao nhất của Nhà nước và ở từng địa phương, hoàn thiện hệ thống văn bản quy phạp pháp luật và chỉ thị, nghị quyết về công tác bảo đảm trật tự, an toàn giao thông.","[2] http://www.tapchiqptd.vn Cơ quan Lý luận quân sự, chính trị của Quân ủy Trung ương - Bộ Quốc phòng.","Mặt khách quan của các tội xâm phạm danh dự, nhân phẩm của con người thểhiện ở những hành vi nguy hiểm cho xã hội (hành động hoặc không hành động) xâmphạm trực tiếp tới danh dự, nhân phẩm của con người.","Thường xuyên rà soát xác định các địa bàn trọng điểm về trật tự, an toàn xãhội để tập trung lực lượng chuyển hóa thành địa bàn không có tội phạm hoặc giảm tội phạm đến mức thấp nhất."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Là cơ quan quyền lực cao nhất của Nhà nước và ở từng địa phương, hoàn thiện hệ thống văn bản quy phạp pháp luật và chỉ thị, nghị quyết về công tác bảo đảm trật tự, an toàn giao thông."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Đối với những hành vi vi phạm quy định về tham gia giao thông mà không có tính chất nguy hiểm không gây thiệt hại cho người khác thì bị xử phạt vi phạm hành chính.","Tại Việt Nam, tình hình an toàn an ninh mạng tiếp tục diễn biến phức tạp, tồn tại nhiều cơ sở gây nguy cơ bị tấn công, phá hoại hạ tầng mạng thông tin, ảnh hưởngtới an ninh quốc gia.","-Lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp luật về bảo vệ môi trường.","Một là, các dân tộc ở Việt Nam có truyền thống đoàn kết gắn bó xây dựng quốc gia dân tộc thống nhất."],"answer":0,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Đối với những hành vi vi phạm quy định về tham gia giao thông mà không có tính chất nguy hiểm không gây thiệt hại cho người khác thì bị xử phạt vi phạm hành chính."},{"q":"Phát biểu nào sau đây được nêu trong bài học này?","options":["Theo Nghị quyết 60-NQ/TW sát nhập 5 tổ chức chính trị xã hội:","Dù còn nhiều quan niệm rất đa dạng, song có thể định dạng một số đặc điểm chủ yếu sau của an ninh phi truyền thống","Tích cực học tập, nâng cao nhận thức và ý thức đầy đủ về thực hiện nghiêm về pháp luật bảo đảm trật tự, an toàn giao thông.","Chúng thực hiện nhiều hoạt động nhằm xoá bỏ chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh."],"answer":2,"explain":"Đáp án đúng là nội dung được nêu trực tiếp trong bài: Tích cực học tập, nâng cao nhận thức và ý thức đầy đủ về thực hiện nghiêm về pháp luật bảo đảm trật tự, an toàn giao thông."}]},{"id":5,"title":"Phòng, chống một số loại tội phạm xâm hại danh dự, nhân phẩm của người khác","questions":[{"q":"Điền nội dung phù hợp vào chỗ trống: “Trang bị cho người học những vấn đề cơ bản về các tội xâmphạm danh dự, nhân phẩm của con người; nội dung, biện pháp phòng, chống các _____, nhân phẩm của con người.”","options":["tình trạng tội phạm","tộixâm phạm danh dự","nhữnghành vi phạm","tính cơ bản chiến"],"answer":1,"explain":"Nội dung trong tài liệu: Trang bị cho người học những vấn đề cơ bản về các tội xâmphạm danh dự, nhân phẩm của con người; nội dung, biện pháp phòng, chống các tộixâm phạm danh dự, nhân phẩm của con người."},{"q":"Điền nội dung phù hợp vào chỗ trống: “Trang bị cho người học những vấn đề cơ bản về các _____, nhân phẩm của con người; nội dung, biện pháp phòng, chống các tộixâm phạm danh dự, nhân phẩm của con người.”","options":["tội xâmphạm danh dự","thức tuyên truyền giáo","hình sự 2015 sửa","ngừng học tập nâng"],"answer":0,"explain":"Nội dung trong tài liệu: Trang bị cho người học những vấn đề cơ bản về các tội xâmphạm danh dự, nhân phẩm của con người; nội dung, biện pháp phòng, chống các tộixâm phạm danh dự, nhân phẩm của con người."},{"q":"Điền nội dung phù hợp vào chỗ trống: “Trang bị cho người học những vấn đề cơ bản về các tội xâmphạm danh dự, nhân phẩm của con người; nội dung, bi
