àn thiện như thế nào?","o":["lực, nghiên cứu, ứng dụng khoa học và trong khám chữa bệnh","thủ tỉnh, thành phố, công trình quân sự","năng, nhiệm vụ theo quy định của pháp luật","dưới và kiểm tra ở mọi khâu, mọi bước của quá trình thực hiện"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trong lĩnh vực y tế: Phối hợp, kết hơp chặt chẽ giữa ngành y tế dân sự với y tế quân sự, an ninh trong đào tạo nhân lực, nghiên cứu, ứng dụng khoa học và trong khám chữa bệnh."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Xây dựng kế hoạch động viên y tế dân sự cho quân …”","o":["- xã hội và quốc phòng, an ninh","tác dụng kích thích kinh tế phát triển","sự khi có chiến tranh","ninh xã hội, an ninh con người"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng kế hoạch động viên y tế dân sự cho quân sự khi có chiến tranh."},{"q":"Phương án nào điền đúng vào chỗ trống: “Sử dụng tiết kiệm, hiệu quả nguồn nhân lực, tài chính, cơ sở vật chất trong huấn luyện, chiến đấu và …”?","o":["cho kinh tế, nhất là khi chiến tranh xảy ra","sẵn sàng chiến đấu của lực lượng vũ trang","khâu lựa chọn đối tác","kinh tế - xã hội vào một chỉnh thể thống nhất"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Sử dụng tiết kiệm, hiệu quả nguồn nhân lực, tài chính, cơ sở vật chất trong huấn luyện, chiến đấu và sẵn sàng chiến đấu của lực lượng vũ trang."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Các cơ quan quân sự, công an phải làm tham mưu trong việc thẩm định, đánh giá các dự án đầu tư, nhất là các dự án có vốn nước ngoài e) Kết hợp trong hoạt động đối ngoại Đại hội XII của Đảng và …”?","o":["hình có giá trị về phòng thủ quân sự, quốc phòng, an ninh","thường của cá nhân, của tổ chức, của toàn xã hội","vấn đề lớn là: Tăng trưởng kinh tế gắn với tiến bộ xã hội","tiếp tục được khẳng định lại tại Đại hội XIII, đã đặt ra yêu"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Các cơ quan quân sự, công an phải làm tham mưu trong việc thẩm định, đánh giá các dự án đầu tư, nhất là các dự án có vốn nước ngoài e) Kết hợp trong hoạt động đối ngoại Đại hội XII của Đảng và tiếp tục được khẳng định lại tại Đại hội XIII, đã đặt ra yêu"},{"q":"Theo giáo trình, ý “Trong lĩnh vực kinh tế đối ngoại, phải kết hợp từ …” kết thúc bằng nội dung nào?","o":["triển nhanh và bền vững đất nước","và công nghệ, đổi mới sáng tạo","phương tiện phục vụ cho toàn dân đánh giặc","khâu lựa chọn đối tác"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trong lĩnh vực kinh tế đối ngoại, phải kết hợp từ khâu lựa chọn đối tác."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Kết hợp trong việc phân bổ đầu tư vào ngành nào, địa bàn nào có lợi cho phát triển kinh tế, bảo …”","o":["nhu cầu dân sinh thời bình và thời chiến","đảm quốc phòng, an ninh của các quốc gia","lực quốc phòng, thế trận quốc phòng","phải xây dựng các công trình ngầm"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Kết hợp trong việc phân bổ đầu tư vào ngành nào, địa bàn nào có lợi cho phát triển kinh tế, bảo đảm quốc phòng, an ninh của các quốc gia."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Phát huy vai trò của cán bộ, nhân viên các đại sứ quán, lãnh sự quán của nước ta ở nước ngoài trong việc …”","o":["quảng bá sản phẩm hàng hoá, truyền thống Việt Nam","an ninh đã có lịch sử lâu dài","hình có giá trị về phòng thủ quân sự, quốc phòng, an ninh","kinh tế - xã hội vào một chỉnh thể thống nhất"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Phát huy vai trò của cán bộ, nhân viên các đại sứ quán, lãnh sự quán của nước ta ở nước ngoài trong việc quảng bá sản phẩm hàng hoá, truyền thống Việt Nam;"},{"q":"Theo bài học, phần còn thiếu trong nhận định “Gắn chủ trương lãnh đạo với tăng cường kiểm tra việc thực hiện của chính quyền, đoàn thể, các tổ chức kinh tế thực hiện chủ trương đường lối về kết hợp phát triển kinh …” là gì?","o":["bộ, đường sắt, đường không, đường thuỷ, đáp ứng nhu cầu đi lại, vận","tế - xã hội với tăng cường củng cố quốc phòng và an ninh","ninh mạng, xây dựng xã hội trật tự, kỷ cương","hiệu quả cao phục vụ sự nghiệp xây dựng và bảo vệ Tổ quốc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Gắn chủ trương lãnh đạo với tăng cường kiểm tra việc thực hiện của chính quyền, đoàn thể, các tổ chức kinh tế thực hiện chủ trương đường lối về kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng và an ninh."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Nâng cao hiệu lực quản lý Nhà nước của chính quyền các cấp trong việc kết hợp Từng cấp làm đúng chức …”?","o":["năng, nhiệm vụ theo quy định của pháp luật","trị vững mạnh ở vùng rừng núi biên giới","xây dựng, phát triển kinh tế","mỗi quốc gia, dân tộc độc lập có chủ quyền"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nâng cao hiệu lực quản lý Nhà nước của chính quyền các cấp trong việc kết hợp Từng cấp làm đúng chức năng, nhiệm vụ theo quy định của pháp luật."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Bồi dưỡng nâng cao kiến thức, kinh nghiệm kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng và an ninh cho các đối tượng Đối tượng bồi dưỡng: Phải phổ cập kiến thức quốc …”","o":["đấu, vừa tăng gia sản xuất, thực hành tiết kiệm”","sân bay, bến cảng, nhiều mục tiêu phải bảo vệ","sống, phát triển kinh tế, xã hội trên địa bàn","phòng và an ninh cho toàn dân nhưng trước hết phải tập trung vào"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Bồi dưỡng nâng cao kiến thức, kinh nghiệm kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng và an ninh cho các đối tượng Đối tượng bồi dưỡng: Phải phổ cập kiến thức quốc phòng và an ninh cho toàn dân nhưng trước hết phải tập trung vào"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Hình thức bồi dưỡng: Phải kết hợp bồi dưỡng tại trường với tại chức, kết hợp lý thuyết với thực hành, để nâng sự hiểu biết và năng lực tổ chức …” được hoàn thiện như thế nào?","o":["Việt Nam: Trở thành nước phát triển, thu nhập cao","toàn dân tộc kết hợp với sức mạnh thời đại","triển kinh tế - xã hội và chiến đấu của Bộ đội Không quân","thực hiện của đội ngũ cán bộ và của toàn dân, toàn quân"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Hình thức bồi dưỡng: Phải kết hợp bồi dưỡng tại trường với tại chức, kết hợp lý thuyết với thực hành, để nâng sự hiểu biết và năng lực tổ chức thực hiện của đội ngũ cán bộ và của toàn dân, toàn quân."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Vì vậy, muốn kết hợp ngay từ đầu và trong suốt quá trình công nghiệp hóa, hiện đại hóa đất nước một cách cơ bản và thống nhất trên phạm vi của cả nước và từng địa phương, phải tiếp tục xây …”","o":["quốc phòng, an ninh, cho phòng thủ tác chiến và phòng thủ dân sự","dựng và hoàn chỉnh các quy hoạch và kế hoạch chiến lược tổng thể","khác nhau về mục đích, nội dung, phương thức và kết quả","phòng chống chiến tranh thông tin điện tử của địch"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Vì vậy, muốn kết hợp ngay từ đầu và trong suốt quá trình công nghiệp hóa, hiện đại hóa đất nước một cách cơ bản và thống nhất trên phạm vi của cả nước và từng địa phương, phải tiếp tục xây dựng và hoàn chỉnh các quy hoạch và kế hoạch chiến lược tổng thể"},{"q":"Phương án nào điền đúng vào chỗ trống: “chính sách điều động nhân lực, bố trí dân cư, chính sách ưu đãi …”?","o":["chế độ xã hội chủ nghĩa","khoa học và công nghệ… 4","hướng xã hội chủ nghĩa","tuyến đường trục dọc Trường Sơn (đường Hồ Chí Minh)"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: chính sách điều động nhân lực, bố trí dân cư, chính sách ưu đãi khoa học và công nghệ… 4."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Việc xác lập cơ chế chính sách, bảo đảm ngân sách cho kết hợp phát triển kinh tế xã hội với tăng cường củng cố quốc phòng và an ninh cần phải …”?","o":["triển kinh tế - xã hội và chiến đấu của Bộ đội Không quân","với điều kiện kinh tế và nhu cầu phòng thủ đất nước","đấu, vừa tăng gia sản xuất, thực hành tiết kiệm”","được xây dựng theo quan điểm quốc phòng toàn dân, an ninh nhân dân"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Việc xác lập cơ chế chính sách, bảo đảm ngân sách cho kết hợp phát triển kinh tế xã hội với tăng cường củng cố quốc phòng và an ninh cần phải được xây dựng theo quan điểm quốc phòng toàn dân, an ninh nhân dân."},{"q":"Theo giáo trình, ý “Phân tích tính tất yếu phải kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc …” kết thúc bằng nội dung nào?","o":["bằng đàm phán hoà bình","phòng và an ninh ở nước ta hiện nay?","hướng xã hội chủ nghĩa","động hiệu lực, hiệu quả"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Phân tích tính tất yếu phải kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng và an ninh ở nước ta hiện nay?"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Phân tích các giải pháp chủ yếu thực hiện kết hợp phát triển kinh tế xã hội với tăng cường củng cố …”","o":["khoa học và công nghệ… 4","quốc phòng và an ninh ở Việt Nam hiện nay?","ninh, kể cả những nước mà hàng trăm năm nay chưa có chiến tranh","và công nghệ, đổi mới sáng tạo"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Phân tích các giải pháp chủ yếu thực hiện kết hợp phát triển kinh tế xã hội với tăng cường củng cố quốc phòng và an ninh ở Việt Nam hiện nay?"}]},{"id":7,"title":"NHỮNG VẤN ĐỀ CƠ BẢN VỀ LỊCH SỬ NGHỆ THUẬT QUÂN SỰ VIỆT NAM","questions":[{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Bài 7 NHỮNG VẤN ĐỀ CƠ BẢN VỀ LỊCH SỬ NGHỆ THUẬT QUÂN …”","o":["là “biết tiến, biết thoái, biết công, biết thủ”","SỰ VIỆT NAM ----- A","là đoàn kết đứng lên đánh giặc, giữ nước","đạo thắng lợi cuộc kháng chiến chống quân Tống"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Bài 7 NHỮNG VẤN ĐỀ CƠ BẢN VỀ LỊCH SỬ NGHỆ THUẬT QUÂN SỰ VIỆT NAM ----- A."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Đất nước trong buổi đầu lịch sử Cách đây mấy nghìn năm, từ khi các Vua Hùng mở nước Văn Lang, lịch sử dân tộc …” là gì?","o":["hiện các nội dung chủ yếu sau","vua Trần, lập ra vương triều mới, triều đại nhà Hồ","lớn, lấy ít địch nhiều, lấy chất lượng cao thắng số lượng đông","Việt Nam bắt đầu thời đại dựng nước và giữ nước"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đất nước trong buổi đầu lịch sử Cách đây mấy nghìn năm, từ khi các Vua Hùng mở nước Văn Lang, lịch sử dân tộc Việt Nam bắt đầu thời đại dựng nước và giữ nước."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Nền văn minh sông Hồng còn gọi là văn minh Văn Lang, mà đỉnh cao là văn hoá Đông Sơn rực rỡ …”?","o":["thành quả đáng tự hào của thời đại Hùng Vương","nước, mà còn là cuộc đấu tranh gay gắt về tài trí giữa hai","5 đại đoàn cùng nhiều lực lượng khác","thù nhiều phen kinh hồn, bạt vía"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nền văn minh sông Hồng còn gọi là văn minh Văn Lang, mà đỉnh cao là văn hoá Đông Sơn rực rỡ, thành quả đáng tự hào của thời đại Hùng Vương."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Sự xuất hiện các thế lực thù địch và âm mưu thôn tính mở rộng lãnh thổ của chúng là nguy cơ …”","o":["trực tiếp đe doạ vận mệnh đất nước ta","chiến, xây dựng phòng tuyến Như Nguyệt để chặn giặc","cao và để lại nhiều bài học lịch sử quý giá","Việt Nam bắt đầu thời đại dựng nước và giữ nước"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Sự xuất hiện các thế lực thù địch và âm mưu thôn tính mở rộng lãnh thổ của chúng là nguy cơ trực tiếp đe doạ vận mệnh đất nước ta."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Những yếu tố tác động đến việc hình thành nghệ thuật đánh giặc a) Về địa lý Nhà nước Văn Lang trước kia, Nhà nước Việt Nam ngày nay có vị trí chiến lược quan trọng ở khu vực Đông Nam …” được hoàn thiện như thế nào?","o":["cơ, đưa chiến tranh Việt Nam kết thúc thắng lợi","thế của địa hình để lập thế trận đánh giặc","chiến lược, bảo toàn lực lượng và tạo thế, thời cơ để phản công","Á và biển Đông, có hệ thống giao thông đường bộ, đường biển, đường"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Những yếu tố tác động đến việc hình thành nghệ thuật đánh giặc a) Về địa lý Nhà nước Văn Lang trước kia, Nhà nước Việt Nam ngày nay có vị trí chiến lược quan trọng ở khu vực Đông Nam Á và biển Đông, có hệ thống giao thông đường bộ, đường biển, đường"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Để bảo vệ đất nước, bảo vệ sự trường tồn của dân tộc, cha ông ta đã đoàn kết và phát huy tối đa ưu …”","o":["hợp với đối tượng và địa hình","của ta trong chiến tranh nhân dân bảo vệ Tổ quốc","địch để giữ vững vùng giải phóng, chiến thuật phòng ngự xuất hiện","thế của địa hình để lập thế trận đánh giặc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Để bảo vệ đất nước, bảo vệ sự trường tồn của dân tộc, cha ông ta đã đoàn kết và phát huy tối đa ưu thế của địa hình để lập thế trận đánh giặc."},{"q":"Phương án nào điền đúng vào chỗ trống: “c) Về chính trị, văn hoá - xã hội Nước Việt Nam có 54 dân tộc anh …”?","o":["vào sự nghiệp bảo vệ Tổ quốc trong thời kỳ mới","SỰ VIỆT NAM ----- A","em cùng chung sống hoà thuận, đoàn kết","lên lật đổ chính quyền của nhà Lương"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: c) Về chính trị, văn hoá - xã hội Nước Việt Nam có 54 dân tộc anh em cùng chung sống hoà thuận, đoàn kết."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Mỗi dân tộc, làng, xã có phong tục, tập quán riêng, tạo nên nét đặc …”?","o":["xin rửa sạch nước thù","sắc văn hoá dân tộc Việt Nam","kiên cường bất khuất","mạnh để giành thắng lợi trong chiến tranh"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Mỗi dân tộc, làng, xã có phong tục, tập quán riêng, tạo nên nét đặc sắc văn hoá dân tộc Việt Nam."},{"q":"Theo giáo trình, ý “Các cuộc khởi nghĩa và chiến tranh chống xâm lược a) Những cuộc chiến tranh giữ nước đầu tiên Cuộc chiến tranh giữ nước đầu tiên mà …” kết thúc bằng nội dung nào?","o":["cuối cùng của Nhà nước phong kiến Việt Nam","vẫn liên tiếp nổ ra, tiêu biểu là khởi nghĩa Lam Sơn","sử sách ghi lại là cuộc kháng chiến chống quân Tần","toàn diện, tập trung những vấn đề chủ yếu sau"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Các cuộc khởi nghĩa và chiến tranh chống xâm lược a) Những cuộc chiến tranh giữ nước đầu tiên Cuộc chiến tranh giữ nước đầu tiên mà sử sách ghi lại là cuộc kháng chiến chống quân Tần."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Từ đây, đất nước ta rơi vào thảm hoạ hơn một nghìn năm bị phong kiến Trung …”","o":["cao và để lại nhiều bài học lịch sử quý giá","thành quả đáng tự hào của thời đại Hùng Vương","dưới sự lãnh đạo của Vua Hùng và Thục Phán","Hoa đô hộ (thời kỳ Bắc thuộc)"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Từ đây, đất nước ta rơi vào thảm hoạ hơn một nghìn năm bị phong kiến Trung Hoa đô hộ (thời kỳ Bắc thuộc)."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Cuộc khởi nghĩa của hai bà Trưng vào mùa xuân năm 40 …”","o":["đã giành được độc lập","hợp với đối tượng và địa hình","số 9 - Nam Lào năm 1971","của chủ lực làm trung tâm phối hợp"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Cuộc khởi nghĩa của hai bà Trưng vào mùa xuân năm 40 đã giành được độc lập."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Mặc dù 67 bà Triệu cùng nghĩa quân chiến đấu rất anh dũng, nhưng kẻ thù có sức mạnh vượt trội và đàn …” là gì?","o":["áp rất khốc liệt, nên khởi nghĩa bị thất bại","trực tiếp đe doạ vận mệnh đất nước ta","phải chủ động tiến công trước để đẩy kẻ thù vào thế bị động","thách toàn diện đối với mỗi quốc gia trong tham chiến"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Mặc dù 67 bà Triệu cùng nghĩa quân chiến đấu rất anh dũng, nhưng kẻ thù có sức mạnh vượt trội và đàn áp rất khốc liệt, nên khởi nghĩa bị thất bại."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Sau đó, nghĩa quân liên tiếp đánh thắng hai cuộc phản …”?","o":["quân đội Pháp xâm lược","công của kẻ thù","kiên cường bất khuất","chiến đấu phòng ngự,"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Sau đó, nghĩa quân liên tiếp đánh thắng hai cuộc phản công của kẻ thù."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Trận quyết chiến trên sông Bạch Đằng, Ngô Quyền cùng quân và dân ta đã nhấn chìm toàn bộ đoàn thuyền của quân Nam Hán, khiến Hoàng Thao phải bỏ mạng, vua Nam Hán phải bãi binh, chấm dứt hơn …”","o":["chiến tranh, tạo đà, tạo thế cho các mặt trận khác phát triển","hình thành, phát triển trong quá trình dựng và giữ nước của dân tộc","ra thế và thời cơ có lợi để tiến hành phản công, tiến công","một nghìn năm Bắc thuộc, đất nước ta mở ra một kỷ nguyên mới"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trận quyết chiến trên sông Bạch Đằng, Ngô Quyền cùng quân và dân ta đã nhấn chìm toàn bộ đoàn thuyền của quân Nam Hán, khiến Hoàng Thao phải bỏ mạng, vua Nam Hán phải bãi binh, chấm dứt hơn một nghìn năm Bắc thuộc, đất nước ta mở ra một kỷ nguyên mới"},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Lúc bấy giờ, ở Trung Quốc, nhà Tống đã thành lập …” được hoàn thiện như thế nào?","o":["đoàn, sau đó phát triển đến sư đoàn","dịch Hồ Chí Minh lịch sử","cướp nước ta một lần nữa...”","và đang phát triển"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Lúc bấy giờ, ở Trung Quốc, nhà Tống đã thành lập và đang phát triển."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Nhân dịp suy yếu của nhà Đinh, nhà Tống quyết định phát động cuộc chiến tranh xâm lược Đại Cồ …”","o":["Việt (quốc hiệu của nước ta lúc đó)","trên tất cả địa hình để nhanh chóng kết thúc chiến tranh","kết hợp đánh nhỏ, đánh vừa và đánh lớn","nghệ thuật quân sự truyền thống của dân tộc"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nhân dịp suy yếu của nhà Đinh, nhà Tống quyết định phát động cuộc chiến tranh xâm lược Đại Cồ Việt (quốc hiệu của nước ta lúc đó)."},{"q":"Phương án nào điền đúng vào chỗ trống: “Cuộc kháng chiến chống Tống lần thứ 2 (1075-1407) của nhà Lý Tuy bị đại bại trong lần xâm lược năm 981, nhà Tống vẫn …”?","o":["chiến tranh nhân dân, thực hiện toàn dân đánh giặc, đánh giặc toàn diện","đã tạo ra thời cơ phản công cho quân ta","cao và để lại nhiều bài học lịch sử quý giá","chưa chịu từ bỏ tham vọng xâm lược nước ta"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Cuộc kháng chiến chống Tống lần thứ 2 (1075-1407) của nhà Lý Tuy bị đại bại trong lần xâm lược năm 981, nhà Tống vẫn chưa chịu từ bỏ tham vọng xâm lược nước ta."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Với chủ trương thực hiện “tiên phát chế nhân”, “Ngồi yên đợi giặc không bằng đem quân ra trước để chặn mũi nhọn của chúng”, Lý Thường Kiệt đã chủ động đưa quân tiến công sang đất Tống tiêu diệt lực lượng ở các …”?","o":["dứt toàn bộ thể chế “vua Lê - chúa Trịnh”","với các mũi thọc sâu, luồn sâu, tạo thế chia cắt địch","tôn Lê Hoàn, người đang giữ chức thập đạo tướng quân lên làm vua","căn cứ xuất phát của kẻ thù, rồi rút về phòng thủ đất nước"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Với chủ trương thực hiện “tiên phát chế nhân”, “Ngồi yên đợi giặc không bằng đem quân ra trước để chặn mũi nhọn của chúng”, Lý Thường Kiệt đã chủ động đưa quân tiến công sang đất Tống tiêu diệt lực lượng ở các căn cứ xuất phát của kẻ thù, rồi rút về phòng thủ đất nước."},{"q":"Theo giáo trình, ý “Trận phản công Như Nguyệt (tháng 3/1077), quân và dân Đại Việt đã quét sạch quân xâm lược …” kết thúc bằng nội dung nào?","o":["5 đại đoàn cùng nhiều lực lượng khác","Tống ra khỏi biên cương của Tổ quốc","được phát triển lên một tầm cao mới","sử sách ghi lại là cuộc kháng chiến chống quân Tần"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trận phản công Như Nguyệt (tháng 3/1077), quân và dân Đại Việt đã quét sạch quân xâm lược Tống ra khỏi biên cương của Tổ quốc."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Cuộc kháng chiến lần thứ hai vào năm 1285, quân và dân ta đã …”","o":["dân quân tự vệ ngày càng nhiều","đối tượng và thời cơ tiến công","đánh thắng 60 vạn quân Nguyên","thắng lợi nhiệm vụ chiến dịch"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Cuộc kháng chiến lần thứ hai vào năm 1285, quân và dân ta đã đánh thắng 60 vạn quân Nguyên."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Kháng chiến chống quân Nguyên không chỉ là cuộc đọ sức quyết liệt giữa một đế quốc đầu sỏ mạnh nhất thế giới lúc đó với một dân tộc nhỏ bé nhưng kiên quyết đứng lên chống xâm lược để bảo vệ đất …”","o":["ứng, rồi sau đó sẽ dốc toàn lực để đánh viện binh","nước, mà còn là cuộc đấu tranh gay gắt về tài trí giữa hai","dưới sự lãnh đạo của Vua Hùng và Thục Phán","để Đảng ta vận dụng, định ra đường lối quân sự trong khởi nghĩa"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Kháng chiến chống quân Nguyên không chỉ là cuộc đọ sức quyết liệt giữa một đế quốc đầu sỏ mạnh nhất thế giới lúc đó với một dân tộc nhỏ bé nhưng kiên quyết đứng lên chống xâm lược để bảo vệ đất nước, mà còn là cuộc đấu tranh gay gắt về tài trí giữa hai"},{"q":"Theo bài học, phần còn thiếu trong nhận định “Trong tác chiến, nhà Hồ quá thiên về phòng thủ, coi đó là phương thức cơ bản, dẫn …” là gì?","o":["đến sai lầm về chỉ đạo chiến lược","cướp nước ta một lần nữa...”","được phát triển lên một tầm cao mới","những thời điểm quan trọng để đánh thắng quân xâm lược"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trong tác chiến, nhà Hồ quá thiên về phòng thủ, coi đó là phương thức cơ bản, dẫn đến sai lầm về chỉ đạo chiến lược."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Mặc dù chiếm được Đại Việt, nhưng giặc Minh không khuất phục được dân tộc ta, các cuộc khởi nghĩa của các tầng lớp nhân dân yêu nước …”?","o":["vẫn liên tiếp nổ ra, tiêu biểu là khởi nghĩa Lam Sơn","địch để giữ vững vùng giải phóng, chiến thuật phòng ngự xuất hiện","hơn 50 chiến dịch trong kháng chiến chống Mỹ","tiến công chúng, do đó thế trận rất lỏng lẻo"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Mặc dù chiếm được Đại Việt, nhưng giặc Minh không khuất phục được dân tộc ta, các cuộc khởi nghĩa của các tầng lớp nhân dân yêu nước vẫn liên tiếp nổ ra, tiêu biểu là khởi nghĩa Lam Sơn."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Khởi nghĩa Tây Sơn và các cuộc kháng chiến chống quân Xiêm 1784-1785, kháng chiến chống quân xâm lược Mãn Thanh 1788-1789 Sau khi đánh thắng giặc Minh xâm lược, Lê Lợi lên ngôi, lập nên triều Hậu Lê (triều …”","o":["thách toàn diện đối với mỗi quốc gia trong tham chiến","vũ trang, bộ phận hợp thành của nghệ thuật quân sự Việt Nam","tốc tiêu diệt 29 vạn quân xâm lược vào mùa xuân Kỷ Dậu 1789","Lê Sơ), đây là giai đoạn hưng thịnh nhất của phong kiến Việt Nam"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Khởi nghĩa Tây Sơn và các cuộc kháng chiến chống quân Xiêm 1784-1785, kháng chiến chống quân xâm lược Mãn Thanh 1788-1789 Sau khi đánh thắng giặc Minh xâm lược, Lê Lợi lên ngôi, lập nên triều Hậu Lê (triều Lê Sơ), đây là giai đoạn hưng thịnh nhất của phong kiến Việt Nam."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Quân Tây Sơn tiến công vào Gia Định, hang ổ cuối …” được hoàn thiện như thế nào?","o":["hiện các nội dung chủ yếu sau","phong kiến lớn nhất Châu Á đương thời","xã hội chủ nghĩa ở nước ta","cùng của nhà Nguyễn"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Quân Tây Sơn tiến công vào Gia Định, hang ổ cuối cùng của nhà Nguyễn."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Năm 1784, nhà Tây Sơn tiêu diệt 5 vạn quân Xiêm và tiến công ra Bắc, xoá bỏ giới tuyến sông Gianh, chấm …”","o":["dứt toàn bộ thể chế “vua Lê - chúa Trịnh”","để kết thúc chiến tranh càng sớm càng tốt","nhà Minh về nước trong danh dự, để muôn đời dập tắt chiến tranh","phát huy cái mạnh của ta"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Năm 1784, nhà Tây Sơn tiêu diệt 5 vạn quân Xiêm và tiến công ra Bắc, xoá bỏ giới tuyến sông Gianh, chấm dứt toàn bộ thể chế “vua Lê - chúa Trịnh”."},{"q":"Phương án nào điền đúng vào chỗ trống: “Nghệ thuật đánh giặc của ông cha Lịch sử đã đặt ra cho dân tộc ta biết bao thử thách ngặt …”?","o":["vào sự nghiệp bảo vệ Tổ quốc trong thời kỳ mới","em cùng chung sống hoà thuận, đoàn kết","nghèo trong quá trình dựng nước và giữ nước","Đảng Cộng sản Việt Nam lãnh đạo?"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nghệ thuật đánh giặc của ông cha Lịch sử đã đặt ra cho dân tộc ta biết bao thử thách ngặt nghèo trong quá trình dựng nước và giữ nước."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Trong quá trình đó, nghệ thuật quân sự Việt Nam từng bước phát triển và được thể hiện rất sinh động trong khởi nghĩa vũ trang, chiến tranh giải phóng, trên …”?","o":["các phương diện tư tưởng chỉ đạo tác chiến, mưu kế đánh giặc","các hành động thiện chí nhằm ngăn ngừa, không để chiến tranh xảy ra","nghệ thuật quân sự Việt Nam từ khi có Đảng","và được tăng cường một số hoả lực như như súng cối 82mm, DKZ,"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trong quá trình đó, nghệ thuật quân sự Việt Nam từng bước phát triển và được thể hiện rất sinh động trong khởi nghĩa vũ trang, chiến tranh giải phóng, trên các phương diện tư tưởng chỉ đạo tác chiến, mưu kế đánh giặc..."},{"q":"Theo giáo trình, ý “Thực hiện tiến công liên tục mọi lúc, mọi nơi, từ cục bộ đến toàn bộ, để …” kết thúc bằng nội dung nào?","o":["quét sạch quân thù ra khỏi bờ cõi","sức mạnh tổng hợp để đánh thắng kẻ thù","ta quyết tâm đánh Mỹ và biết thắng Mỹ","số 9 - Nam Lào năm 1971"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Thực hiện tiến công liên tục mọi lúc, mọi nơi, từ cục bộ đến toàn bộ, để quét sạch quân thù ra khỏi bờ cõi."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Sử sách còn ghi lại, thời nhà Lý đã chủ động đánh bại kẻ thù ở phía Nam (quân Chiêm Thành), phá tan …”","o":["âm mưu liên kết của nhà Tống với Chiêm Thành","cuối cùng của Nhà nước phong kiến Việt Nam","từ “đánh nhanh, thắng nhanh” sang “đánh chắc, tiến chắc” thể hiện sự phân","Việt (quốc hiệu của nước ta lúc đó)"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Sử sách còn ghi lại, thời nhà Lý đã chủ động đánh bại kẻ thù ở phía Nam (quân Chiêm Thành), phá tan âm mưu liên kết của nhà Tống với Chiêm Thành."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “70 Vào thế kỷ XIII, các quốc gia châu Âu, châu Á đang run sợ trước vó ngựa của giặc Nguyên Mông, thì cả ba lần tiến quân xâm lược Đại Việt vào các năm 1258, 1285, 1288, giặc Nguyên đều thảm …”","o":["những đường giao thông qua bán đảo Đông Dương và vùng Đông Nam Á","vụ vẻ vang giải phóng dân tộc, giải phóng Thăng Long","bại, mặc dù có số quân lớn hơn nhiều lần quân đội nhà Trần","thô sơ đến hiện đại, làm cho binh lực của địch bị phân tán,"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: 70 Vào thế kỷ XIII, các quốc gia châu Âu, châu Á đang run sợ trước vó ngựa của giặc Nguyên Mông, thì cả ba lần tiến quân xâm lược Đại Việt vào các năm 1258, 1285, 1288, giặc Nguyên đều thảm bại, mặc dù có số quân lớn hơn nhiều lần quân đội nhà Trần."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Rút lui chiến lược, tạm nhường Thăng Long cho giặc trong một thời gian nhất định, là để bảo toàn lực lượng và đó là một nét độc đáo …” là gì?","o":["và cho rằng: “Lực lượng của Pháp như mặt trời lúc hoàng hôn, hống","trong nghệ thuật tác chiến, chứ không phải là tư tưởng rút lui","từng bước vận dụng công kiên chiến (đánh địch trong công sự)","nghệ thuật lấy nhỏ đánh lớn, lấy ít địch nhiều, lấy yếu chống mạnh"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Rút lui chiến lược, tạm nhường Thăng Long cho giặc trong một thời gian nhất định, là để bảo toàn lực lượng và đó là một nét độc đáo trong nghệ thuật tác chiến, chứ không phải là tư tưởng rút lui."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Đến thời Nguyễn Huệ, tư tưởng chủ động tiến công địch để giải phóng Thăng Long lại …”?","o":["SỰ VIỆT NAM ----- A","được phát triển lên một tầm cao mới","nghệ thuật chiến dịch và chiến thuật","đánh thắng 3 vạn quân Nguyên"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đến thời Nguyễn Huệ, tư tưởng chủ động tiến công địch để giải phóng Thăng Long lại được phát triển lên một tầm cao mới."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Kế là để điều địch theo ý định của ta, giành quyền chủ động, buộc chúng …”","o":["phải đánh theo cách đánh của ta","đối tượng và thời cơ tiến công","Điện Biên Phủ với các chiến trường khác","khu cơ”, “Bình Ngô đại cáo”"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Kế là để điều địch theo ý định của ta, giành quyền chủ động, buộc chúng phải đánh theo cách đánh của ta."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Trong chống giặc ngoại xâm để bảo vệ đất nước, cha ông ta đã kết hợp chặt chẽ giữa quân triều đình, quân địa phương và dân binh, thổ binh các làng xã cùng đánh địch, làm cho lực lượng …” được hoàn thiện như thế nào?","o":["địch luôn bị phân tán, không thực hiện được hợp quân tại Thăng Long","Á và biển Đông, có hệ thống giao thông đường bộ, đường biển, đường","hành tổng công kích tiêu diệt toàn bộ quân địch","sự hình thành của nhà nước trong buổi đầu lịch sử"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trong chống giặc ngoại xâm để bảo vệ đất nước, cha ông ta đã kết hợp chặt chẽ giữa quân triều đình, quân địa phương và dân binh, thổ binh các làng xã cùng đánh địch, làm cho lực lượng địch luôn bị phân tán, không thực hiện được hợp quân tại Thăng Long."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Kế sách đánh giặc của ông cha ta không những sáng tạo, mà còn hết sức mềm dẻo, khôn khéo đó …”","o":["các triều đại phong kiến trong chiến tranh giữ nước","phải đánh theo cách đánh của ta","của giặc, để đánh thắng giặc","là “biết tiến, biết thoái, biết công, biết thủ”"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Kế sách đánh giặc của ông cha ta không những sáng tạo, mà còn hết sức mềm dẻo, khôn khéo đó là “biết tiến, biết thoái, biết công, biết thủ”."},{"q":"Phương án nào điền đúng vào chỗ trống: “Sau khi đánh tan đạo quân viện binh do Liễu Thăng chỉ huy, đã vây chặt thành Đông Quan, buộc Vương Thông phải đầu hàng vô điều kiện, nhưng các ông đã cấp thuyền, ngựa và lương thảo cho hàng binh …”?","o":["dân đánh giặc, xây dựng được nền văn hoá mang bản sắc Việt Nam","công trước để đẩy kẻ thù vào thế bị động","nhà Minh về nước trong danh dự, để muôn đời dập tắt chiến tranh","Mỹ và trong công cuộc bảo vệ Tổ quốc xã hội chủ nghĩa"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Sau khi đánh tan đạo quân viện binh do Liễu Thăng chỉ huy, đã vây chặt thành Đông Quan, buộc Vương Thông phải đầu hàng vô điều kiện, nhưng các ông đã cấp thuyền, ngựa và lương thảo cho hàng binh nhà Minh về nước trong danh dự, để muôn đời dập tắt chiến tranh."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Trong tác chiến, ông cha ta đã triệt để khoét sâu điểm yếu của địch là tác chiến ở chiến trường xa, tiếp tế khó khăn, nên …”?","o":["là cơ sở để tạo ra sức mạnh quân sự","điểm sau đồng khởi và không cho Mỹ tạo cớ phá hoại công cuộc","đã tạo ra thời cơ phản công cho quân ta","đã tập trung triệt phá lương thảo, hậu cần của địch"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trong tác chiến, ông cha ta đã triệt để khoét sâu điểm yếu của địch là tác chiến ở chiến trường xa, tiếp tế khó khăn, nên đã tập trung triệt phá lương thảo, hậu cần của địch."},{"q":"Theo giáo trình, ý “c) Nghệ thuật chiến tranh nhân dân, thực hiện toàn dân đánh giặc Thực hiện toàn dân đánh giặc là một trong những nét độc đáo trong nghệ thuật quân sự của tổ …” kết thúc bằng nội dung nào?","o":["đạo quân dân ta, kiên quyết đánh giặc, bảo vệ chủ quyền dân tộc","tiên ta, được thể hiện cả trong khởi nghĩa và chiến tranh giải phóng","lầm về chiến lược, sa lầy về chiến thuật và thất bại","tích cực tiến công, chúng ta hoàn toàn có thể giành quyền chủ động"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: c) Nghệ thuật chiến tranh nhân dân, thực hiện toàn dân đánh giặc Thực hiện toàn dân đánh giặc là một trong những nét độc đáo trong nghệ thuật quân sự của tổ tiên ta, được thể hiện cả trong khởi nghĩa và chiến tranh giải phóng."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Từ lời thề của hai Bà Trưng và nghĩa quân: “Một …”","o":["làm thất bại kế hoạch hợp vây của địch","xin rửa sạch nước thù","nghệ thuật quân sự truyền thống của dân tộc","phải đánh theo cách đánh của ta"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Từ lời thề của hai Bà Trưng và nghĩa quân: “Một xin rửa sạch nước thù;"},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Trong đánh giặc, ông cha ta đã tận dụng địa hình, xây dựng thế trận làng, nước vững chắc, vận dụng sáng …”","o":["khu cơ”, “Bình Ngô đại cáo”","tạo cách đánh của nhiều lực lượng, nhiều thứ quân","triển cả về số lượng và chất lượng","dụng cách đánh “vây thành để diệt viện”"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trong đánh giặc, ông cha ta đã tận dụng địa hình, xây dựng thế trận làng, nước vững chắc, vận dụng sáng tạo cách đánh của nhiều lực lượng, nhiều thứ quân."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Nghệ thuật lấy nhỏ đánh lớn, lấy ít địch nhiều, lấy yếu chống mạnh chính là …” là gì?","o":["và đang phát triển","sản phẩm của lấy “thế” thắng “lực”","phát huy cái mạnh của ta","Kết, Ngọc Hồi, Đống Đa"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Nghệ thuật lấy nhỏ đánh lớn, lấy ít địch nhiều, lấy yếu chống mạnh chính là sản phẩm của lấy “thế” thắng “lực”."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Thời nhà Trần có khoảng 15 vạn quân, chống lại giặc Nguyên - Mông, lần thứ hai là …”?","o":["đánh lần lượt và đồng loạt)","60 vạn, lần ba là khoảng 50 vạn","và trưởng thành của quân đội ta","sử sách ghi lại là cuộc kháng chiến chống quân Tần"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Thời nhà Trần có khoảng 15 vạn quân, chống lại giặc Nguyên - Mông, lần thứ hai là 60 vạn, lần ba là khoảng 50 vạn."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Vì Lê Lợi, Nguyễn Trãi đã vận dụng “tránh thế ban mai, đánh lúc chiều tà” và vận …”","o":["dụng cách đánh “vây thành để diệt viện”","cùng của nhà Nguyễn","làm cho chúng bị động, lúng túng đối phó","với đánh tiêu diệt lớn quân địch"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Vì Lê Lợi, Nguyễn Trãi đã vận dụng “tránh thế ban mai, đánh lúc chiều tà” và vận dụng cách đánh “vây thành để diệt viện”."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Trong chống giặc ngoại xâm, ông cha ta đã biết kết hợp chặt chẽ các mặt trận nhằm tạo ra …” được hoàn thiện như thế nào?","o":["sức mạnh tổng hợp để đánh thắng kẻ thù","địch bằng các đòn thọc sâu, hiểm hóc","đạo thắng lợi cuộc kháng chiến chống quân Tống","công trước để đẩy kẻ thù vào thế bị động"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trong chống giặc ngoại xâm, ông cha ta đã biết kết hợp chặt chẽ các mặt trận nhằm tạo ra sức mạnh tổng hợp để đánh thắng kẻ thù."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Mặt trận chính trị nhằm cổ vũ tinh thần yêu nước của nhân dân, quy tụ sức mạnh đại đoàn kết dân tộc …”","o":["Nguyễn Hữu Cầu, khởi nghĩa Tây Sơn","là cơ sở để tạo ra sức mạnh quân sự","lâu dài, càng đánh càng mạnh, càng đánh càng thắng","là binh”, giữ vững quê hương, bảo vệ xã tắc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Mặt trận chính trị nhằm cổ vũ tinh thần yêu nước của nhân dân, quy tụ sức mạnh đại đoàn kết dân tộc, là cơ sở để tạo ra sức mạnh quân sự."},{"q":"Phương án nào điền đúng vào chỗ trống: “Mặt khác, mặt trận ngoại giao kết hợp với mặt trận quân sự, chính trị tạo ra thế có lợi …”?","o":["Mỹ và trong công cuộc bảo vệ Tổ quốc xã hội chủ nghĩa","bộ đội ta trước một đối tượng địch, địa hình cụ thể","để kết thúc chiến tranh càng sớm càng tốt","địch mạnh, có vũ khí công nghệ cao"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Mặt khác, mặt trận ngoại giao kết hợp với mặt trận quân sự, chính trị tạo ra thế có lợi để kết thúc chiến tranh càng sớm càng tốt."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “f) Về nghệ thuật tổ chức và thực hành các trận đánh lớn Trong các triều đại phong kiến, ông cha ta đã tổ chức và thực hành các …”?","o":["trên tất cả địa hình để nhanh chóng kết thúc chiến tranh","yếu tố khác để tạo ra sức mạnh hơn địch và đánh thắng địch","trận đánh lớn để giải phóng đất nước, kết thúc chiến tranh","Thống vì Nguyễn Huệ đã dùng lối đánh táo bạo, thần tốc, bất ngờ"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: f) Về nghệ thuật tổ chức và thực hành các trận đánh lớn Trong các triều đại phong kiến, ông cha ta đã tổ chức và thực hành các trận đánh lớn để giải phóng đất nước, kết thúc chiến tranh."},{"q":"Theo giáo trình, ý “Thời nhà Trần, lần chống giặc Nguyên lần thứ 2, Trần Quốc Tuấn đã tổ chức một cuộc rút lui chiến lược …” kết thúc bằng nội dung nào?","o":["chủng giữa bộ binh, xe tăng, pháo binh, phòng không,","làm thất bại kế hoạch hợp vây của địch","chiến hiệp đồng quy mô lớn","là không ngừng bồi đắp lòng yêu quê hương, đất nước"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Thời nhà Trần, lần chống giặc Nguyên lần thứ 2, Trần Quốc Tuấn đã tổ chức một cuộc rút lui chiến lược, làm thất bại kế hoạch hợp vây của địch."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Thời nhà hậu Lê, sau 10 năm bền bỉ, gian khổ, ngoan cường, cuộc khởi nghĩa Lam Sơn do Lê Lợi lãnh đạo đã hoàn thành nhiệm …”","o":["điểm sau đồng khởi và không cho Mỹ tạo cớ phá hoại công cuộc","vụ vẻ vang giải phóng dân tộc, giải phóng Thăng Long","cũng như trong chiến dịch và chiến đấu","Pháp và nâng lên một tầm cao mới"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Thời nhà hậu Lê, sau 10 năm bền bỉ, gian khổ, ngoan cường, cuộc khởi nghĩa Lam Sơn do Lê Lợi lãnh đạo đã hoàn thành nhiệm vụ vẻ vang giải phóng dân tộc, giải phóng Thăng Long."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Khi nghe tin viện binh nhà Minh sắp sang, nhiều tướng sỹ yêu cầu Lê Lợi hạ gấp thành Đông Quan (Thăng Long) để diệt trừ nội …”","o":["rất quan trọng, đặc biệt ở giai đoạn cuối của chiến tranh","ứng, rồi sau đó sẽ dốc toàn lực để đánh viện binh","và các hoạt động tác chiến tương đương","nhà Minh về nước trong danh dự, để muôn đời dập tắt chiến tranh"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Khi nghe tin viện binh nhà Minh sắp sang, nhiều tướng sỹ yêu cầu Lê Lợi hạ gấp thành Đông Quan (Thăng Long) để diệt trừ nội ứng, rồi sau đó sẽ dốc toàn lực để đánh viện binh."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Việc lựa chọn rất đúng mục tiêu tiến công chiến lược và kiệt xuất trong tổ chức, thực hành trận quyết chiến Chi Lăng- Xương Giang, buộc lũ giặc Vương Thông trong thành Đông Quan không đánh mà bị …” là gì?","o":["binh đoàn chủ lực, thực hiện đánh lớn, tiêu diệt lớn quân địch","bắt đã chứng tỏ tài năng quân sự xuất sắc của ông trong tổ","sự hình thành của nhà nước trong buổi đầu lịch sử","cao và để lại nhiều bài học lịch sử quý giá"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Việc lựa chọn rất đúng mục tiêu tiến công chiến lược và kiệt xuất trong tổ chức, thực hành trận quyết chiến Chi Lăng- Xương Giang, buộc lũ giặc Vương Thông trong thành Đông Quan không đánh mà bị bắt đã chứng tỏ tài năng quân sự xuất sắc của ông trong tổ"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Điểm yếu cơ bản của quân tướng nhà Thanh là rất chủ quan, ngạo mạn, cho rằng, Tây Sơn không dám và không thể …”?","o":["tiến công chúng, do đó thế trận rất lỏng lẻo","và thực hành chiến tranh giữ nước","thời điểm có lợi nhất để kết thúc chiến tranh càng sớm càng tốt","bại, mặc dù có số quân lớn hơn nhiều lần quân đội nhà Trần"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Điểm yếu cơ bản của quân tướng nhà Thanh là rất chủ quan, ngạo mạn, cho rằng, Tây Sơn không dám và không thể tiến công chúng, do đó thế trận rất lỏng lẻo."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Đây vừa là nghệ thuật kết hợp tiến công chính diện với bên sườn, vừa là tiến hành nhiều trận đánh diễn ra đồng thời, liên tiếp, nhanh mạnh, bất ngờ …”","o":["để từ đó có đối sách và phương thức đối phó hiệu quả nhất","khiến địch không thể ứng cứu được cho nhau và nhanh chóng thất bại","trong đó tiến công quân sự luôn giữ vai trò quyết định","nghệ thuật quân sự Việt Nam từ khi có Đảng"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Đây vừa là nghệ thuật kết hợp tiến công chính diện với bên sườn, vừa là tiến hành nhiều trận đánh diễn ra đồng thời, liên tiếp, nhanh mạnh, bất ngờ, khiến địch không thể ứng cứu được cho nhau và nhanh chóng thất bại."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Ba bộ phận của nghệ thuật quân sự là một thể thống nhất có quan hệ biện chứng chặt chẽ, thúc đẩy nhau phát triển …” được hoàn thiện như thế nào?","o":["chống Mỹ, lực lượng, vũ khí, trang bị của ta còn hạn chế","trong đó chiến lược quân sự đóng vai trò chủ đạo","địch mạnh, có vũ khí công nghệ cao","đế quốc Mỹ đang dần trở thành kẻ thù trực tiếp, nguy hiểm của"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Ba bộ phận của nghệ thuật quân sự là một thể thống nhất có quan hệ biện chứng chặt chẽ, thúc đẩy nhau phát triển, trong đó chiến lược quân sự đóng vai trò chủ đạo."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Nhiều tư tưởng quân sự kiệt xuất như: “Binh thư yếu lược”, “Hổ trướng …”","o":["phải một cuộc chiến tranh của toàn dân Đại Việt","số 9 - Nam Lào năm 1971","quét sạch quân thù ra khỏi bờ cõi","khu cơ”, “Bình Ngô đại cáo”"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nhiều tư tưởng quân sự kiệt xuất như: “Binh thư yếu lược”, “Hổ trướng khu cơ”, “Bình Ngô đại cáo”;"},{"q":"Phương án nào điền đúng vào chỗ trống: “b) Chủ nghĩa Mác-Lênin về chiến tranh, quân đội và bảo vệ Tổ quốc Đảng Cộng sản Việt Nam lấy chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh làm …”?","o":["nền tảng tư tưởng và kim chỉ nam cho mọi hành động","một “thiên la, địa võng” để diệt địch","các thế lực, mà điển hình nhất là vua Lê-chúa Trịnh","đánh đơn lẻ, chưa có kinh nghiệm tác chiến ở quy mô chiến dịch"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: b) Chủ nghĩa Mác-Lênin về chiến tranh, quân đội và bảo vệ Tổ quốc Đảng Cộng sản Việt Nam lấy chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh làm nền tảng tư tưởng và kim chỉ nam cho mọi hành động."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Hồ Chí Minh đã từng biên dịch “Binh pháp Tôn Tử”, viết về “kinh nghiệm …”?","o":["du kích Tàu”, “du kích Nga”,","địch bằng các đòn thọc sâu, hiểm hóc","hoàn thành nhiệm vụ của cấp trên giao","một “thiên la, địa võng” để diệt địch"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Hồ Chí Minh đã từng biên dịch “Binh pháp Tôn Tử”, viết về “kinh nghiệm du kích Tàu”, “du kích Nga”,..."},{"q":"Theo giáo trình, ý “Nội dung nghệ thuật quân sự Việt Nam từ khi có Đảng lãnh đạo a) Chiến lược quân sự Chiến lược quân sự là tổng thể phương châm, chính sách và mưu lược được hoạch định để ngăn …” kết thúc bằng nội dung nào?","o":["trong chống giặc ngoại xâm để bảo vệ sự tồn vong của đất nước","ngừa và sẵn sàng tiến hành chiến tranh (xung đột vũ trang) thắng lợi","lớn, lấy ít địch nhiều, lấy chất lượng cao thắng số lượng đông","Đồn, làm cho giặc Nguyên ở Thăng Long vô cùng hoảng loạn"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Nội dung nghệ thuật quân sự Việt Nam từ khi có Đảng lãnh đạo a) Chiến lược quân sự Chiến lược quân sự là tổng thể phương châm, chính sách và mưu lược được hoạch định để ngăn ngừa và sẵn sàng tiến hành chiến tranh (xung đột vũ trang) thắng lợi;"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Xác định đúng kẻ thù, đúng đối tượng tác chiến Đây là vấn đề quan trọng của chiến tranh cách mạng, nhiệm vụ của chiến lược quân sự phải xác định chính xác …”","o":["để từ đó có đối sách và phương thức đối phó hiệu quả nhất","nước, mà không phụ thuộc vào những yếu tố tác động khách quan","chiến tranh bảo vệ Tổ quốc là tiêu diệt lực lượng địch phải đi","chiến, xây dựng phòng tuyến Như Nguyệt để chặn giặc"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Xác định đúng kẻ thù, đúng đối tượng tác chiến Đây là vấn đề quan trọng của chiến tranh cách mạng, nhiệm vụ của chiến lược quân sự phải xác định chính xác để từ đó có đối sách và phương thức đối phó hiệu quả nhất."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Trước tình hình đó, Đảng ta xác định kẻ thù nguy hiểm, trực tiếp của cách …”","o":["vệ Tổ quốc Việt Nam xã hội chủ nghĩa","mạng Việt Nam là thực dân Pháp","dựng và bảo vệ Tổ quốc","triển cả về số lượng và chất lượng"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trước tình hình đó, Đảng ta xác định kẻ thù nguy hiểm, trực tiếp của cách mạng Việt Nam là thực dân Pháp."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Sau chiến thắng lịch sử Điện Biên Phủ, khi đế quốc Mỹ không chịu ký hiệp định Giơnevơ, tạo cớ áp đặt chủ nghĩa thực dân mới ở miền Nam Việt Nam, ngay từ tháng 9/1954, Đảng ta đã nhận định …” là gì?","o":["dứt toàn bộ thể chế “vua Lê - chúa Trịnh”","nước ta liên tục bị các triều đại phong kiến phương Bắc từ nhà","trận đánh lớn để giải phóng đất nước, kết thúc chiến tranh","đế quốc Mỹ đang dần trở thành kẻ thù trực tiếp, nguy hiểm của"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Sau chiến thắng lịch sử Điện Biên Phủ, khi đế quốc Mỹ không chịu ký hiệp định Giơnevơ, tạo cớ áp đặt chủ nghĩa thực dân mới ở miền Nam Việt Nam, ngay từ tháng 9/1954, Đảng ta đã nhận định, đế quốc Mỹ đang dần trở thành kẻ thù trực tiếp, nguy hiểm của"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Bước vào kháng chiến chống Pháp, so sánh lực lượng địch, ta hết sức chênh lệch, nhưng với phương pháp xem xét biện chứng, Đảng ta đã phân tích, chỉ ra sự phát triển trong so sánh lực lượng …”?","o":["và cho rằng: “Lực lượng của Pháp như mặt trời lúc hoàng hôn, hống","hành tổng công kích tiêu diệt toàn bộ quân địch","chặn và đánh địch từ xa để bảo vệ Thăng Long","mạnh tổng hợp hơn địch để đánh thắng địch trong mọi tình thế"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Bước vào kháng chiến chống Pháp, so sánh lực lượng địch, ta hết sức chênh lệch, nhưng với phương pháp xem xét biện chứng, Đảng ta đã phân tích, chỉ ra sự phát triển trong so sánh lực lượng và cho rằng: “Lực lượng của Pháp như mặt trời lúc hoàng hôn, hống"},{"q":"Chọn phương án nối tiếp đúng nội dung: “Mở đầu và kết thúc chiến tranh đúng lúc Mở đầu và kết thúc chiến tranh đúng lúc là một vấn đề mang tính nghệ thuật cao trong chỉ đạo chiến tranh của Đảng ta, nhằm giành …”","o":["rất quan trọng, đặc biệt ở giai đoạn cuối của chiến tranh","thắng lợi trọn vẹn nhất nhưng hạn chế tổn thất đến mức thấp nhất","vụ vẻ vang, quét sạch kẻ thù ra khỏi bờ cõi","Thống vì Nguyễn Huệ đã dùng lối đánh táo bạo, thần tốc, bất ngờ"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Mở đầu và kết thúc chiến tranh đúng lúc Mở đầu và kết thúc chiến tranh đúng lúc là một vấn đề mang tính nghệ thuật cao trong chỉ đạo chiến tranh của Đảng ta, nhằm giành thắng lợi trọn vẹn nhất nhưng hạn chế tổn thất đến mức thấp nhất."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Chủ tịch Hồ Chí Minh chỉ rõ: “Chúng ta muốn hoà bình …” được hoàn thiện như thế nào?","o":["Tống ra khỏi biên cương của Tổ quốc","chống giặc ngoại xâm","kiên cường bất khuất","chúng ta phải nhân nhượng"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Chủ tịch Hồ Chí Minh chỉ rõ: “Chúng ta muốn hoà bình, chúng ta phải nhân nhượng."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Trong cuộc kháng chiến chống Mỹ, Đảng ta đã chọn đúng thời điểm sau năm 1960, chuyển từ khởi nghĩa từng phần lên chiến tranh cách mạng, cách mạng miền Nam đã có bước trưởng thành, đây là thời …”","o":["quân địch phải chuyển từ chủ động tiến công sang bị động phòng ngự","Á và biển Đông, có hệ thống giao thông đường bộ, đường biển, đường","tốc tiêu diệt 29 vạn quân xâm lược vào mùa xuân Kỷ Dậu 1789","điểm sau đồng khởi và không cho Mỹ tạo cớ phá hoại công cuộc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trong cuộc kháng chiến chống Mỹ, Đảng ta đã chọn đúng thời điểm sau năm 1960, chuyển từ khởi nghĩa từng phần lên chiến tranh cách mạng, cách mạng miền Nam đã có bước trưởng thành, đây là thời điểm sau đồng khởi và không cho Mỹ tạo cớ phá hoại công cuộc"},{"q":"Phương án nào điền đúng vào chỗ trống: “Tại các thời điểm đó, thế và lực cách mạng đều mạnh, có đủ điều kiện để quyết định kết thúc chiến tranh, tự quyết định vận mệnh của đất …”?","o":["nước ta liên tục bị các triều đại phong kiến phương Bắc từ nhà","bị tổn thất nặng nề, nên bị thất bại","nước, mà không phụ thuộc vào những yếu tố tác động khách quan","lược, đặc biệt là giải phóng Thăng Long trong mùa xuân Kỷ Dậu 1789"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Tại các thời điểm đó, thế và lực cách mạng đều mạnh, có đủ điều kiện để quyết định kết thúc chiến tranh, tự quyết định vận mệnh của đất nước, mà không phụ thuộc vào những yếu tố tác động khách quan."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Phương thức tiến hành chiến tranh Cuộc chiến tranh chống quân xâm lược nước ta là chiến …”?","o":["tranh cách mạng, chính nghĩa và tự vệ","phát huy cái mạnh của ta","vào sự nghiệp bảo vệ Tổ quốc trong thời kỳ mới","đánh thắng 50 vạn quân Nguyên"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Phương thức tiến hành chiến tranh Cuộc chiến tranh chống quân xâm lược nước ta là chiến tranh cách mạng, chính nghĩa và tự vệ."},{"q":"Theo giáo trình, ý “b) Nghệ thuật chiến dịch Nghệ thuật chiến dịch, lý luận và thực tiễn chuẩn bị, thưc hành chiến dịch …” kết thúc bằng nội dung nào?","o":["Châu đều chấn động","và các hoạt động tác chiến tương đương","nghệ thuật quân sự truyền thống của dân tộc","nước, thương nòi, sống hoà thuận, thuỷ chung"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: b) Nghệ thuật chiến dịch Nghệ thuật chiến dịch, lý luận và thực tiễn chuẩn bị, thưc hành chiến dịch và các hoạt động tác chiến tương đương;"},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Trong kháng chiến chống Pháp, ta đã tiến hành hơn 40 chiến dịch ở các quy mô khác nhau và …”","o":["hơn 50 chiến dịch trong kháng chiến chống Mỹ","nghèo trong quá trình dựng nước và giữ nước","sản phẩm của lấy “thế” thắng “lực”","đánh thắng 50 vạn quân Nguyên"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trong kháng chiến chống Pháp, ta đã tiến hành hơn 40 chiến dịch ở các quy mô khác nhau và hơn 50 chiến dịch trong kháng chiến chống Mỹ."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Chiến dịch phản công: Chiến dịch phản công Việt Bắc năm 1947, chiến dịch phản công Đường …”","o":["số 9 - Nam Lào năm 1971","tổng hợp Khu 8","quân đội Pháp xâm lược","hiện các nội dung chủ yếu sau"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Chiến dịch phản công: Chiến dịch phản công Việt Bắc năm 1947, chiến dịch phản công Đường số 9 - Nam Lào năm 1971."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Quy mô chiến dịch Trong kháng chiến chống Pháp, chống Mỹ, quy mô chiến dịch được phát …” là gì?","o":["triển cả về số lượng và chất lượng","chiến đấu phòng ngự,","chiến hiệp đồng quy mô lớn","5 đại đoàn cùng nhiều lực lượng khác"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Quy mô chiến dịch Trong kháng chiến chống Pháp, chống Mỹ, quy mô chiến dịch được phát triển cả về số lượng và chất lượng."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Trong kháng chiến chống Mỹ, giai đoạn đầu lực lượng chỉ có từ 1 đến 2 trung …”?","o":["lâu dài, càng đánh càng mạnh, càng đánh càng thắng","hơn 50 chiến dịch trong kháng chiến chống Mỹ","đoàn, sau đó phát triển đến sư đoàn","chúng ta phải nhân nhượng"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Trong kháng chiến chống Mỹ, giai đoạn đầu lực lượng chỉ có từ 1 đến 2 trung đoàn, sau đó phát triển đến sư đoàn."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Nghệ thuật chiến dịch là cách đánh chiến dịch Thời kỳ đầu, do so sánh lực lượng giữa ta và địch rất chênh lệch, bộ đội ta mới có kinh nghiệm chiến đấu những trận …”","o":["từng bước vận dụng công kiên chiến (đánh địch trong công sự)","trong cái mạnh của địch, chúng bộc lộ những điểm yếu và sơ hở","đánh đơn lẻ, chưa có kinh nghiệm tác chiến ở quy mô chiến dịch","mới có thể tiến công địch một cách liên tục mọi lúc, mọi nơi"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nghệ thuật chiến dịch là cách đánh chiến dịch Thời kỳ đầu, do so sánh lực lượng giữa ta và địch rất chênh lệch, bộ đội ta mới có kinh nghiệm chiến đấu những trận đánh đơn lẻ, chưa có kinh nghiệm tác chiến ở quy mô chiến dịch."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Trong chiến dịch Điện Biên Phủ, nghệ thuật chiến dịch đã có bước phát triển vượt bậc, đó là: Xác định đúng phương châm tác chiến chiến dịch, việc thay đổi phương châm tác chiến …” được hoàn thiện như thế nào?","o":["ngừa và sẵn sàng tiến hành chiến tranh (xung đột vũ trang) thắng lợi","từ “đánh nhanh, thắng nhanh” sang “đánh chắc, tiến chắc” thể hiện sự phân","thế của địa hình để lập thế trận đánh giặc","trong nghệ thuật tác chiến, chứ không phải là tư tưởng rút lui"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Trong chiến dịch Điện Biên Phủ, nghệ thuật chiến dịch đã có bước phát triển vượt bậc, đó là: Xác định đúng phương châm tác chiến chiến dịch, việc thay đổi phương châm tác chiến từ “đánh nhanh, thắng nhanh” sang “đánh chắc, tiến chắc” thể hiện sự phân"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Phát huy cao nhất sức mạnh tác chiến hiệp đồng các binh chủng, tập trung ưu thế binh hoả lực đánh dứt điểm từng trận then chốt, tiêu diệt …”","o":["nhà Minh về nước trong danh dự, để muôn đời dập tắt chiến tranh","từng bộ phận địch, phá vỡ từng mảng phòng ngự của chúng","trong chống giặc ngoại xâm để bảo vệ sự tồn vong của đất nước","khác, phối hợp chặt chẽ với nổi dậy của quần chúng"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Phát huy cao nhất sức mạnh tác chiến hiệp đồng các binh chủng, tập trung ưu thế binh hoả lực đánh dứt điểm từng trận then chốt, tiêu diệt từng bộ phận địch, phá vỡ từng mảng phòng ngự của chúng."},{"q":"Phương án nào điền đúng vào chỗ trống: “Trong kháng chiến chống Mỹ, nghệ thuật chiến dịch đã kế thừa những kinh nghiệm của kháng chiến chống …”?","o":["đứng lên chống xâm lược","nửa mà công được gấp đôi”","Pháp và nâng lên một tầm cao mới","công Chương Dương, Hàm Tử, tiến công Ngọc Hồi, Đống Đa"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Trong kháng chiến chống Mỹ, nghệ thuật chiến dịch đã kế thừa những kinh nghiệm của kháng chiến chống Pháp và nâng lên một tầm cao mới."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Nghệ thuật vận dụng sáng tạo cách đánh chiến dịch (vận dụng hai cách …”?","o":["đánh lần lượt và đồng loạt)","mạng Việt Nam là thực dân Pháp","tránh nơi vững chắc, đánh nơi sơ hở”","nghệ thuật chiến dịch và chiến thuật"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nghệ thuật vận dụng sáng tạo cách đánh chiến dịch (vận dụng hai cách đánh lần lượt và đồng loạt)."},{"q":"Theo giáo trình, ý “Nghệ thuật chỉ đạo vận dụng chiến thuật sáng tạo để thực hiện …” kết thúc bằng nội dung nào?","o":["thắng lợi nhiệm vụ chiến dịch","để kết thúc chiến tranh càng sớm càng tốt","toàn dân đánh giặc","thắng lợi trong suốt quá trình chiến tranh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nghệ thuật chỉ đạo vận dụng chiến thuật sáng tạo để thực hiện thắng lợi nhiệm vụ chiến dịch."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Chiến thuật hình thành, phát triển gắn liền với lịch sử xây dựng, chiến đấu …”","o":["và đạt được nhiều thành tựu quan trọng","triển cả về số lượng và chất lượng","và trưởng thành của quân đội ta","một “thiên la, địa võng” để diệt địch"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Chiến thuật hình thành, phát triển gắn liền với lịch sử xây dựng, chiến đấu và trưởng thành của quân đội ta."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Do đó, tư tưởng tác chiến của bộ đội ta là “quán triệt 79 tư tưởng tiến công, triệt để dùng du …”","o":["địch bằng các đòn thọc sâu, hiểm hóc","thách toàn diện đối với mỗi quốc gia trong tham chiến","cao và để lại nhiều bài học lịch sử quý giá","kích chiến, vận động chiến để tiêu diệt địch”"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Do đó, tư tưởng tác chiến của bộ đội ta là “quán triệt 79 tư tưởng tiến công, triệt để dùng du kích chiến, vận động chiến để tiêu diệt địch”."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Các giai đoạn sau của hai cuộc kháng chiến, bộ đội ta đã trưởng thành, không những đánh giỏi vận động chiến (đánh địch ngoài công sự), mà …” là gì?","o":["từng bước vận dụng công kiên chiến (đánh địch trong công sự)","vào sự nghiệp bảo vệ Tổ quốc trong thời kỳ mới","nghèo trong quá trình dựng nước và giữ nước","vua Trần, lập ra vương triều mới, triều đại nhà Hồ"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Các giai đoạn sau của hai cuộc kháng chiến, bộ đội ta đã trưởng thành, không những đánh giỏi vận động chiến (đánh địch ngoài công sự), mà từng bước vận dụng công kiên chiến (đánh địch trong công sự)."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Ngoài ra, các đơn vị còn vận dụng các hình thức chiến thuật truy kích, đánh địch đổ bộ đường …”?","o":["trong danh dự, để muôn đời dập tắc chiến tranh","và đạt được nhiều thành tựu quan trọng","không, hoàn thành nhiệm vụ cấp trên giao","phát huy cái mạnh của ta"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Ngoài ra, các đơn vị còn vận dụng các hình thức chiến thuật truy kích, đánh địch đổ bộ đường không, hoàn thành nhiệm vụ cấp trên giao."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Hiệp đồng chiến đấu giữa các lực lượng bộ đội chủ lực, bộ đội địa phương và …”","o":["và tiến công xâm lược","đạo thắng lợi cuộc kháng chiến chống quân Tống","dân quân tự vệ ngày càng nhiều","chăn nuôi là chủ yếu, trình độ canh tác thấp"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Hiệp đồng chiến đấu giữa các lực lượng bộ đội chủ lực, bộ đội địa phương và dân quân tự vệ ngày càng nhiều."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Cách đánh của ta thể hiện tính tích cực, chủ động tiến công, bám thắt lưng địch, chia địch …” được hoàn thiện như thế nào?","o":["trận đánh lớn để giải phóng đất nước, kết thúc chiến tranh","du kích Tàu”, “du kích Nga”,","ra mà đánh, trói địch lại mà diệt","tổng hợp Khu 8"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Cách đánh của ta thể hiện tính tích cực, chủ động tiến công, bám thắt lưng địch, chia địch ra mà đánh, trói địch lại mà diệt."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “VẬN DỤNG MỘT SỐ BÀI HỌC KINH NGHIỆM VỀ NGHỆ THUẬT QUÂN SỰ VÀO SỰ NGHIỆP BẢO VỆ TỔ QUỐC TRONG THỜI KỲ MỚI VÀ TRÁCH NHIỆM CỦA SINH VIÊN Nghệ thuật quân sự Việt Nam đã …”","o":["hình thành, phát triển trong quá trình dựng và giữ nước của dân tộc","Đại Việt để tạo thế uy hiếp nước Liêu, nước Hạ","địch luôn bị phân tán, không thực hiện được hợp quân tại Thăng Long","lâu dài, càng đánh càng mạnh, càng đánh càng thắng"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: VẬN DỤNG MỘT SỐ BÀI HỌC KINH NGHIỆM VỀ NGHỆ THUẬT QUÂN SỰ VÀO SỰ NGHIỆP BẢO VỆ TỔ QUỐC TRONG THỜI KỲ MỚI VÀ TRÁCH NHIỆM CỦA SINH VIÊN Nghệ thuật quân sự Việt Nam đã hình thành, phát triển trong quá trình dựng và giữ nước của dân tộc."},{"q":"Phương án nào điền đúng vào chỗ trống: “Quán triệt tư tưởng tích cực tiến công Trong lịch sử chiến tranh giữ nước, nghệ thuật quân sự của cha ông ta trước đây luôn …”?","o":["nhấn mạnh tư tưởng tích cực, chủ động tiến công địch","là không ngừng bồi đắp lòng yêu quê hương, đất nước","làm thất bại kế hoạch hợp vây của địch","và trưởng thành của quân đội ta"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Quán triệt tư tưởng tích cực tiến công Trong lịch sử chiến tranh giữ nước, nghệ thuật quân sự của cha ông ta trước đây luôn nhấn mạnh tư tưởng tích cực, chủ động tiến công địch."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Trên cơ sở đánh giá đúng mạnh, yếu của địch và ta, chúng ta phải biết phát huy sức mạnh của mọi lực lượng, vận dụng linh hoạt mọi hình thức và quy mô tác chiến, mọi cách đánh …”?","o":["mới có thể tiến công địch một cách liên tục mọi lúc, mọi nơi","chiến, xây dựng phòng tuyến Như Nguyệt để chặn giặc","giới vào thực tiễn cách mạng Việt Nam, là cơ sở cho sự hình","trong chống giặc ngoại xâm để bảo vệ sự tồn vong của đất nước"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trên cơ sở đánh giá đúng mạnh, yếu của địch và ta, chúng ta phải biết phát huy sức mạnh của mọi lực lượng, vận dụng linh hoạt mọi hình thức và quy mô tác chiến, mọi cách đánh, mới có thể tiến công địch một cách liên tục mọi lúc, mọi nơi."},{"q":"Theo giáo trình, ý “Nghệ thuật quân sự toàn dân đánh giặc Đây là sự kế thừa và phát huy lên một trình độ mới từ …” kết thúc bằng nội dung nào?","o":["nhấn mạnh tư tưởng tích cực, chủ động tiến công địch","trong nghệ thuật tác chiến, chứ không phải là tư tưởng rút lui","chiến hiệp đồng quy mô lớn","nghệ thuật quân sự truyền thống của dân tộc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nghệ thuật quân sự toàn dân đánh giặc Đây là sự kế thừa và phát huy lên một trình độ mới từ nghệ thuật quân sự truyền thống của dân tộc."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Nguyên tắc đó phải được thể hiện cụ thể trong việc xác định phương hướng, mục tiêu …”","o":["đối tượng và thời cơ tiến công","nghệ thuật chiến dịch và chiến thuật","đoàn, sau đó phát triển đến sư đoàn","tác chiến của quân Mỹ, ngụy và chư hầu"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Nguyên tắc đó phải được thể hiện cụ thể trong việc xác định phương hướng, mục tiêu, đối tượng và thời cơ tiến công..."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Mỗi lực lượng, mỗi thứ quân đều có vị trí tác dụng và có …”","o":["cướp nước ta một lần nữa...”","dựng và bảo vệ Tổ quốc","phát huy cái mạnh của ta","những quy luật hoạt động riêng"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Mỗi lực lượng, mỗi thứ quân đều có vị trí tác dụng và có những quy luật hoạt động riêng."},{"q":"Theo bài học, phần còn thiếu trong nhận định “trên cơ sở đó, thực hiện những đòn đánh quyết định, tạo sự thay đổi …” là gì?","o":["giá đúng mạnh, yếu của kẻ thù","trên chiến trường có lợi cho ta","các cách đánh, các lực lượng cùng đánh","chiến đấu phòng ngự,"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: trên cơ sở đó, thực hiện những đòn đánh quyết định, tạo sự thay đổi trên chiến trường có lợi cho ta."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Đặt thế, lực vào đúng thời cơ có lợi thì “sức dùng một …”?","o":["trận đánh cụ thể","Điện Biên Phủ với các chiến trường khác","nửa mà công được gấp đôi”","điểm lịch sử “ngàn cân treo sợi tóc”"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Đặt thế, lực vào đúng thời cơ có lợi thì “sức dùng một nửa mà công được gấp đôi”."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Nghệ thuật quân sự của ta còn phải biết đánh giá đúng và triệt để khai thác các …”","o":["lập kẻ thù, tạo thế có lợi cho cuộc chiến","và các hoạt động tác chiến tương đương","các cách đánh, các lực lượng cùng đánh","yếu tố “thiên thời, địa lợi, nhân hoà”"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nghệ thuật quân sự của ta còn phải biết đánh giá đúng và triệt để khai thác các yếu tố “thiên thời, địa lợi, nhân hoà”."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Quán triệt tư tưởng lấy ít đánh nhiều, biết tập trung ưu thế lực lượng cần thiết để đánh thắng địch Trong lịch sử dựng nước và giữ nước của dân tộc, ông …” được hoàn thiện như thế nào?","o":["cha ta luôn phải chống lại kẻ thù xâm lược lớn hơn nhiều lần","để Đảng ta vận dụng, định ra đường lối quân sự trong khởi nghĩa","nước, mà còn là cuộc đấu tranh gay gắt về tài trí giữa hai","nước ta liên tục bị các triều đại phong kiến phương Bắc từ nhà"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Quán triệt tư tưởng lấy ít đánh nhiều, biết tập trung ưu thế lực lượng cần thiết để đánh thắng địch Trong lịch sử dựng nước và giữ nước của dân tộc, ông cha ta luôn phải chống lại kẻ thù xâm lược lớn hơn nhiều lần."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Ngày nay, vận dụng tư tưởng lấy ít đánh nhiều, ta phải phát huy được khả năng đánh giặc của toàn dân, của cả ba thứ quân, tạo ra sức …”","o":["thế của địa hình để lập thế trận đánh giặc","áp rất khốc liệt, nên khởi nghĩa bị thất bại","mạnh tổng hợp hơn địch để đánh thắng địch trong mọi tình thế","các yếu tố: Lực lượng, thế trận, thời cơ và mưu trí, sáng tạo"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Ngày nay, vận dụng tư tưởng lấy ít đánh nhiều, ta phải phát huy được khả năng đánh giặc của toàn dân, của cả ba thứ quân, tạo ra sức mạnh tổng hợp hơn địch để đánh thắng địch trong mọi tình thế."},{"q":"Phương án nào điền đúng vào chỗ trống: “Muốn giành thắng lợi triệt để trong chiến tranh, chúng ta phải kết hợp đánh tiêu hao …”?","o":["tối đa, khiến quân địch hoàn toàn bị động","với đánh tiêu diệt lớn quân địch","kích chiến, vận động chiến để tiêu diệt địch”","và trưởng thành của quân đội ta"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Muốn giành thắng lợi triệt để trong chiến tranh, chúng ta phải kết hợp đánh tiêu hao với đánh tiêu diệt lớn quân địch."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Trách nhiệm của sinh viên Nghiên cứu nghệ thuật quân sự của các thế hệ ông cha, chúng ta có quyền tự hào về tinh thần dũng cảm, ý chí kiên cường …”?","o":["sử sách ghi lại là cuộc kháng chiến chống quân Tần","quân địch phải chuyển từ chủ động tiến công sang bị động phòng ngự","tiên ta, được thể hiện cả trong khởi nghĩa và chiến tranh giải phóng","trong chống giặc ngoại xâm để bảo vệ sự tồn vong của đất nước"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trách nhiệm của sinh viên Nghiên cứu nghệ thuật quân sự của các thế hệ ông cha, chúng ta có quyền tự hào về tinh thần dũng cảm, ý chí kiên cường trong chống giặc ngoại xâm để bảo vệ sự tồn vong của đất nước."},{"q":"Theo giáo trình, ý “Do vậy, trách nhiệm của sinh viên rất nặng nề đối với xây …” kết thúc bằng nội dung nào?","o":["bị tổn thất nặng nề, nên bị thất bại","dựng và bảo vệ Tổ quốc","làm thất bại kế hoạch hợp vây của địch","nghệ thuật quân sự truyền thống của dân tộc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Do vậy, trách nhiệm của sinh viên rất nặng nề đối với xây dựng và bảo vệ Tổ quốc."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Trình bày những nét đặc sắc về nghệ thuật quân sự Việt Nam từ khi có …”","o":["và đang phát triển","bộ đội ta đã ngày càng trưởng thành","hợp với đối tượng và địa hình","Đảng Cộng sản Việt Nam lãnh đạo?"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Trình bày những nét đặc sắc về nghệ thuật quân sự Việt Nam từ khi có Đảng Cộng sản Việt Nam lãnh đạo?"}]},{"id":8,"title":"XÂY DỰNG VÀ BẢO VỆ CHỦ QUYỀN BIỂN, ĐẢO, BIÊN GIỚI QUỐC GIA TRONG TÌNH HÌNH MỚI","questions":[{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Bài 8 XÂY DỰNG VÀ BẢO VỆ CHỦ QUYỀN BIỂN, ĐẢO, BIÊN GIỚI QUỐC GIA …”","o":["TRONG TÌNH HÌNH MỚI ----- A","trong sự nghiệp xây dựng và bảo vệ Tổ quốc","gia có bờ biển liền kề hay đối diện nhau","độ và trách nhiệm bảo vệ Tổ quốc"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Bài 8 XÂY DỰNG VÀ BẢO VỆ CHỦ QUYỀN BIỂN, ĐẢO, BIÊN GIỚI QUỐC GIA TRONG TÌNH HÌNH MỚI ----- A."},{"q":"Theo bài học, phần còn thiếu trong nhận định “những nội dung chủ yếu về xây dựng và bảo vệ chủ quyền lãnh thổ, biên giới quốc gia …” là gì?","o":["nước và các vấn đề về biên giới mới nảy sinh","của nước ta trong tình hình hiện nay","thống nhất của Nhà nước, lực lượng vũ trang là nòng cốt","biển và lợi ích quốc gia của Việt Nam"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: những nội dung chủ yếu về xây dựng và bảo vệ chủ quyền lãnh thổ, biên giới quốc gia của nước ta trong tình hình hiện nay."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “XÂY DỰNG VÀ BẢO VỆ CHỦ QUYỀN BIỂN, ĐẢO QUỐC GIA Việt Nam là một …”?","o":["xã hội chủ nghĩa là sự nghiệp của toàn dân","lục địa hoặc đến cách đường cơ sở 200 hải lý","quốc gia độc lập có chủ quyền","nghiệm, nâng cao chất lượng nguồn nhân lực biển"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: XÂY DỰNG VÀ BẢO VỆ CHỦ QUYỀN BIỂN, ĐẢO QUỐC GIA Việt Nam là một quốc gia độc lập có chủ quyền."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Lãnh thổ quốc gia Việt Nam là một chỉnh thể thống …”","o":["quyền lãnh thổ, biên giới quốc gia","nhất, bất khả xâm phạm","đảo, biên giới quốc gia hiện nay?","trong quan hệ quốc tế"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Lãnh thổ quốc gia Việt Nam là một chỉnh thể thống nhất, bất khả xâm phạm."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Nội thủy là vùng biển nằm ở phía trong đường cơ sở Đường cơ sở là đường gãy khúc nối liền các điểm được lựa chọn tại ngấn nước thủy triều thấp nhất dọc theo bờ biển và các đảo gần bờ do Chính phủ …” được hoàn thiện như thế nào?","o":["vực phòng thủ địa phương, phải mang tính hệ thống, liên hoàn, vững chắc","nước Cộng hòa xã hội chủ nghĩa Việt Nam xác định và công bố","từ đường cơ sở, Việt Nam có quyền kiểm tra để phòng ngừa vi","có Công ước của Liên hợp quốc về Luật Biển 1982 (UNCLOS 1982)"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Nội thủy là vùng biển nằm ở phía trong đường cơ sở Đường cơ sở là đường gãy khúc nối liền các điểm được lựa chọn tại ngấn nước thủy triều thấp nhất dọc theo bờ biển và các đảo gần bờ do Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam xác định và công bố."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Lãnh hải là vùng biển có chiều rộng 12 hải lý tính từ đường cơ sở, lãnh hải có chế …”","o":["độ pháp lý như lãnh thổ đất liền","quyền lãnh thổ, biên giới quốc gia","với các quốc gia, dân tộc khác trong cộng đồng quốc tế","lãnh thổ, biển, đảo biên giới quốc gia"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Lãnh hải là vùng biển có chiều rộng 12 hải lý tính từ đường cơ sở, lãnh hải có chế độ pháp lý như lãnh thổ đất liền;"},{"q":"Phương án nào điền đúng vào chỗ trống: “Lãnh hải của Việt Nam bao gồm lãnh hải của đất liền, lãnh hải của đảo, lãnh hải của …”?","o":["luật về biển, đảo ở các cấp","và các công trình khác","hai quần đảo Hoàng Sa và Trường Sa","thuộc 6 vùng đa dạng sinh học biển khác nhau"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Lãnh hải của Việt Nam bao gồm lãnh hải của đất liền, lãnh hải của đảo, lãnh hải của hai quần đảo Hoàng Sa và Trường Sa."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Vùng đặc quyền kinh tế là vùng biển nằm bên ngoài lãnh hải, cùng với lãnh hải vùng đặc quyền kinh tế …”?","o":["độ, khả năng nhận thức của đối tượng tuyên truyền","rộng 200 hải lý tính từ đường cơ sở","về chính trị, kinh tế - xã hội, quốc phòng, an ninh","BIỂN, ĐẢO VÀ BIÊN GIỚI QUỐC GIA 1"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Vùng đặc quyền kinh tế là vùng biển nằm bên ngoài lãnh hải, cùng với lãnh hải vùng đặc quyền kinh tế rộng 200 hải lý tính từ đường cơ sở."},{"q":"Theo giáo trình, ý “lắp đặt và sử dụng các đảo nhân tạo, các thiết bị …” kết thúc bằng nội dung nào?","o":["Việt Nam với nhân dân các nước láng giềng","và các công trình khác","phạm của dân tộc Việt Nam","độ pháp lý như lãnh thổ đất liền"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: lắp đặt và sử dụng các đảo nhân tạo, các thiết bị và các công trình khác."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Thềm lục địa là đáy biển và lòng đất dưới đáy biển nằm bên ngoài lãnh hải kéo dài tự nhiên đến bờ ngoài của rìa …”","o":["lục địa hoặc đến cách đường cơ sở 200 hải lý","và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa","giữ gìn toàn vẹn chủ quyền Nhà nước đối với lãnh thổ quốc gia","Quý, Côn Đảo, Phú Quốc, Thổ Chu"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Thềm lục địa là đáy biển và lòng đất dưới đáy biển nằm bên ngoài lãnh hải kéo dài tự nhiên đến bờ ngoài của rìa lục địa hoặc đến cách đường cơ sở 200 hải lý."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Tiếp giáp lãnh hải, đặc quyền kinh tế và thềm lục địa là ba vùng biển thuộc quyền chủ …”","o":["Việt Nam với nhân dân các nước láng giềng","kỹ thuật khoan có thể thực hiện","quyền và quyền tài phán của quốc gia","ở khu vực biên giới"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Tiếp giáp lãnh hải, đặc quyền kinh tế và thềm lục địa là ba vùng biển thuộc quyền chủ quyền và quyền tài phán của quốc gia."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Hệ thống các đảo tiền tiêu như: Cô Tô, Bạch Long Vĩ, Cồn Cỏ, Lý Sơn, Phú …” là gì?","o":["Quý, Côn Đảo, Phú Quốc, Thổ Chu","lợi ích hợp pháp của Việt Nam trên biển, đảo","nhất, bất khả xâm phạm","Việt Nam xã hội chủ nghĩa"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Hệ thống các đảo tiền tiêu như: Cô Tô, Bạch Long Vĩ, Cồn Cỏ, Lý Sơn, Phú Quý, Côn Đảo, Phú Quốc, Thổ Chu..."},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “Quần đảo có trên 30 hòn đảo, đá, cồn san hô, bãi cát nằm rải rác …”?","o":["trên vùng biển rộng khoảng 15.000 km2","bảo vệ và quản lý tài nguyên sinh vật biển","và Campuchia ở phía Tây, phía Đông giáp biển Đông","trên biển, đảo Việt Nam"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Quần đảo có trên 30 hòn đảo, đá, cồn san hô, bãi cát nằm rải rác trên vùng biển rộng khoảng 15.000 km2."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Diện tích toàn bộ phần đất nổi của quần đảo khoảng 10 km2, đảo lớn nhất là …”","o":["xâm phạm của dân tộc Việt Nam","đảo Phú Lâm diện tích 1,5 km2","trên vùng biển rộng khoảng 15.000 km2","xã hội chủ nghĩa là sự nghiệp của toàn dân"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Diện tích toàn bộ phần đất nổi của quần đảo khoảng 10 km2, đảo lớn nhất là đảo Phú Lâm diện tích 1,5 km2."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Quần đảo Trường Sa là huyện đảo thuộc tỉnh Khánh Hòa nằm ở phía Đông Nam Việt Nam, cách quần đảo Hoàng Sa khoảng 200 hải lý với hơn 100 đảo, đá, cồn …” được hoàn thiện như thế nào?","o":["phủ ban hành nhằm bảo vệ an toàn biên giới","cho cán bộ, nhân dân trong cả nước, kiều bào ta ở nước ngoài","và bãi san hô nằm trải rộng trên vùng biển rộng khoảng 160.000 km2","các điều ước hoạch định biên giới giữa các quốc gia liên quan"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Quần đảo Trường Sa là huyện đảo thuộc tỉnh Khánh Hòa nằm ở phía Đông Nam Việt Nam, cách quần đảo Hoàng Sa khoảng 200 hải lý với hơn 100 đảo, đá, cồn và bãi san hô nằm trải rộng trên vùng biển rộng khoảng 160.000 km2."},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Các nước và vùng lãnh thổ đang tranh chấp với Việt Nam trên quần đảo Trường Sa …”","o":["là Trung Quốc, Philipin, Malayxia, Brunây, Đài Loan","cường quốc phòng, an ninh và đối ngoại”","trong quan hệ quốc tế","bảo đảm quốc phòng và an ninh"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Các nước và vùng lãnh thổ đang tranh chấp với Việt Nam trên quần đảo Trường Sa là Trung Quốc, Philipin, Malayxia, Brunây, Đài Loan."},{"q":"Phương án nào điền đúng vào chỗ trống: “Do vậy, Việt Nam được hưởng quyền và phải thực hiện đầy đủ các nghĩa vụ do Công ước quy định về chủ quyền đối với hai vùng biển là nội thủy và lãnh hải, quyền chủ quyền đối với ba vùng biển là …”?","o":["các tình huống có thể xẩy ra trên biển, đảo","vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế, vùng thềm lục địa","độ, khả năng nhận thức của đối tượng tuyên truyền","thống nhất của Nhà nước, lực lượng vũ trang là nòng cốt"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Do vậy, Việt Nam được hưởng quyền và phải thực hiện đầy đủ các nghĩa vụ do Công ước quy định về chủ quyền đối với hai vùng biển là nội thủy và lãnh hải, quyền chủ quyền đối với ba vùng biển là vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế, vùng thềm lục địa."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Hiện cả nước có đến 28 tỉnh, thành phố ven biển, chiếm 42% diện tích đất …”?","o":["liền và 45% dân số toàn quốc","tầm cao mới trong thời đại Hồ Chí Minh","nghiệm, nâng cao chất lượng nguồn nhân lực biển","dụng vũ lực hay đe doạ sử dụng vũ lực"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Hiện cả nước có đến 28 tỉnh, thành phố ven biển, chiếm 42% diện tích đất liền và 45% dân số toàn quốc."},{"q":"Theo giáo trình, ý “Biển, đảo Việt Nam thuộc Biển Đông, một trong những con đường giao thương hàng hải quốc tế nhộn nhịp nhất trên thế giới, nối liền Ấn Độ Dương và Thái Bình Dương …” kết thúc bằng nội dung nào?","o":["vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế, vùng thềm lục địa","đây là điều kiện thuận lợi để chúng ta hội nhập kinh tế biển","xã hội chủ nghĩa là sự nghiệp của toàn dân","xây dựng và bảo vệ chủ quyền biển, đảo thiêng liêng của Tổ quốc"],"a":1,"e":"Nội dung đầy đủ trong tài liệu: Biển, đảo Việt Nam thuộc Biển Đông, một trong những con đường giao thương hàng hải quốc tế nhộn nhịp nhất trên thế giới, nối liền Ấn Độ Dương và Thái Bình Dương, đây là điều kiện thuận lợi để chúng ta hội nhập kinh tế biển."},{"q":"Chọn cụm nội dung phù hợp nhất để hoàn chỉnh: “Đến nay, Việt Nam đã ký hiệp định hàng hải thương …”","o":["ta phải cùng nhau giữ lấy nước”","ngữ trên đường vào Vịnh Bắc Bộ","mại với 26 quốc gia","đất nước trên khu vực biên giới"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Đến nay, Việt Nam đã ký hiệp định hàng hải thương mại với 26 quốc gia."},{"q":"Hoàn chỉnh đúng nội dung của tài liệu: “Trên vùng biển Việt Nam đã phát hiện được khoảng 11.000 loài sinh vật cư trú trong hơn 20 kiểu hệ sinh thái điển hình …”","o":["thuộc 6 vùng đa dạng sinh học biển khác nhau","độ, khả năng nhận thức của đối tượng tuyên truyền","hình (núi, sông, suối, hồ nước, thung lũng,...)","giữ gìn toàn vẹn chủ quyền Nhà nước đối với lãnh thổ quốc gia"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: Trên vùng biển Việt Nam đã phát hiện được khoảng 11.000 loài sinh vật cư trú trong hơn 20 kiểu hệ sinh thái điển hình, thuộc 6 vùng đa dạng sinh học biển khác nhau."},{"q":"Theo bài học, phần còn thiếu trong nhận định “Biển Việt Nam còn có tiềm năng băng cháy, loại hình tài …” là gì?","o":["phạm của dân tộc Việt Nam","đảo, biên giới quốc gia hiện nay?","tính chiều rộng lãnh hải Việt Nam năm 1982","nguyên mới của thế giới"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Biển Việt Nam còn có tiềm năng băng cháy, loại hình tài nguyên mới của thế giới;"},{"q":"Cụm từ nào hoàn thiện chính xác ý sau theo giáo trình: “các lễ hội dân gian, tín ngưỡng… của cư dân miền biển là điều kiện lý tưởng để xây dựng các khu du lịch, nghỉ mát, nghỉ dưỡng… …”?","o":["ngày càng thu hút nhiều du khách trong nước và quốc tế","Nước Cộng hòa xã hội chủ nghĩa Việt Nam về lãnh hải, vùng tiếp","lợi cho việc giao lưu thương mại quốc tế và du lịch, nghỉ dưỡng","phủ ban hành nhằm bảo vệ an toàn biên giới"],"a":0,"e":"Nội dung đầy đủ trong tài liệu: các lễ hội dân gian, tín ngưỡng… của cư dân miền biển là điều kiện lý tưởng để xây dựng các khu du lịch, nghỉ mát, nghỉ dưỡng… ngày càng thu hút nhiều du khách trong nước và quốc tế."},{"q":"Chọn phương án nối tiếp đúng nội dung: “Nằm ở trung tâm Biển Đông, Hoàng Sa và 86 Trường Sa là những vị trí tiền …”","o":["rộng 200 hải lý tính từ đường cơ sở","tuần tra, kiểm soát duy trì trật tự, an toàn, an ninh","ngữ trên đường vào Vịnh Bắc Bộ","tiêu bảo vệ sườn Đông của Tổ quốc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Nằm ở trung tâm Biển Đông, Hoàng Sa và 86 Trường Sa là những vị trí tiền tiêu bảo vệ sườn Đông của Tổ quốc."},{"q":"Trong tài liệu, nhận định bắt đầu bằng “Nội dung xây dựng và bảo vệ chủ quyền biển, đảo quốc gia Xây dựng và bảo vệ chủ quyền biển, đảo quốc gia là thực hiện tổng thể các giải pháp, biện pháp trên các lĩnh vực chính trị, kinh tế …” được hoàn thiện như thế nào?","o":["và an ninh đủ khả năng bảo vệ chủ quyền biển, đảo quốc gia","khí là tài nguyên lớn nhất ở thềm lục địa","văn hóa, xã hội, quốc phòng, an ninh và đối ngoại nhằm thiết lập","sinh viên các trường trung cấp chuyên nghiệp, đại học"],"a":2,"e":"Nội dung đầy đủ trong tài liệu: Nội dung xây dựng và bảo vệ chủ quyền biển, đảo quốc gia Xây dựng và bảo vệ chủ quyền biển, đảo quốc gia là thực hiện tổng thể các giải pháp, biện pháp trên các lĩnh vực chính trị, kinh tế, văn hóa, xã hội, quốc phòng, an ninh và đối ngoại nhằm thiết lập"},{"q":"Dựa vào nội dung bài học, chọn phần kết đúng cho câu: “Xây dựng và bảo vệ chủ quyền biển, đảo quốc gia Việt Nam là tất yếu, là nghĩa vụ, trách nhiệm của mọi công dân …”","o":["gia có bờ biển liền kề hay đối diện nhau","ngày càng thu hút nhiều du khách trong nước và quốc tế","liên quan đến biển và đại dương ở khu vực và toàn cầu","trong sự nghiệp xây dựng và bảo vệ Tổ quốc"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Xây dựng và bảo vệ chủ quyền biển, đảo quốc gia Việt Nam là tất yếu, là nghĩa vụ, trách nhiệm của mọi công dân trong sự nghiệp xây dựng và bảo vệ Tổ quốc."},{"q":"Phương án nào điền đúng vào chỗ trống: “Đặc biệt là ngày 22/10/2018 Trung ương đã có Nghị quyết số 36-NQ/TW (khóa XII) về “Chiến lược phát triển bền vững kinh tế …”?","o":["bảo vệ chủ quyền lãnh thổ, biên giới quốc gia","là Trung Quốc, Philipin, Malayxia, Brunây, Đài Loan","ranh giới phía ngoài của lãnh hải bao quanh đảo","biển Việt Nam đến năm 2030, tầm nhìn đến 2045”"],"a":3,"e":"Nội dung đầy đủ trong tài liệu: Đặc biệt là ngày 22/10/2018 Trung ương đã có Nghị quyết số 36-NQ/TW (khóa XII) về “Chiến lược phát triển bền vững kinh tế biển Việt Nam đến năm 2030, tầm nhìn đến 2045”."},{"q":"Nội dung nào tiếp nối chính xác đoạn sau: “Tuyên bố của Chính phủ Nước Cộng hòa xã hội chủ nghĩa Việt Nam về đường cơ sở dùng để
